# models.yaml — the ONE model config for the whole fleet (DRE-2316).
#
# THIS IS THE ONLY FILE A HUMAN EDITS to change which model an agent runs on.
# Everything else that names a model is GENERATED from this file, between
# explicit `BEGIN generated …` / `END generated …` markers:
#
#   * scripts/model_fallback.py  — `_FALLBACK_MODEL_CONFIG` (the degrade path
#                                  used only when this file is unreadable)
#   * agents.yaml                — each agent's `model:` line (the console
#                                  roster's contract)
#
# Regenerate with:  python3 scripts/sync_model_config.py
# CI fails red on drift (`--check`, pinned by tests/test_model_config.py).
#
# Why a FILE, not a lookup: product-repo workflows run with NO AWS credentials
# and NO token for a private repo — the same constraint documented for
# config/repo-map.json in config/README.md. Selection must resolve out of the
# public `.bureau-pipeline` checkout the workflow already does, so this file
# travels with the code and is live fleet-wide the moment it merges to @main.
#
# Schema
# ------
#   ladders        named, ordered preference ladders, best → worst. Selection
#                  (scripts/model_fallback.py `select`) walks a ladder top→bottom
#                  and returns the first AVAILABLE model. Availability is probed
#                  at runtime and decides how far DOWN a ladder we walk — NEVER
#                  how far up. A model that is not on a ladder is never selected,
#                  however available it becomes. Membership here is the spend
#                  decision, and it belongs to a human editing this file.
#   default_ladder the ladder used for any agent/role not named below (select()
#                  never blocks a build on an unknown name).
#   agents         agent/role name → ladder name. The names match agents.yaml
#                  `name:` entries; the four label-routed build roles
#                  (engineer/frontend/devops/planner) are also the role strings
#                  the workflows pass to `model_fallback.py select`.
#   retired        ids that have rotated OUT of every ladder. READABLE, never
#                  selectable — `model-attempt:` / `model-error:` markers on
#                  in-flight cards must keep attributing, and dropping an id
#                  would resolve those deaths to None instead of reporting them.
#   excluded       ids that are available but excluded by POLICY (cost/quota).
#                  Same read-not-select treatment as `retired`.

ladders:
  # The WORKHORSE ladder: what every build agent runs on (engineer, frontend,
  # devops, planner, database-architect, fixer, repairer). Opus-first since
  # 2026-08-09 — see `excluded` below for why Fable is not on it.
  workhorse:
    - model: claude-opus-5
      reason: "preferred — the workhorse build model (2026-08-09)"
    - model: claude-sonnet-4-6
      reason: "fallback if Opus is unavailable"

  # The REVIEW tier: critic, verifier, medic. These read and judge rather than
  # build, and they run on every PR — Sonnet is the deliberate cost/latency
  # choice, unchanged by DRE-2316 (which moved WHERE it is declared, not WHAT
  # it is). Before that move the id was pinned in five places across three
  # workflow files and no config edit could change it.
  reviewer:
    - model: claude-sonnet-4-6
      reason: "review/diagnosis tier — runs on every PR; cost and latency win"

default_ladder: workhorse

agents:
  engineer: workhorse
  frontend: workhorse
  database-architect: workhorse
  devops: workhorse
  # Attempt 3 of a fix is a FRESH-EYES escalation, not a MODEL escalation:
  # same ladder, new framing (re-derive from scratch). It used to hardcode a
  # pricier model — an attempt-gated escalation is still a build path.
  fixer: workhorse
  critic: reviewer
  verifier: reviewer
  planner: workhorse
  medic: reviewer
  # The red-main repair agent is an engineer-tier fixer.
  repairer: workhorse

retired:
  - model: claude-opus-4-8
    reason: "rotated out when Opus 5 landed; kept readable so old markers attribute"

excluded:
  - model: claude-fable-5
    reason: >-
      Off every build ladder on 2026-08-09 by COST/QUOTA POLICY, not
      availability. When Anthropic enabled it on our subscription the probe
      stopped 404ing, the best-first ladder promoted the whole fleet onto it
      (~2x Opus per token) in one TTL window, the rolling usage drained and
      agents began dying is_error mid-run. Re-enabling it upstream must NOT put
      it back on a ladder — that is a human spend decision made in this file.
