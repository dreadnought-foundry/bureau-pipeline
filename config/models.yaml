# models.yaml — the ONE model config for the whole fleet (DRE-2316/DRE-2317).
#
# THIS IS THE ONLY FILE A HUMAN EDITS to change which model an agent runs on.
# Everything else that names a model is GENERATED from this file, between
# explicit `BEGIN generated …` / `END generated …` markers:
#
#   * scripts/model_fallback.py  — `_FALLBACK_MODEL_CONFIG` (the degrade path
#                                  used only when this file is unreadable)
#   * agents.yaml                — each agent's `model:` / `kind:` lines (the
#                                  console roster's contract)
#
# Regenerate with:  python3 scripts/sync_model_config.py
# CI fails red on drift (`--check`, pinned by tests/test_model_config.py).
#
# Why a FILE, not a lookup: product-repo workflows run with NO AWS credentials
# and NO token for a private repo — the same constraint documented for
# config/repo-map.json in config/README.md. Selection must resolve out of the
# public `.bureau-pipeline` checkout the workflow already does, so this file
# travels with the code and is live fleet-wide the moment it merges to @main.
#
# THE RULE: AVAILABILITY IS NOT PERMISSION (DRE-2317)
# ---------------------------------------------------
# On 2026-08-09 Anthropic enabled `claude-fable-5` on our subscription, the
# availability probe stopped returning 404, and a best-first ladder promoted
# the ENTIRE FLEET onto it inside one TTL window with no human deciding
# anything. The rolling session usage drained and agents started dying
# is_error mid-run. So NOTHING MOVES THE FLEET IN A TTL WINDOW: a model
# becoming AVAILABLE never promotes itself onto a ladder. Adoption is an edit
# of this file in a merged, reviewed PR, which reaches the fleet riding
# `stable` like every other commit on `main` — never a probe flip. The probe
# decides how far DOWN a ladder we walk, never how far up.
#
# Membership on a ladder is a SPEND DECISION, and since the CEO's decision of
# 2026-09-14 some of those decisions are made by rule rather than case by
# case. `scripts/model_adoption.py` sorts every model the catalog offers that
# no ladder names into exactly one of three:
#
#   `adopt`  — a NEWER VERSION of a family already on a ladder, at the same or
#              a lower declared price in `config/model-prices.yaml` (input AND
#              output), replaces that family's rung by itself. The daily
#              `.github/workflows/model-adoption.yml` gives it one real agent
#              run on the new model (`.github/workflows/model-trial.yml`), then
#              opens an ordinary PR to this file that the critic reviews and
#              the merge gate lands. No human decision: the rule was the
#              decision.
#   `ignore` — a model OLDER than, or superseded by, what we run gets nothing
#              — a line in the run summary, no card, no PR.
#   `ask`    — a NEW FAMILY, a model whose declared price is above the rung it
#              would join, or a model with NO declared price (an id absent from
#              `config/model-prices.yaml`) is still the CEO's spending
#              decision. The workflow files one plain-English question and
#              adopts nothing until it is answered.
#
# THE THIRD KIND (DRE-3015, CEO decision 2026-09-03)
# --------------------------------------------------
# The rule above is intact and this file still obeys it. What changed is WHICH
# roles are on the hot path. The planner runs ONCE PER EPIC, at a decision
# point, and every build run downstream is shaped by its output — a bad
# decomposition costs a fix loop per child. That is an advisory-shaped cost
# profile that wore a workhorse label, so the planner moved to its own kind,
# `judgement`, and runs on the strongest model we have.
#
# It was a promotion a HUMAN made, in this file, in a reviewed PR — a new rung
# for the planner, not a newer version of one it had — and a promotion of that
# kind still is, under the `ask` rule above. No probe, no discovery, no
# availability flip can put a model on the workhorse or judgement ladder: the
# only way onto either is a merged PR to this file, written by a person or
# opened by the adoption workflow for a same-family successor it has trialed.
#
# Schema
# ------
#   kinds          the role kinds, each naming the ladder its roles walk.
#                  A role is assigned a KIND, never a raw ladder name — that
#                  is what stops a future edit from inventing a ladder of its
#                  own and quietly putting build work on the strongest model.
#                    workhorse — high-volume build work, hundreds of turns per
#                                card. The HOT PATH. Cost-appropriate model.
#                    advisory  — bounded consults at decision points (the
#                                critic gates every unattended merge). Sonnet 5
#                                since 2026-08-12, on measured cost; Sonnet 5.5
#                                since 2026-09-28 (DRE-5116).
#                    judgement — judgement-heavy, LOW-VOLUME work whose output
#                                every downstream run is shaped by: the planner,
#                                once per epic. The STRONGEST model, and never
#                                on the hot path.
#   ladders        named, ordered preference ladders, best → worst. Selection
#                  (scripts/model_fallback.py `select`) walks a ladder top→bottom
#                  and returns the first AVAILABLE model. A model that is not on
#                  a ladder is never selected, however available it becomes.
#   default_ladder the ladder used for any agent/role not named below (select()
#                  never blocks a build on an unknown name). It MUST be the
#                  workhorse ladder: an unrecognized role lands on the cheap
#                  side of the fence, never on the advisory model.
#   agents         agent/role name → KIND. The names match agents.yaml `name:`
#                  entries; the four label-routed roles
#                  (engineer/frontend/devops/planner) are also the role strings
#                  the workflows pass to `model_fallback.py select`.
#   review_separation
#                  the build/review fence, bought at SELECTION time rather than
#                  by keeping the ladders disjoint (DRE-3880). `roles` names the
#                  reviewer roles it binds — the critic and the verifier, both
#                  advisory — and `rules` names, for each model that sits on the
#                  advisory ladder AND a build ladder, the model those reviewers
#                  use instead when the pull request in front of them was BUILT
#                  on it. Every such model ABOVE the advisory ladder's last rung
#                  needs a rule (DRE-5116; it was only the top rung until two
#                  Sonnet versions sat on both ladders at once). Schema
#                  validation refuses a BARE overlap (one with no rule), a rule
#                  that sends the reviewer back to the build model, a
#                  `reviewers_use` that is not on the advisory ladder, and a
#                  STALE rule describing an overlap that no longer exists.
#   effort         model id → the effort level every run on that model asks
#                  for, passed to the CLI as `--effort`. A model that is NOT
#                  named here is run with no `--effort` argument at all, which
#                  is how adopting one model's level leaves every other model's
#                  spend where it was. Levels are the CLI's own set (low,
#                  medium, high, xhigh, max), and validation refuses both an
#                  unknown level and an entry for an id no ladder names — the
#                  likeliest cause of the second being a typo in the id the
#                  fleet is meant to be running at that level.
#   discovery      what happens to a model id the system SEES but this file
#                  does not name. `on_new_model` may be `advisory` (a NEW
#                  FAMILY may be proposed for the advisory ladder at most, and
#                  only after the CEO answers the `ask` question) or `none`.
#                  `workhorse` is REJECTED by schema validation — that value is
#                  precisely the incident — and so is `judgement`: a
#                  newly-discovered family may never land on a BUILD or a
#                  PLANNING ladder by itself. A newer version of a family
#                  already on a ladder is not governed by this key: it is the
#                  `adopt` rule above, and replaces its own family's rung
#                  wherever that rung sits. `alert` must be true: discovery is
#                  never silent. The daily `model-adoption` workflow sorts
#                  every newly seen id by the CEO's rule of 2026-09-14; the
#                  weekly `model-drift` workflow refreshes the snapshot and
#                  files no card (DRE-3899).
#   retired        ids that have rotated OUT of every ladder. READABLE, never
#                  selectable — `model-attempt:` / `model-error:` markers on
#                  in-flight cards must keep attributing, and dropping an id
#                  would resolve those deaths to None instead of reporting them.
#   excluded       ids that are available but excluded from EVERY ladder by
#                  POLICY (cost/quota). Same read-not-select treatment as
#                  `retired`.

kinds:
  # THE HOT PATH. Hundreds of turns per card, every card, every repo — this is
  # what consumes the shared rolling session window, so it gets the
  # cost-appropriate model, and the stronger models are structurally barred
  # from it: schema validation rejects a config that puts the top of the
  # advisory or the judgement ladder here.
  workhorse:
    ladder: workhorse
    roles: >-
      build agents — engineer, frontend, devops, database-architect, fixer,
      repairer

  # THE BACKSTOP. Bounded consults at decision points: one review per PR, one
  # verification, one diagnosis per failed run. Low volume, high stakes — the
  # critic gates EVERY unattended merge in a pipeline where no human reads a
  # diff, so a shallow review is a silent failure. It gets the strongest model.
  advisory:
    ladder: advisory
    roles: critic, verifier, medic, plan-critic-pre, plan-critic-post

  # THE DECISION POINT. One run per epic, and the plan it writes is the
  # specification every child card is built from — so the cost of a bad output
  # is a fix loop per child, not a retry. Low volume, highest leverage: it gets
  # the strongest model (CEO decision, 2026-09-03). ONE role, deliberately —
  # a role that runs per CARD belongs on the workhorse ladder however carefully
  # it thinks, because volume is what drains the subscription.
  judgement:
    ladder: judgement
    roles: planner

ladders:
  # The WORKHORSE ladder: what every build agent runs on. Opus-first since
  # 2026-08-09, and Opus 5.5-first since 2026-09-25 (DRE-4836).
  # `claude-fable-5` is absent by POLICY, not availability, and
  # validation now enforces that absence rather than trusting the next edit.
  workhorse:
    - model: claude-opus-5-5
      reason: >-
        preferred — the workhorse build model since 2026-09-25 (DRE-4836).
        Adopted under the CEO's "newer versions auto" rule of 2026-09-14: a
        same-family newer version at the same or a lower price goes in through
        a normal PR, with no CEO decision of its own. It is CHEAPER than the
        Opus 5 it takes over from — $4/$20 per MTok against $5/$25, cache reads
        $0.20 — with the same 1M context, 128K output and tokenizer. Its
        effort DEFAULT is `medium`, one level below Opus 5's, so every run on
        it sets `high` explicitly; see the `effort` block below. It was off
        every ladder from 2026-09-25 07:42 PT (DRE-4852, PR #510) because the
        pinned Claude Code 2.1.263 could not run it ("version 2.1.280 or
        newer is required"); DRE-3417 undoes that rollback in the same PR
        that raises the pin to 2.1.282 (claude-code-action v1.0.234), and
        tests/test_model_cli_support.py holds the pair.
    - model: claude-opus-5
      reason: >-
        the fallback rung, and the model this ladder led with from 2026-08-09
        to 2026-09-25 (DRE-4836). A run that cannot get Opus 5.5 — the probe
        404s it, or the subscription does not serve it — lands on the model the
        fleet has been building on all along, which is what makes the first
        fleet build on the new ladder safe to be the first real run.
    - model: claude-sonnet-5-5
      reason: >-
        the Sonnet rung since 2026-09-28 (DRE-5116) — what a build gets when
        NEITHER Opus rung above is available. Adopted under the CEO's "newer
        versions auto" rule of 2026-09-14, on his request of 2026-09-28 13:23
        PT that the whole system move to Sonnet 5.5: the successor to Sonnet 5
        at the SAME price ($2/$10 per MTok, cache reads $0.20), with the same
        1M context, 128K output and tokenizer. Trialed live on the pinned
        Claude Code before it went on (https://github.com/dreadnought-foundry/bureau-pipeline/actions/runs/36481112286, `passed — completed, 3 turns,
        4s`, contextWindow 1,000,000). That needed Claude Code 2.1.284
        (claude-code-action v1.0.236), raised in the same PR: 2.1.282 had no
        registry entry for this model and ran it on a 200K window.
        tests/test_model_cli_support.py holds the pair. It is ALSO the top of
        the advisory ladder (Sonnet 5 below it is that ladder's second rung),
        and `review_separation` declares what its reviewers run instead.
    - model: claude-sonnet-5
      reason: >-
        the last rung — what a build gets when NEITHER Opus rung NOR Sonnet 5.5
        above is available; the ladder's last rung since DRE-5116 put Sonnet 5.5
        directly above it (2026-09-28), and kept, not replaced, as that card
        specifies — the fallback if Sonnet 5.5 is not served. Replaced `claude-sonnet-4-6` here on
        2026-09-16 (CEO decision, DRE-3880): same 1M context and 128k output,
        and cheaper ($2/$10 against $3/$15). Sonnet 4.6 was NOT retired — it
        keeps the judgement ladder's last rung below, and only its WORKHORSE
        entry was replaced. This rung is ALSO on the advisory ladder (its top
        until 2026-09-28, its second rung since), so it is one of two Sonnet
        models on both ladders; the fence that used to be bought by keeping
        the lists disjoint is bought at selection time instead, and
        `review_separation` below declares it for both.

  # The ADVISORY ladder: the roles that judge rather than build. Sonnet-first
  # since 2026-08-12 on MEASURED cost, and Sonnet 5.5-first since 2026-09-28
  # (DRE-5116). The premise this ladder was built on —
  # "advisory work is bounded, so the price per token is affordable" — held for
  # verifier and medic but NOT for the critic, which fires on every PR push.
  advisory:
    - model: claude-sonnet-5-5
      reason: >-
        preferred — the reviewers' model since 2026-09-28 (DRE-5116), adopted
        under the CEO's "newer versions auto" rule of 2026-09-14 on his request
        of 2026-09-28 that the whole system move to Sonnet 5.5. It is Sonnet
        5's successor at the SAME price ($2/$10 per MTok) with the same 1M
        context and 128K output, so the cost case measured for Sonnet 5 below
        carries over unchanged and nothing is given up on large diffs — which
        is why it waited for Claude Code 2.1.284: on 2.1.282 it ran on a 200K
        window. Live trial on 2.1.284: https://github.com/dreadnought-foundry/bureau-pipeline/actions/runs/36481112286 (`passed — completed, 3 turns,
        4s`, contextWindow 1,000,000). It also sits on the workhorse ladder,
        so `review_separation` declares what its reviewers run instead.
    - model: claude-sonnet-5
      reason: >-
        the first fallback since 2026-09-28 (DRE-5116), when Sonnet 5.5 took
        the top rung above it; kept rather than replaced, so a reviewer that
        cannot get Sonnet 5.5 lands on the model the critic ran on for six
        weeks before falling to Opus. ALSO the workhorse ladder's last rung
        since 2026-09-16 (DRE-3880) — one of the two declared overlaps in this
        file, see `review_separation`. It was
        promoted to primary 2026-08-12 on measured cost with no measured
        quality loss. Fable cost 5.5x per critic review ($0.60 -> $3.33 median,
        portico) while the critic's run rate rose 27/day -> 63/day, taking it
        from 11% of build spend to 139% of it. Rejection rate moved 20.4%
        (sonnet-4-6, n=691) -> 25.8% (fable-5, n=132): +5.4pp at p=0.17, inside
        noise, and confounded by the build model changing in the same commit.
        Sonnet 5 has the SAME 1M context and 128k output as Opus 5 and Fable 5,
        so nothing is given up on large diffs, and it is cheaper than the
        sonnet-4-6 the critic ran for 691 verdicts ($2/$10 vs $3/$15).
    - model: claude-opus-5-5
      reason: >-
        the LOUD fallback — selection note prefixed DEGRADED, workflow raises a
        ::warning::. This rung moved from `claude-opus-5` to `claude-opus-5-5`
        on 2026-09-25 (DRE-4836) with the workhorse ladder's primary: the Opus
        rung is one decision written in three places, and a ladder left on the
        older id would have reviewers falling onto a model no build runs on.
        The ladder's FIRST rung was unchanged by that move; since 2026-09-28
        (DRE-5116) reviewers start on Sonnet 5.5, then Sonnet 5, then this
        rung. NOTE the direction INVERTED on 2026-08-12: falling to Opus
        is now falling UP in capability and cost ($4/$20 vs $2/$10), not down.
        The warning still matters — an advisory role that did not get its
        intended model is a run worth looking at — but read it as "unexpected
        spend", not "weakened critic".

  # The JUDGEMENT ladder: the planner, and nothing else. Fable-first since
  # 2026-09-03. Whether `claude-fable-5-1` is enabled on this fleet's
  # subscription is NOT verified from here — the probe decides that at run time
  # (404 -> skip, loudly) — so the first planner run after this lands must be
  # READ, not assumed.
  judgement:
    - model: claude-fable-5-1
      reason: >-
        the strongest model, for the one role whose output every downstream
        build run is shaped by (CEO decision 2026-09-03). The planner runs once
        per epic, so the volume that drained the subscription on 2026-08-09 is
        absent by construction; a bad decomposition, by contrast, costs a fix
        loop per child. NOTE the id — `claude-fable-5-1`, NOT the
        `claude-fable-5` listed under `excluded` below. A different model, and
        that exclusion still stands.
    - model: claude-opus-5-5
      reason: >-
        the LOUD fallback — selection note prefixed DEGRADED, workflow raises a
        ::warning::, exactly as the advisory ladder does it. The id moved from
        `claude-opus-5` on 2026-09-25 (DRE-4836), with the other two ladders'
        Opus rung; everything below about WHY the planner falls here is about
        the rung, not the version, and is untouched. This ladder's first rung
        is unchanged — the planner still starts on Fable 5.1. Read it as "the
        planner did not get the model it was promised", which is a plan worth
        looking at, not a broken run. Confirmed as the planner's fallback by the
        CEO on 2026-09-13 (DRE-3709), after Fable refused every planner run on a
        monthly spend limit. The probe cannot see that refusal, so the planner
        reaches this rung by reading its own `model-error:` death marker
        (plan.yml "Select model", DRE-3824). Since 2026-09-14 (CEO decision,
        DRE-3970) the fall is IMMEDIATE, in the same step: "When it's out of
        Fable 5, it should just default back to Opus 5." A call Fable refuses
        for capacity — monthly spend limit, usage limit, rate limit, overload,
        read by `model_fallback.capacity_refusal` and never on a run that did
        real work — is made again on this rung by the classifier and the
        groomer, the planner's Select model skips Fable when the classifier
        already saw it refused, and every planner step hands this rung to the
        CLI as `--fallback-model`. DRE-3969 had taken Fable off this ladder as
        the hotfix while that was built.
    - model: claude-sonnet-4-6
      reason: >-
        last resort — never block a plan on availability. It left the WORKHORSE
        ladder on 2026-09-16 (DRE-3880) and kept this rung, on the CEO's answer
        in as many words: do not retire it. It sits below the rung this ladder
        degrades onto, which is admissible because it is CHEAPER than that rung
        ($3/$15 against Opus 5.5 at $4/$20, config/model-prices.yaml) — the rule is
        "no dearer model hides below the fallback", and validation reads the
        declared price rather than assuming every lower rung is a build model.

default_ladder: workhorse

agents:
  engineer: workhorse
  frontend: workhorse
  database-architect: workhorse
  devops: workhorse
  # Attempt 3 of a fix is a FRESH-EYES escalation, not a MODEL escalation:
  # same kind, new framing (re-derive from scratch). It used to hardcode a
  # pricier model — an attempt-gated escalation is still a build path.
  fixer: workhorse
  # The red-main repair agent is an engineer-tier fixer.
  repairer: workhorse
  # The proof runner (DRE-5921, DRE-5924) observes and writes a record on a
  # branch — a run per proof card, so the hot path's ladder, not a judge's.
  proof: workhorse
  # The one judgement role (DRE-3015). Once per epic, at a decision point, and
  # the plan it writes is what every child card is built from.
  planner: judgement
  # The three that judge rather than build. The critic gates every unattended
  # merge; the verifier is the scenario gate for UI/multi-system PRs; the medic
  # diagnoses a failed run once. All bounded consults — all advisory.
  critic: advisory
  verifier: advisory
  medic: advisory
  # The two plan critics (DRE-2721). Bounded consults at the two decision
  # points around the CEO's green light — one before a plan takes their
  # attention, one after the approved text becomes the specification agents
  # build from. Both judge rather than build, so both are advisory; and both
  # are capped at two rounds per epic, so the volume stays bounded by design.
  plan-critic-pre: advisory
  plan-critic-post: advisory

# THE BUILD/REVIEW FENCE, DECLARED (DRE-3880, CEO decision 2026-09-16)
# --------------------------------------------------------------------
# `claude-sonnet-5` topped the advisory ladder AND backed the workhorse one, so
# the separation the old schema rule bought by keeping those two lists disjoint
# has to be bought somewhere else. It is bought HERE, per pull request: when a
# build ran on a model named below, the reviewers for that pull request skip it
# and use the model this file names instead.
#
# Since 2026-09-28 (DRE-5116) TWO models sit on both ladders: Sonnet 5.5 tops
# the advisory ladder and is the workhorse ladder's Sonnet rung, and Sonnet 5 is
# the rung below it on both. Each gets a rule. Validation used to admit a rule
# only for the advisory TOP, which would have refused Sonnet 5's as stale and
# left a Sonnet-5 build one unavailable Sonnet 5.5 away from being reviewed on
# Sonnet 5 — and a Sonnet-5 build happens precisely when Sonnet 5.5 was
# skipped. So every advisory rung ABOVE the ladder's last that also sits on a
# build ladder needs a rule; the last rung is the designed loud fall onto the
# build model and needs none.
#
# The overlap is not new in principle — the advisory ladder's own fallback is
# `claude-opus-5`, the workhorse PRIMARY, so reviewer and worker have coincided
# whenever the critic falls back. What is new is that the guarantee is explicit
# per run instead of incidental.
#
# A rule is not decoration: `model_fallback.policy_errors` refuses a bare
# overlap, a rule pointing back at the build model, a `reviewers_use` that is
# not on the advisory ladder, and a rule that no longer describes a real
# overlap. That last one is the DRE-3892 carry-forward — a future same-family
# adoption moves a Sonnet rung on BOTH ladders at once, and an adoption that did
# not move the rule with it fails `sync_model_config.py --check` twice over.
review_separation:
  # The two roles that REVIEW a pull request. The medic is advisory too and is
  # deliberately absent: it diagnoses a failed run and reviews nothing, so
  # binding it would be a spend change nobody asked for.
  roles:
    - critic
    - verifier
  rules:
    - built_on: claude-sonnet-5-5
      reviewers_use: claude-opus-5-5
      reason: >-
        a Sonnet-5.5 build is never reviewed by Sonnet 5.5 (DRE-5116). Opus
        5.5, not Sonnet 5: Sonnet 5 is Sonnet 5.5's own predecessor, so a
        different family is the real separation, and Opus 5.5 is already the
        substitute below, so this adds no model these roles did not already run
        on. A card we could not read (`--built-on-unknown`) still lands on Opus
        5.5, exactly as it did before, because both Sonnet rungs come off.
        Sonnet 5 stays behind it as the next rung.
    - built_on: claude-sonnet-5
      reviewers_use: claude-opus-5-5
      reason: >-
        a Sonnet-5 build is never reviewed by Sonnet 5. Opus 5.5 is the
        advisory ladder's own last rung, so the substitute is a model these
        roles already run on rather than a new spend decision; Sonnet 5.5, a
        different model, stays behind it. The id moved
        with that rung on 2026-09-25 (DRE-4836) — this is the DRE-3892
        carry-forward arriving exactly as written: a same-family adoption moves
        the overlap on both ladders at once, and a rule left naming
        `claude-opus-5` would be STALE and refused by validation.

# THE EFFORT LEVEL, DECLARED (DRE-4836, CEO decision 2026-09-24)
# ---------------------------------------------------------------
# "we should be using the new opus 5.5 models on high effort." Claude Opus 5.5
# defaults to `medium`, one level BELOW Claude Opus 5's `high`, so an adoption
# that moved the id and said nothing about effort would have every build agent
# in the fleet thinking one level less with nothing in any log saying so. The
# level is therefore set EXPLICITLY on every run that selects this model — not
# its own default, and not the harness's.
#
# It is DATA here for the same reason the model id is: one place a human edits,
# one reader (`model_fallback.effort_for`), and every workflow step that
# chooses a model emits the argument for the model it actually chose. A run
# that FELL to another rung gets that rung's level — Opus 5's, which is to say
# none, because Opus 5 already defaults to `high`.
#
# Claude Sonnet 5.5 (DRE-5116) is declared at `high` too. That is the level the
# fleet runs Sonnet 5 at — Sonnet 5 has no entry because its default IS `high`
# — and Sonnet 5.5's default is still `high`, but its levels are recalibrated,
# so the level is written down rather than left to a default that may move.
# Both live trials ran at the default, which is this same level.
effort:
  claude-opus-5-5: high
  claude-sonnet-5-5: high

discovery:
  # A NEW FAMILY we SEE but do not name here may, at most, be proposed for the
  # ADVISORY ladder — and only after the CEO answers the one plain-English
  # question `.github/workflows/model-adoption.yml` files for it (the `ask`
  # rule). Until then nothing is adopted. `workhorse` is rejected by schema
  # validation: that value IS the 2026-08-09 incident, written down as config.
  # `judgement` is rejected the same way — the planning ladder is the strongest
  # one we run, which makes it the most attractive place for an unattended
  # promotion to land. A newer version of a family already on a ladder is the
  # `adopt` rule, not this key: it replaces its family's rung through a
  # trialed (`model-trial.yml`), reviewed PR, and never adds a rung.
  on_new_model: advisory
  # Never silent. A newly discovered model is sorted by the CEO's rule of
  # 2026-09-14 in the daily `model-adoption` workflow — `adopt`, `ignore` or
  # `ask`; the weekly `model-drift` workflow files no card (DRE-3899).
  alert: true

retired:
  - model: claude-opus-4-8
    reason: "rotated out when Opus 5 landed; kept readable so old markers attribute"

