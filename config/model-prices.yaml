# model-prices.yaml — the DECLARED price of a model, in USD per million tokens
# (DRE-3895). Two readers, and no third:
#
#   * `scripts/model_adoption.py` — the adoption rule ("newer and no dearer").
#   * `scripts/model_fallback.py` — schema validation, since DRE-3880. One
#     question only: is a rung sitting BELOW the one its ladder degrades onto
#     dearer than that rung? The rule used to read "every rung below the
#     fallback is a workhorse model", a proxy that stopped working the moment
#     `claude-sonnet-4-6` left the build ladder and stayed the planner's last
#     resort. That makes this file load-bearing on the DISPATCH path: a config
#     whose lower rungs cannot be priced is refused and the fleet keeps the
#     last-known-good ladders, so an entry deleted here is a fleet-wide
#     degrade, not a documentation change.
#
# PRICE IS NEVER GUESSED, AND ABSENCE IS A VALID ANSWER.
# ------------------------------------------------------
# This file is the ONLY source of price the adoption rule reads. An id that is
# absent from it has NO price, and a candidate with no price can never be
# `adopt` — it becomes `ask`, a question for a human. A price the engineer
# cannot source from the vendor's published pricing page stays ABSENT: leaving
# an entry out is the fail-closed answer and it is always available. Inventing
# a figure, or copying a sibling model's, is the one thing this file exists to
# prevent — the whole rule downstream is "the same or a lower declared price",
# and a guessed number adopts a model on a number nobody stands behind.
#
# Every id on a ladder in `config/models.yaml` has an entry here, and a test
# reads the ladders live and fails this build if one does not. An EXTRA entry
# is fine: a retired id may keep its price (markers on in-flight cards still
# name it, and a rotation is not a reason to lose the figure).
#
# Each entry is `{input, output, source, declared}`:
#   input     USD per million INPUT tokens.
#   output    USD per million OUTPUT tokens. Both sides matter — a cheaper
#             input does not buy a dearer output, and `adopt` requires the
#             candidate to be at or below the rung on EACH side. Fable at
#             $10/$50 against Opus at $5/$25 is the 2026-08-09 incident.
#   source    the vendor's published pricing page the figure was read from.
#             Required — a figure with no source is a figure nobody can check.
#   declared  the date a human wrote the figure down. A stale declaration is
#             visible rather than silent; re-read the source before trusting an
#             old one.
#
# The seed figures below were transcribed on 2026-09-14 from what this repo
# already records — the advisory rung reasons in `config/models.yaml`
# (Sonnet 5 $2/$10, Sonnet 4.6 $3/$15, Opus 5 $5/$25) and the Fable figure in
# `scripts/model_catalog.py` ($10/$50) — and each carries the vendor page they
# are checked against.
#
# Nothing here changes what the fleet runs. Ladder membership is still a
# deliberate human edit of `config/models.yaml`; this file only says what a
# model costs, so the adoption rule can tell "newer and no dearer" from
# "newer and a decision for a person".

prices:
  # The workhorse ladder's primary since 2026-09-25 (DRE-4836) — and the
  # figure the adoption rests on: Opus 5.5 is CHEAPER than the Opus 5 below it
  # on both sides, which is what makes it a "newer versions auto" adoption
  # (CEO's rule of 2026-09-14) rather than a decision for the CEO. Cache reads
  # are $0.20/MTok; this file declares the two sides the rule reads.
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    source: "https://www.anthropic.com/pricing"
    declared: 2026-09-25
  claude-opus-5:
    input: 5.00
    output: 25.00
    source: "https://www.anthropic.com/pricing"
    declared: 2026-09-14
  claude-sonnet-5:
    input: 2.00
    output: 10.00
    source: "https://www.anthropic.com/pricing"
    declared: 2026-09-14
  # LOAD-BEARING since DRE-3880 merged (2026-09-16). Sonnet 4.6 left the
  # workhorse ladder and kept the judgement ladder's last rung, which puts it
  # BELOW the rung that ladder degrades onto — so this entry is what shows it
  # is cheaper than Opus 5 and admissible there. Delete it and the canonical
  # config stops validating.
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    source: "https://www.anthropic.com/pricing"
    declared: 2026-09-14
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    source: "https://www.anthropic.com/pricing"
    declared: 2026-09-14
