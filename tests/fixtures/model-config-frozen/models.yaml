# models.yaml — the model config's code-side facts (DRE-2316/DRE-2317, DRE-6983).
#
# WHERE THE CHOICES LIVE. Which models a group runs on and in what order, which
# group an agent is in, a group's name and purpose, and a project's own model
# are CHOICES, and none of them is in this file. They live in the model home,
# the `BUREAU_MODEL_CHOICES` variable the console writes (read by
# scripts/model_home.py), or, with no home, in the defaults in the code:
# `CODE_DEFAULTS` in scripts/model_fallback.py. A choice is changed on the
# console's Settings › Agents & models page, and is in force from the next
# agent run. Every run's `model-home:` line says which of the two it ran on;
# docs/model-choice-levers.md has the run lines that show it (DRE-7195).
#
# THIS FILE HOLDS ONLY CODE-SIDE FACTS: `session_agents`, `about`, `rules`,
# `review_separation`, `effort`, `discovery`, `retired` and `excluded`. Each
# is a fact the code relies on rather than a choice a person makes on the
# page. `CODE_DEFAULTS` carries the same facts for a checkout that cannot read
# this file, and tests/test_model_fallback.py fails, naming the key, when the
# two differ — edit them together. A choice key written back here (`kinds`,
# `ladders`, `default_ladder`, `agents`, `ungrouped`, `projects`) is refused
# by `model_fallback.policy_errors` with `<key> is a choice and lives in the
# home, not in this file`, and the selector then runs on the facts in the code
# rather than read the file; tests/test_no_choice_copies.py fails on it too.
#
# Why a FILE, not a lookup: product-repo workflows run with NO AWS credentials
# and NO token for a private repo — the same constraint documented for
# config/repo-map.json in config/README.md. The code-side facts resolve out of
# the public `.bureau-pipeline` checkout the workflow already does. A change
# here is in force for a run whose pipeline ref carries the merge: on the merge
# for an `@main` caller, and when `stable` or the next `vN` moves past it for a
# tag-pinned one.
#
# THE INCIDENT OF 2026-08-09: AVAILABILITY IS NOT PERMISSION (DRE-2317)
# ---------------------------------------------------------------------
# On 2026-08-09 Anthropic enabled `claude-fable-5` on our subscription, the
# availability probe stopped returning 404, and a best-first ladder promoted
# the ENTIRE FLEET onto it inside one TTL window with no human deciding
# anything. The rolling session usage drained and agents started dying
# is_error mid-run. That is why `excluded` exists — a model we do not run at
# all is on no group's list, whatever the probe says — and why nothing
# automatic climbs a list: the probe decides how far DOWN a group's models we
# walk, never how far up, and discovery proposes nothing for a build or
# planning group (`discovery` below).
#
# THE CEO'S DECISION OF 2026-09-14: NEWER VERSIONS BY RULE
# --------------------------------------------------------
# Which model a group runs is a SPEND DECISION, and some of those decisions are
# made by rule rather than case by case. `scripts/model_adoption.py` sorts
# every model the catalog offers that the home does not name into exactly one
# of three: `adopt` — a NEWER VERSION of a family a group already runs, at the
# same or a lower declared price in `config/model-prices.yaml` (input AND
# output), replaces that family's model in the home after one real trial run
# (`.github/workflows/model-adoption.yml`, `model-trial.yml`), with no human
# decision, because the rule was the decision; `ignore` — a model older than,
# or superseded by, what we run gets a line in the run summary and nothing
# else; `ask` — a NEW FAMILY, a dearer model, or one with no declared price is
# still the CEO's spending decision, asked as one plain-English question, and
# nothing is adopted until it is answered.
#
# THE CEO'S DECISION OF 2026-10-10: AN EXPLICIT CHOICE CAUTIONS, IT IS NOT
# REFUSED (DRE-6785)
# ------------------------------------------------------------------------
# The CEO, 2026-10-10 17:54 PT, looking at the Planners' dropdown with five of
# seven models grayed out: "It shouldn't gray out these models. I should be
# able to set it to anything I want. Fix this." So a person's explicit choice
# of ANY model with a declared price is admissible for any group and for any
# project; an id with no declared price is refused in plain words. A reviewer
# skips the model that built the pull request at selection time
# (`review_separation` below), so a model may sit with both the Builders and
# the Reviewers. Nothing automatic changed — the probe still walks only DOWN,
# discovery still proposes nothing for a build or planning group, and the daily
# adoption still adopts only a same-family successor at no higher price.
#
# THE CEO'S DECISION OF 2026-10-11: A CHOICE IS A CONFIGURATION VALUE
# (DRE-6939)
# -------------------------------------------------------------------
# "These should all be externalized and all we're doing is changing the values
# of the configuration." A choice made from the page's list is a configuration
# value, not a code change: it needs no review and no release, and it is in
# force from the next agent run. The rules above still hold where it is made —
# the home's reader refuses a document that breaks one
# (`model_home.home_errors`) — and this file keeps the facts those rules read.
#
# Schema
# ------
#   session_agents agent names that run in a person's session rather than a
#                  pipeline workflow — the console's interactive agents
#                  (DRE-6833). A name here is never a pipeline role, in a group
#                  or not: none has an agents.yaml entry, none is in
#                  `model_fallback.AGENT_KINDS`, and no workflow selects a model
#                  for it. Each must be an agent the defaults in the code name.
#                  Making one RUN on its group's model is DRE-6784's work in
#                  agent-bureau.
#   about          agent name → one line saying what it does, for the page to
#                  show beside its name. A line for a name the defaults in the
#                  code do not name is refused.
#   rules          which agents must stay Reviewers and which may sit with the
#                  Planners (DRE-6992) — see the block below.
#   review_separation
#                  the build/review fence, bought at SELECTION time rather than
#                  by keeping the groups' lists disjoint (DRE-3880). `roles`
#                  names the reviewer roles it binds — the critic and the
#                  verifier. A reviewer skips the model that built the pull
#                  request in front of it on that project's walk and the next
#                  model leads, with no rule written for it (DRE-6785). `rules`
#                  may name, for a model on the Reviewers' list AND a build
#                  group's, the model those reviewers use instead when the pull
#                  request was BUILT on it. Validation refuses a rule that
#                  sends the reviewer back to the build model, a
#                  `reviewers_use` that is not on the Reviewers' list, and a
#                  STALE rule describing an overlap that no longer exists.
#   effort         model id → the effort level every run on that model asks
#                  for, passed to the CLI as `--effort`. A model that is NOT
#                  named here is run with no `--effort` argument at all, which
#                  is how adopting one model's level leaves every other model's
#                  spend where it was. Levels are the CLI's own set (low,
#                  medium, high, xhigh, max), and validation refuses both an
#                  unknown level and an entry for an id no group of the
#                  defaults in the code runs — the likeliest cause of the
#                  second being a typo in the id.
#   discovery      what happens to a model id the system SEES but does not
#                  run. `on_new_model` may be `advisory` (a NEW FAMILY may be
#                  proposed for the Reviewers at most, and only after the CEO
#                  answers the `ask` question) or `none`. `workhorse` is
#                  REJECTED by schema validation — that value is precisely the
#                  incident — and so is `judgement`: a newly-discovered family
#                  may never land on a BUILD or a PLANNING group by itself. A
#                  newer version of a family a group already runs is not
#                  governed by this key: it is the `adopt` rule above. `alert`
#                  must be true: discovery is never silent.
#   retired        ids that have rotated OUT of every group. READABLE, never
#                  selectable — `model-attempt:` / `model-error:` markers on
#                  in-flight cards must keep attributing, and dropping an id
#                  would resolve those deaths to None instead of reporting them.
#                  A retired id is set aside by the home's reader wherever the
#                  home names it, and an id the defaults in the code still run
#                  may not be retired.
#   excluded       ids that are available but excluded from EVERY group by
#                  POLICY (cost/quota). Same read-not-select treatment as
#                  `retired`. It also holds a model the CEO has said we do
#                  not use (`claude-haiku-5-5`, DRE-6288).

# The agents that run in a person's session, not a pipeline workflow (DRE-6833).
# None of them has an agents.yaml entry in this repo, and that is fine: a name
# here is never a pipeline role, in a group or not. `model_fallback` answers
# it as an unknown name (the top of the Builders' list), and rule 10 does not
# apply to it, so the CEO may put it in any group. Its group is a choice, in
# the home; making it run on that group's model is DRE-6784 (agent-bureau).
session_agents:
  - designer
  - ux-ui-engineer
  - fullstack-engineer
  - mobile
  - product-lead

# THE RULES THE PAGE OFFERS BY (DRE-6992)
# ---------------------------------------
# Which agents must stay Reviewers (rule 3: they review before an unattended
# merge) and which may sit with the Planners (rule 10: the Planners run once per
# epic on the strongest model). `model_fallback` reads both lists when it loads
# — `BACKSTOP_ROLES` and `JUDGEMENT_ROLES` — and the console reads them to know
# what its page may offer. A name in `session_agents` may hold any group, and
# this block does not restate that. Not the `rules` under `review_separation`,
# below: a different key. A file with no block reads exactly these values.
rules:
  reviewers_only: [critic, verifier]
  planners_may_hold: [planner]

# One line per agent the defaults in the code name, for the page to show
# beside its name. A line for a name they do not is refused.
about:
  engineer: Builds a card and opens the PR
  frontend: Builds the screens a card asks for and opens the PR
  database-architect: Designs the schema and writes the migrations a card needs
  devops: Writes the infrastructure, CI and deploy code a card needs
  fixer: Answers a review's requested changes on an open PR
  repairer: Repairs the main branch when its tests go red
  proof: Runs a proof card's checks and records what it saw
  planner: Turns an epic into the cards the fleet builds
  critic: Reviews every pull request before it merges
  verifier: Tries a UI or multi-system change the way a person would
  medic: Diagnoses a failed run and says what went wrong
  plan-critic-pre: Checks a plan's cards before they reach the CEO
  plan-critic-post: Reads a passed plan as the spec agents will build from
  designer: Designs screens and systems
  ux-ui-engineer: Turns a design into working screens
  fullstack-engineer: Builds across the front and back end
  mobile: Builds the mobile apps
  product-lead: Decides what to build next and writes the cards

# THE BUILD/REVIEW FENCE, DECLARED (DRE-3880, CEO decision 2026-09-16)
# --------------------------------------------------------------------
# `claude-sonnet-5` topped the Reviewers' list AND backed the Builders', so
# the separation the old schema rule bought by keeping those two lists disjoint
# has to be bought somewhere else. It is bought at SELECTION time, per pull
# request: the reviewers for a pull request skip the model it was built on, on
# the walk that project's reviewers really make, and the next model leads.
# Since 2026-10-10 (DRE-6785) that needs no rule written here: a rule below
# only says which model leads instead, when a build ran on the model it names.
#
# Since 2026-09-28 (DRE-5116) TWO models sit on both lists in the defaults in
# the code: Sonnet 5.5 tops the Reviewers' and is the Builders' Sonnet model,
# and Sonnet 5 is the model below it on both. Each carries a rule sending its
# builds to Opus 5.5.
# A reviewer never falls back onto the build model, even when every other model
# on its walk is unavailable: an Opus 5.5 build whose two Sonnet reviewers are
# both down is reviewed on neither Opus 5.5 nor anything else, and the review
# fails loudly, saying the build model was skipped for separation, until a
# Sonnet returns. A card whose build model cannot be read reviews on the
# walk's last rung (Opus 5.5 today), whatever other walk it sits on, and says
# so — every rung might have built it, and the dispatch may not strand.
#
# The overlap is not new in principle — the Reviewers' own fallback has long
# been the Builders' first model, so reviewer and worker have coincided
# whenever the critic falls back. What is new is that the guarantee is explicit
# per run instead of incidental.
#
# A rule is not decoration: `model_fallback.policy_errors` refuses a rule
# pointing back at the build model, a `reviewers_use` that is not on the
# Reviewers' list, and a rule that no longer describes a real overlap — each
# judged on the defaults in the code. That last one is the DRE-3892
# carry-forward: a same-family successor replaces a Sonnet model on BOTH lists
# at once, and a rule left behind is refused by `policy_errors` when the
# selector loads this file.
review_separation:
  # The two roles that REVIEW a pull request. The medic is advisory too and is
  # deliberately absent: it diagnoses a failed run and reviews nothing, so
  # binding it would be a spend change nobody asked for.
  roles:
    - critic
    - verifier
  rules:
    - built_on: claude-sonnet-5-5
      reviewers_use: claude-opus-5-5
      reason: >-
        a Sonnet-5.5 build is never reviewed by Sonnet 5.5 (DRE-5116). Opus
        5.5, not Sonnet 5: Sonnet 5 is Sonnet 5.5's own predecessor, so a
        different family is the real separation, and Opus 5.5 is already the
        substitute below, so this adds no model these roles did not already run
        on. A card we could not read (`--built-on-unknown`) still lands on Opus
        5.5, exactly as it did before, because both Sonnet rungs come off.
        Sonnet 5 stays behind it as the next rung.
    - built_on: claude-sonnet-5
      reviewers_use: claude-opus-5-5
      reason: >-
        a Sonnet-5 build is never reviewed by Sonnet 5. Opus 5.5 is the
        advisory ladder's own last rung, so the substitute is a model these
        roles already run on rather than a new spend decision; Sonnet 5.5, a
        different model, stays behind it. The id moved
        with that rung on 2026-09-25 (DRE-4836) — this is the DRE-3892
        carry-forward arriving exactly as written: a same-family adoption moves
        the overlap on both ladders at once, and a rule left naming
        `claude-opus-5` would be STALE and refused by validation.

# THE EFFORT LEVEL, DECLARED (DRE-4836, CEO decision 2026-09-24)
# ---------------------------------------------------------------
# "we should be using the new opus 5.5 models on high effort." Claude Opus 5.5
# defaults to `medium`, one level BELOW Claude Opus 5's `high`, so an adoption
# that moved the id and said nothing about effort would have every build agent
# in the fleet thinking one level less with nothing in any log saying so. The
# level is therefore set EXPLICITLY on every run that selects this model — not
# its own default, and not the harness's.
#
# It is DATA here: one place a human edits, one reader
# (`model_fallback.effort_for`), and every workflow step that chooses a model
# emits the argument for the model it actually chose. A run that FELL to
# another model gets that model's level — Opus 5's, which is to say none,
# because Opus 5 already defaults to `high`.
#
# Claude Sonnet 5.5 (DRE-5116) is declared at `high` too. That is the level the
# fleet runs Sonnet 5 at — Sonnet 5 has no entry because its default IS `high`
# — and Sonnet 5.5's default is still `high`, but its levels are recalibrated,
# so the level is written down rather than left to a default that may move.
# Both live trials ran at the default, which is this same level.
effort:
  claude-opus-5-5: high
  claude-sonnet-5-5: high

discovery:
  # A NEW FAMILY we SEE but do not run may, at most, be proposed for the
  # Reviewers — and only after the CEO answers the one plain-English question
  # `.github/workflows/model-adoption.yml` files for it (the `ask` rule). Until
  # then nothing is adopted. `workhorse` is rejected by schema validation: that
  # value IS the 2026-08-09 incident, written down as config. `judgement` is
  # rejected the same way — the Planners run the strongest model we have,
  # which makes them the most attractive place for an unattended promotion to
  # land. A newer version of a family a group already runs is the `adopt`
  # rule, not this key: after a trial (`model-trial.yml`) it replaces its
  # family's model in the home, and never adds one.
  on_new_model: advisory
  # Never silent. A newly discovered model is sorted by the CEO's rule of
  # 2026-09-14 in the daily `model-adoption` workflow — `adopt`, `ignore` or
  # `ask`.
  alert: true

retired:
  - model: claude-opus-4-8
    reason: "rotated out when Opus 5 landed; kept readable so old markers attribute"

# Fable held the Reviewers 2026-08-09 to 2026-08-12 and came off on a
# MEASUREMENT, not a preference: it cost 5.5x per critic review ($0.60 -> $3.33
# median, portico) with no measured quality gain. Kept readable, never
# selectable, so model-attempt:/model-error: markers on in-flight cards still
# attribute instead of resolving to None.
#
# This is `claude-fable-5`, the PREDECESSOR of `claude-fable-5-1`. Two
# different model ids: the exclusion below is the one measured against critic
# volume and it is untouched by DRE-3015 — nothing excluded may be on ANY
# group's list, and validation enforces that on its own terms rather than
# trusting the next edit.
excluded:
  - model: claude-haiku-5-5
    reason: "on no ladder by the CEO's signed answer of 2026-10-08 (DRE-6288): added to the record, used by no agent or reviewer until he says otherwise"
  - model: claude-fable-5
    reason: "off every ladder on cost policy (2026-08-12)"
