# agents.yaml — the machine-readable agent roster (DRE-1335).
#
# THE CONTRACT: this file is the source of truth for "what agents exist and
# how they run." The console reads it via the GitHub contents API (never by
# parsing workflow YAML). Any change to an agent's budgets, trigger, or brief
# in .github/workflows/ MUST update this file in the same PR.
#
# EXCEPT the model. `model:` is a GENERATED mirror of config/models.yaml
# (DRE-2316), which is the ONE file a human edits to change what an agent runs
# on — and the file the CI path itself reads. Each `model:` line sits inside a
# marked generated region below; edit the config and then run
# `python3 scripts/sync_model_config.py`. CI fails red on drift. The
# ordered fallback LADDERS live in that config only: they used to be
# copy-pasted five times into this file, where nothing on the CI path read them.
#
# Schema (one entry per agent):
#   name      — stable identifier (lowercase)
#   role      — human label shown in the console roster
#   category  — business-function grouping for the console roster:
#               product | development | operations | marketing | sales
#               (product = planning/spec; development = building & code review;
#               operations = devops, fixes, verification, pipeline health;
#               marketing/sales reserved for future agents — no entries yet)
#   kind      — GENERATED: the role kind from config/models.yaml (DRE-2317).
#               `workhorse` = high-volume build work, the hot path, a
#               cost-appropriate model. `advisory` = bounded consults at
#               decision points (critic, verifier, medic) — the STRONGEST
#               model, because the critic gates every unattended merge and a
#               shallow review is a silent failure. A role is assigned a KIND,
#               never a ladder, and the advisory model is unreachable from any
#               build ladder at any availability.
#   model     — GENERATED: the top of that kind's ladder in config/models.yaml.
#               Selection walks that ladder at runtime and uses the first
#               AVAILABLE model (DRE-1490); the probe decides how far DOWN a
#               ladder to walk, never how far up — a model that is not ON a
#               ladder is never selected, however available it becomes.
#               Availability is not permission: that is what put the whole
#               fleet on Fable on 2026-08-09 with nobody deciding.
#   trigger   — what starts a run (relay dispatch / GitHub event / sweep)
#   maxTurns  — hard turn budget passed via claude_args
#   maxBudget — advisory dollars per run (console display; not enforced)
#   tools     — allowedTools passed to the agent
#   briefPath — role brief in this repo (briefs/<role>.md), if any
#   workflow  — the reusable workflow implementing the agent

agents:
  - name: engineer
    role: Engineer
    category: development
    # Rides the WORKHORSE ladder (config/models.yaml), shared by every build
    # agent — no role hardcodes a model. Selection probes availability at
    # runtime and uses the first AVAILABLE entry.
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: workhorse
    model: claude-opus-5  # top of the `workhorse` ladder
    # END generated model
    trigger: "Linear card → Todo → relay repository_dispatch (agent-execute)"
    maxTurns: 150
    maxBudget: 12
    tools: [Bash, Edit, Write, Read, Glob, Grep]
    briefPath: briefs/engineer.md
    workflow: .github/workflows/agent-task.yml

  - name: frontend
    role: Frontend
    category: development
    # Engineer in WEB MODE — same shared ladder as engineer. The brief
    # (briefs/frontend.md) binds every engineer rule and adds the web specifics
    # (Vite SPA, the static-asset/MIME proxy trap, esbuild Node-API, same-origin
    # /graphql, the **Design:** fidelity convention). Routed by an agent:frontend
    # label; runs on the shared agent-task.yml like the engineer.
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: workhorse
    model: claude-opus-5  # top of the `workhorse` ladder
    # END generated model
    trigger: "Linear card (label agent:frontend) → Todo → relay repository_dispatch (agent-execute)"
    maxTurns: 150
    maxBudget: 12
    tools: [Bash, Edit, Write, Read, Glob, Grep]
    briefPath: briefs/frontend.md
    workflow: .github/workflows/agent-task.yml

  - name: database-architect
    role: Database Architect
    category: development
    # Data-layer specialist — relational schema design, migrations, indexing,
    # query/performance tuning, plus analytical/warehouse modeling (dimensional,
    # ELT, dbt). AUTHOR-ONLY: writes schema/migrations/models as code and NEVER
    # executes against a live database. Shown in the roster now; CI auto-dispatch
    # is intentionally NOT wired yet (no agent:database label route / no new
    # workflow). The workflow field points at the shared agent-task.yml only to
    # satisfy the roster schema — NOTHING routes a Linear label here, so it can
    # never be auto-dispatched (label routing resolves only planner/devops/
    # frontend, else engineer; see scripts/model_fallback.py + validate_card.py).
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: workhorse
    model: claude-opus-5  # top of the `workhorse` ladder
    # END generated model
    trigger: "Operator-launched (interactive Claude Code / VS Code task); CI auto-dispatch not yet wired"
    maxTurns: 150
    maxBudget: 12
    tools: [Bash, Edit, Write, Read, Glob, Grep]
    briefPath: briefs/database-architect.md
    workflow: .github/workflows/agent-task.yml

  - name: devops
    role: DevOps
    category: operations
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: workhorse
    model: claude-opus-5  # top of the `workhorse` ladder
    # END generated model
    trigger: "Linear card (label agent:devops) → Todo → relay repository_dispatch (agent-execute)"
    maxTurns: 150
    maxBudget: 12
    tools: [Bash, Edit, Write, Read, Glob, Grep]
    briefPath: briefs/devops.md
    workflow: .github/workflows/agent-task.yml

  - name: fixer
    role: Fix agent
    category: operations
    # Attempt 3 is a FRESH-EYES escalation, not a MODEL escalation: same
    # workhorse ladder, new framing (re-derive the fix from scratch rather than
    # patch the last attempt). It used to hardcode a pricier model here and in
    # agent-fix.yml; an attempt-gated escalation is still a build path, and the
    # workflow now selects from config/models.yaml like every other agent.
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: workhorse
    model: claude-opus-5  # top of the `workhorse` ladder
    # END generated model
    trigger: "workflow_dispatch — merge-gate DIRTY path, conflict sweep, approved-but-red sweep, critic REQUEST_CHANGES"
    maxTurns: 60
    maxBudget: 9
    tools: [Bash, Edit, Write, Read, Glob, Grep]
    briefPath: null
    workflow: .github/workflows/agent-fix.yml

  - name: critic
    role: QA Critic
    category: development
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: advisory
    model: claude-fable-5  # top of the `advisory` ladder
    # END generated model
    trigger: "agent PR opened/updated (head agent/*) or workflow_dispatch re-review"
    maxTurns: 40
    maxBudget: 3
    tools: [Bash, Read, Glob, Grep]
    briefPath: null
    workflow: .github/workflows/qa-review.yml

  - name: verifier
    role: Verifier
    category: operations
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: advisory
    model: claude-fable-5  # top of the `advisory` ladder
    # END generated model
    trigger: "agent PR opened/updated (head agent/*) on multi-system or UI (**Design:**) cards; scope-gated SKIP otherwise"
    maxTurns: 60
    maxBudget: 5
    tools: [Bash, Edit, Write, Read, Glob, Grep]
    briefPath: briefs/verifier.md
    workflow: .github/workflows/verify.yml

  - name: planner
    role: Planner
    category: product
    # Same workhorse ladder as the engineer (DRE-1490) — both roles walk it
    # best→worst and use the first AVAILABLE model.
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: workhorse
    model: claude-opus-5  # top of the `workhorse` ladder
    # END generated model
    trigger: "Linear epic (label agent:planner) → Todo → relay repository_dispatch (agent-plan)"
    maxTurns: 50
    maxBudget: 8
    tools: [Bash, Read, Glob, Grep]
    briefPath: briefs/planner.md
    workflow: .github/workflows/plan.yml

  - name: medic
    role: Pipeline Medic
    category: operations
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: advisory
    model: claude-fable-5  # top of the `advisory` ladder
    # END generated model
    trigger: "workflow_run failed twice (attempt 1 auto-retries without an agent)"
    maxTurns: 40
    maxBudget: 3
    tools: [Bash, Read, Glob, Grep, Write]
    briefPath: null
    workflow: .github/workflows/medic.yml

  - name: repairer
    role: Red-Main Repair
    category: operations
    # Engineer ladder (DRE-1490): the repair agent is an engineer-tier fixer.
    # BEGIN generated model — canonical: config/models.yaml (regenerate: scripts/sync_model_config.py)
    kind: workhorse
    model: claude-opus-5  # top of the `workhorse` ladder
    # END generated model
    trigger: "workflow_run — default-branch CI conclusion=failure (event-driven; no polling; ≤2 attempts per failing SHA)"
    maxTurns: 100
    maxBudget: 10
    tools: [Bash, Edit, Write, Read, Glob, Grep]
    briefPath: null
    workflow: .github/workflows/red-main-repair.yml
