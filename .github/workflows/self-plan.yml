# Self-host trigger stub (DRE-1929, adr-bureau-pipeline-self-host) — this repo
# consumes its OWN reusable workflows exactly like a product repo.
# @main on purpose: this repo is the canary channel; the fleet rides tags.
#
# The activate route promotes cards, so this stub is one of the repo's two
# WIP-cap paths. Like self-reconcile it passes no max_wip — both or none
# (DRE-2529) — so the number is this repo's BUREAU_MAX_WIP Actions variable,
# which the console writes, and default 8 while it is unset (DRE-6783).
# self-linear-sync was the third until DRE-9254, when a merge's promotion
# moved to the relay's card-done Reconcile pass.
name: Agent Plan

on:
  repository_dispatch:
    types: [agent-plan]

concurrency:
  group: agent-${{ github.event.client_payload.identifier }}
  cancel-in-progress: false

permissions:
  # DRE-4269: the agent's scrubbed log uploads on a short-lived AWS login,
  # and a reusable workflow can hold no more permission than the stub that
  # calls it — so the grant has to live here.
  id-token: write
  contents: read

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/plan.yml@main
    with:
      pipeline_ref: main
    secrets: inherit
