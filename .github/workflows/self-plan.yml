# Self-host trigger stub (DRE-1929, adr-bureau-pipeline-self-host) — this repo
# consumes its OWN reusable workflows exactly like a product repo.
# @main on purpose: this repo is the canary channel; the fleet rides tags.
#
# The activate route promotes cards, so this stub is one of the repo's three
# WIP-cap paths. It passes no max_wip, matching self-reconcile and
# self-linear-sync — override all three or none (DRE-2529). An empty input is
# resolved from self-reconcile.yml, which sets none, so the cap is
# reconcile.DEFAULT_MAX_WIP ("8") on every path (DRE-3994).
name: Agent Plan

on:
  repository_dispatch:
    types: [agent-plan]

concurrency:
  group: agent-${{ github.event.client_payload.identifier }}
  cancel-in-progress: false

permissions:
  id-token: write # DRE-4269: the agent's scrubbed log uploads on a short-lived AWS login; a reusable workflow can hold no more than its stub grants
  contents: read

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/plan.yml@main
    with:
      pipeline_ref: main
    secrets: inherit
