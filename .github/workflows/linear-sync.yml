# Closes the loop: when an agent PR merges, the Linear card moves to Done.
# This is the bureau's complete-card principle made structural — the Done
# transition fires from GitHub's merge event (ground truth), never from an
# agent's claim that it merged something.
#
# Done gate (DRE-2027, DRE-727 class): the ONLY card this workflow may move
# to Done is the one whose OWN agent branch was merged — head ref anchored
# `agent/DRE-<n>-<slug>`, delimiter required after the number (DRE-142 can
# never act for DRE-1428; same rule as agent-task.yml's branch lookup,
# DRE-2025). Card references in PR titles/bodies are prose, not provenance —
# they never transition other cards ("part of DRE-99" in a title used to
# auto-Done epic DRE-99, and the cloud era has no auto-revert). Hand-named
# branches (ops/..., chore/...) auto-Done NOTHING: the operator closes those
# cards by hand, which was already the real behavior for operator work.
#
# Operator/demo guard (six false closes in portico — DRE-2242 ×2, DRE-2241,
# DRE-2218, DRE-2253, DRE-2252, cascading to epic DRE-2169): an agent branch
# pointing at a `no-code` operator card or a `DEMO:`-titled card defeated the
# intent above — merging the RUNBOOK/report closed a card whose real
# acceptance is live AWS work or demo evidence. `card-done` (linear_ops.py)
# now checks the card's labels/title and refuses those two classes: the merge
# is commented on the card, the state is left for the operator/evidence.
#
# Epic guard (DRE-3119): the head-ref anchor above closes "part of DRE-99 in a
# PR title" — it assumes the branch is named for a CARD. A branch named for the
# EPIC the work serves passes it. agent-bureau PR #2273 merged on
# `agent/DRE-3060-one-river-phase-chain`, and DRE-3060 was an epic in Planning
# with 21 children and a planner run in flight; an epic's Done ends its plan,
# and epic_autoclose and prove_phase read it. `card-done` refuses an epic as a
# third class — read off the same shape the rest of the pipeline uses
# (`mid_epic.is_epic`: `[EPIC]` in the title, or any children; never
# `agent:planner`, which every classified one-off still wears) — comments the
# merge on the epic and leaves the state alone. Name the branch for the card
# the work delivers.
#
# Dependabot arm (DRE-3665): the one branch that can never carry a card id is
# `dependabot/*` — dependabot names its own branches — so every dependency
# bump in the fleet merged with no card to close (atlas #154 read "CARD —" on
# the console). The reconcile sweep now files one card per dependabot pull
# request and prepends ONE machine-written line to the pull request body
# (`scripts/dependabot_card.py`, `**Card:** DRE-<n> — filed by the reconcile
# sweep …`). The fenced arm below reads that line — and ONLY when the head ref
# gave no card, the head is `dependabot/*` and the author is dependabot[bot],
# all checked inside `dependabot_card.py card-from-pr`. That is not the
# DRE-2027 hole re-opened: a person cannot author a dependabot pull request,
# and for every branch a person CAN name the body stays prose. The head-ref
# line is untouched and still reads only `$HEAD_REF`
# (tests/test_linear_sync_done_gate.py); the arm is pinned by
# tests/test_dependabot_card.py.
#
# Stacked-base gate (DRE-4647): "merged" and "landed" were the same word, and
# for a stacked pull request they are not. On 2026-09-21 17:46 PT the merge
# gate merged agent-bureau #2691 and #2692 into `agent/DRE-4534-record-reads` —
# their parent's branch, not `main` — and this workflow moved DRE-4535 and
# DRE-4536 to Done. Their code was on no default branch: the parent (#2690) and
# its own parent (#2688) were still open drafts and did not land until
# 2026-09-22 09:57 PT. A card is Done only when its code is on the default
# branch. The job now reads `base.ref` against the repository's own
# `default_branch` (through step env, never interpolated — a branch name is
# attacker-nameable, the same rule `PR_BODY` already follows) and on a
# non-default base it closes nothing, sweeps nothing, and posts ONE plain
# comment on the card instead. The conflict sweep is gated on the same
# question: a merge into a side branch is not the moment sibling pull requests
# go DIRTY. Closing those cards when the parent finally lands is a sibling
# card; it finds them by the `🪜 Merged into` receipt.
#
# Stacked-landing closer (DRE-4650): the other half of that gate. When the
# parent finally lands on the default branch, the pull requests that merged INTO
# its head ref are the ones whose code has just arrived — and until this card
# nothing moved them. On 2026-09-22 09:57 PT agent-bureau #2690
# (`agent/DRE-4534-record-reads`) landed on `main` carrying #2691 and #2692 with
# it; with the gate above in place DRE-4535 and DRE-4536 would have sat In
# Review holding a receipt and waiting on a closer that did not exist.
# `scripts/stacked_landing.py landed <repo> <head> <default>` lists those pull
# requests off GitHub (`gh pr list --state merged --base <head>`, never off the
# receipt — a card that carries it and a card that does not are closed the same
# way), names each one's card by the SAME anchored own-branch rule below, and
# closes it through the same `card-done` with the same guard. It recurses one
# level per landed head for a grandchild, bounded; a GitHub read that fails
# closes nothing and says so. It runs inside the step below, after the merged
# card's own `card-done` and before the merge sweeps, so `--promote-only` sees
# the whole set of cards this landing made Done — and after the gate above, so
# it runs only on a default-branch merge. That read is the one thing this job
# never had: it mints the qa-bot token for it, and survives a mint that fails.
#
# Reusable workflow: permissions live in the calling stub.
name: Linear Sync (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkouts (scripts, briefs,
          standards). REQUIRED since DRE-2689: a caller must pass the same
          ref it pins in `uses:`, or it runs channel workflow YAML over
          another ref's scripts — pinned to everything that counts refs,
          and not actually pinned (DRE-2026).
        type: string
        required: true
      max_wip:
        # The repo's ONE work-in-progress cap (DRE-2529). When the merge
        # handler below promotes (gated since DRE-2930) it runs the same
        # `reconcile.py --promote-only` the reconcile sweep runs, so it
        # must promote at the same cap the caller gives
        # reconcile.yml — it used to hardcode 8, which meant a repo capped at
        # 12 had this fast path refuse between 8 and 11 in flight while the
        # cron promoted the very same card an hour later, at 12.
        # NO DEFAULT, on purpose (DRE-3994). A stub that passes nothing renders
        # an empty input, and reconcile.py then reads the cap from the caller's
        # own reconcile.yml stub — the value the sweep runs at. A declared "8"
        # here promoted a merged card's dependents at 8 in repos held at "0".
        description: WIP cap for the dependency gate's auto-promotion (empty = the caller's reconcile.yml stub)
        type: string
        required: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: true
      BUREAU_APP_ID:
        required: false
      BUREAU_APP_PRIVATE_KEY:
        required: false
      BUREAU_QA_APP_ID:
        required: false
      BUREAU_QA_APP_PRIVATE_KEY:
        required: false

jobs:
  card-done:
    if: github.event.pull_request.merged == true
    # The SHORT-job lane (DRE-3887). Closing a card is seconds of Linear calls,
    # and the conflict sweep below is two `reconcile.py` passes around a 105s
    # sleep — neither needs the pool that runs the 20-minute Claude jobs, and
    # sharing it is what left agent-bureau's gates queued for an hour on
    # 2026-09-13. `BUREAU_SHORT_RUNS_ON` unset renders exactly today's runner,
    # so nothing moves until a repo sets it
    # (`tests/test_short_runs_on_lane.py`).
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    # Whose Linear hour this job spends (DRE-3321) — see reconcile.yml's sweep
    # for the why. Job level, beside the job that reads secrets.LINEAR_API_KEY,
    # so every step inherits it and none of them is edited.
    env:
      LINEAR_IDENTITY: fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      # The stacked-landing closer's ONE credential (DRE-4650). This job has
      # never held a GitHub token — closing a card is Linear calls — and the
      # closer needs to ask GitHub which pull requests merged into the head
      # that just landed. The qa-bot is the identity that merged them, and the
      # read is read-only; `github.token` cannot do it, because the calling
      # stub grants this reusable `contents: read` and a declared permissions
      # block makes every other scope `none`.
      #
      # `continue-on-error` is load-bearing, not tidiness: a repo that has not
      # installed the qa-bot App (these secrets are `required: false` above)
      # would otherwise fail this job at the mint and never close the card that
      # actually merged — a regression paid by every merge, to add a closer for
      # stacked ones. A mint that fails renders an empty token, `gh pr list`
      # exits non-zero, and the closer takes its own fail-closed path: it lists
      # nothing, says `could not list stacked pull requests`, and closes
      # nothing.
      - name: Mint qa-bot token (for the stacked-landing read)
        id: qa
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}

      - name: Card → Done
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # The stacked-landing closer's GitHub read (DRE-4650). Empty when the
          # mint above could not run; the closer fails closed on it.
          GH_TOKEN: ${{ steps.qa.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The dependabot arm's inputs (DRE-3665), through env and never
          # interpolated into the shell: the body is untrusted text.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # The stacked-base gate's two inputs (DRE-4647), through env for the
          # same reason the body is: a base branch is named by whoever opened
          # the pull request. The default branch is read off the REPOSITORY,
          # never assumed to be `main` — the fleet's repos are free to differ.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The caller's cap, never a literal (DRE-2529). Through env, not
          # interpolated into the shell line.
          MAX_WIP: ${{ inputs.max_wip }}
        run: |
          # Own-branch provenance only (DRE-2027): anchored agent/DRE-<n>- or
          # repair/DRE-<n>- with the delimiter required after the number;
          # case-insensitive, normalized to uppercase (DRE-2003). PR title/body
          # never read.
          #
          # repair/ joined agent/ in DRE-3533. A Red-Main Repair now files its
          # card before it starts and names its branch after it, so the ref
          # carries the same own-branch provenance an agent ref does — the
          # repair agent filed the card and is the one working it. The cardless
          # repair/<sha> fallback (Linear unreachable) matches nothing here and
          # still closes nothing, which is correct: there is no card to close.
          CARD=$(printf '%s' "$HEAD_REF" | grep -oiE '^(agent|repair)/DRE-[0-9]+-' | grep -oiE 'DRE-[0-9]+' | tr '[:lower:]' '[:upper:]' || true)
          # >>> DRE-3665 dependabot join — executed verbatim by tests/test_dependabot_card.py
          # A dependabot head carries no card id and cannot be renamed; the
          # reconcile sweep filed its card and wrote the id on the first line
          # of the pull request body. Read ONLY when the head ref gave nothing,
          # and the script answers only for a `dependabot/*` head authored by
          # dependabot[bot] (see the header). Reads HEAD_REF, PR_AUTHOR, PR_BODY
          # from the step env.
          if [ -z "$CARD" ]; then
            CARD=$(python3 .bureau-pipeline/scripts/dependabot_card.py card-from-pr || true)
          fi
          # <<< DRE-3665 dependabot join
          if [ -z "$CARD" ]; then
            echo "head branch '$HEAD_REF' is not a card's own branch (agent/DRE-<n>-<slug> or repair/DRE-<n>-<sha12>) — no automatic Done"
            echo "card references in PR titles/bodies never transition cards; hand-named branches are closed by the operator"
            exit 0
          fi
          # >>> DRE-4647 stacked-base gate — executed verbatim by tests/test_linear_sync_stacked_base.py
          # Merged is not landed. A pull request merged into another agent's
          # branch puts nothing on the default branch, so its card is not Done
          # and nothing this merge touched is promotable — the two false Dones
          # of 2026-09-21 (see the header) are exactly this. The card keeps its
          # state and gets ONE comment saying where the work actually went; the
          # `🪜 Merged into` opener is the contract the sibling card that closes
          # these cards on the landing reads them back by. Both values come
          # from the step env above and are never interpolated into this shell.
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::notice::$CARD is NOT going Done: pull request $PR_URL merged into '$BASE_REF', which is not the default branch '$DEFAULT_BRANCH'"
            echo "a card is Done only when its code is on the default branch; the state is left alone and the merge is commented on the card"
            echo "no merge sweep runs either — nothing this merge changed is on '$DEFAULT_BRANCH', so there is nothing to promote and no epic to close"
            STACKED=$(printf '🪜 Merged into `%s`, not `%s`. This card goes Done when `%s` lands on `%s` (pull request %s).' \
              "$BASE_REF" "$DEFAULT_BRANCH" "$BASE_REF" "$DEFAULT_BRANCH" "$PR_URL")
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" "$STACKED"
            exit 0
          fi
          # <<< DRE-4647 stacked-base gate
          # card-done, NOT a bare `state Done`: the no-code/DEMO guard lives
          # inside it (the six portico false closes — see header). Ordinary
          # code cards go Done + "✅ Merged" comment exactly as before; a
          # skipped card still gets the merge commented so the state never
          # lies in either direction.
          python3 .bureau-pipeline/scripts/linear_ops.py card-done "$CARD" "$PR_URL"
          # >>> DRE-4650 stacked landing — executed verbatim by tests/test_stacked_landing.py
          # The other half of the gate above. This merge reached the default
          # branch, so every pull request that had merged into THIS head ref is
          # on the default branch too — and the gate above deliberately left
          # those cards open when they merged. Closing them is this line.
          #
          # HERE, and not a step of its own, because the position is the
          # contract: after the merged card's own `card-done` so the parent is
          # closed first, and before the merge-sweep gate below so
          # `--promote-only` sees the whole set of cards this landing made Done
          # rather than one of them. It is also below the DRE-4647 gate's
          # `exit 0`, which is what makes it run on a default-branch merge only.
          #
          # Fail-closed and exit 0 by construction (see the script): a GitHub
          # read that fails lists nothing and says so, so a closer that could
          # not look never fails a merge that succeeded, and no card is guessed
          # Done. Values come from the step env; nothing is interpolated.
          python3 .bureau-pipeline/scripts/stacked_landing.py landed "$GITHUB_REPOSITORY" "$HEAD_REF" "$DEFAULT_BRANCH"
          # <<< DRE-4650 stacked landing
          # Event-driven sweeps, but only the ones THIS merge can have changed
          # (DRE-2930). Two board-wide passes used to run here unconditionally:
          #   --promote-only  a Done may have unblocked dependent Backlog
          #                   children — promote them NOW rather than waiting
          #                   on the drifting cron ("*/15" delivers 78-100 min
          #                   apart in practice). Pure Linear; the Backlog→Todo
          #                   transition rides the relay webhook for the actual
          #                   agent dispatch.
          #   --close-epics   a Done may have been an epic's LAST child — close
          #                   the parent NOW rather than letting it read "still
          #                   working" until the next full sweep, which is the
          #                   only other place epic-close runs. (DRE-1496 sat In
          #                   Progress with 9/9 children Done; DRE-1552.)
          # They do different work on different cards, which is why both are
          # still here — but neither was conditional on the merge having made
          # its work true. 47 merges on 2026-09-01 therefore bought ~94 extra
          # full-board passes and helped exhaust Linear's 2,500/hour quota: a
          # cost unbounded in merge rate, worst on our best days.
          # merge_sweep_gate reads the merged card ONCE and prints the flags
          # this merge justifies — usually none. It falls back to both on an
          # unreadable card, and to none on an exhausted quota (a sweep cannot
          # succeed against a spent limit and would deepen it — DRE-1921).
          # MAX_WIP comes from the step env above — the caller's cap, so this
          # fast path and the cron sweep never disagree (DRE-2529). Empty when
          # the stub passes none: reconcile.py then reads the caller's
          # reconcile.yml stub from the checkout above (DRE-3994).
          # MERGED_CARD scopes each pass to what THIS merge can have changed
          # (DRE-3236): the merged card's own dependents for --promote-only,
          # its own parent for --close-epics. A pass that read the whole board
          # and walked every epic to act on one card cost 110 requests per
          # merge on 2026-09-05; everything else waits for the cron, as the
          # gate above already decided for what it declines.
          # >>> DRE-2930 merge-sweep gate — executed verbatim by tests/test_merge_sweep_gate.py
          SWEEPS=$(python3 .bureau-pipeline/scripts/merge_sweep_gate.py "$CARD")
          for SWEEP in $SWEEPS; do
            REPO="$GITHUB_REPOSITORY" \
              REPO_SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]') \
              MERGED_CARD="$CARD" \
              python3 .bureau-pipeline/scripts/reconcile.py "$SWEEP"
          done
          # <<< DRE-2930 merge-sweep gate

  # Event-driven conflict sweep: a merge to the default branch is the exact
  # moment sibling PRs touching the same files go DIRTY — and DIRTY PRs emit
  # zero workflow events, so without this only the drifting cron notices.
  # (Origin: PR #1348 / DRE-1277 waited ~1h between sibling merges.)
  #
  # "To the default branch" is now checked rather than assumed (DRE-4647). A
  # merge into another agent's branch changes nothing on the default branch, so
  # it is not the moment siblings go DIRTY — the sentence above is the gate's
  # own reason and it does not hold for a stacked merge. The 15-minute
  # reconcile sweep remains the backstop for everything this declines.
  conflict-sweep:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    # The short lane, same as `card-done` above (DRE-3887).
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    # Same declaration, same reason (DRE-3321): this job runs the sweep too.
    env:
      LINEAR_IDENTITY: fleet
    steps:
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Dispatch fix agents for newly conflicted PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # The App token cannot dispatch workflows (HTTP 403 — same lesson
          # as reconcile.yml / DRE-1254): dispatches run under the stub's
          # github.token, which the stub grants actions:write.
          GH_DISPATCH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REPO: ${{ github.repository }}
          # Named in the notice below, so the person recovering by hand starts
          # at the run that failed instead of hunting for it.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # >>> DRE-3042 conflict sweep — executed verbatim by tests/test_linear_sync_workflow.py
          # REPO_SLUG, derived exactly as reconcile.yml's Sweep step derives it,
          # and the whole of DRE-3042. reconcile.py binds it at import and
          # `fix_workflow()` reads it; unset it does not raise, it DEFAULTS to
          # `atlas` — so on this repo the sweep computed `agent-fix.yml` (a
          # workflow_call reusable with no dispatch trigger) instead of
          # `self-agent-fix.yml`, `gh workflow run` exited non-zero and the step
          # died having dispatched nothing. PR #244 then sat DIRTY with no
          # critic and no fix loop until a person dispatched it by hand. Every
          # other reconcile.py step set this; only this one did not, and CI now
          # checks all of them against reconcile.REQUIRED_ENV.
          REPO_SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          export REPO_SLUG
          NOTE="${RUNNER_TEMP:-/tmp}/conflict-sweep-note.md"
          OPEN_PRS="${RUNNER_TEMP:-/tmp}/conflict-sweep-open.json"
          CONFLICTED="${RUNNER_TEMP:-/tmp}/conflict-sweep-dirty.txt"

          # GitHub recomputes sibling mergeability lazily after a merge;
          # give it a beat, then sweep twice so a slow recompute still
          # lands inside this run rather than waiting for the cron.
          FIRST_PASS=0
          SECOND_PASS=0
          sleep 45
          python3 .bureau-pipeline/scripts/reconcile.py --conflicts-only || FIRST_PASS=1
          sleep 60
          python3 .bureau-pipeline/scripts/reconcile.py --conflicts-only || SECOND_PASS=1

          # A step that dispatches fix agents must never fail quietly into "no
          # dispatch". A DIRTY pull request emits no workflow events at all —
          # no CI, no review, no merge gate — so when this sweep dies there is
          # nothing else left to say anything: #244's only signal was an exit
          # code inside a job nobody was watching. The second pass sweeps
          # everything the first one did, so ITS failure is what means "no PR
          # was dispatched by this run" — say so on the conflicted pull
          # requests, with the recovery the person doing it by hand would need.
          if [ "$SECOND_PASS" = 1 ]; then
            gh pr list --repo "$REPO" --state open --limit 30 \
              --json number,headRefName,mergeStateStatus > "$OPEN_PRS"
            # The same two questions `unstick_conflicts` asks of each PR, asked
            # here because the helper that asks them is what just failed.
            python3 -c 'import json,sys; print("\n".join(str(p["number"]) for p in json.load(open(sys.argv[1])) if p.get("mergeStateStatus") == "DIRTY" and (p.get("headRefName") or "").lower().startswith("agent/")))' "$OPEN_PRS" > "$CONFLICTED"
            while read -r PR; do
              [ -n "$PR" ] || continue
              # The tag is the idempotency key, as it is for every other receipt
              # this pipeline posts: merge after merge must not stack notices.
              if gh pr view "$PR" --repo "$REPO" --json comments | grep -q conflict-sweep-crashed; then
                echo "conflict sweep: PR #$PR already carries the notice — not repeating it"
                continue
              fi
              BODY=$(printf '%s\n' \
                "🚨 conflict-sweep-crashed: this pull request is CONFLICTED and the sweep that dispatches the fix agent could not run, so no fix agent was dispatched for it." \
                "" \
                "A conflicted pull request emits no workflow events at all, so without this note nothing here would say anything." \
                "" \
                "What happens next: the 15-minute reconcile sweep is the automatic backstop and normally picks this up on its next pass. If it does not, a person dispatches the fix workflow for this pull request by hand." \
                "" \
                "The run that failed: $RUN_URL")
              # DRE-2826: composed through the one receipt writer, which returns
              # this body byte-identically and appends the act trailer. The
              # `|| printf` fallback is the fail-soft rule this repo keeps
              # wherever the notice IS the escalation — a lost trailer is a
              # missing machine-readable line, a lost comment is an invisible
              # conflicted pull request, which is the incident itself.
              python3 .bureau-pipeline/scripts/pipeline_act.py receipt conflict-sweep-unavailable \
                --body "$BODY" --out "$NOTE" \
                || printf '%s' "$BODY" > "$NOTE"
              gh pr comment "$PR" --repo "$REPO" --body-file "$NOTE"
            done < "$CONFLICTED"
          fi

          if [ "$FIRST_PASS" = 1 ] || [ "$SECOND_PASS" = 1 ]; then
            echo "conflict sweep: a sweep pass failed (first=$FIRST_PASS second=$SECOND_PASS) — see the output above" >&2
            exit 1
          fi
          # <<< DRE-3042 conflict sweep
