# The release train (DRE-3167) — the ninth reusable workflow in this repo, in
# the shape of the other eight: a thin stub per product repo rides `@stable`
# and passes `pipeline_ref: stable`, and THIS file contains no product's
# deploy steps. What a surface does is the surface's own script, in the
# caller's repo, under the caller's own identity.
#
# Every rule lives in scripts/release_train.py and is unit-tested without
# GitHub (tests/test_release_train.py) — the promote-channel.yml shape. This
# file only gathers GitHub's records and acts on the verdict.
#
# THE TRAIN IS NEVER STOPPED (DRE-3263, the CEO's rule of 2026-09-06): if the
# commit is ready it goes; if not, the train leaves without it and the next
# train picks it up. A gating check still running is a no-op that names it,
# never a wait — and only the checks that GATE A MERGE are checks (a fix
# agent, the medic, the sweep and this train's own run all report against
# main's head; they are ignored by verified origin). The trigger that makes
# the rule true is CI COMPLETING on the default branch, so the stub in every
# caller must declare, in place of `push`:
#
#   on:
#     workflow_run:
#       workflows: ["CI"]        # the `name:` of the caller's CI workflow
#       types: [completed]
#       branches: [main]
#     schedule:                  # the two cron lines, unchanged
#       - cron: "0 15 * * *"
#       - cron: "0 14 * * *"
#     workflow_dispatch:         # the `surface` input, unchanged
#
# On that event this workflow proceeds only when
# `github.event.workflow_run.conclusion` is `success`; the commit CI ran on
# (`github.event.workflow_run.head_sha`) is a candidate by construction. A
# `push`-triggered stub still works, but fires before that commit's CI has
# started and will find it pending on every run — releasing only from the
# schedule.
#
# READY IS A COMMIT, NOT THE HEAD (DRE-3266, the CEO's amendment of the same
# day, after run 34058913763 at 13:44 PT left with the head still checking
# and its green parent behind it). The plan walks the default branch's
# first-parent line from the head back to each surface's newest tag, newest
# first, and releases the newest commit whose gating checks are all green; a
# still-checking head is stepped past and rides the train its own CI
# completion fires; a red one is stepped past and named. The matrix carries
# the chosen sha per surface, the surface job checks out THAT commit, and
# the script receives it as `RELEASE_SHA`.
#
# THE VENDOR PREMORTEM (standards/vendor-boundaries.md), answered here because
# this workflow is nothing but boundary:
#
#   Q1 WHO INITIATES. The stub's `workflow_run` (CI completing on main) and
#      `schedule` runs initiate as the caller repo itself; a
#      `workflow_dispatch` initiates as whoever ran it. No actor gate is
#      involved — this workflow admits every actor, because the gates that
#      matter are green-at-SHA and the brake, not identity.
#   Q2 WHICH SECRETS STORE. The caller's. `RELEASE_ROLE_ARN` is the caller's
#      OWN OIDC role, so a repo can only ever deploy itself; the two Linear
#      keys are optional and pass through to the script's environment. NOTE
#      that `vars.RELEASE_HOLD` below resolves against the CALLING repository
#      and the organization, never against this repo's own variables — the
#      fleet-wide brake is therefore the ORG variable
#      (standards/release-train.md says so where an operator will read it).
#   Q3 RETRY / RE-RUN. A re-run re-reads the tags: the surface it already
#      released now reads current and is a no-op. The concurrency lane below
#      is per surface and never cancels, so a second CI completion queues
#      behind the first rather than racing it for the same tag — and a
#      commit the newest tag already contains reads current, so a slow CI
#      on an older commit never tags backwards, and a plan whose chosen
#      commit was released by the run it queued behind is a no-op too.
#   Q4 COMMAND LIMITS. GitHub's `schedule:` takes UTC only and has no timezone
#      field, which is why the stub carries two cron lines and the TRAIN reads
#      the clock in America/Los_Angeles.
#   Q5 CRASH MID-FLOW. The tag is the only record, and it is written by the
#      surface script at the end. A crash before it leaves the surface BEHIND,
#      which the next trigger reads and releases; a crash after it leaves the
#      surface CURRENT, which the next trigger reads as a no-op. Nothing here
#      writes a marker that could block its own recovery.
#
# A NO-OP THAT NAMES A MINUTE RE-ARMS ITSELF (DRE-3559). A run that no-ops on
# the spacing names the minute the next release may be cut, and one that
# no-ops on the window names its next open — and neither minute is a trigger.
# On 2026-09-12 four runs (15:23, 15:25, 15:31, 15:35:52 PT) each named 15:36
# PT and the release waited for a hand dispatch at 15:38:58 PT. So the plan
# dispatches the CALLER's stub once, `-f not_before=<UTC minute>`, with this
# run's own `github.token` (a `workflow_dispatch` is one of the two events a
# GITHUB_TOKEN may start a run with); the re-armed run's `wait` job sleeps
# until the minute — bounded by the largest spacing plus two minutes — and
# `plan` then decides as ever, nothing bypassed. The stub must therefore
# declare, beside `surface`:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         not_before:
#           type: string
#           required: false
#           default: ""
#   permissions:
#     actions: write            # was `read`; write covers the reads too
#
# and it need not pass `not_before` to this workflow: a called workflow's
# `github` context is the caller's, so `github.event.inputs.not_before` is
# read here directly — the same way `github.event.workflow_run.head_sha` is.
# A stub without either is a `re-arm skipped: …` clause on the no-op's line,
# never a failed run. NOTE for the caller's permissions: this workflow never
# declares a job-level `permissions:` block, because a called job asking for
# more than its caller granted fails the WHOLE run at startup — an old stub
# with `actions: read` would lose its train, not just its re-arm.
name: Release Train (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkout (the scripts this
          workflow runs). REQUIRED since DRE-2689: a caller must pass the same
          ref it pins in `uses:`, or it runs channel workflow YAML over
          another ref's scripts.
        type: string
        required: true
      surface:
        description: >-
          A hand dispatch, naming ONE surface. It runs that surface even when
          its `auto` is false and outside its window — this is how a
          supervised first release is run. It bypasses nothing else: not
          green-at-SHA, not the spacing, not the fleet-wide brake.
        type: string
        required: false
        default: ""
      aws_region:
        description: The region the caller's release role is assumed in.
        type: string
        required: false
        default: us-west-2
    secrets:
      RELEASE_ROLE_ARN:
        description: The CALLER'S OWN OIDC role — the one required secret.
        required: true
      LINEAR_RELEASE_KEY:
        required: false
      LINEAR_API_KEY:
        required: false

jobs:
  # A RE-ARMED run's first job (DRE-3559), and skipped on every other event.
  # It sleeps until the minute the no-op named — never longer than the
  # caller's largest `spacing_minutes` plus two minutes, straight on if the
  # minute has passed or cannot be read — and then `plan` decides as ever.
  #
  # Its own job, not a step in `plan`, so `plan` keeps the 10-minute bound
  # config/pipeline-acts.json reads `release-ci-green`'s cadence off.
  #
  # THE NAME IS LOAD-BEARING: the plan finds a run already armed for a minute
  # by `Wait until <that minute>` in the jobs API (release_train.armed_run),
  # which is how two no-ops inside one spacing window produce one re-arm. The
  # concurrency group is the backstop for a race past that read: keyed on the
  # repository and the minute, never cancelling, so at most one run SLEEPS for
  # a minute and a second queues without holding a runner. A run with no
  # minute keys on its own run id and shares a lane with nothing.
  wait:
    name: Wait until ${{ github.event.inputs.not_before }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.not_before != ''
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    # Above release_train.WAIT_CEILING_MINUTES (60) plus the slack and the two
    # checkouts; tests/test_release_train_re_arm.py holds it there.
    timeout-minutes: 70
    concurrency:
      group: release-re-arm:${{ github.repository }}:${{ github.event.inputs.not_before || github.run_id }}
      cancel-in-progress: false
    steps:
      # Only the data: the bound is read off the caller's own release.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/bureau

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Wait until the minute the train named
        env:
          # Through env, never interpolated into the shell line (tests.yml).
          NOT_BEFORE: ${{ github.event.inputs.not_before }}
        run: |
          python3 .bureau-pipeline/scripts/release_train.py \
            --repo "$GITHUB_REPOSITORY" wait --not-before "$NOT_BEFORE"

  # The head of the default branch at the moment the run starts (the COLLAPSE
  # rule), every surface's decision made from it, and — for each surface
  # that releases — the COMMIT it releases: the newest green one on the
  # first-parent line back to the surface's tag (DRE-3266). The brake is
  # read HERE, so a held fleet says so once per surface and no surface job
  # is ever created.
  plan:
    name: Plan the surfaces
    # Behind the wait on a re-armed run; on every other event the wait is
    # skipped, and a skipped need skips its dependants unless they say
    # otherwise — so this says otherwise. A wait cancelled by its concurrency
    # group is the collapse working, and plans nothing.
    needs: wait
    if: ${{ !cancelled() && needs.wait.result != 'cancelled' }}
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      # fetch-depth: 0 on purpose — the train reads the newest tag in each
      # surface's series, diffs the surface's paths since it, and walks the
      # first-parent line between them. A shallow checkout has neither the
      # tags nor the history, and would report every surface BEHIND on every
      # trigger.
      #
      # No `ref:` on any event, deliberately (DRE-3266): on `workflow_run`
      # actions/checkout's default is the default branch's head, which is
      # where the walk starts — the commit CI just ran on is one candidate,
      # and a newer merge already on the branch is another.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: The caller's release.json is well formed
        run: |
          python3 .bureau-pipeline/scripts/release_train.py \
            --repo "$GITHUB_REPOSITORY" schema

      # Reads checks HERE now (DRE-3266) — for a surface that would release,
      # one read per candidate walked, newest first, until the first green
      # one; a `tag` surface with nothing to release still reads none. Hence
      # the token: the stub's `checks: read` and `actions: read` cover it.
      #
      # A `record: channel` surface is the exception (DRE-3568): the train
      # never runs it, but its row now READS where the channel is — the ref
      # (`git/ref/tags/<channel>`, through the API rather than the checkout's
      # tags: the same two records promote-channel.yml reads, so the row and
      # the promoter can never disagree), the compare against the head, the
      # gate's latest run on the default branch (harness.yml) and, only when
      # that run went red, its `--log-failed` output for the scenario names.
      # At most four reads, all through `gh` with this same token; a read
      # that fails prints `unknown` with a warning and never a green. A
      # blocked channel raises a `::warning::` and a `## Blocked` block on
      # this run's summary page, the same way a deferral is carried.
      - name: Decide every surface
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # The fleet-wide brake, in the shape of INTAKE_HOLD and read by the
          # same function. Never a literal: a value baked into the shared
          # channel would brake one repo's train for everybody.
          RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
          # Through env, never interpolated into the shell line — the tests.yml
          # rule: a crafted dispatch input must not become shell input.
          SURFACE: ${{ inputs.surface }}
          # The CI-completion event (DRE-3263): the commit CI ran on and how
          # it concluded. Both empty on the schedule and on a dispatch.
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # The re-arm (DRE-3559): the ref the caller's stub is dispatched on.
          # Empty on a schedule's thin payload, where the script falls back to
          # GITHUB_REF_NAME — which on a schedule IS the default branch. The
          # stub itself is named by GITHUB_WORKFLOW_REF, the caller's.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A CI run that concluded anything but success is a no-op that says
          # so — in the step's own shell, not a job-level `if:`, because a
          # skipped job says nothing and this run's log has to. The commit
          # waits for the repair the medic files; the train is never stopped.
          if [ "$EVENT" = "workflow_run" ] && [ "$CI_CONCLUSION" != "success" ]; then
            echo "release-train: no-op $GITHUB_REPOSITORY — CI on ${CI_SHA:0:7} concluded ${CI_CONCLUSION:-nothing}; the train leaves without it"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "head=$CI_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The walk starts at the branch's head. On a CI completion the
          # commit CI ran on is a candidate by construction; it and the head
          # legitimately differ when a newer merge has landed since.
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$EVENT" = "workflow_run" ] && [ -n "$CI_SHA" ]; then
            echo "release-train: CI on ${CI_SHA:0:7} concluded success; walking from the head ${HEAD_SHA:0:7}"
          fi
          python3 .bureau-pipeline/scripts/release_train.py \
            --repo "$GITHUB_REPOSITORY" plan \
            --head "$HEAD_SHA" --surface "$SURFACE" --re-arm

  # One job per surface that is actually releasing, each in its own lane, at
  # the commit the plan chose for it: the matrix is `[{surface, sha}, …]`.
  release:
    name: Release ${{ matrix.surface }}
    needs: plan
    # The status check is explicit (DRE-3559): the implicit `success()` is
    # false when ANY ancestor was skipped (actions/runner#491), and `wait` is
    # skipped on every run that was not re-armed. A failed plan (a refusal)
    # still releases nothing, exactly as before.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' && needs.plan.outputs.matrix != '' }}
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # ONE lane per surface, and it never cancels: a run that starts releases
    # the commit its plan chose, and a second run waits behind it rather than
    # racing it for the same tag.
    concurrency:
      group: release:${{ github.repository }}:${{ matrix.surface }}
      cancel-in-progress: false
    steps:
      # The plan's chosen sha, not the branch: whatever landed while this job
      # queued is the next run's business, not this one's — and the script
      # runs in a checkout of exactly the commit it is handed as RELEASE_SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      # `git tag -a` needs a tagger, and a detached checkout has none. The
      # surface script cuts the tag; the train names who cut it.
      - name: Name the tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The caller's OWN role, so a repo can only ever deploy itself. Assumed
      # BEFORE the script runs, because the script's contract is that its
      # identity is already there (standards/release-train.md).
      #
      # v6, not v4 (DRE-3265): the vendor's manifest declares the runtime, and
      # v4.3.1's said `runs.using: node20`, so GitHub forced it onto 24 and
      # annotated EVERY release-train run with the Node 20 deprecation notice.
      # v6.0.0 is the first release whose manifest declares node24 (its release
      # notes call the runtime its breaking change, and it needs runner
      # v2.327.1+, which the hosted runners are long past); v6.2.4 is the
      # newest. The two majors crossed change nothing we pass — v5.0.0's break
      # was invalid BOOLEAN input handling and this step passes none, and v6's
      # was the runtime itself. `role-to-assume`, `role-session-name` and
      # `aws-region` are unchanged inputs at v6.2.4.
      - name: Assume the caller's release identity
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}
          role-session-name: release-train-${{ matrix.surface }}
          aws-region: ${{ inputs.aws_region }}

      # Re-reads green-at-SHA ONCE on the chosen commit, inside the lane —
      # the check runs on it plus the workflow-runs record that says which of
      # them gate (DRE-3263: only the merge gate's set counts; a fix agent,
      # the medic, the sweep and this train's own run are ignored by verified
      # origin, and the line says what was read and what was ignored). The
      # plan chose a green commit; this is the same rule asked again with a
      # fresh answer, the way the rules are always asked twice. Then runs the
      # surface's script at that commit and verifies the annotated tag it
      # cut. A no-op and a deferral exit 0; a refusal and a failed script
      # exit non-zero.
      - name: Run the surface
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
          LINEAR_RELEASE_KEY: ${{ secrets.LINEAR_RELEASE_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Through env, never interpolated into the shell line (tests.yml).
          SURFACE: ${{ matrix.surface }}
          PLAN_SHA: ${{ matrix.sha }}
          DISPATCHED: ${{ inputs.surface }}
        run: |
          args=()
          if [ -n "$DISPATCHED" ]; then args+=(--dispatched); fi
          python3 .bureau-pipeline/scripts/release_train.py \
            --repo "$GITHUB_REPOSITORY" release \
            --sha "$PLAN_SHA" --surface "$SURFACE" "${args[@]}"
