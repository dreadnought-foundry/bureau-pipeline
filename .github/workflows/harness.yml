# Integration harness (DRE-2098): drives end-to-end scenarios against the
# dedicated sandbox repo dreadnought-foundry/bureau-harness with REAL
# pipeline behavior — the worker bot authors a PR there, the sandbox's own
# stubs run the real critic and merge gate, and the driver
# (scripts/harness/) asserts the outcomes. Nothing GitHub-side is mocked.
#
# Tokens are minted from THIS repo's existing App secrets, scoped to the
# sandbox only (both Apps are installed there — operator card). The qa-bot
# mint exists for its app-slug (the expected-merger assertion derives from
# the same App key the gate merges with, merge-gate #57 pattern — never a
# hardcoded login) and doubles as a pre-flight proof the qa App really is
# installed on the sandbox before we spend scenario minutes waiting.
#
# A THIRD token, the READER, comes from the dispatch pool (DRE-4282): the
# driver polls the sandbox for as long as a review takes, every poll is
# billed to the identity that asks, and on 2026-09-17 that emptied the
# worker installation's hour for every job in the fleet (DRE-4132). The
# worker client's GETs now go out as whichever pool App has the most
# headroom; its writes, and the clone/push credential, stay the worker's —
# WHICH identity ACTS is the thing under test, and a read is not an action.
#
# NOTE (scope of pipeline_ref): the input pins the DRIVER code under test.
# The sandbox's stubs consume the reusable workflows at the ref THEY pin —
# main, the canary channel — and GitHub resolves that ref at dispatch. So a
# by-hand run against a branch drives the sandbox with the branch's driver
# while the sandbox's own workflows are still main's.
#
# THE HARNESS PROVES MAIN, NOT EVERY PULL REQUEST (DRE-4149).
#
# From DRE-2103 until 2026-09-17 this workflow also ran on pull requests that
# touched the boundary paths, and a red run held the merge (merge_gate.py
# condition 1 counts every check run on the head). That run is gone:
#
#   * It largely re-proved main. The sandbox rides @main (above), which the
#     harness logged on every PR run — "agent-task.yml parses at <main sha> …
#     which is NOT the commit under test" — and DRE-3101 had already handed a
#     PR run main's own sweep and probe rules. The run that proves the MERGED
#     result is the one on main, and it runs anyway.
#   * It was not free. On 2026-09-17 the worker App's hourly GitHub allowance
#     ran out near the end of every hour (DRE-4132). Every harness run that
#     needed GitHub in that stretch was refused, so six approved pull requests
#     sat behind a red harness that said nothing about their code and `stable`
#     fell twelve merges behind — with about ten PR runs that morning, each up
#     to 26 minutes of polling, among the heaviest spenders of that allowance.
#
# THE ACCEPTED COST, named: a change that breaks the pipeline end to end is
# found on main AFTER it merges rather than on its pull request before.
# `stable` does not move onto it, so no product repo sees it; Red-Main Repair
# watches this workflow on main (DRE-2820) and files the repair card. With
# several merges between two main runs, the failing run names a RANGE of
# commits, not one.
#
# A person can still prove a risky branch BEFORE it merges: dispatch this
# workflow by hand with `pipeline_ref` set to the branch. That run proves, it
# does not gate — its check run lands on the dispatch ref's tip and its stamp
# is a commit status, which the merge gate never reads.
#
# Load-bearing, two ways:
#   * Release channel — every push to main runs the default sweep, and
#     promote-channel.yml moves `stable` only for a commit whose run here
#     SUCCEEDED on main (DRE-2551). A pull request merges on the critic, the
#     verifier and the unit/contract suite, the bar every other repo in the
#     fleet merges on; nothing reaches a product repo without a green harness,
#     because products ride `stable`.
#   * Release gate — a green run stamps a success `integration-harness`
#     commit status on the sha it actually checked out; release-gate.yml
#     refuses any v* tag whose commit lacks that stamp. The stamp, not
#     the run record, is the sha-binding: a dispatch run's head_sha is
#     the DISPATCH ref's tip, not pipeline_ref's.
#
# tests/test_harness_proves_main.py pins the triggers, so a pull_request
# trigger cannot return without someone deciding it should.
name: Integration Harness

on:
  workflow_dispatch:
    inputs:
      pipeline_ref:
        description: bureau-pipeline ref under test (the driver checkout)
        required: false
        default: main
      scenarios:
        description: >-
          comma-separated scenario names. Empty = the default sweep — every
          discovered scenario that does not spend a build-agent run. The
          DRE-2490 adversarial scenarios each spend one and are opt-in BY NAME
          here —
          noop_resubmission, partial_delivery, checklist_gaming,
          already_live, unverified_claim. Each is capped at 45 minutes by
          the driver, so name at most two per dispatch (job timeout below).
        required: false
        default: ""
      wait_deadline_minutes:
        description: >-
          Per-wait SANDBOX-LIVENESS deadline, in minutes — separate from the
          job timeout below, and deliberately NOT a shorter budget (DRE-3076).
          Every this many minutes a waiting scenario stops and reads the
          sandbox's own sweep / gate / linear-sync runs; a FAILED one ends the
          run with its cause quoted, a healthy-but-slow one keeps its full
          budget. The same check also asks whether the sandbox has STARTED
          anything since the wait began, and two consecutive nos end the wait
          as "waiting for something the sandbox will not do" (DRE-3453). The
          passing PR run does all its scenarios in 18 minutes, so a single
          silent wait past ten is already a fault. `0` switches both checks
          off.
        required: false
        default: "10"
  # DRE-2551: automatic promotion needs a PROVEN commit on the trunk. The
  # fleet merges with merge commits, so a stamp on any other commit never
  # transfers to main's tip — the proof has to be made HERE, on the push.
  #
  # Deliberately NO paths filter. Consumers pin
  # the whole repo, so every commit on main changes what they get — a channel
  # that only advances for pipeline-path commits would sit stale on a docs
  # merge and trip its own staleness alarm. This is the cheap default sweep
  # (the scenarios that spend no build-agent run — `agent_task_parses` among
  # them since DRE-3486, because this sweep IS the channel gate and an opt-in
  # rehearsal would leave agent-task.yml exactly as uncovered as it was on
  # 2026-09-09), and it is affordable because Step 1 cut the CI burn first —
  # decision D4, in this order, for this reason.
  push:
    branches: [main]

  # NO pull_request trigger, on purpose (DRE-4149) — see the header. Do not
  # add one back to "catch it earlier": the run it adds re-proves main, spends
  # the allowance main's own run needs, and a refused run holds an approved
  # pull request behind a red check that says nothing about its code.

# ONE lane: `integration-harness-main` (DRE-3075 named it; DRE-4149 made it
# the only one). DRE-3075 split main's lane from a `pr-<number>` lane per pull
# request after a PR run held a shared group for 18 minutes on 2026-09-03
# while five pushes to main queued behind it and `stable` fell 50 commits
# behind. With the pull_request trigger gone there is no PR lane to keep out
# of main's way, so the expression is a plain string again.
#
# A push to main AND a hand dispatch both ride it — a dispatch drives the
# sandbox under the same `main` namespace (HARNESS_NAMESPACE below), and two
# live runs in one namespace would sweep each other's branches.
#
# RUNS ON MAIN COLLAPSE TO THE NEWEST COMMIT (DRE-4149) — and this group is
# the whole mechanism; there is no cancel step to find. GitHub keeps one run
# in progress and at most ONE pending run per group: the proof in progress
# finishes, the newest head waits behind it, and a head in between is dropped
# before it starts. tests/test_merge_train.py simulates exactly that, and
# tests/test_harness_proves_main.py pins the single group.
#
# QUEUE BEHIND, NEVER CANCEL — and the release channel depends on it
# (DRE-3070). `promote-channel.yml` moves `stable` only for a commit a harness
# run PROVED, so a harness run that never finishes is a channel that never
# advances. With `cancel-in-progress: false` the run proving commit N is
# allowed to finish and promote, and the newest head queues behind it: on a
# night of fourteen merges the channel advances to N and then to the latest,
# rather than to nothing.
#
# What that costs, stated because it looks like a bug in the run list: GitHub
# keeps at most ONE pending run per group, so a head still waiting when the
# next push arrives is cancelled BEFORE IT STARTS. Those are the `cancelled`
# conclusions on the incident evening of 2026-09-03 — every one has
# `run_started_at == created_at` and was cancelled one to two seconds after
# the next run in the group was created. Nothing in progress was ever killed.
# Skipping an intermediate head is the intended trade; the skip is now
# RECORDED rather than silent (promote_channel.OUTCOME_CANCELLED), and the
# staleness alarm counts those records to say "merge train" instead of
# "unknown". See docs/self-hosting.md, "Queue behind, never cancel".
concurrency:
  group: integration-harness-main
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write  # the tested-sha stamp release-gate.yml reads

jobs:
  harness:
    # No job-level `if` (DRE-4149). There was one — a clean self-skip for
    # dependabot-triggered pull_request events, which get GitHub's separate,
    # EMPTY Dependabot secrets store (DRE-2047/2067). Dependabot neither pushes
    # to main nor dispatches, so with the pull_request trigger gone the guard
    # could only ever be true.
    runs-on: ubuntu-latest
    # Scenario budget for the whole default sweep: each verdict wait is bounded
    # by the critic job's own timeout — 65m since DRE-2466, not the 25m this
    # comment and the driver's default were both written against —
    # dependabot_flow adds one reconcile cron interval (~15m, DRE-2100), and
    # gate_paths runs three PR legs (concurrent reviews, sequential asserts).
    # Typical runs finish far sooner; this is the slow-but-honest ceiling.
    #
    # It was never a sum of worst cases (five verdict waits overran it at 25m
    # each) and it is not one now. What it must hold is the shape of a bad
    # day: one earlier scenario burning a full verdict wait, and gate_paths
    # still owed its longest single chain — a verdict wait plus the merge
    # wait after it. Below that the run is CANCELLED at the cap, and a
    # cancelled run skips the `success() || failure()` stamp step, so the
    # release gate loses the evidence a clean FAIL would have left it.
    # Pinned to the driver's own budgets by tests/test_harness_wiring.py.
    timeout-minutes: 180
    env:
      # The secrets context is not readable in a step-level `if:`, so the
      # dispatch-pool probe mints check slot PRESENCE via these job-env
      # mirrors (app ids only — NEVER keys). Empty ⇒ the probe is skipped
      # and the pool shrinks (DRE-2013 graceful degradation).
      BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
      BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
      BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
    steps:
      # The ref under test: pipeline_ref on a by-hand dispatch (defaulted to
      # main). On a push the inputs context is EMPTY and the tail runs.
      #
      # The tail is github.sha — an immutable commit, never the branch NAME
      # 'main' (DRE-2551). On a push run the first clause does not resolve, and
      # a branch name checks out whatever main's tip is at the moment the job
      # starts, not the commit that triggered this run. Merge bursts are
      # routine here (merge-gate.yml records five PRs / twelve gate runs in 25
      # minutes on 2026-08-17), so a second merge landing first would make the
      # job test and stamp a DIFFERENT, newer sha than the one GitHub recorded
      # as this run's head_sha. promote-channel.yml reads exactly that head_sha,
      # would find no integration-harness stamp on it, and would silently
      # decline to promote a commit the harness had in fact just proved — a
      # quiet no-op precisely during the busy periods this must survive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_ref || github.sha }}

      # The sha the stamp binds — resolved from the ACTUAL checkout, the
      # only record a dispatch run has of what pipeline_ref pointed at.
      - name: Resolve tested sha
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The same context, opened PENDING before any scenario runs (DRE-3515).
      #
      # A commit status is not a check run. GitHub replaces a check run when a
      # run is re-run — which is why `harness` goes back to in_progress — but a
      # STATUS stands on the sha until something posts over it, and the verdict
      # stamp at the bottom of this job only fires when the job ends. So for the
      # whole of a re-run, every consumer reads the PREVIOUS attempt's verdict.
      # Live on 2026-09-09, PR #332: attempt 2 stamped `failure` at 15:18 PT,
      # attempt 3 started at 15:20 PT, and the console read the pull request as
      # "blocked — Stuck, needs you" while this harness was busy re-proving the
      # very check it was reporting. The console was reading GitHub faithfully;
      # the stale stamp was the lie, so the fix belongs here and not in a reader.
      #
      # Pending is honest to every consumer of the context: release_gate.py
      # counts it RED ("pending proved nothing" — a tag still cannot promote on
      # a run that has not finished), and promote-channel.yml fires on
      # workflow_run completion, by which time the verdict below has replaced
      # this. A run CANCELLED at the cap still stamps no verdict and now leaves
      # this pending standing — the honest record of a run that proved nothing,
      # with the job's own cancelled check run red beside it.
      - name: Open the harness stamp for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" \
            -f state="pending" \
            -f context="integration-harness" \
            -f description="integration harness: running (attempt ${ATTEMPT})" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # Is this checkout allowed at the SHARED sandbox at all?
      #
      # The sandbox is shared, and the only thing keeping one run's leftovers
      # from another's is that each sweep collects its own namespace
      # (DRE-3075). That rule lives entirely in the driver — and on a by-hand
      # dispatch the driver is whatever `pipeline_ref` names, at whatever
      # vintage that branch was cut. Since DRE-4149 that is the ONLY way an old
      # driver reaches the sandbox (pull requests no longer run here, and the
      # DRE-3101 step that handed a PR run main's copy of scripts/harness/
      # went with them), so this guard is what stands between a months-old
      # branch someone dispatches "just to check" and main's live proving run.
      #
      # 2026-09-04, the cost of having no guard yet: run 33910802510
      # started at 19:22 for PR #260, whose head forked from a7bfa52 and
      # predated DRE-3075. Its sweep was the unscoped one, so it closed every
      # open harness PR it found — including main's live gate_paths probe
      # #957, opened 50 minutes earlier. Main's run 33903196184 spent 70 of
      # its 76 minutes polling a closed PR and went red naming the sandbox's
      # critic, which had reviewed another lane's PR in minutes while it
      # waited.
      #
      # This step is the guard, and it sits HERE for two reasons: the whole
      # checkout is the stale thing, so the check cannot be a script in it —
      # but a dispatch runs the workflow file from the ref it was dispatched
      # ON (main), so this file is current even when the driver is months old.
      # And it runs BEFORE the mints below: a driver that will not be let near
      # the sandbox is never handed a token for it.
      #
      # The driver is READ, never imported: an old enough one may not import
      # at all, and "it crashed" must not read as "it is fine".
      - name: Refuse a driver that predates the sandbox-isolation contract
        env:
          # The floor. Raise it in the same PR that raises
          # framework.SANDBOX_ISOLATION_CONTRACT — the two are pinned
          # together by tests/test_harness_driver_contract.py.
          REQUIRED_CONTRACT: "1"
        run: |
          python3 - <<'PY'
          import ast
          import os
          import pathlib
          import sys

          NAME = "SANDBOX_ISOLATION_CONTRACT"
          required = int(os.environ["REQUIRED_CONTRACT"])
          source = pathlib.Path("scripts/harness/framework.py")

          declared = 0
          try:
              tree = ast.parse(source.read_text(encoding="utf-8"))
          except (OSError, SyntaxError) as e:
              print(f"could not read {source}: {e}")
              tree = None
          for node in getattr(tree, "body", []):
              if not isinstance(node, ast.Assign):
                  continue
              if not any(getattr(t, "id", "") == NAME for t in node.targets):
                  continue
              if isinstance(node.value, ast.Constant) and isinstance(
                  node.value.value, int
              ):
                  declared = node.value.value

          if declared >= required:
              print(f"driver sandbox-isolation contract {declared} (need {required}) — ok")
              sys.exit(0)

          sys.exit(
              f"::error title=Harness driver too old::this checkout declares "
              f"sandbox-isolation contract {declared} and the shared sandbox "
              f"requires {required}. Its sweep is not scoped to this run's "
              f"namespace, so it would close the probe PRs of any harness run "
              f"beside it — that is how run 33903196184 lost 70 minutes and "
              f"turned main red. Rebase this branch onto main and push again; "
              f"nothing else on the branch needs to change."
          )
          PY

      # Only the named-scenario path needs test tooling: the DRE-2490
      # unverified_claim scenario proves a shipped test is non-vacuous by
      # RUNNING it against a mutant, and that needs pytest on the runner. The
      # default sweep (empty input, every push to main) is stdlib-only and
      # asks for install: false — the workflow the release channel waits on
      # does not take a package-registry dependency it does not use. The install itself is the
      # shared action's job now (DRE-2589), so the pins have one home.
      - name: Install test tooling (named scenarios only)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          install: ${{ inputs.scenarios != '' && 'true' || 'false' }}
          requirements: |
            requirements-dev.txt

      - name: Mint worker-bot token (sandbox-scoped)
        id: worker
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: bureau-harness

      - name: Mint qa-bot token (identity probe — merger-login source)
        id: qa
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: bureau-harness

      # ---- Dispatch-pool reader selection (DRE-2013, wired here by DRE-4282) ----
      # verify.yml's shape, copied, sandbox-scoped like the two mints above:
      # mint a probe token per CONFIGURED pool app (absent secrets skip the
      # step and shrink the pool; continue-on-error so a pool app that is not
      # installed on the sandbox can never fail a proving run), let
      # dispatch_pool.py read each bucket's quota-exempt /rate_limit and pick
      # the app with the MOST remaining, then mint the driver's READ token from
      # it. The worker token above is slot 1's probe — /rate_limit is per
      # installation, so the token's repo scope does not matter. The selector
      # is the checkout's own copy (it has been in the tree since 2026-07-10,
      # long before the isolation contract the guard above requires); it only
      # ever sees app ids and probe tokens, never keys, and the mint below maps
      # the chosen slot to its secret pair explicitly and falls through to the
      # worker pair, so a run without the pool secrets is a single-app pool
      # reading exactly as before.
      - name: Mint pool probe token (2)
        id: probe_2
        if: env.BUREAU_APP_ID_2 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_2 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_2 }}
          owner: dreadnought-foundry
          repositories: bureau-harness
      - name: Mint pool probe token (3)
        id: probe_3
        if: env.BUREAU_APP_ID_3 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_3 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_3 }}
          owner: dreadnought-foundry
          repositories: bureau-harness
      - name: Mint pool probe token (4)
        id: probe_4
        if: env.BUREAU_APP_ID_4 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_4 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_4 }}
          owner: dreadnought-foundry
          repositories: bureau-harness

      - name: Select dispatch-pool app
        id: pool
        env:
          BUREAU_APP_ID: ${{ secrets.BUREAU_APP_ID }}
          BUREAU_POOL_TOKEN: ${{ steps.worker.outputs.token }}
          BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
          BUREAU_POOL_TOKEN_2: ${{ steps.probe_2.outputs.token }}
          BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
          BUREAU_POOL_TOKEN_3: ${{ steps.probe_3.outputs.token }}
          BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
          BUREAU_POOL_TOKEN_4: ${{ steps.probe_4.outputs.token }}
          # Deterministic fallback key on read failure: this run, so a re-run
          # picks the same slot instead of scattering across buckets.
          BUREAU_POOL_KEY: harness:${{ github.run_id }}
        run: |
          python3 scripts/dispatch_pool.py select >> "$GITHUB_OUTPUT"

      # Read token: minted from the SELECTED pool app, sandbox-scoped.
      # Explicit per-N map (Actions can't index secrets dynamically); each
      # clause yields '' when not selected, so the chain always falls through
      # to the worker pair. The same map is handed to the driver below as the
      # reader's re-mint credentials.
      - name: Mint pool reader token (sandbox-scoped)
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_ID_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_ID_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_ID_4
             || secrets.BUREAU_APP_ID }}
          private-key: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_PRIVATE_KEY_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_PRIVATE_KEY_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_PRIVATE_KEY_4
             || secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: bureau-harness

      # The console's own state lists (DRE-2726). Best-effort BY DESIGN: this
      # is a different repository and a different installation, and a mint that
      # cannot happen must not turn every proving run red on a clause the wave
      # has not reached yet. When the token is absent the lane-contract clause
      # reports UNEVALUATED — never a pass — and config/lane-contract.json names
      # the phase from which that unevaluated state becomes a hard failure.
      - name: Mint console token (lane-contract parity — best effort)
        id: console
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: agent-bureau

      - name: Run harness scenarios
        id: scenarios
        env:
          HARNESS_REPO: dreadnought-foundry/bureau-harness
          # The lane_contract scenario's ONE Linear call: a read-only GraphQL
          # query for the board's workflow states and their occupancy. The
          # harness writes nothing to Linear and addresses no card (see
          # scripts/harness/README.md) — this does not change that.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          HARNESS_CONSOLE_TOKEN: ${{ steps.console.outputs.token }}
          # The agent scenarios run the SHIPPED agent-task.yml prompt through
          # the Claude Code CLI against a sandbox clone (scripts/harness/
          # agent_run.py). Same auth switch agent-task.yml uses; unset on the
          # default sweep, which never starts an agent.
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          HARNESS_WORKER_TOKEN: ${{ steps.worker.outputs.token }}
          HARNESS_WORKER_LOGIN: ${{ steps.worker.outputs.app-slug }}[bot]
          # The qa token is the PROVEN reader for commit check-runs
          # (merge-gate.yml's own read path) — dependabot_flow's self-skip
          # evidence rides on it; the worker App's checks permission is
          # not guaranteed.
          HARNESS_QA_TOKEN: ${{ steps.qa.outputs.token }}
          HARNESS_QA_LOGIN: ${{ steps.qa.outputs.app-slug }}[bot]
          # App credentials so the DRIVER can re-mint mid-run: the mint
          # steps above run once, installation tokens live one hour, and
          # a full scenario run can outlast it (run 29795108949 401ed
          # its late scenarios). Same secrets, same single-repo scope.
          HARNESS_WORKER_APP_ID: ${{ secrets.BUREAU_APP_ID }}
          HARNESS_WORKER_APP_PRIVATE_KEY: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          HARNESS_QA_APP_ID: ${{ secrets.BUREAU_QA_APP_ID }}
          HARNESS_QA_APP_PRIVATE_KEY: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
          # The pool READER (DRE-4282): every GET the worker client would send
          # goes out as this identity; writes and the clone/push credential
          # stay the worker's. Its re-mint credentials are the SAME per-slot
          # map the reader mint used, so a run past the hour re-mints the App
          # it selected and never drifts back to slot 1. The slot is named in
          # the run's `github-spend:` line.
          HARNESS_READER_TOKEN: ${{ steps.reader.outputs.token }}
          HARNESS_READER_APP_ID: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_ID_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_ID_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_ID_4
             || secrets.BUREAU_APP_ID }}
          HARNESS_READER_APP_PRIVATE_KEY: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_PRIVATE_KEY_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_PRIVATE_KEY_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_PRIVATE_KEY_4
             || secrets.BUREAU_APP_PRIVATE_KEY }}
          HARNESS_POOL_SLOT: ${{ steps.pool.outputs.n }}
          HARNESS_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          # The commit this run PROVES — the same sha the stamp below binds,
          # resolved from the actual checkout (DRE-3486). The
          # `agent_task_parses` rehearsal reports it beside the commit the
          # sandbox actually compiled: the sandbox's stubs ride @main and
          # GitHub resolves that ref at dispatch, so the two agree on a
          # quiet push to main and deliberately do not on a by-hand run
          # against a branch (or when a second merge lands mid-run). Recorded
          # either way; the rehearsal never fails on the difference.
          HARNESS_TESTED_SHA: ${{ steps.tested.outputs.sha }}
          # The slice of the sandbox this run owns (DRE-3075). It opens the
          # run id, so every branch and probe file lands inside it, and the
          # driver's sweep collects nothing outside it — which is what keeps
          # a local run (namespace `local`) from collecting this one's.
          #
          # Always `main` since DRE-4149: every run this workflow can start —
          # a push to main or a by-hand dispatch — rides the one
          # `integration-harness-main` lane, and the lane and the namespace
          # must agree (two live runs in one namespace sweep each other). It
          # was `pr<number>` for a pull request's run while those existed.
          # Pinned, for every event, by tests/test_harness_main_slot.py.
          HARNESS_NAMESPACE: main
          SCENARIOS: ${{ inputs.scenarios }}
          # DRE-3076. On a push the `inputs` context does not
          # resolve and this is empty — the driver then uses its own default
          # (framework.WAIT_DEADLINE_SECONDS), which is the same number as the
          # input's default above; tests/test_harness_sandbox_deadline.py pins
          # them together. Those are exactly the runs that stalled the channel,
          # so the deadline must NOT be dispatch-only.
          HARNESS_WAIT_DEADLINE_MINUTES: ${{ inputs.wait_deadline_minutes }}
          PYTHONPATH: scripts
        run: |
          # The clock the duration receipt reads (DRE-3070). Recorded here, in
          # the scenarios' own step, so the number is about the scenarios and
          # not about the checkout and three token mints ahead of them.
          echo "SCENARIOS_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          python3 -m harness --repo "$HARNESS_REPO" --scenarios "$SCENARIOS"

      # How long that took, on the record, every time (DRE-3070). Nothing
      # reported a harness run's own length, and on 2026-09-03 that absence
      # cost the channel an evening: a PR run took 18 minutes while the main
      # run behind it sat on the step above for 54, waiting on a sandbox whose
      # Linear quota had been exhausted. Its only bound was the job's
      # 180-minute timeout, so the queue behind it — and the channel — was
      # frozen for as long as the wait lasted, and nothing distinguished "the
      # queue is long" from "this run is hung" until an operator read the logs.
      #
      # This does not shorten the wait. It makes it VISIBLE: a number in the
      # summary of every run, and a warning annotation past the budget, so the
      # difference shows up in the run list instead of in the channel.
      #
      # `always()`, because a run that went red or was cancelled at the cap is
      # exactly when the number is wanted.
      - name: Scenario duration receipt
        if: always()
        env:
          # Well clear of the observed healthy runs (9m40s–18m) and well under
          # the job's own timeout, which is a ceiling for a bad day rather than
          # a budget: past it the run is CANCELLED and stamps nothing at all.
          BUDGET_MINUTES: "40"
        run: |
          if [ -z "${SCENARIOS_STARTED_AT:-}" ]; then
            echo "scenarios never started — nothing to time" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ELAPSED=$(( ( $(date +%s) - SCENARIOS_STARTED_AT ) / 60 ))
          echo "⏱ harness scenarios: ${ELAPSED}m (budget ${BUDGET_MINUTES}m)" \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$ELAPSED" -gt "$BUDGET_MINUTES" ]; then
            echo "::warning title=Harness over budget::scenarios took ${ELAPSED}m against a ${BUDGET_MINUTES}m budget. A run this long holds the sandbox, holds every queued run behind it, and holds the release channel with them — look for a hung scenario or a failing sandbox, not a busy queue."
          fi

      # The release gate's record (scripts/release_gate.py reads exactly
      # this context): success on green, an honest failure on red — a
      # later green run overwrites it, GitHub keeps the latest status per
      # context. Cancelled runs proved nothing and stamp nothing.
      #
      # DRE-3076: the DESCRIPTION carries one more fact. When the driver died
      # because the SANDBOX was down (a failed sweep / gate / linear-sync run,
      # e.g. Linear rate-limited on 2026-09-03), it writes the sandbox's quoted
      # failure to `blocked_reason` — already marker-prefixed and clamped to
      # GitHub's 140-character description limit — and that becomes the
      # description. promote_channel.py reads the marker and says "blocked by
      # sandbox, not proven yet" instead of "harness failed", which would send
      # someone looking at a diff that was never judged. The stamp stays RED:
      # unproven is not proven, and the channel must not move on it.
      - name: Stamp tested sha with the harness verdict
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          BLOCKED_REASON: ${{ steps.scenarios.outputs.blocked_reason }}
        run: |
          DESCRIPTION="integration harness: ${STATE}"
          if [ -n "$BLOCKED_REASON" ]; then
            DESCRIPTION="$BLOCKED_REASON"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" \
            -f state="$STATE" \
            -f context="integration-harness" \
            -f description="$DESCRIPTION" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
