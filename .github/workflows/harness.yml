# Integration harness (DRE-2098): drives end-to-end scenarios against the
# dedicated sandbox repo dreadnought-foundry/bureau-harness with REAL
# pipeline behavior — the worker bot authors a PR there, the sandbox's own
# stubs run the real critic and merge gate, and the driver
# (scripts/harness/) asserts the outcomes. Nothing GitHub-side is mocked.
#
# Tokens are minted from THIS repo's existing App secrets, scoped to the
# sandbox only (both Apps are installed there — operator card). The qa-bot
# mint exists for its app-slug (the expected-merger assertion derives from
# the same App key the gate merges with, merge-gate #57 pattern — never a
# hardcoded login) and doubles as a pre-flight proof the qa App really is
# installed on the sandbox before we spend scenario minutes waiting.
#
# NOTE (scope of pipeline_ref): the input pins the DRIVER code under test.
# The sandbox's stubs consume the reusable workflows at the ref THEY pin —
# on a PR run the driver comes from the PR's head while the sandbox still
# rides its own pinned pipeline ref (main, the canary channel).
#
# Load-bearing since DRE-2103, two ways:
#   * PR gate — pull_request on the boundary paths below. merge_gate.py
#     condition 1 requires EVERY check run on the head sha to finish
#     green and harness.yml is not a review workflow, so a red run holds
#     the merge with no branch-protection change
#     (tests/test_harness_gate_evidence.py).
#   * Release gate — a green run stamps a success `integration-harness`
#     commit status on the sha it actually checked out; release-gate.yml
#     refuses any v* tag whose commit lacks that stamp. The stamp, not
#     the run record, is the sha-binding: a dispatch run's head_sha is
#     the DISPATCH ref's tip, not pipeline_ref's.
name: Integration Harness

on:
  workflow_dispatch:
    inputs:
      pipeline_ref:
        description: bureau-pipeline ref under test (the driver checkout)
        required: false
        default: main
      scenarios:
        description: >-
          comma-separated scenario names. Empty = the default sweep (the
          three cheap scenarios). The DRE-2490 adversarial scenarios each
          spend a REAL build-agent run and are opt-in BY NAME here —
          noop_resubmission, partial_delivery, checklist_gaming,
          already_live, unverified_claim. Each is capped at 45 minutes by
          the driver, so name at most two per dispatch (job timeout below).
        required: false
        default: ""
  # DRE-2551: automatic promotion needs a PROVEN commit on the trunk, and
  # until now nothing ever proved one. The PR trigger stamps the PR head; the
  # fleet merges with merge commits, so that stamp never transfers to main's
  # tip and no commit on main has ever carried a harness verdict.
  #
  # Deliberately NO paths filter, unlike the PR trigger below. Consumers pin
  # the whole repo, so every commit on main changes what they get — a channel
  # that only advances for pipeline-path commits would sit stale on a docs
  # merge and trip its own staleness alarm. This is the cheap default sweep
  # (three scenarios), and it is affordable because Step 1 cut the CI burn
  # first — decision D4, in this order, for this reason.
  push:
    branches: [main]

  pull_request:
    # The boundary: workflow wiring plus the dispatch/gate scripts the
    # scenarios exercise end-to-end. Everything else stays silent.
    paths:
      - ".github/workflows/**"
      - "scripts/harness/**"
      - "scripts/reconcile.py"
      - "scripts/merge_gate.py"
      - "scripts/gate_note.py"
      - "scripts/dispatch_pool.py"
      - "scripts/dedupe_dispatch.py"
      - "scripts/should_review_pr.py"

# One shared sandbox repo — two concurrent runs would trample each other's
# branches and PRs. A second dispatch QUEUES; never cancel-in-progress
# (killing a run mid-scenario is exactly the crashed-run mess the driver's
# sweep exists to mop up).
#
# QUEUE BEHIND, NEVER CANCEL — and the release channel depends on it
# (DRE-3070). `promote-channel.yml` moves `stable` only for a commit a harness
# run PROVED, so a harness run that never finishes is a channel that never
# advances. With `cancel-in-progress: false` the run proving commit N is
# allowed to finish and promote, and the newest head queues behind it: on a
# night of fourteen merges the channel advances to N and then to the latest,
# rather than to nothing.
#
# What that costs, stated because it looks like a bug in the run list: GitHub
# keeps at most ONE pending run per group, so a head still waiting when the
# next push arrives is cancelled BEFORE IT STARTS. Those are the `cancelled`
# conclusions on the incident evening of 2026-09-03 — every one has
# `run_started_at == created_at` and was cancelled one to two seconds after
# the next run in the group was created. Nothing in progress was ever killed.
# Skipping an intermediate head is the intended trade; the skip is now
# RECORDED rather than silent (promote_channel.OUTCOME_CANCELLED), and the
# staleness alarm counts those records to say "merge train" instead of
# "unknown". See docs/self-hosting.md, "Queue behind, never cancel".
#
# The group is deliberately ONE constant shared by the push and pull_request
# triggers alike: it guards a single sandbox, not a ref. Splitting it per ref
# would let two runs sweep each other's branches — a worse failure than a
# skipped head, and the residual cost is written down in the same doc.
concurrency:
  group: integration-harness-sandbox
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write  # the tested-sha stamp release-gate.yml reads

jobs:
  harness:
    # Premortem Q1/Q2 on our own wiring (DRE-2047/2067): dependabot's own
    # opens/rebases of a .github/workflows/** bump fire pull_request AS
    # dependabot[bot], and that event gets GitHub's SEPARATE Dependabot
    # secrets store — for us EMPTY — so the App-token mints below would
    # crash red with zero scenarios run. The guard sits on the JOB so no
    # step ever executes: the run concludes `skipped`, which the merge
    # gate's GREEN_CONCLUSIONS admits — a clean skip, never a red crash
    # (the pr-review.yml pattern; reconcile's dispatch route reviews
    # dependabot PRs, and dependency bumps are not harness business).
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Scenario budget for all three scenarios: each verdict wait is bounded
    # by the critic job's own timeout — 65m since DRE-2466, not the 25m this
    # comment and the driver's default were both written against —
    # dependabot_flow adds one reconcile cron interval (~15m, DRE-2100), and
    # gate_paths runs three PR legs (concurrent reviews, sequential asserts).
    # Typical runs finish far sooner; this is the slow-but-honest ceiling.
    #
    # It was never a sum of worst cases (five verdict waits overran it at 25m
    # each) and it is not one now. What it must hold is the shape of a bad
    # day: one earlier scenario burning a full verdict wait, and gate_paths
    # still owed its longest single chain — a verdict wait plus the merge
    # wait after it. Below that the run is CANCELLED at the cap, and a
    # cancelled run skips the `success() || failure()` stamp step, so the
    # release gate loses the evidence a clean FAIL would have left it.
    # Pinned to the driver's own budgets by tests/test_harness_wiring.py.
    timeout-minutes: 180
    steps:
      # The ref under test: pipeline_ref on a dispatch (defaulted to
      # main); on pull_request the inputs context is EMPTY, so the middle
      # clause makes the PR's own head the driver checkout — without it
      # every PR run would silently test main (the DRE-2026 chimera).
      #
      # The tail is github.sha — an immutable commit, never the branch NAME
      # 'main' (DRE-2551). On a push run neither earlier clause resolves, and
      # a branch name checks out whatever main's tip is at the moment the job
      # starts, not the commit that triggered this run. Merge bursts are
      # routine here (merge-gate.yml records five PRs / twelve gate runs in 25
      # minutes on 2026-08-17), so a second merge landing first would make the
      # job test and stamp a DIFFERENT, newer sha than the one GitHub recorded
      # as this run's head_sha. promote-channel.yml reads exactly that head_sha,
      # would find no integration-harness stamp on it, and would silently
      # decline to promote a commit the harness had in fact just proved — a
      # quiet no-op precisely during the busy periods this must survive.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pipeline_ref || github.event.pull_request.head.sha || github.sha }}

      # The sha the stamp binds — resolved from the ACTUAL checkout, the
      # only record a dispatch run has of what pipeline_ref pointed at.
      - name: Resolve tested sha
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only the named-scenario path needs test tooling: the DRE-2490
      # unverified_claim scenario proves a shipped test is non-vacuous by
      # RUNNING it against a mutant, and that needs pytest on the runner. The
      # default sweep (empty input, every pull_request run) is stdlib-only and
      # asks for install: false — a merge-gating workflow does not take a
      # package-registry dependency it does not use. The install itself is the
      # shared action's job now (DRE-2589), so the pins have one home.
      - name: Install test tooling (named scenarios only)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          install: ${{ inputs.scenarios != '' && 'true' || 'false' }}
          requirements: |
            requirements-dev.txt

      - name: Mint worker-bot token (sandbox-scoped)
        id: worker
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: bureau-harness

      - name: Mint qa-bot token (identity probe — merger-login source)
        id: qa
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: bureau-harness

      # The console's own state lists (DRE-2726). Best-effort BY DESIGN: this
      # is a different repository and a different installation, and a mint that
      # cannot happen must not turn every boundary PR red on a clause the wave
      # has not reached yet. When the token is absent the lane-contract clause
      # reports UNEVALUATED — never a pass — and config/lane-contract.json names
      # the phase from which that unevaluated state becomes a hard failure.
      - name: Mint console token (lane-contract parity — best effort)
        id: console
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: agent-bureau

      - name: Run harness scenarios
        env:
          HARNESS_REPO: dreadnought-foundry/bureau-harness
          # The lane_contract scenario's ONE Linear call: a read-only GraphQL
          # query for the board's workflow states and their occupancy. The
          # harness writes nothing to Linear and addresses no card (see
          # scripts/harness/README.md) — this does not change that.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          HARNESS_CONSOLE_TOKEN: ${{ steps.console.outputs.token }}
          # The agent scenarios run the SHIPPED agent-task.yml prompt through
          # the Claude Code CLI against a sandbox clone (scripts/harness/
          # agent_run.py). Same auth switch agent-task.yml uses; unset on the
          # default sweep, which never starts an agent. A dependabot-triggered
          # PR event gets the empty Dependabot secrets store — the job-level
          # guard above already skips it clean (DRE-2067), so these resolve to
          # empty only on runs that do not read them.
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          HARNESS_WORKER_TOKEN: ${{ steps.worker.outputs.token }}
          HARNESS_WORKER_LOGIN: ${{ steps.worker.outputs.app-slug }}[bot]
          # The qa token is the PROVEN reader for commit check-runs
          # (merge-gate.yml's own read path) — dependabot_flow's self-skip
          # evidence rides on it; the worker App's checks permission is
          # not guaranteed.
          HARNESS_QA_TOKEN: ${{ steps.qa.outputs.token }}
          HARNESS_QA_LOGIN: ${{ steps.qa.outputs.app-slug }}[bot]
          # App credentials so the DRIVER can re-mint mid-run: the mint
          # steps above run once, installation tokens live one hour, and
          # a full scenario run can outlast it (run 29795108949 401ed
          # its late scenarios). Same secrets, same single-repo scope.
          HARNESS_WORKER_APP_ID: ${{ secrets.BUREAU_APP_ID }}
          HARNESS_WORKER_APP_PRIVATE_KEY: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          HARNESS_QA_APP_ID: ${{ secrets.BUREAU_QA_APP_ID }}
          HARNESS_QA_APP_PRIVATE_KEY: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}
          HARNESS_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          SCENARIOS: ${{ inputs.scenarios }}
          PYTHONPATH: scripts
        run: |
          # The clock the duration receipt reads (DRE-3070). Recorded here, in
          # the scenarios' own step, so the number is about the scenarios and
          # not about the checkout and three token mints ahead of them.
          echo "SCENARIOS_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          python3 -m harness --repo "$HARNESS_REPO" --scenarios "$SCENARIOS"

      # How long that took, on the record, every time (DRE-3070). Nothing
      # reported a harness run's own length, and on 2026-09-03 that absence
      # cost the channel an evening: a PR run took 18 minutes while the main
      # run behind it sat on the step above for 54, waiting on a sandbox whose
      # Linear quota had been exhausted. Its only bound was the job's
      # 180-minute timeout, so the queue behind it — and the channel — was
      # frozen for as long as the wait lasted, and nothing distinguished "the
      # queue is long" from "this run is hung" until an operator read the logs.
      #
      # This does not shorten the wait. It makes it VISIBLE: a number in the
      # summary of every run, and a warning annotation past the budget, so the
      # difference shows up in the run list instead of in the channel.
      #
      # `always()`, because a run that went red or was cancelled at the cap is
      # exactly when the number is wanted.
      - name: Scenario duration receipt
        if: always()
        env:
          # Well clear of the observed healthy runs (9m40s–18m) and well under
          # the job's own timeout, which is a ceiling for a bad day rather than
          # a budget: past it the run is CANCELLED and stamps nothing at all.
          BUDGET_MINUTES: "40"
        run: |
          if [ -z "${SCENARIOS_STARTED_AT:-}" ]; then
            echo "scenarios never started — nothing to time" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ELAPSED=$(( ( $(date +%s) - SCENARIOS_STARTED_AT ) / 60 ))
          echo "⏱ harness scenarios: ${ELAPSED}m (budget ${BUDGET_MINUTES}m)" \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$ELAPSED" -gt "$BUDGET_MINUTES" ]; then
            echo "::warning title=Harness over budget::scenarios took ${ELAPSED}m against a ${BUDGET_MINUTES}m budget. A run this long holds the sandbox, holds every queued run behind it, and holds the release channel with them — look for a hung scenario or a failing sandbox, not a busy queue."
          fi

      # The release gate's record (scripts/release_gate.py reads exactly
      # this context): success on green, an honest failure on red — a
      # later green run overwrites it, GitHub keeps the latest status per
      # context. Cancelled runs proved nothing and stamp nothing.
      - name: Stamp tested sha with the harness verdict
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" \
            -f state="$STATE" \
            -f context="integration-harness" \
            -f description="integration harness: ${STATE}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
