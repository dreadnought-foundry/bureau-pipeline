# The split ledger, regenerated daily (DRE-3357 — piece of DRE-3022).
#
# The epic's rule for this file is that it is "regenerated by a scheduled job,
# never hand-edited, with the generation time inside it". Two of those three
# were already true: `scripts/split_ledger.py derive` writes the generation
# time into `config/split-ledger.json` and renders `docs/split-ledger.md` from
# it, and nobody edits either by hand. The missing third is why the ledger the
# planner reads was derived once, on 2026-09-04, and aged from there.
#
# Aging is not cosmetic. `scripts/ledger_context.py` calls a ledger older than
# LEDGER_MAX_AGE_HOURS (72) `UNKNOWN` and hands the planner that instead of the
# rates, so a ledger nobody regenerates becomes a ledger nobody reads — silently,
# three days after the last person remembered. Daily against a 72-hour window is
# two missed runs of margin, which matters because GitHub drops scheduled jobs
# under load and never retries them.
#
# Shaped on `model-drift.yml`, the other scheduled job here that commits a
# generated file to `main`, down to the commit step's staged-set proof: stage
# the paths by name, read the index back, refuse anything else. That is what
# makes a job that can push to `main` incapable of pushing anything but the two
# files it just generated.
#
# A run that changes nothing but `generated_at` STILL COMMITS. The timestamp is
# the freshness every reader checks, so a run that derived the same rows and
# skipped the commit would leave a fresh derivation looking stale.
#
# Vendor boundary (standards/vendor-boundaries.md):
#   Q1 actor — the schedule initiates as `github-actions`; the push is made
#      with the bureau App token, so the commit and the Pipeline Tests run it
#      triggers are attributed to `agent-bureau-bot`, an identity every gate
#      here already admits (the same arrangement model-drift.yml runs under).
#   Q2 secrets — a schedule-triggered run in this repo reads the repo's normal
#      secrets store, never GitHub's separate Dependabot store, so
#      `LINEAR_API_KEY` and the App credentials resolve. No dependabot-triggered
#      event is in this workflow's path at all.
#   Q3 re-run — safe and boring: a second run on the same day re-derives the
#      same rows and commits a new timestamp. There is nothing else to change
#      and no state a re-run could double.
#   Q4 command limits — `git push` to `main` needs the branch protection rule to
#      admit this App. It already admits model-drift.yml's identical push, which
#      is the whole of the evidence; the PR body confirms it rather than assumes
#      it. `derive` itself is bounded by what it can read: a repo this token
#      cannot see records `UNKNOWN`, never `0`, so a narrowed token degrades the
#      ledger visibly instead of quietly reporting a clean history.
#   Q5 our crash — a crash anywhere leaves the previous ledger in place. There
#      are no receipts and no markers, so nothing blocks recovery: the next
#      day's run simply repeats, and `workflow_dispatch` re-runs it sooner.
name: Split ledger

on:
  schedule:
    # Daily, 04:41 UTC. Off the hour on purpose — GitHub delays scheduled jobs
    # hardest at :00, and a ledger read is not time-critical. Off model-drift's
    # :17 too, so the two jobs that push to `main` are not racing each other.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    # The Linear budget this job draws: `derive` reads ~3 requests per card in
    # the population (the card, its comment thread, its successor search)
    # against the workspace's shared 2,500/hour, serially through the one fleet
    # key. That is tens of requests once a day, and it is attributable rather
    # than assumed — the derive step declares `LINEAR_IDENTITY: fleet`, so
    # `python3 scripts/check_linear_budget.py` reports this workflow's spend by
    # name instead of `undeclared`. The cap is the ceiling on a live read that
    # hangs; the population grows a card at a time, so 20 is generous against a
    # run that is minutes long.
    timeout-minutes: 20
    concurrency:
      group: split-ledger
      cancel-in-progress: false
    steps:
      # The App token, not github.token: a push made with GITHUB_TOKEN does not
      # trigger workflows, so the ledger commit would land on main with the test
      # suite never running against it.
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # NO `--card`. Whatever `derive` discovers is what gets committed: the
      # seed cards plus every successor the citation search turns up. The
      # discovery rules live in split_ledger.py and belong there — a card list
      # written into this file would freeze the ledger at the day someone typed
      # it, which is the hand-derivation this workflow exists to replace.
      #
      # GH_TOKEN is the App token, so the pull requests of split pieces are read
      # where this installation can see them and recorded as `UNKNOWN` where it
      # cannot (`planner_score.repo_is_readable` probes the repo first, because
      # `gh pr list` on an invisible repo exits 0 and prints `[]`).
      - name: Derive the ledger from the board
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_IDENTITY: fleet
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/split_ledger.py derive

      # GENERATED FILES ONLY, and proven so: stage the two paths by name, read
      # the index back, and refuse to commit if anything else is in it. Copied
      # from model-drift.yml, where the same three lines are what make a
      # scheduled job structurally incapable of moving a model pin.
      - name: Commit the ledger (the two generated paths only)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git add config/split-ledger.json docs/split-ledger.md
          STAGED=$(git diff --cached --name-only)
          # Unreachable while the derivation stamps itself: both files carry
          # `generated_at`, so every run changes both. It is here so that an
          # impossible no-op is a green run rather than a red one from
          # `git commit` refusing an empty index — never as a way to skip a
          # derivation that only moved the timestamp.
          if [ -z "$STAGED" ]; then
            echo "the ledger is byte-identical — nothing to commit"
            exit 0
          fi
          UNEXPECTED=$(printf '%s\n' "$STAGED" \
            | grep -vxF -e 'config/split-ledger.json' -e 'docs/split-ledger.md' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::refusing to commit — staged more than the generated ledger: $UNEXPECTED"
            exit 1
          fi
          git -c user.name="agent-bureau-bot[bot]" \
              -c user.email="agent-bureau-bot[bot]@users.noreply.github.com" \
              commit -m "chore(ledger): regenerate the split ledger

          Generated by .github/workflows/split-ledger.yml (DRE-3357). Derived,
          never hand-edited — the generation time inside it is the freshness
          scripts/ledger_context.py checks."
          git push origin HEAD:main
