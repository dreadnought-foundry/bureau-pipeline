# The split ledger, regenerated daily (DRE-3357 — piece of DRE-3022).
#
# The epic's rule for this file is that it is "regenerated by a scheduled job,
# never hand-edited, with the generation time inside it". Two of those three
# were already true: `scripts/split_ledger.py derive` writes the generation
# time into `config/split-ledger.json` and renders `docs/split-ledger.md` from
# it, and nobody edits either by hand. The missing third is why the ledger the
# planner reads was derived once, on 2026-09-04, and aged from there.
#
# Aging is not cosmetic. `scripts/ledger_context.py` calls a ledger older than
# LEDGER_MAX_AGE_HOURS (72) `UNKNOWN` and hands the planner that instead of the
# rates, so a ledger nobody regenerates becomes a ledger nobody reads — silently,
# three days after the last person remembered. Daily against a 72-hour window is
# two missed runs of margin, which matters because GitHub drops scheduled jobs
# under load and never retries them.
#
# Shaped on `model-drift.yml`, the other scheduled job here that commits a
# generated file, down to the staged-set proof: stage the paths by name, read
# the index back, refuse anything else. That is what makes a job holding
# `contents: write` incapable of committing anything but the two files it just
# generated. Since DRE-3879 both jobs make that proof in one place —
# `scripts/bot_branch_pr.py` — rather than in two copies of shell.
#
# IT DOES NOT PUSH TO `main`, AND THAT IS THE POINT (DRE-3879). This step used
# to end in `git push origin HEAD:main`, and branch protection refused it every
# single morning:
#
#     GH006: Protected branch update failed
#     Changes must be made through a pull request
#
# The ledger was derived correctly and then could not be saved. The CEO's
# signed answer (2026-09-14 08:14 PT) is the remedy and its limit in one
# sentence: open a pull request, change no branch protection. So the derivation
# is committed to `bot/split-ledger` — one fixed branch, one pull request,
# updated in place rather than reopened — and `main` keeps requiring a pull
# request and both required checks. The branch is on the merge gate's trusted
# list as a LITERAL name (never `bot/*`), so CI and the adversarial critic run
# on it exactly as on any other pull request and a red check or a
# REQUEST_CHANGES verdict blocks the merge.
#
# A run that changes nothing but `generated_at` STILL COMMITS. The timestamp is
# the freshness every reader checks, so a run that derived the same rows and
# skipped the commit would leave a fresh derivation looking stale. A run that
# changes NOTHING AT ALL opens no pull request and exits green.
#
# Vendor boundary (standards/vendor-boundaries.md):
#   Q1 actor — the schedule initiates as `github-actions`; the push and the
#      `gh pr create` are made with the bureau App token, so the commit, the
#      pull request and the Pipeline Tests run it triggers are attributed to
#      `agent-bureau-bot` — an identity every gate here already admits, and one
#      distinct from the qa-bot App that merges, so author != merger holds.
#   Q2 secrets — a schedule-triggered run in this repo reads the repo's normal
#      secrets store, never GitHub's separate Dependabot store, so
#      `LINEAR_API_KEY` and the App credentials resolve. No dependabot-triggered
#      event is in this workflow's path at all.
#   Q3 re-run — safe and boring: a second run on the same day re-derives the
#      same rows, force-pushes the same branch and finds its own open pull
#      request rather than opening a second. There is nothing else to change
#      and no state a re-run could double.
#   Q4 command limits — the push is to `bot/split-ledger`, which no protection
#      rule covers, so the GH006 refusal cannot recur; the pull request is what
#      reaches `main`, through the gate. `gh pr list --state open` is
#      deliberately not `--state all` — a merged pull request is finished and
#      the next change needs a new one — and a listing GitHub will not answer
#      fails the run rather than opening a duplicate. `derive` itself is
#      bounded by what it can read: a repo this token cannot see records
#      `UNKNOWN`, never `0`, so a narrowed token degrades the ledger visibly
#      instead of quietly reporting a clean history.
#   Q5 our crash — a crash anywhere leaves the previous ledger in place. There
#      are no receipts and no markers, so nothing blocks recovery: the next
#      day's run simply repeats, and `workflow_dispatch` re-runs it sooner.
name: Split ledger

on:
  schedule:
    # Daily, 04:41 UTC. Off the hour on purpose — GitHub delays scheduled jobs
    # hardest at :00, and a ledger read is not time-critical. Off model-drift's
    # :17 too, so the two jobs that push to `main` are not racing each other.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    # The Linear budget this job draws: `derive` reads ~3 requests per card in
    # the population (the card, its comment thread, its successor search)
    # against the workspace's shared 2,500/hour, serially through the one fleet
    # key. That is tens of requests once a day, and it is attributable rather
    # than assumed — the derive step declares `LINEAR_IDENTITY: fleet`, so
    # `python3 scripts/check_linear_budget.py` reports this workflow's spend by
    # name instead of `undeclared`. The cap is the ceiling on a live read that
    # hangs; the population grows a card at a time, so 20 is generous against a
    # run that is minutes long.
    timeout-minutes: 20
    concurrency:
      group: split-ledger
      cancel-in-progress: false
    steps:
      # The App token, not github.token: a push made with GITHUB_TOKEN does not
      # trigger workflows, so the ledger commit would land on main with the test
      # suite never running against it.
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # NO `--card`. Whatever `derive` discovers is what gets committed: the
      # seed cards plus every successor the citation search turns up. The
      # discovery rules live in split_ledger.py and belong there — a card list
      # written into this file would freeze the ledger at the day someone typed
      # it, which is the hand-derivation this workflow exists to replace.
      #
      # GH_TOKEN is the App token, so the pull requests of split pieces are read
      # where this installation can see them and recorded as `UNKNOWN` where it
      # cannot (`planner_score.repo_is_readable` probes the repo first, because
      # `gh pr list` on an invisible repo exits 0 and prints `[]`).
      - name: Derive the ledger from the board
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_IDENTITY: fleet
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/split_ledger.py derive

      # GENERATED FILES ONLY, and proven so: the two paths are named here, and
      # `bot_branch_pr.py` stages exactly them, reads the index back and
      # refuses to commit if anything else is in it — the model-drift
      # guarantee, now in one tested place for both jobs (DRE-3879). It then
      # commits to `bot/split-ledger` and opens or updates that branch's ONE
      # pull request. Nothing changed means no pull request and a green run.
      - name: Publish the ledger on bot/split-ledger (one PR, never a push to main)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cat > "$RUNNER_TEMP/split-ledger-pr-body.md" <<'BODY'
          The split ledger, regenerated by `.github/workflows/split-ledger.yml`
          (DRE-3357). Derived, never hand-edited — the generation time inside it
          is the freshness `scripts/ledger_context.py` checks, and a ledger older
          than `LEDGER_MAX_AGE_HOURS` is handed to the planner as `UNKNOWN`.

          Data only: the run stages `config/split-ledger.json` and
          `docs/split-ledger.md` by name and refuses to commit anything else, so
          this job is structurally incapable of changing code.
          BODY
          python3 scripts/bot_branch_pr.py publish \
            --repo "$GITHUB_REPOSITORY" \
            --branch bot/split-ledger \
            --base "${DEFAULT_BRANCH:-main}" \
            --path config/split-ledger.json \
            --path docs/split-ledger.md \
            --title "chore(ledger): regenerate the split ledger" \
            --body-file "$RUNNER_TEMP/split-ledger-pr-body.md"
