# Self-host trigger stub (DRE-1929, adr-bureau-pipeline-self-host) — this repo
# consumes its OWN reusable workflows exactly like a product repo.
# @main on purpose: this repo is the canary channel; the fleet rides tags.
#
# No max_wip here, so the cap is reconcile.DEFAULT_MAX_WIP ("8") — a
# conservative cap for the control-plane repo, deliberately below
# agent-bureau's "12". All THREE of this repo's promotion stubs (this one,
# self-plan, self-linear-sync) pass none, and since DRE-3994 an empty input on
# any of them is resolved from THIS file — the line a repo writes its cap on.
# To override, set max_wip here; setting it on all three keeps them in step
# (DRE-2529, enforced by scripts/check_wip_cap.py).
name: Reconcile

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [reconcile]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/reconcile.yml@main
    with:
      pipeline_ref: main
      # THE PEN'S SWITCH IS NOT PASSED HERE ANY MORE (DRE-4141). This sweep
      # moves no card out of Intake — no card leaves that lane because it is
      # old — so there is nothing here for a hold to hold. The switch lives on
      # `self-groomer.yml`, which calls the drain, which is the one exit:
      #
      #   gh variable set INTAKE_HOLD \
      #     --repo dreadnought-foundry/bureau-pipeline --body 2026-09-08
      #   gh variable delete INTAKE_HOLD --repo dreadnought-foundry/bureau-pipeline
      #
      # ONE variable, ONE reader, and that is the point of the change: it used
      # to take a hold on every repo to stop this sweep ageing the whole
      # fleet's Intake, and on 2026-09-17 one of them being deleted for eight
      # minutes put three cards in the CEO's queue.
      # The dispatch's scope (DRE-3640). The relay fires `reconcile` because
      # ONE card moved, and this stub is the adapter that carries that fact
      # through: `reason` is why, `identifier` is the card. On `schedule` and
      # `workflow_dispatch` the `client_payload` context is empty, both render
      # as "", and the sweep runs the full board pass it always has — so these
      # two lines narrow the dispatched pass and nothing else.
      #
      # The reusable's INPUT names are the contract it shares with the sweep
      # that reads the env; the payload KEYS are the relay's, and mapping one
      # to the other is this stub's job.
      sweep_reason: ${{ github.event.client_payload.reason }}
      sweep_card: ${{ github.event.client_payload.identifier }}
      # intake_max_age_minutes / intake_escalation_cap were never passed here
      # and are retired inputs now (DRE-4141) — there is no window and no cap,
      # because there is no move for either to bound.
    secrets: inherit
