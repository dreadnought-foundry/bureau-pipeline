# Deterministic merge gate: merges an agent PR when ALL conditions hold —
# the branch does not conflict with its base (DRE-2416), every CI check
# green, the latest QA Critic verdict is APPROVE **for the PR's current
# head commit** (DRE-1990: the verdict embeds the SHA it reviewed; a missing
# or stale SHA is treated as no verdict), AND the pull request is not a
# DRAFT (DRE-3467 — GitHub never merges one, so the gate posts the honest
# waiting-for-human state instead of failing on the merge command), AND no
# other OPEN pull request whose head this branch carries stands unapproved
# (DRE-4103 — a merge would land that work too, and GitHub would mark it
# merged; the gate holds and says which, on the PR). The
# merge uses the qa-bot identity
# (distinct GitHub App), so author != merger is enforced by identity, not
# policy. No human in the loop; no agent claims trusted — all inputs are
# read from GitHub's own records.
#
# The gate does NOT require an up-to-date branch, and IT is the single
# writer of that rule — not branch protection (DRE-2416, CEO decision
# 2026-08-20 on DRE-2597). It used to merge the base into a stale branch
# (DRE-1924's condition 0); every such merge was a new head, every new head
# restarted the full CI suite, and on a busy repo the base moved again
# before that suite finished — portico PR 268 burned four green CI runs on
# unchanged source in thirteen minutes and still read BLOCKED (DRE-2393).
# The accepted cost is that two individually-green PRs can break the base
# together; the push-to-main run going red plus medic.yml's repair card
# catches that in minutes.
#
# The one exception is a FORK, not currency (DRE-4912, DRE-5070). What
# DRE-2416 retired was updating any branch that had fallen behind. What the
# gate does now is refresh a branch only where merging it would fork `main`:
# the pull request adds a file under a path the repo declares order-sensitive
# (`.github/bureau/merge-recheck.json` — alembic's versions directory), AND
# `main` has added one there since the branch's merge base. On 2026-09-25 the
# gate merged agent-bureau #2773 on a CI run two hours stale, after #2777 had
# added a sibling `0062_*` migration, and every open PR, the release train and
# a console deploy paid for the second head. So right before merging, the
# gate asks scripts/order_sensitive_refresh.py; on `refresh` it updates the
# branch from `main` instead, CI re-runs on a fresh merge ref, and the repo's
# own head check refuses the second head before it lands. The cost is
# bounded where DRE-2393's was not: it fires only on a same-prefix addition
# on both sides, at most once per `main` tip, never for a base move that adds
# nothing there, and each refresh buys the CI run the fork would otherwise
# have cost every open PR after the merge. A repo with no declaration pays
# nothing, and a behind head with no such addition merges as it stands.
#
# The DECISION itself lives in scripts/merge_gate.py (DRE-1992) with the
# full rules and their history (DRE-1987 authorship, DRE-1990 SHA binding,
# DRE-1991 SKIP arm, anchored verdict parsing) — tested by the decision-
# table parity suite. This workflow only GATHERS the inputs and ACTS on the
# script's machine-readable verdict.
#
# Triggered (via the product-repo stub) from both directions of the race: CI
# finishing (workflow_run) and a verdict landing (issue_comment) — the
# critic's, or since DRE-5228 the verifier's: a qa-bot comment carrying
# "QA Critic" or "QA Verifier" wakes it, whichever workflows the stub's
# workflow_run list happens to name. Whichever happens last merges. A
# person's approving review wakes it too (pull_request_review, DRE-4341) —
# the one wake left for a card the gate parked in Green Light while it
# waited on a required code-owner review.
#
# A HOLD says so on the PR (DRE-5228). The stack, code-owner and
# waiting-for-human arms always spoke; every other hold — a verifier FAIL, a
# critic REQUEST_CHANGES, a stale or unbound verdict, a stack it cannot
# read — used to end in a green run and nothing on the thread. It now posts
# one note, `⏸️ Merge gate: declined @<head sha> — <reason>`, once per head
# and reason, the reason being the decision script's own `reason=` line.
#
# Reusable workflow: permissions live in the calling stub (contents: read,
# actions: write). Job-level concurrency stays here — it keys off
# github.event, which is the caller's.
#
# ONE billed job per evaluation when the event names its PR (DRE-4279):
# GitHub rounds every job up to a whole minute, so the ~20-second lookup job
# that used to precede every evaluation doubled the gate's bill. It now runs
# only for a workflow_run that names no pull request.
name: Merge Gate (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkouts (scripts, briefs,
          standards). REQUIRED since DRE-2689: a caller must pass the same
          ref it pins in `uses:`, or it runs channel workflow YAML over
          another ref's scripts — pinned to everything that counts refs,
          and not actually pinned (DRE-2026).
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: true
      BUREAU_APP_ID:
        required: false
      BUREAU_APP_PRIVATE_KEY:
        required: false
      BUREAU_QA_APP_ID:
        required: true
      BUREAU_QA_APP_PRIVATE_KEY:
        required: true

jobs:
  # DRE-2508: the PR-lookup job — it answers one question, "which PR did
  # this event wake me about?", so the evaluating job below can key its
  # concurrency group on that single identity.
  #
  # The group used to be `${{ workflow_run.head_branch || issue.number }}`,
  # which names a DIFFERENT thing per leg: the branch on the CI leg, the
  # number on the verdict leg, nothing at all on a dispatch. Two evaluations
  # of ONE pull request therefore landed in different groups and ran
  # concurrently — and every check-then-act in the evaluate step (the
  # waiting-for-human note, the carried-verdict record) is a race the moment
  # they do. Live on 2026-08-17: twelve gate runs in twenty-five minutes
  # during a burst of five PRs, two waiting-for-human comments on one PR,
  # harness red.
  #
  # DRE-4279: this job is the FALLBACK, not the funnel. GitHub bills every
  # job rounded UP to a whole minute, so the ~20 seconds this lookup takes
  # billed a full minute on every evaluation — 1,200+ times in three days
  # across agent-bureau and bureau-harness, beside the evaluating job's own
  # minute. Three of the four legs already carry the PR number in the
  # event: `issue.number` on the verdict leg, `inputs.pr_number` on a
  # dispatch, and `workflow_run.pull_requests[0].number` on the CI leg (a
  # same-repo `pull_request` run names the PR it was created for — 24 of 24
  # live runs sampled on agent-bureau and portico did). Those legs skip this
  # job and `evaluate` keys its group on the event's own number. The lookup
  # runs only for a workflow_run that names NO pull request — a fork PR, or
  # a run whose PR closed before it finished (GitHub empties the array once
  # the PR is closed) — and there it answers exactly what it always did.
  #
  # The event-leg filter moved with the funnel: it lives ONCE, on
  # `evaluate`, and the condition here is deliberately narrow — the event
  # kind and "no named PR" — so the branch list is written in one place
  # (eight hand-copied answers to that question stranded four PRs for ten
  # hours, DRE-2426). The cost of not repeating it: a lookup minute on a
  # hand-named branch whose PR closed before CI finished, which `evaluate`'s
  # filter then declines.
  resolve:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      !github.event.workflow_run.pull_requests[0].number
    # The SHORT-job lane (DRE-3887). Every job in this file is bookkeeping that
    # finishes in well under a minute, and until now it drew from the same
    # `BUREAU_RUNS_ON` pool as the 20-minute agent, critic and verifier jobs: on
    # 2026-09-13 twenty-two agent-bureau gate runs sat queued from 16:40 PT for
    # about an hour while three heavy runners sat idle. A repo routes its short
    # jobs elsewhere by setting `BUREAU_SHORT_RUNS_ON`; with it unset this is
    # the same chain it has always been, so nothing changes until a repo opts
    # in (`tests/test_short_runs_on_lane.py`).
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      # The same App key the gate merges with — no extra identity, and the
      # PR lookup draws on the qa App's own quota, as every other read here
      # does. Minting needs nothing from the caller's GITHUB_TOKEN.
      - name: Mint qa-bot token (author != merger)
        id: qa
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}

      - name: Resolve the PR this event is about
        id: pr
        env:
          GH_TOKEN: ${{ steps.qa.outputs.token }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The one leg that reaches this job (DRE-4279) is a workflow_run
          # that named no PR: look the open one up by head branch. No
          # checkout here, so the repo is named explicitly.
          PR=$(gh pr list --repo "${{ github.repository }}" --head "$WR_BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -z "${PR:-}" ] || [ "$PR" = "null" ]; then
            echo "no open PR — nothing to do"
            PR=""
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "resolved PR: ${PR:-<none>}"

  evaluate:
    needs: resolve
    # The gate's ENTRY for every event that names its PR (DRE-4279), and the
    # event-leg filter every leg passes through — nothing reaches the
    # evaluation around it.
    #
    # `!cancelled()` first, on purpose: `needs: resolve` carries an implicit
    # success() that would SKIP this job whenever `resolve` was skipped —
    # i.e. on every leg this card makes one job. Naming a status function
    # drops that implicit check; `!cancelled()` (not `always()`) still
    # refuses a run being cancelled.
    #
    # Fail-closed on the lookup leg, unchanged: a `resolve` that FAILED
    # (rather than skipped) must not let the gate evaluate a guessed PR,
    # and an empty number means the event pointed at nothing to gate.
    #
    # issue_comment leg (DRE-1987): only a verdict comment AUTHORED BY the
    # qa-bot App wakes the gate — anyone can type "QA Critic" in a comment.
    # The literal must match the BUREAU_QA_APP bot login; the decision steps
    # below re-derive the same login from the minted token (app-slug), but a
    # job-if runs before any step can mint one, so the login is hardcoded
    # here and does NOT follow an App rename.
    # RENAME PROCEDURE (DRE-2120): renaming the qa App must update every
    # hardcoded login site in .github/workflows/ together with the roster in
    # tests/test_qa_login_literal_roster.py, in one commit — a missed site
    # sends this leg dark silently (verdicts stop landing merges until
    # reconcile's ~15-min gate nudge picks them up).
    #
    # The comment predicate is deliberately no narrower than "a qa-bot QA
    # Critic comment". Measured 2026-09-15..18 on agent-bureau + portico:
    # 279 of 279 comment wakes were exactly that; 149 were REQUEST_CHANGES
    # or a neutral hold, which cannot merge but CAN act — merge_gate.py runs
    # the conflict arm first, so either one on a conflicted PR dispatches
    # the fix agent, and a verdict from a workflow_dispatch re-review has no
    # other wake (its run's completion is not a `pull_request` event). The
    # one provable no-op, a comment on an already-closed PR, was 3 of 279.
    #
    # DRE-5228 widened it by exactly one marker: a qa-bot "QA Verifier"
    # comment wakes the gate too, inside the same author clause. Before, a
    # Verifier FAIL woke the gate only where the calling stub's workflow_run
    # list named `Verify` — agent-bureau's does, the scaffold's and this
    # repo's own do not — so elsewhere the next look after a late FAIL was
    # the sweep's nudge. The comment leg makes the wake independent of every
    # stub's list, and the stubs already fire on every created comment. A
    # SKIP and the neutral "could not run" notice wake it as well; the
    # decision script treats the first as advisory and holds on the second.
    # Where both wakes fire, the per-PR concurrency group serializes them
    # and the hold note's marker makes the second a no-op.
    #
    # pull_request_review leg (DRE-4341): a person's submitted APPROVING
    # review. A pull request held for a required code-owner review has its
    # card parked in Green Light, where the sweep dispatches nothing, so the
    # owner's approval is what re-wakes the gate. Not a bot's review —
    # sync_review_state.py files a formal APPROVE beside every APPROVE verdict
    # comment, which already woke the gate — and not a fork's, which gets no
    # secrets to mint the token with and is never gated anyway.
    #
    # The critic's own completion is NOT a wake (Stage 2 #20). Its verdict
    # comment is: the comment leg above runs the gate on it, and the run
    # finishing seconds later woke the gate a second time for the same
    # answer. The gate never waits on the critic's run — its check runs and
    # the run itself sit at a review path, excluded from condition 1 by
    # verified origin (DRE-1994, DRE-5045) — so with no new verdict that wake
    # could only repeat the last evaluation. A review that crashed without
    # commenting is decided `wait` with or without it, and
    # reconcile.recover_crashed_reviews re-dispatches the review, whose
    # comment is the wake. Every stub listing it names it `QA Review` (the
    # scaffold's, agent-bureau's, and this repo's own pr-review.yml).
    # `Verify` is deliberately still a wake: verify.yml is no review path, so
    # the gate waits on the Verifier's run as CI; its verdict comment posts
    # before that run ends, and an out-of-scope Verify posts none. Its
    # completion is the wake that merges.
    if: >
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.inputs.pr_number != '') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (contains(github.event.comment.body, 'QA Critic') || contains(github.event.comment.body, 'QA Verifier')) &&
        github.event.comment.user.login == 'agent-bureau-qa-bot[bot]') ||
       (github.event_name == 'pull_request_review' &&
        github.event.action == 'submitted' &&
        github.event.review.state == 'approved' &&
        github.event.review.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.name != 'QA Review' &&
        (startsWith(github.event.workflow_run.head_branch, 'agent/') ||
         startsWith(github.event.workflow_run.head_branch, 'repair/') ||
         startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
         github.event.workflow_run.head_branch == 'bot/standards-sync' ||
         github.event.workflow_run.head_branch == 'bot/split-ledger' ||
         github.event.workflow_run.head_branch == 'bot/model-drift') &&
        ((needs.resolve.result == 'skipped' &&
          github.event.workflow_run.pull_requests[0].number) ||
         (needs.resolve.result == 'success' &&
          needs.resolve.outputs.pr != ''))))
    # The short lane, same as `resolve` above (DRE-3887).
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    # One group per PR, whatever woke the gate — the CI leg, the verdict
    # leg, and a dispatch all land here (DRE-2508). The key is the PR NUMBER
    # from whichever place this event carries it: the lookup's answer when
    # it ran, else the event's own field (DRE-4279) — every leg renders the
    # same string for the same PR, and tests/test_merge_gate_one_job.py
    # renders every leg to prove it (the review leg's number is
    # `pull_request.number`, DRE-4341). The SAME expression is the `PR` the step
    # below evaluates, so the serialization and the evaluation can never be
    # about different PRs. Never cancel-in-progress: the queued wake is the
    # one that was going to merge, and dropping it would leave the PR
    # waiting for reconcile's ~15-minute nudge.
    concurrency:
      group: merge-gate-pr-${{ needs.resolve.outputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.event.pull_request.number || github.event.inputs.pr_number }}
      cancel-in-progress: false
    # Whose Linear hour this job spends (DRE-3321): the card advance and the
    # merge comment ride the fleet key. Job level, so every step inherits it.
    env:
      LINEAR_IDENTITY: fleet
    steps:
      - name: Mint qa-bot token (author != merger)
        id: qa
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ steps.qa.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # The SAME expression this job's concurrency group is keyed on —
          # the lookup's answer when it ran, else the event's own number —
          # so the serialization and the evaluation can never be about
          # different PRs (DRE-2508, DRE-4279).
          PR: ${{ needs.resolve.outputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.event.pull_request.number || github.event.inputs.pr_number }}
          # Through env, because scripts/evaluate_and_merge.sh is a file and
          # Actions fills in no `${{ }}` there. DRE-4486 and DRE-4103 moved
          # every expression up here while the script was still this step's
          # `run:` block, inside the expression budget
          # tests/test_workflow_expression_budget.py names; DRE-5383 moved
          # the block into the file. tests/test_merge_gate_wiring.py pins
          # QA_LOGIN's derivation here.
          REPO_FULL: ${{ github.repository }}
          WORKFLOW_TOKEN: ${{ github.token }}
          # The trusted verdict author is derived from the same App key this
          # gate merges with (app-slug of the minted token), so an App rename
          # follows automatically; GitHub reserves the "[bot]" suffix, so no
          # user account can impersonate it. Empirically the critic posts as
          # agent-bureau-qa-bot[bot] since bureau-pipeline #51.
          QA_LOGIN: ${{ steps.qa.outputs.app-slug }}[bot]
        run: bash .bureau-pipeline/scripts/evaluate_and_merge.sh
