# Deterministic merge gate: merges an agent PR when ALL conditions hold —
# the branch does not conflict with its base (DRE-2416), every CI check
# green, AND the latest QA Critic verdict is APPROVE **for the PR's current
# head commit** (DRE-1990: the verdict embeds the SHA it reviewed; a missing
# or stale SHA is treated as no verdict). The merge uses the qa-bot identity
# (distinct GitHub App), so author != merger is enforced by identity, not
# policy. No human in the loop; no agent claims trusted — all inputs are
# read from GitHub's own records.
#
# The gate does NOT require an up-to-date branch, and IT is the single
# writer of that rule — not branch protection (DRE-2416, CEO decision
# 2026-08-20 on DRE-2597). It used to merge the base into a stale branch
# (DRE-1924's condition 0); every such merge was a new head, every new head
# restarted the full CI suite, and on a busy repo the base moved again
# before that suite finished — portico PR 268 burned four green CI runs on
# unchanged source in thirteen minutes and still read BLOCKED (DRE-2393).
# The accepted cost is that two individually-green PRs can break the base
# together; the push-to-main run going red plus medic.yml's repair card
# catches that in minutes.
#
# The DECISION itself lives in scripts/merge_gate.py (DRE-1992) with the
# full rules and their history (DRE-1987 authorship, DRE-1990 SHA binding,
# DRE-1991 SKIP arm, anchored verdict parsing) — tested by the decision-
# table parity suite. This workflow only GATHERS the inputs and ACTS on the
# script's machine-readable verdict.
#
# Triggered (via the product-repo stub) from both directions of the race: CI
# finishing (workflow_run) and the critic verdict landing (issue_comment).
# Whichever happens last merges.
#
# Reusable workflow: permissions live in the calling stub (contents: read,
# actions: write). Job-level concurrency stays here — it keys off
# github.event, which is the caller's.
name: Merge Gate (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkouts (scripts, briefs,
          standards). REQUIRED since DRE-2689: a caller must pass the same
          ref it pins in `uses:`, or it runs channel workflow YAML over
          another ref's scripts — pinned to everything that counts refs,
          and not actually pinned (DRE-2026).
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: true
      BUREAU_APP_ID:
        required: false
      BUREAU_APP_PRIVATE_KEY:
        required: false
      BUREAU_QA_APP_ID:
        required: true
      BUREAU_QA_APP_PRIVATE_KEY:
        required: true

jobs:
  # DRE-2508: the gate's ENTRY job — it answers one question, "which PR did
  # this event wake me about?", so the evaluating job below can key its
  # concurrency group on that single identity.
  #
  # The group used to be `${{ workflow_run.head_branch || issue.number }}`,
  # which names a DIFFERENT thing per leg: the branch on the CI leg, the
  # number on the verdict leg, nothing at all on a dispatch. Two evaluations
  # of ONE pull request therefore landed in different groups and ran
  # concurrently — and every check-then-act in the evaluate step (the
  # waiting-for-human note, the carried-verdict record) is a race the moment
  # they do. Live on 2026-08-17: twelve gate runs in twenty-five minutes
  # during a burst of five PRs, two waiting-for-human comments on one PR,
  # harness red. Resolving the PR here costs one job (~20s) and makes the
  # key event-independent.
  #
  # The event-leg filter lives here now, on the funnel every leg passes
  # through; `evaluate` is reachable only via this job's resolved number.
  resolve:
    # issue_comment leg (DRE-1987): only a verdict comment AUTHORED BY the
    # qa-bot App wakes the gate — anyone can type "QA Critic" in a comment.
    # The literal must match the BUREAU_QA_APP bot login; the decision steps
    # below re-derive the same login from the minted token (app-slug), but a
    # job-if runs before any step can mint one, so the login is hardcoded
    # here and does NOT follow an App rename.
    # RENAME PROCEDURE (DRE-2120): renaming the qa App must update every
    # hardcoded login site in .github/workflows/ together with the roster in
    # tests/test_qa_login_literal_roster.py, in one commit — a missed site
    # sends this leg dark silently (verdicts stop landing merges until
    # reconcile's ~15-min gate nudge picks them up).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       (startsWith(github.event.workflow_run.head_branch, 'agent/') ||
        startsWith(github.event.workflow_run.head_branch, 'repair/') ||
        startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
        github.event.workflow_run.head_branch == 'bot/standards-sync')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, 'QA Critic') &&
       github.event.comment.user.login == 'agent-bureau-qa-bot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      # The same App key the gate merges with — no extra identity, and the
      # PR lookup draws on the qa App's own quota, as every other read here
      # does. Minting needs nothing from the caller's GITHUB_TOKEN.
      - name: Mint qa-bot token (author != merger)
        id: qa
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}

      - name: Resolve the PR this event is about
        id: pr
        env:
          GH_TOKEN: ${{ steps.qa.outputs.token }}
          EVENT: ${{ github.event_name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          IC_PR: ${{ github.event.issue.number }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          # Resolve the PR number from whichever event fired. No checkout
          # here, so the repo is named explicitly.
          case "$EVENT" in
            workflow_run)      PR=$(gh pr list --repo "${{ github.repository }}" --head "$WR_BRANCH" --state open --json number --jq '.[0].number' || true) ;;
            workflow_dispatch) PR=$INPUT_PR ;;
            *)                 PR=$IC_PR ;;
          esac
          if [ -z "${PR:-}" ] || [ "$PR" = "null" ]; then
            echo "no open PR — nothing to do"
            PR=""
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "resolved PR: ${PR:-<none>}"

  evaluate:
    needs: resolve
    # Fail-closed on both counts: a resolve that FAILED (rather than
    # skipped) must not let the gate evaluate a guessed PR, and an empty
    # number means the event pointed at nothing to gate. A custom `if`
    # replaces the implicit success() check, so it is spelled out.
    if: needs.resolve.result == 'success' && needs.resolve.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One group per PR, whatever woke the gate — the CI leg, the verdict
    # leg, and a dispatch all land here (DRE-2508). Never cancel-in-progress:
    # the queued wake is the one that was going to merge, and dropping it
    # would leave the PR waiting for reconcile's ~15-minute nudge.
    concurrency:
      group: merge-gate-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Mint qa-bot token (author != merger)
        id: qa
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ steps.qa.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Resolved by the `resolve` job — the SAME number this job's
          # concurrency group is keyed on, so the serialization and the
          # evaluation can never be about different PRs (DRE-2508).
          PR: ${{ needs.resolve.outputs.pr }}
        run: |
          set -euo pipefail

          BRANCH=$(gh pr view "$PR" --json headRefName,state --jq .headRefName)
          STATE=$(gh pr view "$PR" --json state --jq .state)
          [ "$STATE" != "OPEN" ] && { echo "PR #$PR is $STATE — nothing to do"; exit 0; }
          # agent/* = card work; repair/* = red-main auto-repair PRs
          # (DRE-1927); dependabot/* = dependency PRs (DRE-2039, minor/
          # patch only — the script's condition D routes majors to a
          # human). All merge ONLY here, as qa-bot, on CI green + critic
          # APPROVE (author != merger by App identity).
          #
          # bot/standards-sync = the nightly dreadnought-standards regeneration
          # (DRE-2777). CARD-LESS on purpose, exactly like dependabot/*: a
          # nightly job has no per-run card, and pinning it to a fixed id would
          # have linear-sync re-close a long-done card every night. The CARD
          # lookup below already tolerates an empty result.
          #
          # Matched as the LITERAL branch, not `bot/*`. A broad prefix would
          # hand auto-merge to any future branch that happened to be named that
          # way — a permission nobody asked for. A second bot workflow will hit
          # this wall and unowned-branch-watchdog will say so loudly, which is
          # the right amount of friction.
          case "$BRANCH" in agent/*|repair/*|dependabot/*|bot/standards-sync) ;; *) echo "not an agent branch — skip"; exit 0;; esac
          CARD=$(printf '%s' "$BRANCH" | grep -oiE 'DRE-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)

          # The conflict record (DRE-2416): GitHub's own mergeability
          # answer for this PR, read ONCE and handed to the decision script
          # as condition 0. The shell used to branch on it right here; the
          # rule now lives with every other rule, and the ACTION it implies
          # (dispatch the fix agent) sits behind `decision=conflict` below,
          # the same shape every other arm has. UNKNOWN is GitHub computing
          # mergeability lazily (DRE-2121), not a conflict — reconcile owns
          # the re-read poll.
          MSTATE=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)

          # Gather the decision inputs from GitHub's own records; the rules
          # live in scripts/merge_gate.py (DRE-1992 — conditions 0-3: no
          # merge conflict with the base (DRE-2416 — a conflicted branch
          # needs the fix agent, and freshness is NOT required), CI green
          # with the review-run exclusion by VERIFIED ORIGIN (DRE-1994),
          # critic APPROVE authored by the qa-bot App and SHA-bound to this
          # head, verifier PASS/SKIP/absent with the fail-closed
          # present-but-stale asymmetry).
          # REST check-runs API, NOT `gh pr checks` — the GraphQL rollup needs
          # actions:read the qa-bot App deliberately doesn't have.
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" > /tmp/check-runs.json
          # DRE-2340: the CONTENT-binding record — GitHub's own three-dot
          # compare of the PR's base against its current head, passed WHOLE
          # (never trimmed to `{status}`). Its `files[]` is the PR's own
          # contribution, from which merge_gate.py computes this head's
          # content id, so a verdict survives a base merge that changes
          # nothing the PR changes. Computing it inside the script means no
          # extra API call and no way to hand the gate an id for a
          # different head.
          # A blip (`{}`) fails CLOSED where it matters: no content id → no
          # carry → a stale verdict needs a fresh review. Its `.status` is
          # only the behind/ahead note now (DRE-2416) and gates nothing, so
          # a blip no longer strands a green, approved PR.
          BASE=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          gh api "repos/${{ github.repository }}/compare/$BASE...$SHA" > /tmp/compare.json 2>/dev/null \
            || echo '{}' > /tmp/compare.json
          # A transient comments-API failure must read as "no verdicts yet"
          # (the gate waits, fail-closed) — the same tolerance the inline
          # shell had — not as a red merge-gate run.
          gh api "repos/${{ github.repository }}/issues/$PR/comments" > /tmp/comments.json 2>/dev/null \
            || echo '[]' > /tmp/comments.json
          # DRE-1994: the review-run exclusion is by VERIFIED ORIGIN, not
          # name — a PR-authored job can call itself "sneaky-review" and it
          # still counts against all-green. The runs listing is GitHub's own
          # record of which workflow FILE (path) produced each check suite;
          # merge_gate.py excludes only check runs sitting in a suite of an
          # allowlisted review workflow. The listing needs actions:read,
          # which the qa-bot App deliberately lacks — this ONE read uses the
          # workflow's own token (the calling stub grants actions perms). A
          # blip here must fail CLOSED: empty record → no exclusions → the
          # gate waits; it never merges past an unverifiable check.
          GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" > /tmp/workflow-runs.json 2>/dev/null \
            || echo '{"workflow_runs":[]}' > /tmp/workflow-runs.json
          # The trusted verdict author is derived from the same App key this
          # gate merges with (app-slug of the minted token), so an App rename
          # follows automatically; GitHub reserves the "[bot]" suffix, so no
          # user account can impersonate it. Empirically the critic posts as
          # agent-bureau-qa-bot[bot] since bureau-pipeline #51.
          QA_LOGIN="${{ steps.qa.outputs.app-slug }}[bot]"
          # DRE-2039: the dependabot-policy record — the PR author from
          # GitHub's own PR object (REST user.login gives the literal
          # "dependabot[bot]"; gh's GraphQL author rendering varies by
          # version) and the PR's commits, whose messages carry Dependabot's
          # machine-readable update-type trailer (the semver signal). A blip
          # must fail CLOSED: empty record → the script waits; it never
          # judges the semver level on unverifiable data.
          AUTHOR=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .user.login)
          gh api "repos/${{ github.repository }}/pulls/$PR/commits?per_page=100" > /tmp/pr-commits.json 2>/dev/null \
            || echo '[]' > /tmp/pr-commits.json

          python3 .bureau-pipeline/scripts/merge_gate.py \
            --head-sha "$SHA" \
            --qa-login "$QA_LOGIN" \
            --check-runs-file /tmp/check-runs.json \
            --comments-file /tmp/comments.json \
            --workflow-runs-file /tmp/workflow-runs.json \
            --compare-file /tmp/compare.json \
            --merge-state "$MSTATE" \
            --review-workflows ".github/workflows/qa-review.yml,.github/workflows/pr-review.yml" \
            --head-branch "$BRANCH" \
            --pr-author "$AUTHOR" \
            --pr-commits-file /tmp/pr-commits.json \
            | tee /tmp/gate-decision
          # Fail-closed on shape drift: no `decision=merge` line, no merge.
          DECISION=$(grep -m1 '^decision=' /tmp/gate-decision | cut -d= -f2-)

          # DRE-2340: when a verdict was honoured ACROSS a head change, say
          # so on the PR. Nobody here reads diffs, so the audit trail has
          # to explain itself — portico #205's six merge commits had
          # nothing in the timeline explaining them. Since DRE-2416 the
          # gate never moves a head itself, so the head change this records
          # is the FIX AGENT's conflict merge.
          # Idempotent on the CONTENT ID (one record per readiness cycle,
          # not per head), checked against the comments record already
          # fetched above — the same shape the `human` arm uses. The needle
          # is the NOTE's own ASCII marker, not the bare content id: the
          # verdict comment carries that id too, so matching on it alone
          # would read as "already posted" every single time and the record
          # would never appear.
          # Deliberately carries NO verdict-shaped text: it is a status
          # note, never an approval credential, and it must not re-wake
          # this workflow's own issue_comment leg.
          # `carried=` is OPTIONAL — merge_gate.py emits it only when a
          # verdict was actually carried. Absent, grep exits 1, and under
          # this step's `set -euo pipefail` that status escapes the command
          # substitution and kills the STEP — before the conflict/human/
          # merge arms run. It took the whole fleet's gate down on 2026-08-10
          # (green 02:38:52, dead from 02:46:16). `|| true` makes absence
          # read as empty, which is exactly what `[ -n "$CARRIED" ]` below
          # already expects. Any future optional field needs the same.
          CARRIED=$(grep -m1 '^carried=' /tmp/gate-decision | cut -d= -f2- || true)
          CARRIED_ID=$(grep -m1 '^carried_content_id=' /tmp/gate-decision | cut -d= -f2- || true)
          # Posted through the issue-comments API rather than the gh pr
          # helper: this arm sits BEFORE the conflict/human/merge arms (a
          # carry can end in any of them). Identical result either way.
          # This idempotence check is still a read of the snapshot above,
          # i.e. the same shape DRE-2508 removed from the `human` arm — it
          # is left alone deliberately (that arm's wiring is pinned by the
          # DRE-2340 suite, and the record is not asserted once-only
          # anywhere). What protects it is the per-PR concurrency group on
          # this job: two evaluations of one PR no longer overlap at all.
          CARRY_MARK="carried verdict content:$CARRIED_ID"
          if [ -n "$CARRIED" ] && ! grep -q "$CARRY_MARK" /tmp/comments.json; then
            printf '%s\n\n%s\n\n%s\n' \
              "♻️ Merge gate: $CARRY_MARK — the standing review verdict was carried across a branch update." \
              "Reviewed at $CARRIED; current head $SHA. This branch's own changes are byte-identical to what was reviewed: the head moved only because $BASE was merged in, and that merge touched nothing this pull request changes." \
              "Any change to this pull request's own diff changes the fingerprint above and the verdict dies (DRE-2340). CI still re-runs on the merged result." \
              > /tmp/carry-note.md
            gh api "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@/tmp/carry-note.md >/dev/null || true
          fi

          # DRE-2416: `conflict` = the branch cannot merge until it is
          # reconciled with its base. The `update-branch` API cannot
          # resolve a textual conflict; the fix agent can, and its merge
          # moves the head, so a fresh SHA-bound review follows. This is
          # the arm the shell used to run inline on mergeStateStatus, now
          # behind the machine-readable decision — same action, one writer.
          if [ "$DECISION" = "conflict" ]; then
            # DRE-2039: never point the fix agent at a dependabot PR — it
            # has no card to work, and Dependabot rebases/recreates its own
            # conflicted PRs.
            case "$BRANCH" in dependabot/*)
              echo "dependabot PR has a conflict — dependabot rebases its own PRs; not dispatching the fix agent"
              exit 0;;
            esac
            echo "merge conflict with $BASE — dispatching fix agent"
            # DRE-2056: in the self-host repo agent-fix.yml IS the reusable
            # (workflow_call only — dispatching it 422s, and the || true
            # below swallowed that); the dispatchable stub there is
            # self-agent-fix.yml. Same resolution reconcile.fix_workflow()
            # makes for the sweep's dispatches.
            FIX_WF=agent-fix.yml
            [ "${{ github.repository }}" = "dreadnought-foundry/bureau-pipeline" ] && FIX_WF=self-agent-fix.yml
            # qa-bot token lacks Actions perms (deliberate); use the workflow's
            # own GITHUB_TOKEN — workflow_dispatch is exempt from the
            # no-cascade rule, so the dispatched run still fires.
            GH_TOKEN="${{ github.token }}" gh workflow run "$FIX_WF" \
              --repo "${{ github.repository }}" \
              --ref "$(gh api repos/${{ github.repository }} --jq .default_branch)" \
              -f pr_number="$PR" || true
            exit 0
          fi
          # DRE-2039: `human` = the gate will NEVER merge this PR (a
          # dependabot major / unprovable semver level). Post the honest
          # state ONCE and stop. No verdict-shaped text: this is a status
          # note, not an approval credential.
          #
          # DRE-2508: posted through scripts/gate_note.py, NOT guarded by a
          # grep over /tmp/comments.json. That record was fetched ~40 lines
          # above, and checking a stale read before acting is a race: two
          # gate evaluations of one PR both read before either wrote and
          # both posted (bureau-pipeline #157, 2026-08-17 — the harness
          # asserts exactly one and went red). The script re-reads as late
          # as possible, posts, then converges on the earliest note; it is
          # also scoped to the gate's OWN login, so a human quoting the
          # marker no longer silences the honest state. Per-PR
          # serialization (the concurrency group above) should mean the
          # overlap never happens — this is the mechanism that holds if it
          # does, and the one a unit test can actually race.
          if [ "$DECISION" = "human" ]; then
            REASON=$(grep -m1 '^reason=' /tmp/gate-decision | cut -d= -f2-)
            HUMAN_MARK="Merge gate: waiting for human merge"
            printf '⏸️ %s — %s\n' "$HUMAN_MARK" "$REASON" > /tmp/human-note.md
            python3 .bureau-pipeline/scripts/gate_note.py \
              --repo "${{ github.repository }}" \
              --pr "$PR" \
              --author "$QA_LOGIN" \
              --marker "$HUMAN_MARK" \
              --body-file /tmp/human-note.md
            exit 0
          fi
          [ "$DECISION" = "merge" ] || exit 0

          # Both gates green: advance card, merge as qa-bot.
          [ -n "$CARD" ] && python3 .bureau-pipeline/scripts/linear_ops.py advance "$CARD" "In Review" "In QA,In Progress" || true
          # DRE-2117: pin the merge to the exact head every condition above
          # (including the SHA-bound critic APPROVE) was evaluated against —
          # a push or rebase landing since $SHA was captured makes GitHub
          # reject the merge (405) instead of merging a head the critic
          # never reviewed (the DRE-1990 skew at the last step). Classify
          # the failure before deciding loud/quiet: a MOVED (or
          # unverifiable) head is the benign race — exit clean, the new
          # head's own events re-run the gate; a failure with the head
          # still at $SHA is real and stays a red run.
          if ! gh pr merge "$PR" --merge --delete-branch --match-head-commit "$SHA"; then
            NOW=$(gh pr view "$PR" --json headRefOid --jq .headRefOid 2>/dev/null || true)
            if [ -n "$NOW" ] && [ "$NOW" = "$SHA" ]; then
              echo "merge failed with the head still at $SHA — real failure"
              exit 1
            fi
            echo "head moved since evaluation (was $SHA, now ${NOW:-unverifiable}) — not merging; the gate re-runs on the new head's events"
            exit 0
          fi
          echo "merged PR #$PR"
          [ -n "$CARD" ] && python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" \
            "🔀 Auto-merged by qa-bot: CI green + critic APPROVE. PR: $(gh pr view "$PR" --json url --jq .url)" || true
