# Reconcile sweep: every 15 minutes (cron lives in the calling stub), compare
# Linear card states against pipeline reality (runs, PRs, verdicts) and nudge
# whatever is stuck. The webhook path is primary; this sweep is the backstop
# that makes a missed webhook a 15-minute delay instead of a silent stall.
#
# Reusable workflow: permissions live in the calling stub (contents: read,
# actions: write). Job-level concurrency stays here.
name: Reconcile (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkouts (scripts, briefs,
          standards). REQUIRED since DRE-2689: a caller must pass the same
          ref it pins in `uses:`, or it runs channel workflow YAML over
          another ref's scripts — pinned to everything that counts refs,
          and not actually pinned (DRE-2026).
        type: string
        required: true
      max_wip:
        # NO DEFAULT (DRE-3994), the same as plan.yml and linear-sync.yml: an
        # empty input makes reconcile.py read the caller's own reconcile stub,
        # which for this workflow is the stub that called it — so a stub that
        # sets no cap still resolves to reconcile.DEFAULT_MAX_WIP, as before.
        description: WIP cap for the dependency gate's auto-promotion (empty = the caller's reconcile.yml stub)
        type: string
        required: false
      # RETIRED BY DRE-4141, AND STILL DECLARED. The sweep no longer moves a
      # card out of Intake for any reason, so none of these three reaches the
      # script: THE PEN'S SWITCH LIVES ON `groomer.yml` NOW, where the one
      # remaining exit is (the approved batch's drain), and the window and the
      # cap bounded a move that no longer happens.
      #
      # They stay declared because a `workflow_call` input a caller passes and
      # the reusable does not declare is a HARD ERROR — "Invalid input, X is
      # not defined in the referenced workflow" — and every stub on this
      # channel would fail its next sweep on the merge rather than on a change
      # anybody made to it. Accepted and ignored is the compatible shape; the
      # stubs drop the lines on their own schedule, and these go with the
      # scaffold's next pass.
      intake_hold:
        description: >-
          RETIRED (DRE-4141) — accepted and ignored. The hold is read by
          `groomer.yml`, which is where the one exit from Intake is; set
          `vars.INTAKE_HOLD` and pass it THERE. Passing it here holds nothing,
          because this sweep moves nothing out of Intake.
        type: string
        required: false
        default: ""
      intake_max_age_minutes:
        description: >-
          RETIRED (DRE-4141) — accepted and ignored. No card leaves Intake
          because it is old, so there is no window to widen: the CEO's signed
          answer of 2026-09-17 removed the age-out rather than retuning it.
          The sweep reports the lane's depth instead; delete this line.
        type: string
        required: false
        default: ""
      intake_escalation_cap:
        description: >-
          RETIRED (DRE-4141) — accepted and ignored. It capped how many aged
          cards ONE sweep could move, and no sweep moves any. Delete this line.
        type: string
        required: false
        default: ""
      linear_identity:
        description: >-
          WHOSE Linear hour this sweep spends (DRE-3321). Must be a `name`
          from `config/linear-identities.json` — `linear_ops` prints
          `undeclared` for any other word rather than guessing, because a
          confident wrong name sends the reader to the wrong bucket. The
          default is `fleet`, the user every product repo's sweep runs as, so
          a production stub passes nothing and is unchanged. A caller on its
          own Linear key passes its own name (the sandbox's stub passes
          `sandbox`).
        type: string
        required: false
        default: "fleet"
      sweep_reason:
        description: >-
          WHY this pass was asked for (DRE-3640) — the scope the sweep reads
          off `SWEEP_REASON`. The words it recognises are `card-done` and
          `epic-activated`; anything else, EMPTY INCLUDED, means a full board
          pass. Empty is the whole safety of it: on `schedule` and
          `workflow_dispatch` the `inputs` context is empty, both this and
          `sweep_card` interpolate to "", and the sweep does exactly what it
          does today. A caller that knows why it fired — the relay's
          `repository_dispatch`, fired because ONE card went Done — passes the
          reason and buys a scoped pass instead of the full price.
        type: string
        required: false
        default: ""
      sweep_card:
        description: >-
          WHICH card the pass is about (`DRE-1234`), read off `SWEEP_CARD`.
          Empty means the whole board. Paired with `sweep_reason`: a reason
          with no card is still a full pass, because the sweep has nothing to
          narrow to.
        type: string
        required: false
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: true
      BUREAU_APP_ID:
        required: true
      BUREAU_APP_PRIVATE_KEY:
        required: true
      BUREAU_QA_APP_ID:
        required: false
      BUREAU_QA_APP_PRIVATE_KEY:
        required: false
      # Dispatch-pool workers (DRE-2013), wired in here by DRE-4282: the
      # sweep's READS — `pr_for` once per card, the unlanded watchdog's branch
      # listing — go out as the pool App with the most headroom instead of
      # the original App's bucket, which they helped empty on 2026-09-17
      # (DRE-4132). ALL optional: a repo without these pairs reads on the
      # original App exactly as before.
      BUREAU_APP_ID_2:
        required: false
      BUREAU_APP_PRIVATE_KEY_2:
        required: false
      BUREAU_APP_ID_3:
        required: false
      BUREAU_APP_PRIVATE_KEY_3:
        required: false
      BUREAU_APP_ID_4:
        required: false
      BUREAU_APP_PRIVATE_KEY_4:
        required: false

jobs:
  sweep:
    # The SHORT-job lane (DRE-3887, widened to the sweeps by DRE-4276). This
    # job is `reconcile.py` and nothing else — no Claude call, no test suite,
    # no build — and until now it drew from the same `BUREAU_RUNS_ON` pool as
    # the 20-minute agent, critic and verifier jobs: on 2026-09-18 at 13:47 PT
    # the mini's six runners were all busy, 38 jobs were queued, the oldest
    # reviews had waited about 100 minutes, and three of the queued jobs were
    # agent-bureau Reconcile sweeps taking a turn ahead of them. A repo routes
    # its short jobs elsewhere by setting `BUREAU_SHORT_RUNS_ON`; with it unset
    # this is the same chain it has always been, so nothing changes until a
    # repo opts in (`tests/test_short_runs_on_lane.py`).
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    concurrency:
      group: reconcile
      cancel-in-progress: false
    # Whose Linear hour this sweep spends (DRE-3321). Linear's 2,500/hour
    # limit is PER USER and there are three non-human users (DRE-3172,
    # DRE-3628: fleet, operator-tools, sandbox), so a rate-limited run has to
    # name the bucket that ran dry. Job level, beside
    # the job that reads secrets.LINEAR_API_KEY: every step inherits it and no
    # step has to be edited — including the next one somebody adds. DECLARED,
    # not verified: the label cannot be checked against Linear from inside a
    # run without spending a request from the budget in question
    # (check_linear_identities.py is the live proof the key is who this says).
    #
    # From the CALLER since DRE-3630, never a literal here: this file is the
    # shared channel, and a stub on its own Linear key — the sandbox's — would
    # otherwise print `budget: fleet` while spending its own hour, mis-filing
    # every one of its lines in check_linear_budget.py. The word `fleet` is
    # written once, as the input's default, so every production stub inherits
    # it with no edit.
    env:
      LINEAR_IDENTITY: ${{ inputs.linear_identity }}
      # The secrets context is not readable in a step-level `if:`, so the
      # dispatch-pool probe mints check slot PRESENCE via these job-env
      # mirrors (app ids only — NEVER keys). Empty ⇒ the probe is skipped
      # and the pool shrinks (DRE-2013 graceful degradation).
      BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
      BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
      BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
    steps:
      # Boot token: the ORIGINAL app (pool slot 1). It stays the token the
      # sweep WRITES with — the receipts reconcile.py counts by
      # WORKER_BOT_LOGIN, the merge-sweep commits — and it is slot 1's
      # /rate_limit probe; the reads move to the selected pool app below.
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      # ---- Dispatch-pool reader selection (DRE-2013, wired here by DRE-4282) ----
      # verify.yml's shape, copied: mint a probe token per CONFIGURED pool app
      # (absent secrets skip the step and shrink the pool; continue-on-error so
      # a broken pool app can never fail a sweep), let dispatch_pool.py read
      # each bucket's quota-exempt /rate_limit and pick the app with the MOST
      # remaining, then mint the sweep's READ token from that app. The selector
      # only ever sees app ids and probe tokens, never keys; the mint below
      # maps the chosen slot to its secret pair explicitly and falls through to
      # the original app, so a repo without the new secrets is a single-app
      # pool behaving exactly as before.
      - name: Mint pool probe token (2)
        id: probe_2
        if: env.BUREAU_APP_ID_2 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_2 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_2 }}
      - name: Mint pool probe token (3)
        id: probe_3
        if: env.BUREAU_APP_ID_3 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_3 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_3 }}
      - name: Mint pool probe token (4)
        id: probe_4
        if: env.BUREAU_APP_ID_4 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_4 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_4 }}

      - name: Select dispatch-pool app
        id: pool
        env:
          BUREAU_APP_ID: ${{ secrets.BUREAU_APP_ID }}
          BUREAU_POOL_TOKEN: ${{ steps.app.outputs.token }}
          BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
          BUREAU_POOL_TOKEN_2: ${{ steps.probe_2.outputs.token }}
          BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
          BUREAU_POOL_TOKEN_3: ${{ steps.probe_3.outputs.token }}
          BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
          BUREAU_POOL_TOKEN_4: ${{ steps.probe_4.outputs.token }}
          # Deterministic fallback key on read failure: this run, so a re-run
          # of the same sweep picks the same slot.
          BUREAU_POOL_KEY: reconcile:${{ github.run_id }}
        run: |
          python3 .bureau-pipeline/scripts/dispatch_pool.py select >> "$GITHUB_OUTPUT"

      # Read token: minted from the SELECTED pool app. Explicit per-N map
      # (Actions can't index secrets dynamically); each clause yields '' when
      # not selected, so the chain always falls through to the original pair.
      - name: Mint read token (selected pool app)
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_ID_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_ID_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_ID_4
             || secrets.BUREAU_APP_ID }}
          private-key: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_PRIVATE_KEY_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_PRIVATE_KEY_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_PRIVATE_KEY_4
             || secrets.BUREAU_APP_PRIVATE_KEY }}

      - name: Sweep
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # The sweep's READS go out as the pool app selected above (DRE-4282):
          # reconcile.py's gh_read() swaps this in, the way gh_dispatch() swaps
          # in GH_DISPATCH_TOKEN. Its WRITES stay on GH_TOKEN — the receipts it
          # posts are counted by the worker's login, so the App that writes
          # them must be the App that login names.
          GH_READ_TOKEN: ${{ steps.reader.outputs.token }}
          # Workflow-dispatch needs actions:write, which the calling stub
          # grants to the workflow's own token — the App token gets HTTP 403
          # on the dispatch API (the silent DRE-1254 stall, 2026-06-12).
          # reconcile.py's gh_dispatch() swaps this in for `gh workflow run`.
          GH_DISPATCH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_WIP: ${{ inputs.max_wip }}
          # The operator's controls on Intake are NOT threaded here any more
          # (DRE-4141). The sweep moves no card out of Intake, so it reads no
          # hold, no window and no cap; `groomer.yml` threads the hold to the
          # one thing that still moves a card out of the lane. The three inputs
          # above stay declared for callers that still pass them, and a value
          # that reaches no environment is the whole of what "ignored" means.
          # WHY this pass was asked for and WHICH card it is about (DRE-3640),
          # threaded from the caller's inputs and never a literal here — a
          # scope baked into the shared channel would narrow every repo's
          # SCHEDULED sweep, which is the one pass that must stay full. Empty
          # on schedule/workflow_dispatch, which the sweep reads as a full
          # pass.
          SWEEP_REASON: ${{ inputs.sweep_reason }}
          SWEEP_CARD: ${{ inputs.sweep_card }}
        run: |
          # Cards carry `**Repo:** <slug>` — reconcile.py compares against the
          # lowercase repo basename.
          REPO_SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          export REPO_SLUG
          # The pass's output, kept (DRE-3640). Every line still flows to the
          # run log exactly as before; `tee` only keeps a copy so the spend
          # lines can be lifted out of it below. `pipefail` is what keeps a red
          # sweep red — without it `tee`'s zero would mask reconcile.py's exit
          # — and the status is carried PAST the summary rather than aborting
          # on it, because a failed pass is exactly when somebody wants to know
          # what the hour cost.
          set -o pipefail
          STATUS=0
          python3 .bureau-pipeline/scripts/reconcile.py 2>&1 | tee sweep.log || STATUS=$?
          # The sweep's own lines, verbatim: the `linear-budget:` trailer it
          # prints as it exits, and every `sweep-spend:` phase line. Reading a
          # pass's spend used to mean opening the run log, which at four passes
          # an hour nobody does. A pass that printed no trailer says so — a
          # blank page reads as "nothing was spent" when it means "unknown".
          BUDGET=$(grep '^linear-budget:' sweep.log || true)
          SPEND=$(grep '^sweep-spend:' sweep.log || true)
          {
            echo "### Reconcile sweep — spend"
            echo
            echo '```'
            if [ -n "$SPEND" ]; then printf '%s\n' "$SPEND"; fi
            if [ -n "$BUDGET" ]; then
              printf '%s\n' "$BUDGET"
            else
              echo "no linear-budget: line — the pass exited before its trailer, so this run's spend is unknown"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
