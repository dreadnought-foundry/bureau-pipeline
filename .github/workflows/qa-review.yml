# Critic agent: adversarially reviews every agent PR and posts a verdict in
# plain English (the CEO judges outcomes, not diffs). The verdict is advisory
# input to merge-gate.yml — the merge itself happens only when CI is green
# AND the verdict is APPROVE.
#
# Reusable workflow: concurrency + permissions live in the calling stub.
name: QA Review (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkouts (scripts, briefs,
          standards). REQUIRED since DRE-2689: a caller must pass the same
          ref it pins in `uses:`, or it runs channel workflow YAML over
          another ref's scripts — pinned to everything that counts refs,
          and not actually pinned (DRE-2026).
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: true
      # The critic mints its GitHub token from the qa-bot App, NOT the dispatch
      # bot (DRE-1921). The relay's repository_dispatch and the critic's review
      # API calls used to share the SAME bureau-bot installation, so they drew
      # down one 5,000/hr quota bucket together and exhausted it in lockstep
      # (the 2026-06-28 rate-limit incident). The qa-bot App is a SEPARATE
      # installation with its own independent quota, so card dispatch and code
      # review no longer compete. (qa-bot is also a non-author of agent PRs, so
      # its formal APPROVE review in sync_review_state.py now succeeds instead
      # of being rejected as a self-approval.)
      #
      # The dispatch-bot secrets came back for ONE call (DRE-2291): the
      # head-bound review check. The qa-bot App carries checks:READ
      # (`GET /apps/agent-bureau-qa-bot`, verified 2026-08-07), so its token
      # physically cannot create a check run; the dispatch App carries
      # checks:write. That is one API write per review, not the critic's
      # review workload, so the DRE-1921 quota split stands. They remain
      # optional here so a repo that has not provisioned them still passes
      # required-secret validation and still posts its verdict comment — the
      # mint step then fails loudly rather than failing silently.
      BUREAU_APP_ID:
        required: false
      BUREAU_APP_PRIVATE_KEY:
        required: false
      BUREAU_QA_APP_ID:
        required: true
      BUREAU_QA_APP_PRIVATE_KEY:
        required: true
      # Dispatch-pool workers (DRE-2013), wired in here by DRE-4282. The
      # critic's READS — the PR record, the compare record, the diff, the
      # files listing, the card context, the model's own reads — used to draw
      # on the qa-bot bucket alone (DRE-1921's split). That bucket is now the
      # pool's slot 1 for this workflow: the selector reads every bucket's
      # headroom and the reads go to the one with the most, which is the qa
      # bucket itself whenever it is the roomiest. The verdict COMMENT never
      # moves — merge-gate attributes it to the qa-bot. ALL optional: a repo
      # without these pairs reviews on the qa-bot App exactly as before.
      BUREAU_APP_ID_2:
        required: false
      BUREAU_APP_PRIVATE_KEY_2:
        required: false
      BUREAU_APP_ID_3:
        required: false
      BUREAU_APP_PRIVATE_KEY_3:
        required: false
      BUREAU_APP_ID_4:
        required: false
      BUREAU_APP_PRIVATE_KEY_4:
        required: false

jobs:
  review:
    # NO REVIEW POLICY LIVES HERE (DRE-2250). This gate decides only whether
    # the job may START; whether the critic actually reviews is decided in ONE
    # place, the "Decide review" step (should_review_pr.py).
    #
    # It used to list branch prefixes — agent/, repair/, dependabot/, and
    # anything containing DRE- — which was the same rule should_review_pr.py
    # already applied, written a second time in a second language. Two effects,
    # both bad:
    #
    #   • Anything the list didn't name (fix/…, model/…, db/…) never started
    #     the job, so no verdict was ever written and NOTHING went red. The PR
    #     just looked green. All five open fleet PRs sat that way on
    #     2026-07-29; the one reviewed by hand had three real defects.
    #   • The two copies drifted. DRE-2003: contains() here was
    #     case-insensitive, the Python regex was not, so a lowercase
    #     ops/dre-N- branch started the job and then decided review=false —
    #     a silent bypass that cost three re-pushed security PRs.
    #
    # Keep this gate MECHANICAL. A condition belongs here only if it must be
    # evaluated before the first step runs; anything about WHICH PRs deserve
    # review belongs in should_review_pr.py, where it can be unit-tested.
    #
    # DEPENDABOT SELF-SKIP (DRE-2067, leading conjunct) — mechanical, and the
    # reason this gate still exists at all: a pull_request run
    # triggered by dependabot[bot] gets GitHub's separate Dependabot secrets
    # store (empty for us), so the qa-bot token mint below crashes red with
    # zero review. DRE-2047 guarded only this repo's own stub — fleet stubs
    # call this reusable with `secrets: inherit` and no guard, so the skip
    # must live HERE, on the job `if` (the only point evaluated before the
    # mint; a false job `if` skips clean green/neutral). Actor-based, not
    # PR-author-based: the secrets store is keyed to the triggering actor —
    # a human pushing to a dependabot/ head has normal secrets and still
    # gets the event-driven review. The reconcile sweep's workflow_dispatch
    # (DRE-2047) is the real review route for dependabot PRs and passes the
    # event_name disjunct untouched. NOT pull_request_target — full secrets
    # are never attached to a dependabot-triggered event.
    if: >
      (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]')
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    # 65, raised from 25 with the file-list strategy (DRE-2466). A large
    # review deliberately takes more, smaller steps, and the budget has to
    # hold the WHOLE cycle this job can run — not just the first attempt:
    #
    #   attempt 1   150 turns × 7 s  = 17.5 min
    #   backoff     sleep 120        =  2.0 min   ("Back off before the
    #                                              critic retry", below)
    #   retry       200 turns × 7 s  = 23.3 min
    #                                  ────────
    #                                  42.8 min
    #
    # at the 7 s/turn upper end portico's COMPLETED reviews ran at — plus
    # roughly 15 minutes the turn arithmetic does not model: token minting,
    # two checkouts, should_review_pr and the compare-record fetch with its
    # own retry loop, context assembly, model selection, the verdict-posting
    # retry loop, and — on a PR carrying a `**Design:**` ref — "Render
    # affected screens" pulling an `npm ci` plus a chromium download first.
    # That is ~58 minutes; 65 leaves margin. (45 held the first attempt but
    # not the cycle, which is why this number is derived, not guessed.)
    #
    # A job that hits its timeout is CANCELLED, and a cancelled job skips
    # even its `always()` steps: no verdict comment, no head-bound check,
    # nothing for anyone to read — the exact #297 outcome this card exists
    # to remove, so it must not come back one size class up. The wall clock
    # is the real backstop on a runaway review, so it moves with the ceiling
    # rather than silently capping it.
    # tests/test_critic_size_strategy.py pins this against the turn budget
    # and the backoff sleep, so changing either re-opens the arithmetic.
    timeout-minutes: 65
    env:
      # The secrets context is not readable in a step-level `if:`, so the
      # dispatch-pool probe mints check slot PRESENCE via these job-env
      # mirrors (app ids only — NEVER keys). Empty ⇒ the probe is skipped
      # and the pool shrinks (DRE-2013 graceful degradation).
      BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
      BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
      BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
    steps:
      # Mint from the qa-bot App so the critic's GitHub calls draw from the
      # qa-bot installation's SEPARATE 5,000/hr quota — not the dispatch bot's
      # bucket the relay's repository_dispatch already consumes (DRE-1921).
      # Kept as id `app`: it is the token the VERDICT is posted with (the
      # qa-bot authorship merge-gate checks), the review decision's token, and
      # — since DRE-4282 — the pool's slot 1 and its /rate_limit probe. The
      # heavy reads after the decision run on the selected pool app below.
      - name: Mint qa-bot token (separate quota from relay dispatch)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_QA_APP_ID }}
          private-key: ${{ secrets.BUREAU_QA_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `path:` must stay under $GITHUB_WORKSPACE — actions/checkout refuses
      # anything else outright ("is not under") — so the checkout lands in the
      # PR's working tree and the NEXT step moves it out. Keeping it an
      # actions/checkout is deliberate: the ref threading this line carries is
      # what scripts/check_pipeline_ref.py enforces, and a hand-rolled `git
      # clone` would take this workflow out of that check's sight (DRE-2026).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      # DRE-3226: the pipeline the review RUNS ON leaves the pull request's
      # working tree, and every later step addresses it by the absolute path
      # exported here, once.
      #
      # The critic is asked to prove a PR's tests actually bite, which means
      # reverting files to `main` and running them — and on bureau-pipeline
      # PR #279 that experiment (a `git stash -u`, a `git clean -x`, a
      # checkout of a path containing the nested clone) took `.bureau-pipeline`
      # with it, because the pipeline's own checkout was sitting INSIDE the
      # tree it was experimenting on. The post-review step then ran
      # check_critic_result.py out of a directory that no longer existed and
      # the review died; the PR got "could not run (infra error)" for a critic
      # that had reviewed it fine. Nothing inside the repo can reach
      # $RUNNER_TEMP, so no command the critic runs in the repo root can do
      # this again — briefs/critic.md carries the other half, the two commands
      # it must not run there at all.
      #
      # WHAT STAYS BEHIND, and why it is not the checkout: a `uses: ./…` local
      # action is resolved under $GITHUB_WORKSPACE and `uses:` admits no
      # `${{ }}` expression, so the two composite actions this job runs from
      # the pinned channel cannot be addressed any other way. Only
      # `.github/actions` is put back — no scripts, no config, nothing any
      # step after the agent reads — and both `uses:` of it run before the
      # critic starts. The assembled agent-context.md joins it there because
      # that is where the agent is told to read it (one path, every workflow:
      # tests/test_assemble_context_wiring.py).
      - name: Move the pipeline checkout out of the PR's working tree
        id: pipeline
        run: |
          DEST="$RUNNER_TEMP/bureau-pipeline"
          rm -rf "$DEST"
          mv "$GITHUB_WORKSPACE/.bureau-pipeline" "$DEST"
          mkdir -p "$GITHUB_WORKSPACE/.bureau-pipeline/.github"
          # A release cut before the shared actions existed carries no
          # .github/actions, and the one step that `uses:` it is already
          # gated on the file being there (the node probe below). A missing
          # directory is that ref's answer, never a failed job.
          if [ -d "$DEST/.github/actions" ]; then
            cp -a "$DEST/.github/actions" \
                  "$GITHUB_WORKSPACE/.bureau-pipeline/.github/actions"
          fi
          # ONE export, read by every step below as $PIPELINE_DIR — including
          # the critic's own Bash tool, which is how its brief can name where
          # the pipeline's scripts are.
          echo "PIPELINE_DIR=$DEST" >> "$GITHUB_ENV"
          echo "pipeline scripts: $DEST (outside $GITHUB_WORKSPACE)"

      # Authoritative review gate (DRE-1888). A workflow_dispatch always
      # reviews (operator asked for it explicitly). For a PR event, the critic
      # runs iff the branch is an agent branch OR carries a linked card; a
      # chrome-only PR with no linked card is skipped here — every later step
      # is guarded on steps.decide.outputs.review so the job ends green-skip
      # without burning critic inference.
      # DRE-2340: the gate's own binding is also the ONE proof that a
      # re-review is pointless. When the latest qa-bot APPROVE carries a
      # content id equal to this head's, the critic has already read exactly
      # this diff — the head moved only because the gate merged the base in.
      # Portico PR #205 paid for that six times in 47 minutes. The records
      # come from GitHub (the comments listing, the compare record and the
      # PR's commit record — all three the gate reads, so the skip can
      # never be wider than the carry); a blip in any reads as "no proof"
      # and the review runs, so the expensive mistake stays the safe
      # direction.
      - name: Decide review
        id: decide
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          # The same App identity the verdict is posted under, so the
          # authorship filter here is the one merge-gate enforces.
          QA_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — reviewing on request"
            exit 0
          fi
          # Every read here is fail-SOFT: this step decides whether to
          # SPEND a review, and an API blip must degrade to "review it"
          # (the cheap mistake), never to a red run that reviews nothing.
          # `{}` / `[]` both yield no proof of a carry.
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid 2>/dev/null || true)
          BASE=$(gh pr view "$PR" --json baseRefName --jq .baseRefName 2>/dev/null || true)
          echo '{}' > /tmp/decide-compare.json
          if [ -n "$SHA" ] && [ -n "$BASE" ]; then
            gh api "repos/${{ github.repository }}/compare/$BASE...$SHA" > /tmp/decide-compare.json 2>/dev/null \
              || echo '{}' > /tmp/decide-compare.json
          fi
          # Same call shape merge-gate.yml uses, so the skip and the gate
          # read the same record and can never disagree about the standing
          # verdict. DRE-4139 made that shape a PAGINATED one at both ends:
          # unpaginated, both read GitHub's default 30 — the OLDEST 30 — and
          # a long PR's real verdict was invisible to each of them. Fixing
          # only the gate would have broken the promise in the line above.
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/issues/$PR/comments?per_page=100" \
            > /tmp/decide-comments.json 2>/dev/null \
            || echo '[]' > /tmp/decide-comments.json
          # The gate's carry condition 4: the reviewed commit is still in
          # THIS PR's own commit record. Same call shape merge-gate.yml
          # uses (`per_page=100`), because the skip must be a strict subset
          # of the carry — skipping a review the gate then refuses to
          # honour deadlocks the PR with nobody left to order one. `[]`
          # blip substitute = no proof = review, this step's direction.
          gh api "repos/${{ github.repository }}/pulls/$PR/commits?per_page=100" > /tmp/decide-commits.json 2>/dev/null \
            || echo '[]' > /tmp/decide-commits.json
          set +e
          OUT=$(python3 "$PIPELINE_DIR"/scripts/should_review_pr.py "$HEAD_REF" \
            --comments-file /tmp/decide-comments.json \
            --compare-file /tmp/decide-compare.json \
            --pr-commits-file /tmp/decide-commits.json \
            --qa-login "$QA_LOGIN")
          set -e
          echo "$OUT"
          echo "$OUT" | grep -E '^(review|carried_sha|content_id)=' >> "$GITHUB_OUTPUT" || true
          # The head the decision was made about — the skip path re-publishes
          # the review check against exactly this commit.
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"

      # ---- Dispatch-pool reader selection (DRE-2013, wired here by DRE-4282) ----
      # verify.yml's shape, copied, with ONE difference: slot 1 is the qa-bot
      # App (the `app` token above), not the dispatch App — DRE-1921 gave the
      # critic its own bucket and that bucket stays the fallback; the pool
      # adds three more. Mint a probe token per CONFIGURED pool app (absent
      # secrets skip the step and shrink the pool; continue-on-error so a
      # broken pool app can never fail a review), let dispatch_pool.py read
      # each bucket's quota-exempt /rate_limit and pick the app with the MOST
      # remaining, then mint the review's READ token from it. Gated on the
      # review decision, like verify's scope gate: a skipped review must not
      # spend three mints on a pool it will never use. The selector only ever
      # sees app ids and probe tokens, never keys; the mint below maps the
      # chosen slot to its secret pair explicitly and falls through to the
      # qa-bot pair, so a repo without the new secrets is a single-app pool
      # behaving exactly as before.
      - name: Mint pool probe token (2)
        id: probe_2
        if: steps.decide.outputs.review == 'true' && env.BUREAU_APP_ID_2 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_2 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_2 }}
      - name: Mint pool probe token (3)
        id: probe_3
        if: steps.decide.outputs.review == 'true' && env.BUREAU_APP_ID_3 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_3 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_3 }}
      - name: Mint pool probe token (4)
        id: probe_4
        if: steps.decide.outputs.review == 'true' && env.BUREAU_APP_ID_4 != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_4 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_4 }}

      - name: Select dispatch-pool app
        id: pool
        if: steps.decide.outputs.review == 'true'
        env:
          # Slot 1 IS the qa-bot App here (see above) — the selector's names
          # are positional, not the App's.
          BUREAU_APP_ID: ${{ secrets.BUREAU_QA_APP_ID }}
          BUREAU_POOL_TOKEN: ${{ steps.app.outputs.token }}
          BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
          BUREAU_POOL_TOKEN_2: ${{ steps.probe_2.outputs.token }}
          BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
          BUREAU_POOL_TOKEN_3: ${{ steps.probe_3.outputs.token }}
          BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
          BUREAU_POOL_TOKEN_4: ${{ steps.probe_4.outputs.token }}
          # Deterministic fallback key on read failure: the PR, so a re-review
          # of the same PR picks the same slot instead of scattering.
          BUREAU_POOL_KEY: review:${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          python3 "$PIPELINE_DIR"/scripts/dispatch_pool.py select >> "$GITHUB_OUTPUT"

      # Read token: minted from the SELECTED pool app. Explicit per-N map
      # (Actions can't index secrets dynamically); each clause yields '' when
      # not selected, so the chain always falls through to the qa-bot pair.
      - name: Mint read token (selected pool app)
        id: reader
        if: steps.decide.outputs.review == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_ID_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_ID_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_ID_4
             || secrets.BUREAU_QA_APP_ID }}
          private-key: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_PRIVATE_KEY_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_PRIVATE_KEY_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_PRIVATE_KEY_4
             || secrets.BUREAU_QA_APP_PRIVATE_KEY }}

      - name: Resolve PR
        if: steps.decide.outputs.review == 'true'
        id: pr
        env:
          # Reads (the PR record, the compare record) — the pool-selected
          # token (DRE-4282).
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          PR=${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          CARD=$(printf '%s' "$BRANCH" | grep -oiE 'DRE-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          echo "card=$CARD" >> "$GITHUB_OUTPUT"
          # DRE-1990: capture the head commit the critic is about to review.
          # The verdict comment embeds it (`VERDICT: <X> @<sha>`) so
          # merge-gate can refuse to apply the verdict to any LATER commit.
          # Captured BEFORE the review starts — fail-closed: if code lands
          # mid-review, the embedded SHA is already behind the new head and
          # the gate holds for a fresh review instead of merging code the
          # critic never saw.
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # DRE-3005 rule 3: the moment this review's read of the pull
          # request BODY begins. The critic reads the description through
          # `gh pr view` during the run, and a description can be corrected
          # while the review is in flight — portico #407's review
          # snapshotted the body at 06:41, the author corrected it at
          # 06:43, and the verdict posted at 06:48 demanding a change that
          # had been in the body for five minutes. The race is not fixable
          # (a review takes minutes) but a race with a signal costs a
          # sentence instead of ten hours, so the verdict says which
          # snapshot it read and the post step flags an edit that landed
          # after it. Stamped by the WORKFLOW, never by the agent: the
          # honesty of the agent's own read is the thing under audit.
          echo "body_read_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # DRE-2340: the CONTENT this review is about to read — the
          # three-dot diff of the SAME sha captured above, hashed by
          # scripts/verdict_content.py. Fetched here rather than reused
          # from the decide step so the id can never describe a different
          # commit than the one the verdict binds. No id (a truncated
          # 300-file record, or an API blip → `{}`) means the verdict binds
          # the SHA alone, exactly as before this card.
          BASE=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          gh api "repos/${{ github.repository }}/compare/$BASE...$SHA" > /tmp/qa-compare.json 2>/dev/null \
            || echo '{}' > /tmp/qa-compare.json
          CONTENT=$(python3 "$PIPELINE_DIR"/scripts/verdict_content.py --compare-file /tmp/qa-compare.json 2>/dev/null || true)
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"
          # DRE-2466: the PR's own size totals, for the review-strategy step
          # below. The compare record above already carries per-file counts
          # but caps at 300 files and does not paginate (verdict_content.py
          # documents the same cap), and under-counting is the direction
          # that sends a 17k-line diff down the one-pass path that cannot
          # review it. One extra field read on a call this step already
          # makes; a blip leaves `{}` and the sizing degrades to the compare
          # record alone.
          gh pr view "$PR" --json changedFiles,additions,deletions > /tmp/qa-size.json 2>/dev/null \
            || echo '{}' > /tmp/qa-size.json

      # ── Review-strategy stage (DRE-2466) ──────────────────────────────────
      # A pull request four times larger than anything the critic has ever
      # reviewed used to get the same review a two-file change gets: one
      # exhaustive `gh pr diff` pass, under the prompt's standing order to
      # examine the ENTIRE diff. Portico PR #297 (118 files, +16,909/-628)
      # produced four executions across two run attempts — every one
      # `subtype: success`, `is_error: false`, none near its turn ceiling,
      # all finishing in 2-3.5 minutes — for $12.40 and no verdict file. The
      # PR then merged with this check red and no review at all.
      #
      # WHY scale breaks it is NOT established and this step assumes nothing
      # about it (DRE-2465's gate diagnostics will decide that on the next
      # occurrence). What is established is that scale is the trigger, so the
      # STRATEGY changes with size:
      #   • standard  → today's behavior, byte for byte
      #   • large     → review from the changed-file list with targeted
      #                 per-file reads, exhaustive over the files actually
      #                 reviewed, turn ceiling raised to match
      #   • oversized → decline honestly, name the size, ask for a split, and
      #                 spend NO inference (the second threshold only)
      #
      # The signal is free: /tmp/qa-compare.json is already fetched above for
      # the content id, and /tmp/qa-size.json is one extra field read on a
      # `gh pr view` the same step already makes. Thresholds and their
      # derivation from this repo's own review history live in
      # scripts/pr_size_strategy.py; tests/test_critic_size_strategy.py pins
      # the selection either side of both of them.
      #
      # The `||` fallback is load-bearing: claude_args interpolates
      # max_turns, so an unwritten output would hand the action a bare
      # `--max-turns`. The script itself never exits non-zero, and this is
      # the belt to that pair of braces.
      - name: Size the diff and pick the review strategy
        id: size
        if: steps.decide.outputs.review == 'true'
        env:
          # The per-file STATUSES (DRE-3995): above the compare record's
          # 300-file cap the script reads them from the paginated PR files
          # API, which needs a token. Below it, no call is made. A read, so
          # the pool-selected token (DRE-4282).
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          python3 "$PIPELINE_DIR"/scripts/pr_size_strategy.py \
            --compare-file /tmp/qa-compare.json \
            --pr-json-file /tmp/qa-size.json \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr.outputs.number }}" \
          || {
            echo "::warning::PR sizing failed — falling back to the standard one-pass review"
            {
              echo "strategy=standard"
              echo "files=0"
              echo "lines=0"
              echo "review_files=0"
              echo "review_lines=0"
              echo "removed_files=0"
              echo "removed_lines=0"
              echo "max_turns=80"
              echo "retry_max_turns=120"
            } >> "$GITHUB_OUTPUT"
          }

      # Assemble the critic's context = the standards it reviews AGAINST
      # (engineering + architecture) plus the comms standard for its verdict
      # voice (DRE-1646) — plus briefs/critic.md, the standing facts about the
      # critic's own position that a run cannot re-derive (DRE-3084, and
      # DRE-3226's rule about what its experiments may not run).
      # assemble_context.py reads the files from this checkout at run time, so
      # a `@main` standards edit reaches the critic on its next run with no
      # workflow change. Shared by both critic attempts below.
      #
      # `--root "$PIPELINE_DIR"` is load-bearing (DRE-4158). The script's
      # default root is the in-tree `.bureau-pipeline`, which the move above
      # emptied of everything but the stub actions — so RUNNING the script
      # from $PIPELINE_DIR while letting it READ from its default killed every
      # review of a bureau-pipeline PR from the hour DRE-3226 merged
      # (`FileNotFoundError: '.bureau-pipeline/standards/comms.md'`). Only the
      # OUTPUT belongs in the tree: the move step's `mkdir -p` guarantees the
      # directory, and the agent is told to read the file there.
      # tests/test_critic_context_root.py executes this block as written.
      - name: Assemble critic context
        id: ctx
        if: steps.decide.outputs.review == 'true'
        run: |
          python3 "$PIPELINE_DIR"/scripts/assemble_context.py assemble critic \
            --root "$PIPELINE_DIR" \
            > .bureau-pipeline/agent-context.md
          echo "assembled $(wc -l < .bureau-pipeline/agent-context.md) lines of critic context"
          # DRE-3226: keep the durable copy outside the working tree. The
          # agent is pointed at the in-tree path — one path across every
          # workflow — and attempt 1 is the one thing that can remove it, so
          # the retry restores this copy rather than reviewing blind.
          cp .bureau-pipeline/agent-context.md "$PIPELINE_DIR/agent-context.md"

      # ── Visual-QA stage (DRE-1481, layer 3b of DRE-1477) ──────────────────
      # When the PR's card has a **Design:** ref AND the PR changed UI, render
      # the affected screen(s) with the console harness (DRE-1480) and hand the
      # critic both the design PNG and the fresh screenshot to compare. This
      # GATES merges, so every branch here is conservative:
      #   • no **Design:** ref / non-UI change  → SKIP (never block)
      #   • harness or render failure           → NON-FATAL note (never block)
      #   • when in doubt                        → SKIP
      # The whole stage is best-effort: its product is just a `context` string
      # injected into the critic prompt. It cannot fail the job (continue-on-
      # error + a guaranteed fallback context), so it can never wedge the gate.
      - name: Plan visual QA
        id: vqplan
        # DRE-2466: nothing downstream of an oversized PR runs, and this
        # stage can pull an npm install + a browser download behind it. A
        # fast failure that first spends five minutes rendering screens is
        # not a fast failure.
        if: steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized'
        continue-on-error: true
        env:
          # Reads — the pool-selected token (DRE-4282).
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR: ${{ steps.pr.outputs.number }}
          CARD: ${{ steps.pr.outputs.card }}
        run: |
          set +e
          mkdir -p /tmp/vqa
          # The card description is the AUTHORITATIVE **Design:** source. The PR
          # body is agent-authored and not guaranteed to quote the ref verbatim,
          # so we read the live card and also scan the PR body as a backstop.
          gh pr view "$PR" --json body --jq .body > /tmp/vqa/pr-body.txt 2>/dev/null || true
          : > /tmp/vqa/card.txt
          if [ -n "$CARD" ]; then
            python3 "$PIPELINE_DIR"/scripts/linear_ops.py description "$CARD" > /tmp/vqa/card.txt 2>/dev/null || : > /tmp/vqa/card.txt
          fi
          # Changed files vs the PR base, repo-root-relative.
          gh pr diff "$PR" --name-only > /tmp/vqa/changed.txt 2>/dev/null || : > /tmp/vqa/changed.txt
          # The screen map is the harness's own contract (single source of truth).
          MJS=console/web/scripts/visual-qa/screens.mjs
          python3 "$PIPELINE_DIR"/scripts/visual_qa_plan.py \
            --card-text-file /tmp/vqa/card.txt \
            --pr-body-file /tmp/vqa/pr-body.txt \
            --changed-file /tmp/vqa/changed.txt \
            --screens-mjs "$MJS" > /tmp/vqa/plan.json 2>/dev/null
          # Any failure above → emit a safe skip plan so the gate degrades, never blocks.
          if [ ! -s /tmp/vqa/plan.json ] || ! python3 -c "import json;json.load(open('/tmp/vqa/plan.json'))" 2>/dev/null; then
            echo '{"run": false, "reason": "visual-QA planner unavailable — stage skipped (degrade, no block)"}' > /tmp/vqa/plan.json
          fi
          RUN=$(python3 -c "import json;print(json.load(open('/tmp/vqa/plan.json')).get('run') is True)")
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "plan: $(cat /tmp/vqa/plan.json)"

      # THE CONSUMER'S NODE, BEFORE ITS npm (DRE-3248). The render below runs
      # the consumer's own screenshot harness in its `console/web`, and that
      # project declares which node it needs. There used to be no setup-node
      # in front of it at all, so it ran on whatever the hosted runner
      # shipped: when the runner default fell to v22 under a project
      # requiring `>=24 <25`, `npm ci` died at EBADENGINE before a single
      # screenshot, the stage degraded, and the design-fidelity verdict was a
      # skip wearing green. One River's Phase 2 proof (DRE-3066) painted five
      # screens red and every one of them went uncompared.
      #
      # The version is READ FROM THE CONSUMER, never written here — a second
      # copy of the number is the same defect one release later.
      - name: Resolve the consumer's node version
        id: vqnode
        if: steps.decide.outputs.review == 'true' && steps.vqplan.outputs.run == 'True'
        continue-on-error: true
        env:
          # The shared node plumbing (DRE-2550) comes out of the pipeline
          # checkout, which already threads pipeline_ref — so a caller pinned
          # to a channel gets that channel's action. A release cut before the
          # action existed carries no action.yml, and a `uses:` of a path that
          # is not there is a step failure with nothing to read; the setup step
          # is gated on this file so that degrades like every other branch of
          # this stage instead.
          #
          # DRE-3226: in-tree on purpose, and the ONLY correct path here — it
          # is the file the `uses: ./…` below actually loads, and a local
          # action is resolved under $GITHUB_WORKSPACE. Probing the copy
          # outside the tree would answer for a file the runner never reads.
          NODE_ACTION: .bureau-pipeline/.github/actions/setup-node-cached/action.yml
        run: |
          set +e
          python3 "$PIPELINE_DIR"/scripts/consumer_node.py console/web \
            > /tmp/vqa/node.txt 2> /tmp/vqa/node.err
          RC=$?
          cat /tmp/vqa/node.txt
          cat /tmp/vqa/node.err
          if [ "$RC" -ne 0 ]; then
            echo "setup=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$NODE_ACTION" ]; then
            echo "setup=false" >> "$GITHUB_OUTPUT"
            echo "the pipeline checkout at this ref carries no shared node action"
            exit 0
          fi
          # Only the keys the script declares reach the step outputs — a
          # consumer file cannot add a line of its own choosing here.
          grep -E '^(setup|version|source|node-version|node-version-file)=' \
            /tmp/vqa/node.txt >> "$GITHUB_OUTPUT"

      - name: Set up the consumer's node
        id: vqsetup
        if: steps.decide.outputs.review == 'true' && steps.vqnode.outputs.setup == 'true'
        # Best-effort like the rest of this stage: a node that cannot be set
        # up degrades the visual check (and now says so on the verdict), it
        # never wedges the gate.
        continue-on-error: true
        # DRE-2550's shared node plumbing, from the pinned pipeline checkout.
        # It also does the `npm ci` — keyed on the lockfile AND the node
        # identity, and skipped outright on a cache hit.
        uses: ./.bureau-pipeline/.github/actions/setup-node-cached
        with:
          working-directory: console/web
          node-version: ${{ steps.vqnode.outputs.node-version }}
          node-version-file: ${{ steps.vqnode.outputs.node-version-file }}

      - name: Render affected screens
        id: vqshots
        # Only when the planner said run; best-effort, never fails the job.
        if: steps.decide.outputs.review == 'true' && steps.vqplan.outputs.run == 'True'
        continue-on-error: true
        env:
          # Force the harness to dodge live network even if a screen route would.
          CI: "true"
          # Through env, never interpolated into the shell line — these are
          # derived from files in the CONSUMER's repository.
          NODE_READY: ${{ steps.vqnode.outputs.setup }}
          NODE_SETUP: ${{ steps.vqsetup.outcome }}
          NODE_DECLARED: ${{ steps.vqnode.outputs.version }}
          NODE_SOURCE: ${{ steps.vqnode.outputs.source }}
        run: |
          set +e
          SCREENS=$(python3 -c "import json;print(','.join(json.load(open('/tmp/vqa/plan.json')).get('screens',[])))")
          echo "rendering screens: $SCREENS"
          # The node this actually renders on, next to the version the
          # consumer asked for. A silent mismatch here is the whole defect.
          echo "[vqnode] runner node: $(node --version 2>/dev/null || echo none)" \
               "· consumer declares: ${NODE_DECLARED:-none} (${NODE_SOURCE:-no declaration})"
          STATUS=degraded
          NOTE="harness did not run"
          # NOTE reaches the verdict, so it stays pipeline-authored: consumer
          # text belongs in the log line above, not in a string this workflow
          # later re-expands.
          if [ "$NODE_READY" != "true" ]; then
            STATUS=degraded
            NOTE="the consumer's node version could not be read from console/web (see logs)"
          elif [ "$NODE_SETUP" != "success" ]; then
            STATUS=degraded
            NOTE="the consumer's node could not be set up, so nothing was rendered (see logs)"
          elif [ -n "$SCREENS" ]; then
            ( cd console/web \
              && npx playwright install --with-deps chromium \
              && npm run shots -- "$SCREENS" ) > /tmp/vqa/shots.log 2>&1
            RC=$?
            if [ "$RC" -eq 0 ]; then
              # Confirm each expected render actually exists and is non-empty.
              MISSING=""
              for k in $(echo "$SCREENS" | tr ',' ' '); do
                f="console/design/images/_renders/$k.png"
                if [ ! -s "$f" ]; then MISSING="$MISSING $k"; fi
              done
              if [ -z "$MISSING" ]; then
                STATUS=ok; NOTE=""
              else
                STATUS=degraded; NOTE="no render produced for:$MISSING"
              fi
            else
              STATUS=degraded; NOTE="screenshot harness exited $RC (see logs)"
            fi
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "note=$NOTE" >> "$GITHUB_OUTPUT"
          echo "[vqshots] status=$STATUS note=$NOTE"
          tail -40 /tmp/vqa/shots.log 2>/dev/null || true

      - name: Build critic visual context
        id: visual
        if: always() && !cancelled() && steps.decide.outputs.review == 'true'
        continue-on-error: true
        run: |
          set +e
          [ -s /tmp/vqa/plan.json ] || echo '{"run": false, "reason": "no plan"}' > /tmp/vqa/plan.json
          STATUS="${{ steps.vqshots.outputs.status }}"
          [ -n "$STATUS" ] || STATUS=degraded
          NOTE="${{ steps.vqshots.outputs.note }}"
          # Map each screen key to its render path for the context block.
          RENDERED=$(python3 -c "import json;print(' '.join(f'{k}=console/design/images/_renders/{k}.png' for k in json.load(open('/tmp/vqa/plan.json')).get('screens',[])))")
          python3 "$PIPELINE_DIR"/scripts/visual_qa_context.py \
            --plan-file /tmp/vqa/plan.json \
            --render-status "$STATUS" \
            --render-note "$NOTE" \
            --rendered $RENDERED > /tmp/vqa/context.txt 2>/dev/null
          # Guaranteed fallback: if context generation failed, emit a no-block
          # note. It is still not allowed to read green (DRE-3248) — a PR whose
          # planner said RUN and whose harness did not deliver gets the same
          # "did not run" line the context block would have carried.
          if [ ! -s /tmp/vqa/context.txt ]; then
            if [ "${{ steps.vqplan.outputs.run }}" = "True" ] && [ "$STATUS" != "ok" ]; then
              printf '%s\n' \
                "VISUAL QA — THE COMPARISON DID NOT HAPPEN, and its context could not be built." \
                "Your verdict Summary MUST carry this line, verbatim, on its own line:" \
                "    Visual check did not run: the screenshot harness produced no render" \
                "Do NOT raise a visual-comparison finding and do NOT block on it — but do NOT report the design check as done or not applicable either." \
                > /tmp/vqa/context.txt
            else
              echo "VISUAL QA: not available for this PR. Do NOT raise any visual-comparison finding and do NOT block on it." > /tmp/vqa/context.txt
            fi
          fi
          # Expose as a multiline output for the prompt blocks below.
          {
            echo "context<<VQA_EOF"
            cat /tmp/vqa/context.txt
            echo "VQA_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Repair-PR stage (DRE-1927, adr-red-main-auto-repair guardrail 1) ──
      # A repair/<failing-sha> PR is an agent's fix for a broken main — the
      # critic must judge it against the ORIGINAL failing log, with every
      # test-tree edit mechanically flagged as a mandatory finding
      # (test-gutting is the #1 danger the ADR names). repair_context.py is
      # inert for non-repair branches, degrades to a maximum-suspicion
      # instruction when the log can't be fetched, and writes its output
      # under a random heredoc delimiter (log text must never terminate the
      # output block). The log listing/read needs actions:read, which the
      # qa-bot App deliberately lacks — that ONE read uses the workflow's
      # own token, and a blip degrades toward suspicion, never past it.
      - name: Build repair-PR review context
        id: repair
        if: steps.decide.outputs.review == 'true'
        continue-on-error: true
        env:
          # Reads — the pool-selected token (DRE-4282).
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          RUNS_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e
          mkdir -p /tmp/repair
          BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          gh pr diff "$PR" --name-only > /tmp/repair/changed.txt 2>/dev/null || : > /tmp/repair/changed.txt
          : > /tmp/repair/original-failure.log
          NOTE=""
          # The failing head SHA is encoded in the branch name itself —
          # deterministic, no trust in the PR body. Two shapes since DRE-3533:
          # repair/DRE-<n>-<sha12> (the card the repair filed) and the cardless
          # repair/<sha> fallback.
          SHA=$(printf '%s' "$BRANCH" | grep -oiE '^repair/(DRE-[0-9]+-)?[0-9a-f]{12}([0-9a-f]{28})?' | grep -oiE '[0-9a-f]{12}([0-9a-f]{28})?$' || true)
          # An ABBREVIATED sha is not a head_sha the runs API answers — it
          # returns 0 runs, silently, and the critic would review a repair with
          # no failing log and maximum suspicion. The commits API does accept
          # an abbreviation, so resolve it to the whole sha first.
          if [ -n "$SHA" ] && [ ${#SHA} -lt 40 ]; then
            FULL=$(GH_TOKEN="$RUNS_TOKEN" gh api \
              "repos/${{ github.repository }}/commits/$SHA" --jq .sha 2>/dev/null || true)
            if [ -n "$FULL" ] && [ "$FULL" != "null" ]; then
              SHA="$FULL"
            else
              NOTE="could not resolve abbreviated commit $SHA"
              SHA=""
            fi
          fi
          if [ -n "$SHA" ]; then
            RUN_ID=$(GH_TOKEN="$RUNS_TOKEN" gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&status=failure&per_page=20" \
              --jq "first(.workflow_runs[] | select(.head_branch == \"$DEFAULT_BRANCH\")) | .id" 2>/dev/null)
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              GH_TOKEN="$RUNS_TOKEN" gh run view "$RUN_ID" --log-failed \
                --repo ${{ github.repository }} > /tmp/repair/original-failure.log 2>/dev/null \
                || NOTE="log fetch failed for run $RUN_ID"
            else
              NOTE="no failed default-branch run found for $SHA"
            fi
          fi
          python3 "$PIPELINE_DIR"/scripts/repair_context.py \
            --branch "$BRANCH" \
            --changed-file /tmp/repair/changed.txt \
            --log-file /tmp/repair/original-failure.log \
            --log-note "$NOTE"

      # ── Card-context stage (DRE-2052) ─────────────────────────────────────
      # The prompt used to interpolate the card ref raw — for a cardless PR
      # (dependabot/**, repair/**) that rendered as "It implements Linear
      # card ." and pointed the critic's card-criteria instructions at the
      # PR body, which for dependabot is machine-generated release notes,
      # potentially hundreds of KB of untrusted changelog (the routed
      # agent-bureau reviews died is_error on both attempts, 2026-07-11;
      # bureau-pipeline's small-body actions bumps survived the same
      # dispatch). review_card_context.py builds the block deterministically
      # per PR shape: card PRs keep today's sentence; cardless dependabot
      # PRs get an explicit deps-policy review with the body sanitized,
      # size-capped, and fenced (DRE-1996 discipline); repair and other
      # cardless shapes are stated plainly and card bookkeeping no-ops.
      # Inputs ride env only — nothing agent-influenced is interpolated
      # into this script, so it is also executable verbatim by the tests.
      # ── Act-registry consumer receipt (DRE-3091) ──────────────────────────
      # `config/pipeline-acts.json` is a contract the console reads, and twice
      # in twelve hours a PR declaring an act the console did not know was
      # approved, merged, and broke every open PR in agent-bureau (DRE-3081,
      # DRE-3090). The critic had no way to see it. These two steps put the
      # producer-side guard's result in front of it before it approves.
      #
      # The files list decides, not the repo name: only bureau-pipeline carries
      # this file, so a product repo's review never reaches the mint.
      - name: Does this PR change the act registry?
        id: actsreg
        if: steps.decide.outputs.review == 'true'
        env:
          # A read — the pool-selected token (DRE-4282).
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr view "$PR" --json files --jq '.files[].path' \
            > /tmp/cardctx-changed.txt 2>/dev/null || : > /tmp/cardctx-changed.txt
          if grep -qxF 'config/pipeline-acts.json' /tmp/cardctx-changed.txt; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "this PR changes the act registry — the console's ACTS will be read"
          fi

      # Best effort BY DESIGN, exactly as harness.yml's console mint is: this
      # is another repository and another installation, and a mint that cannot
      # happen must cost the receipt paragraph, never the whole review. When
      # the token is empty the guard reports SKIPPED with the reason and the
      # critic reads that instead of a verdict it cannot trust.
      - name: Mint console token (act-registry receipt — best effort)
        id: console
        if: steps.actsreg.outputs.touched == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: agent-bureau

      - name: Build card review context
        id: cardctx
        if: steps.decide.outputs.review == 'true'
        env:
          # Reads (the thread, the refutations) — the pool-selected token
          # (DRE-4282).
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          CARD: ${{ steps.pr.outputs.card }}
          # DRE-3091: empty on every review that is not about the act registry,
          # which is every review outside this repo.
          BUREAU_CONSOLE_TOKEN: ${{ steps.console.outputs.token }}
          # DRE-3084: the commit this review is about to judge, so a
          # refutation is read back for THIS head and never for an older one.
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName || true)
          gh pr view "$PR" --json body --jq .body > /tmp/cardctx-pr-body.txt 2>/dev/null \
            || : > /tmp/cardctx-pr-body.txt
          # DRE-3084 — the refutation, when there is one. The fix agent
          # answered a blocking finding on this exact commit with evidence it
          # could read and this reviewer could not (the live card — no Linear
          # key here, on purpose — a test run, the merge base) and pushed
          # nothing. It reaches the prompt through the SAME builder, fence,
          # sanitizer and size cap the PR body does, because it is agent text
          # written while reading an attacker-authored diff.
          #
          # Worker-bot authored ONLY (DRE-1995) and bound to this head: an
          # unfiltered read would let any commenter write into the critic's
          # context, and an unbound one would replay a settled dispute onto a
          # commit nobody contested. Fail-soft in both directions — a comments
          # blip leaves the file empty and the review runs exactly as it does
          # today.
          : > /tmp/cardctx-refutation.txt
          SHA8=${HEAD_SHA:0:8}
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            > /tmp/cardctx-comments.json 2>/dev/null \
            || echo '[]' > /tmp/cardctx-comments.json
          # `// empty` and not `// ""`: a no-match must leave a ZERO-byte file,
          # or the `-s` test below reads jq's trailing newline as a refutation
          # and every ordinary review claims to be a re-review.
          jq -r --arg sha8 "$SHA8" '[add[] | select(.user.login == "agent-bureau-bot[bot]") | select(.body | contains("refuted-finding @" + $sha8))] | last | .body // empty' \
            < /tmp/cardctx-comments.json > /tmp/cardctx-refutation.txt 2>/dev/null \
            || : > /tmp/cardctx-refutation.txt
          if [ -s /tmp/cardctx-refutation.txt ]; then
            echo "refuted=true" >> "$GITHUB_OUTPUT"
            echo "re-review after refutation: found a contested finding on $SHA8"
          fi
          # DRE-3091 — the act-registry consumer check, over THIS PR's registry
          # (the `.` checkout is the head; $PIPELINE_DIR is the channel and
          # would answer for main, which is the very state this PR changes).
          # Writes an empty file when the PR does not touch the registry, and
          # never exits non-zero: the receipt is not a gate, the tests.yml job
          # is.
          : > /tmp/cardctx-acts.txt
          python3 "$PIPELINE_DIR"/scripts/check_act_consumers.py context \
            --changed-files /tmp/cardctx-changed.txt \
            --registry config/pipeline-acts.json \
            --out /tmp/cardctx-acts.txt || : > /tmp/cardctx-acts.txt
          python3 "$PIPELINE_DIR"/scripts/review_card_context.py \
            --card "$CARD" \
            --branch "$BRANCH" \
            --pr-body-file /tmp/cardctx-pr-body.txt \
            --refutation-file /tmp/cardctx-refutation.txt \
            --acts-consumer-file /tmp/cardctx-acts.txt

      # Model selection for the critic (DRE-2316 / DRE-2317). This step exists
      # because the critic used to carry a pinned Sonnet id twice in this file:
      # nothing a human could edit changed it, and the agent registry could not
      # see it. The id now comes from config/models.yaml (agent `critic`, the
      # ADVISORY ladder) through the SAME availability-probing ladder walk the
      # build agents use — the config is a file in the pipeline checkout
      # ($PIPELINE_DIR, moved out of the working tree by DRE-3226), never a
      # runtime lookup (these runners hold no cloud credentials).
      #
      # The critic is ADVISORY, so it gets the STRONGEST model we run. It gates
      # every unattended merge in a pipeline where no human reads a diff: a
      # build failure is loud, a shallow review is silent. Advisory work is
      # bounded (one review per PR), which is what makes the strongest model
      # affordable — it is never on the high-volume build path.
      #
      # --explain-file records WHY anything above the chosen model was skipped.
      # If the critic ever falls off the strongest model the note starts with
      # DEGRADED and this step raises a ::warning:: — a silently weakened critic
      # is precisely the failure DRE-2317 exists to prevent.
      #
      # A SONNET-5 BUILD IS NEVER REVIEWED BY SONNET 5 (DRE-3880). Since
      # 2026-09-16 `claude-sonnet-5` tops the advisory ladder AND backs the
      # workhorse one, so the critic can no longer assume its own ladder is
      # disjoint from the build path — the separation is bought HERE, per pull
      # request. `build-model` reads the model this card's last attempt ran on
      # out of its own `model-attempt:` heartbeat, and `--built-on` hands it to
      # the ladder walk, which takes that rung off this run.
      #
      # A card we cannot read is `--built-on-unknown`, which bars every
      # declared overlap: absence of evidence that the build ran on something
      # else is not evidence that it did, and "never" has to survive a Linear
      # blip. The substitute is DATA (config/models.yaml `review_separation`),
      # never a literal here — a pinned id in a workflow is drift by
      # construction.
      - name: Select model
        id: model
        if: steps.decide.outputs.review == 'true'
        env:
          # The probe authenticates with the same CLAUDE token the critic uses.
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Reads the card's own attempt heartbeat (DRE-3880) — see the run
          # block. This is the SELECT step, not the critic's agent step: the
          # critic itself is still denied Linear on purpose (DRE-2052/2696).
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CARD: ${{ steps.pr.outputs.card }}
        run: |
          WHY_FILE="$RUNNER_TEMP/model-why.txt"
          BUILT_ON=""
          if [ -n "$CARD" ] && python3 "$PIPELINE_DIR"/scripts/linear_ops.py \
               dump-comments "$CARD" > "$RUNNER_TEMP/card-thread.json"; then
            BUILT_ON=$(python3 \
              "$PIPELINE_DIR"/scripts/model_fallback.py build-model \
              "$RUNNER_TEMP/card-thread.json")
          fi
          if [ -n "$BUILT_ON" ]; then
            SEPARATION_ARG="--built-on $BUILT_ON"
          else
            # No card, no thread, or no heartbeat we recognise — fail CLOSED.
            SEPARATION_ARG="--built-on-unknown"
          fi
          # shellcheck disable=SC2086 # deliberate word split: one flag or two
          MODEL=$(python3 "$PIPELINE_DIR"/scripts/model_fallback.py select critic \
            $SEPARATION_ARG \
            --explain-file "$WHY_FILE")
          WHY=$(cat "$WHY_FILE")
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "selected model: $MODEL (agent: critic)"
          echo "$WHY" >> "$GITHUB_STEP_SUMMARY"
          # Never silent: an advisory role that did not get the STRONGEST
          # model is the silently-weakened critic DRE-2317 exists to prevent.
          case "$WHY" in DEGRADED*) echo "::warning::$WHY" ;; esac

      # TURN BUDGET (DRE-2422, sized per strategy by DRE-2466). The size step
      # above selects it: 80/120 on a standard review — unchanged, byte for
      # byte — and 150/200 when the file-list strategy is in play, because
      # that path deliberately takes more, smaller steps. The retry MUST stay
      # strictly higher on every path. 40 was sized for an older, terser
      # model; Sonnet 5 rides it. Portico's critic runs in one hour: 12, 18,
      # 19, 31, 41(success), 41(error_max_turns). A run that SUCCEEDS at 41
      # has zero margin left, and PR #273 (7 files / +1184) fell off — twice,
      # for $4.05 and no verdict, because the retry re-ran with the SAME
      # ceiling and error_max_turns is deterministic. This is a CEILING, not
      # a target: the 12- and 19-turn runs cost exactly what they cost
      # before. Every sibling already sits higher (verify 60, agent-fix 60,
      # red-main-repair 100, agent-task 150) — the one agent that must read
      # the WHOLE diff before it may speak had the tightest budget in the
      # fleet. Pinned by tests/test_critic_turn_budget.py, which resolves
      # these expressions through scripts/pr_size_strategy.py and asserts the
      # whole DRE-2422 rule set on EVERY strategy.
      #
      # Skipped entirely past the second size threshold (strategy
      # `oversized`): that PR gets an honest refusal naming its size, not a
      # fourth invoice for a review that cannot happen.
      # NO LINEAR_API_KEY HERE, AND THAT IS DELIBERATE (DRE-2696). Every
      # other agent step in the fleet gets the key; this one is the stated
      # exception, so nobody has to guess whether it was an oversight — it
      # was, for agent-fix.yml and red-main-repair.yml, and this is the file
      # where the answer is the other way.
      #
      # The critic's card material arrives through exactly ONE stage: "Build
      # card review context" above (review_card_context.py, DRE-2052). That
      # stage tells the critic to judge check 1 against "the card description
      # quoted in the PR body" — a frozen artifact — and for a cardless PR it
      # sanitizes, size-caps and fences the body as untrusted data. Handing
      # the critic a live Linear key would let it fetch card prose AROUND
      # that sanitizer, which is the whole discipline the stage exists to
      # enforce (standards/untrusted-content.md, DRE-1996). Judging the diff
      # rather than re-reading the author's prose is the point of the role.
      #
      # The Linear WORK of this workflow is done by ordinary steps that DO
      # hold the key — "Plan visual QA" (reads the card's **Design:** ref)
      # and "Post verdict or neutral status" (the card bookkeeping). Linear
      # state stays ground truth written by the pipeline, never an agent
      # claim. And unlike the fix and repair agents, nothing tells this agent
      # the key is in its env: `briefs/critic.md` (DRE-3084) carries only the
      # standing facts about the critic's own position and names no
      # credential — asserted by tests/test_refuted_verdict_rereview.py,
      # never assumed.
      #
      # Pinned by tests/test_agent_linear_key.py, which fails if this step
      # is renamed or the exception loses its reason.

      # Claude Code, installed ONCE and proved, before the model step below
      # (DRE-3414). DRE-3416: the vendor's own installer exited clean, left no
      # launcher, and every Claude-running job in the fleet died minutes later
      # on "native binary not found" — one turn, $0, which reads exactly like
      # a stale credential. The first operator to look was sent to the token,
      # which was the one thing that was not wrong.
      #
      # This step asserts `claude --version` answers, retries the install
      # once, and fails AS AN INSTALL FAILURE if it still does not; the model
      # step below then runs the binary this step proved, never a second copy
      # the vendor installed and nobody checked. It comes out of the pinned
      # pipeline checkout, the same way this file reaches the fleet's other
      # shared actions, so a caller's pipeline_ref picks the channel.
      - name: Install Claude Code (asserted)
        id: install_claude
        # Gated exactly like the model step below: a run that never reaches a
        # model must neither spend an install nor go red for one it did not
        # need.
        if: steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized'
        uses: ./.bureau-pipeline/.github/actions/install-claude-code

      - name: Critic review
        id: critic
        if: steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized'
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217 — pinned DRE-3416: v1.0.218's Claude Code 2.1.265 installer leaves no launcher (anthropics/claude-code-action#1817); unpin on DRE-3417
        # A crash here (is_error / no verdict) must NOT fail-close into a
        # false REQUEST_CHANGES — the gate below detects it and we retry.
        continue-on-error: true
        with:
          # DRE-3414: the launcher the shared install step above PROVED
          # runs. Without it the vendor action installs a second copy of
          # Claude Code that nothing asserted, and the step above proves
          # nothing about the binary this step actually executes.
          path_to_claude_code_executable: ${{ steps.install_claude.outputs.executable }}
          anthropic_api_key: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # The critic READS the PR through this token and writes its verdict
          # to a file; the comment is posted below with the qa-bot token. So
          # this is the pool-selected reader (DRE-4282) — the model's reads
          # are the bulk of a review's GitHub spend.
          github_token: ${{ steps.reader.outputs.token }}
          # qa-bot retained from the DRE-1924 skew-guard: merge-gate's
          # update-branch push fired synchronize as agent-bureau-qa-bot
          # (DRE-2037). DRE-2416 removed that push, so the entry is now
          # defence in depth — it costs nothing and a future qa-bot-authored
          # push would otherwise crash this review. github-actions:
          # reconcile's workflow_dispatch runs initiate as the workflow token's
          # actor (DRE-2053 — dependabot review dispatches, DRE-2047).
          allowed_bots: agent-bureau-bot,agent-bureau-bot-2,agent-bureau-bot-3,agent-bureau-bot-4,agent-bureau-qa-bot,dependabot,github-actions
          claude_args: |
            --max-turns ${{ steps.size.outputs.max_turns }}
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Bash,Read,Glob,Grep,Write,WebSearch,WebFetch"
          prompt: |
            Read .bureau-pipeline/agent-context.md FIRST — the bureau
            engineering and architecture standards you review AGAINST, plus the
            comms standard that governs the VOICE of the verdict you write for
            the CEO. Hold the diff to those standards.

            You are an adversarial code reviewer. Review PR #${{ steps.pr.outputs.number }}
            in this repo (use `gh pr view ${{ steps.pr.outputs.number }}`;
            for the diff itself follow the REVIEW STRATEGY block below —
            GH_TOKEN is in your env).

            REVIEW STRATEGY (DRE-2466 — chosen from this PR's measured diff
            size; follow it exactly). Fallback if the block below is empty:
            read the whole diff in one `gh pr diff ${{ steps.pr.outputs.number }}`
            pass and examine the ENTIRE diff:
            ${{ steps.size.outputs.strategy_context }}

            CARD CONTEXT (DRE-2052 — what this PR implements and how to
            judge check 1; follow it exactly). Fallback if the block below
            is empty: judge a DRE-carrying branch against its card quoted
            in the PR body, and a cardless branch on the diff alone —
            never invent a card:
            ${{ steps.cardctx.outputs.context }}

            Check, in order of severity:
            1. Does the diff actually satisfy the acceptance criteria the
               CARD CONTEXT block above defines — for a card PR the card's
               criteria (its description and any **Spec:** directory it
               references), for a cardless PR the policy the block states?
               If the card has a
               `**Design:**` ref, Read the referenced design image(s) and
               compare the diff against it — flag as findings any missing or
               incorrect components, wrong structure/layout, wrong copy, or
               obviously wrong layout intent. These design files are
               normal-sized exported screen PNGs (under
               console/design/images/screens/...), safe to Read directly. If
               the card has NO `**Design:**` ref, skip this comparison — its
               absence is NOT a finding.

               VISUAL-QA STAGE (read this and follow it exactly — it gates
               merges, so it is deliberately conservative):
               ${{ steps.visual.outputs.context }}

               REPAIR-PR STAGE (DRE-1927 — follow it exactly; it gates
               agent-authored fixes to a broken main). Fallback rule: if
               this PR's head branch starts with `repair/` and
               the block below is empty, treat ANY change under a test tree
               as a blocking finding — going green by silencing the failing
               signal is the failure mode this stage exists to catch:
               ${{ steps.repair.outputs.context }}
            2. Are the tests REAL — do they assert meaningful behavior, would
               they fail if the implementation were wrong? Vacuous or
               tautological tests are a blocking finding.
            3. Correctness bugs, security issues, data-loss risks.
            4. Scope creep — changes beyond the card.
            5. Convention violations (style, naming, structure vs neighbors).

            Default skeptical: your job is to find reasons NOT to merge. If
            you cannot find any, approve.

            EVIDENCE FOR A CLAIM ABOUT A RUN (DRE-3005 — mechanically
            checked; a blocking verdict that fails it is HELD instead of
            posted, which costs this pull request a whole review). The
            estate's standing law — capture the error body, not the status —
            applies to you: a finding asserting what a command or a CI job
            actually DID must carry the run.

            * CITE A FAILING COMMAND, PASTE ITS OUTPUT. If a finding says a
              command exits non-zero, fails, errors or does not do
              something, put the command AND its actual result together in
              ONE fenced block. (A command that PASSED is free — saying
              "the checks are green" rejects nobody. This is only about the
              claims that block.) A quoted fragment is not the output:
              `check_tdd_commits.py` prints a per-commit classification line
              for every commit beside its reason, unconditionally, and a
              verdict that reproduced only the reason blocked a correct pull
              request for 22 hours. Whatever a real run always prints,
              paste it.
            * A CI-COVERAGE FINDING NAMES THE JOB. Saying a job did not run
              something requires the run id, the job id, and the line
              proving what it ran (`gh run view`, `gh api` — GH_TOKEN is in
              your env). A `pull_request` run executes from the MERGE REF,
              so the base branch's jobs apply even when the branch's own
              workflow file predates them; reading the branch's config is
              not evidence about what ran.
            * BODY SNAPSHOT. Run `gh pr view` again immediately before you
              write the final verdict. A description can be corrected while
              you review, and a verdict demanding a change the author had
              already made cost ten hours.
            * A CLAIM YOU CANNOT EVIDENCE IS A CLAIM YOU DO NOT MAKE. "I
              could not verify X; <command> would settle it" is a
              legitimate finding. An unevidenced assertion is not.

            This is narrowly about facts a command can settle. Your
            judgement findings — scope, design, risk, test quality — need no
            citation and are untouched: there you are meant to be believed.

            CONVERGENCE (mandatory): if earlier QA Critic verdicts exist on
            this PR, you are RE-reviewing: verify the prior findings are
            resolved, review what changed since, and raise a NEW finding
            only if (a) the latest changes introduced it, or (b) it is
            data-loss/security severity.

            AND SAY IT MACHINE-READABLY (DRE-2817). On a RE-review that
            blocks, put ONE line of its own immediately after the VERDICT
            line — exactly three tokens, in this order, nothing else on the
            line:

                convergence: <new-finding|repeat-finding> <prior-fixes-held|prior-fix-regressed> <in-scope|scope-creep>

            - `new-finding` — the thing you are blocking on is not one any
              earlier round on this PR named. `repeat-finding` — it is.
            - `prior-fixes-held` — every earlier round's fix is still there
              and still works. `prior-fix-regressed` — one of them came
              undone.
            - `in-scope` — the change is still what the card asked for.
              `scope-creep` — it has grown past it.

            This line IS the fix budget. `new-finding prior-fixes-held
            in-scope` says the loop is closing in and buys it another round;
            anything else says it is circling and spends a stop budget of
            two rounds. Write it from what you VERIFIED yourself, never from
            what the fixing agent claims — that claim is the thing you exist
            to check, and a fix loop was killed mid-convergence for four
            rounds because nothing here was written down. Omit the line on a
            first review (nothing earlier to repeat) and on an APPROVE
            (nothing is blocking).

            WRITE THE VERDICT FILE FIRST (DRE-2466). Before you read any
            code, Write /tmp/qa-verdict.md with exactly this stub:

                VERDICT: REQUEST_CHANGES
                <!-- QA-REVIEW-INCOMPLETE -->
                ## Summary
                This review has not finished.

            Then rewrite the whole file as the review proceeds, so it always
            reflects what you have found so far. Keep the
            `<!-- QA-REVIEW-INCOMPLETE -->` line for as long as the review is
            unfinished, and REMOVE it in your final rewrite — while it is
            present the gate treats the file as a receipt, not a verdict, so
            an early exit holds the merge instead of requesting changes
            nobody found. Never write `VERDICT: APPROVE` before you have
            finished the whole review. (Origin: four reviews of portico PR
            #297 ended early and left nothing at all behind.)

            Write your verdict to /tmp/qa-verdict.md in TWO clearly separated
            parts — a business summary the CEO reads, then the technical detail
            the fixing agent reads:

            - First line: `VERDICT: APPROVE` on its own, or — when you are
              blocking — `VERDICT: REQUEST_CHANGES cause:<tag>`, the verdict
              word followed by EXACTLY ONE tag from this fixed vocabulary,
              spelled exactly as written here and nothing else on the line:

                * `unmet-criteria` — the card's acceptance criteria are not
                  all satisfied (this covers partial delivery and an
                  unchanged resubmission)
                * `defect` — the diff contains a correctness, security or
                  data-loss problem
                * `unverified-claim` — the PR asserts something its diff does
                  not prove (untested logic, a claim nothing executes)
                * `scope` — the diff does work the card did not ask for, or
                  targets the wrong thing

              The tag names the BLOCKING reason: when several apply, pick the
              one your verdict LEADS with. Never invent a tag outside those
              four and never write more than one. Never put a cause on an
              APPROVE — that line stays exactly `VERDICT: APPROVE`. (DRE-2489:
              this one word is how "why do first passes fail?" gets answered
              by filtering verdict headers instead of by hand.)
            - Then `## Summary` — for the CEO, who is NON-TECHNICAL and reads
              this to make a decision, not to debug. Use plain business
              language:
                (a) what this change does for the product / the user, in 1-2
                    sentences;
                (b) whether it delivers what the card asked for;
                (c) if you are blocking, WHY it matters — described as the
                    user's experience or the business risk, NOT the mechanism.
                    Good: "When someone taps between menu sections, the new
                    section's sub-items don't appear, so the app looks broken."
                    Bad: "useState captures `active` once at mount so the
                    NavGroup never re-opens on client-side navigation."
              BANNED in this section: code, variable/function names, file paths,
              line numbers, framework or library terms (useState, props, API,
              client-side, component, etc.), and the word "test". If a
              non-technical reader couldn't act on it, rewrite it.
            - If REQUEST_CHANGES: AFTER the summary, a `## For the fixing agent`
              section with ALL the precise technical findings (file:line, what's
              wrong, the fix, any test gaps). This is the ONLY place technical
              language belongs — be as code-level and exact as the fixer needs.

      # Crash detection (mirrors DRE-1346's agent-result gate). A real
      # verdict requires is_error != true AND a verdict file with a VERDICT:
      # line. is_error / no-verdict means the critic did NOT actually run —
      # we must retry, never post the crash as REQUEST_CHANGES.
      - name: Gate critic result (attempt 1)
        id: gate1
        if: always() && !cancelled() && steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized'
        continue-on-error: true
        run: |
          EXEC_FILE="${{ steps.critic.outputs.execution_file }}"
          [ -n "$EXEC_FILE" ] || EXEC_FILE=/home/runner/work/_temp/claude-execution-output.json
          # --github-output (DRE-2465): the gate also writes `outcome` and,
          # for a run that ended cleanly, `turns`/`cost` — numbers only, so a
          # hostile execution record cannot forge a second step output. The
          # neutral comment is composed from these instead of assuming a crash.
          # Kept identical in the attempt-2 gate below.
          # DRE-3005, the second half of "is this a real verdict": a
          # BLOCKING verdict that asserts what a command or a CI job did
          # without carrying the run is not one. Two correct PRs were
          # blocked overnight on claims of exactly that shape that did not
          # reproduce. It runs SECOND and only on a verdict the gate above
          # already accepted — an unreadable or unfinished file is that
          # gate's finding, not this one — and it can only ever hold a
          # merge: `evidence=defective` lands on the same neutral path a
          # crash does, and an APPROVE is never gated.
          if python3 "$PIPELINE_DIR"/scripts/check_critic_result.py "$EXEC_FILE" /tmp/qa-verdict.md --github-output "$GITHUB_OUTPUT" \
             && python3 "$PIPELINE_DIR"/scripts/verdict_evidence.py check /tmp/qa-verdict.md --github-output "$GITHUB_OUTPUT" --hold-file /tmp/qa-evidence-hold.md; then
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "critic attempt 1 did not produce a real verdict — will retry"
          fi

      # Retry once (medic.yml's one-retry pattern, but in-workflow so we
      # don't burn a whole failed run + rerun cycle on a transient critic
      # crash). Clear any stale verdict so the gate re-evaluates honestly.
      - name: Clear stale verdict before retry
        if: always() && !cancelled() && steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized' && steps.gate1.outputs.real != 'true'
        # qa-evidence-hold.md too (DRE-3005): attempt 1's list of
        # unevidenced claims describes attempt 1's verdict, and a retry that
        # writes a clean one must not post the dead list beside it.
        run: |
          rm -f /tmp/qa-verdict.md /tmp/qa-evidence-hold.md
          # DRE-3226: attempt 1 ran inside the working tree, so the in-tree
          # agent-context.md is the one file of ours its experiments could
          # have removed. Restore it from the durable copy the assemble step
          # kept outside the tree — a retry that reads no standards reviews
          # against nothing and is worse than no retry.
          mkdir -p "$GITHUB_WORKSPACE/.bureau-pipeline"
          cp -f "$PIPELINE_DIR/agent-context.md" \
                "$GITHUB_WORKSPACE/.bureau-pipeline/agent-context.md" || true

      # Back off before the retry (DRE-2429), same defect as verify.yml: the
      # retry ran as the immediately following step, so a deterministic
      # failure was simply re-issued at once and charged twice. 120s clears
      # the transient class this retry exists for (token-mint blip, action
      # startup, an API 5xx) and is counted in the job's timeout-minutes
      # arithmetic above — raising it means raising that too.
      #
      # This workflow is NOT rate-limit-prone the way verify.yml was: its
      # token comes from the qa-bot App, whose installation has its own
      # separate 5,000 req/hr bucket (DRE-1921) — which is why every QA
      # Review run on agent-bureau PR #2045 succeeded while Verify died on
      # installation 123249480. Do not "finish the job" by moving this
      # workflow onto the dispatch pool; that would take the critic OFF a
      # healthy dedicated bucket and ONTO the contended one.
      #
      # Gated identically to the retry it guards, so a healthy review never
      # sleeps.
      - name: Back off before the critic retry
        # Byte-identical to the retry's own `if` below, including DRE-3414's
        # install conjunct — tests/test_gate_pool_and_backoff.py fails if the
        # two ever drift, because a backoff that outlives its retry sleeps
        # 120s on runs that will never retry.
        if: always() && !cancelled() && steps.install_claude.outcome == 'success' && steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized' && steps.gate1.outputs.real != 'true'
        run: |
          echo "critic attempt 1 produced no verdict — waiting 120s before the retry"
          sleep 120

      # NOTE: the with block below is intentionally duplicated from the
      # attempt-1 "Critic review" step and MUST be kept in sync with it.
      # GitHub Actions does NOT support YAML anchors / merge keys, so this
      # cannot be DRY'd with `&anchor` / `<<: *anchor` — the runner would
      # fail to parse the file, breaking the critic in every consuming repo.
      #
      # --max-turns is the ONE intended difference (DRE-2422): 120 here
      # against attempt 1's 80, and it must stay strictly higher. A retry
      # exists to change the outcome, and error_max_turns is DETERMINISTIC —
      # the same review over the same diff with the same ceiling dies at the
      # same turn. Portico PR #273 proved it: two attempts, both dead at 41
      # of 40, $4.05 spent, no verdict. A retry that comes back with no more
      # of the resource it just exhausted is only a second invoice.
      # Enforced by tests/test_critic_turn_budget.py, which also checks that
      # nothing ELSE in these two blocks has drifted apart.
      #
      # NO LINEAR_API_KEY HERE EITHER, for the reasons written out in full
      # above attempt 1 (DRE-2696): the critic reads card material only
      # through the "Build card review context" stage, sanitized and fenced.
      # A retry that quietly gained a credential attempt 1 never had would be
      # exactly the drift this comment block warns about.
      - name: Critic review (retry)
        id: critic_retry
        # DRE-3414: `always()` is why this needs saying out loud. A failed
        # step skips the rest of the job — except the steps that asked for
        # always(), which is this one. Without the install conjunct the retry
        # would start against an executable the install step never produced,
        # and buy a second identical death for the price of a first.
        if: always() && !cancelled() && steps.install_claude.outcome == 'success' && steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized' && steps.gate1.outputs.real != 'true'
