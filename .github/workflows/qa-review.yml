            # APPROVE needs one re-review nudge (reconcile's review-lane sweep now
            # re-triggers qa-review for verdicts not bound to the head).
            # DRE-2340: ` content:<64-hex>` is appended when the reviewed
            # commit's three-dot diff could be hashed, so a gate-initiated
            # base merge (which changes the head but nothing this PR
            # contributes) no longer destroys the verdict. Absent → the
            # line is byte-identical to today's, and the verdict binds the
            # SHA alone. The `:+` form is deliberate: it is safe under
            # `set -u` when CONTENT_ID is unset.
            # DRE-2489: a REQUEST_CHANGES verdict's own first line now also
            # carries ` cause:<tag>`, so the composed header reads
            # `… VERDICT: REQUEST_CHANGES cause:defect @<sha> content:<id>`.
            # It rides along in `head -1` and needs nothing here — but note
            # the ORDER is load-bearing in both directions: the content id
            # stays LAST (verdict_content.py matches it end-anchored) and the
            # cause sits before the sha, where merge_gate's `VERDICT:
            # \s*([A-Z_]+)` has already stopped. Appending anything after the
            # content id breaks the carry; every parser is pinned against
            # both formats in tests/test_verdict_cause_tag.py.
            { echo "🔎 QA Critic — $(head -1 /tmp/qa-verdict.md) @${REVIEWED_SHA}${CONTENT_ID:+ content:$CONTENT_ID}"; echo; tail -n +2 /tmp/qa-verdict.md; } > /tmp/qa-comment.md
            # DRE-3005 rule 3, the body-snapshot footer. Appended AFTER the
            # verdict body, never near the header: `head -1` is the line
            # every consumer parses (merge_gate's `VERDICT:` match,
            # verdict_content's end-anchored `content:` read), and the
            # footer carries neither token. `lastEditedAt` is null until
            # the body or title is actually edited — `updatedAt` moves on
            # any activity at all and would cry wolf on every commented
            # pull request. A blip leaves it empty, and an empty edit time
            # is rendered as no claim rather than as freshness.
            BODY_EDITED=$(gh api graphql -f query='query($owner:String!,$name:String!,$pr:Int!){repository(owner:$owner,name:$name){pullRequest(number:$pr){lastEditedAt}}}' \
              -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" \
              --jq '.data.repository.pullRequest.lastEditedAt // ""' 2>/dev/null || true)
            FOOTER=$(python3 "$PIPELINE_DIR"/scripts/verdict_evidence.py snapshot \
              --reviewed-at "${BODY_READ_AT:-}" --edited-at "${BODY_EDITED:-}" || true)
            if [ -n "$FOOTER" ]; then
              printf '\n%s\n' "$FOOTER" >> /tmp/qa-comment.md
            fi
          elif [ "${INSTALL_FAILED:-}" = "true" ]; then
            # DRE-3414: the reviewer never started, because Claude Code was
            # never installed. The shared install-and-assert step proved the
            # binary would not run and failed the job there — so both critic
            # attempts were skipped, both gates are empty, and without this
            # branch the comment below would blame a startup/auth failure and
            # send an operator to rotate a healthy credential (DRE-3416: that
            # is exactly what the fleet's last install outage cost).
            # Ordered AFTER the real-verdict branch and before every failure
            # branch: a genuine verdict is never swallowed, and no other
            # failure wording can claim this run first. Same neutral contract
            # as every branch here — "QA Critic" so merge-gate treats it as
            # the latest word and it supersedes a stale APPROVE, no
            # "VERDICT:" line so merge is held and the fix agent is not woken
            # for findings nobody made.
            printf '%s\n\n%s\n' \
              "🔎 QA Critic could not run — the Claude Code install failed, this is NOT a code rejection." \
              "The shared install step could not produce a Claude Code binary that runs, so the adversarial reviewer never started and no findings were produced. This is an install failure: it is not an authentication failure and not a model failure, so no credential needs rotating and no model is degraded on the strength of this message — the install step's own error on this run names what it tried. Merge is held until a critic actually reviews this PR; this is not a request for changes." \
              > /tmp/qa-comment.md
          elif [ "${A2_EVIDENCE:-${A1_EVIDENCE:-}}" = "defective" ] && [ -s /tmp/qa-evidence-hold.md ]; then
            # DRE-3005: the reviewer ran, finished, and blocked this pull
            # request on a claim about what a command or a CI job actually
            # did — without carrying the run. Two correct PRs were blocked
            # overnight on exactly that shape and neither claim reproduced,
            # so it does NOT post as REQUEST_CHANGES: that would spend a
            # fix-loop attempt and an operator decision on a finding nobody
            # proved (the #1441/#1442 false-reject class). Same neutral
            # contract as the branches below — carries "QA Critic" so
            # merge-gate treats it as the latest word and it supersedes a
            # stale APPROVE, carries no "VERDICT:" line so merge is held
            # and the fix agent is not dispatched. The message is
            # verdict_evidence.py's one wording, written to a file by the
            # gate step; it names the unevidenced claims and claims nothing
            # about credentials, because nothing here was a credential.
            cp /tmp/qa-evidence-hold.md /tmp/qa-comment.md
          elif [ "${A1_OUTCOME:-}" = "turn_exhaustion" ] || [ "${A2_OUTCOME:-}" = "turn_exhaustion" ]; then
            # DRE-2924: the reviewer RAN OUT OF TURNS. `error_max_turns` is
            # is_error, so this used to fall through to the crash branch
            # below and blame a startup/auth failure — over a run that
            # authenticated, reviewed for 62 turns and was billed ~$2.56
            # (portico PR #364). That misdiagnosis cost three days across two
            # repos once already; the genuine stale-token signature is
            # instant, one turn and $0, which is why the numbers are in this
            # message. Ordered BEFORE the completed-no-verdict branch: when
            # one attempt merely finished empty and the other exhausted its
            # ceiling, exhaustion is the actionable cause and its remedy is
            # not the other one's. Same neutral contract as every branch here
            # — "QA Critic" so merge-gate treats it as the latest word and it
            # supersedes a stale APPROVE, no "VERDICT:" line so the merge is
            # held and the fix agent is not woken for findings nobody made.
            # Deliberately NOT medic_classify's "could not run (infra error)"
            # marker: this was not an infra failure.
            printf '%s\n\n%s\n' \
              "🔎 QA Critic ran out of turns before it could finish — re-review needed, this is NOT a code rejection." \
              "The adversarial reviewer hit its turn ceiling mid-review and stopped, so there is no verdict to post — ${SPENT:-no turn count was recorded}. This is NOT an authentication or startup failure: it authenticated, did real work, and was billed for it, so no credential needs rotating on the strength of this message. A retry hits the same wall, because the budget it exhausted is the same one — the fix is a smaller change: split this pull request into independently reviewable parts, and each part gets a full review. Merge is held until a critic actually reviews this PR; this is not a request for changes." \
              > /tmp/qa-comment.md
          elif [ -n "$RAN" ]; then
            # DRE-2465, the third branch: the reviewer RAN TO COMPLETION and
            # left no verdict this gate could read. Same neutral contract as
            # the crash branch below — "QA Critic" so merge-gate treats it as
            # the latest verdict and it supersedes any stale APPROVE, and no
            # "VERDICT: APPROVE" line so merge-gate holds rather than merges —
            # but it describes what happened instead of blaming the token. The
            # numbers are the point: they are what tells the operator, in one
            # line, that rotating a credential will not fix this. What was
            # actually found in place of the verdict (existed / bytes /
            # near-miss VERDICT token) is in the run log, printed by the gate.
            # DRE-3304: and WHAT was found there, in one clause, rather than
            # a pointer to a log that outlives neither the runner nor the
            # verdict file. The retry's cause wins when both attempts have
            # one — same precedence as $RAN above, for the same reason: it is
            # the later evidence.
            WHY="${A2_CAUSE_TEXT:-${A1_CAUSE_TEXT:-}}"
            printf '%s\n\n%s\n' \
              "🔎 QA Critic ran but produced no verdict — re-review needed, this is NOT a code rejection." \
              "The adversarial reviewer completed its run and then left no verdict we could read — $RAN.${WHY:+ What was found in its place: $WHY.} This is NOT an authentication or startup failure: it authenticated, did real work, and was billed for it, so no credential needs rotating on the strength of this message. Merge is held until a critic actually reviews this PR; this is not a request for changes." \
              > /tmp/qa-comment.md
          else
            # The critic CRASHED on both attempts (is_error / no verdict). Do
            # NOT post REQUEST_CHANGES — that false reject churns good PRs into
            # the fix loop (#1441/#1442, DRE-1330/1332, 2026-06-13). Post a
            # NEUTRAL status: contains "QA Critic" (so merge-gate treats it as
            # the latest verdict and it supersedes any stale APPROVE) but NO
            # "VERDICT: APPROVE" line, so merge-gate holds rather than merges.
            # The job then fails loudly below → red + medic-visible.
            # DRE-2924 appends the attempts' own numbers when the gates
            # recorded any. On a genuine auth death that is the FINGERPRINT —
            # instant, one turn, $0 — so it corroborates this wording; on
            # anything that spent more than that it contradicts it out loud,
            # which is the only way a reader ever catches this notice
            # describing the wrong cause again.
            printf '%s\n\n%s\n' \
              "🔎 QA Critic could not run (infra error) — re-review needed, this is NOT a code rejection." \
              "The adversarial reviewer crashed twice (startup/auth failure, no inference). No findings were produced.${SPENT:+ What the execution records report for those attempts: $SPENT — an instant, one-turn, \$0 run IS the stale-credential signature, and anything more than that means the reviewer did real work and this notice is naming the wrong cause (DRE-2924).} Merge is held until a critic actually reviews this PR; this is not a request for changes." \
              > /tmp/qa-comment.md
          fi
          fi
          # DRE-3084: say WHY this head carries two verdicts. A FOOTER, and
          # deliberately so — `head -1` is the line merge_gate's `VERDICT:`
          # match, verdict_content's end-anchored `content:` read and
          # verdict_cause's tag all parse, and this note carries none of those
          # tokens. Appended on every branch above, because a re-review that
          # crashes or declines still has to explain the second comment.
          if [ "${REFUTED:-}" = "true" ]; then
            printf '\n%s\n' "♻️ re-review after refutation — the fixing agent contested this reviewer's previous finding on this same commit with evidence, so the pipeline ordered one more look. Nothing was pushed between the two verdicts; this one is the answer." \
              >> /tmp/qa-comment.md
          fi
          # The verdict comment is load-bearing (merge-gate reads it) —
          # retry through transient GitHub API blips rather than losing it.
          for i in 1 2 3 4; do
            gh pr comment "$PR" --body-file /tmp/qa-comment.md && break
            echo "comment attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          # DRE-2317 follow-on: carry the SELECTED MODEL on the Linear copy of
          # the verdict so quality-per-model is queryable without scraping run
          # logs (which expire at ~90 days). Deliberately NOT a separate 🧠
          # heartbeat like agent-task.yml's: the critic fires on every PR push,
          # so a per-run comment would add hundreds of Linear comments per repo.
          # The PR copy stays byte-identical — merge-gate parses it.
          if [ -n "$CARD" ]; then
            { cat /tmp/qa-comment.md
              printf '\n\n🧠 model: %s — %s\n' "$MODEL_ID" "$MODEL_WHY"
            } > /tmp/qa-linear.md
            python3 "$PIPELINE_DIR"/scripts/linear_ops.py comment "$CARD" "$(cat /tmp/qa-linear.md)" || true
          fi

          # DRE-1874: reconcile the FORMAL review state with the verdict. When
          # the critic earlier said REQUEST_CHANGES, claude-code-action submits
          # a formal "Changes requested" review (as this bot). On the APPROVE
          # flip, qa-review only posted a comment — the stale formal review kept
          # reviewDecision=CHANGES_REQUESTED and mergeStateStatus=BLOCKED, so
          # the merge-gate (and even --admin) couldn't merge until a human
          # dismissed it. On an APPROVE verdict, dismiss the stale
          # changes-requested review(s) AND submit a fresh APPROVE review so
          # GitHub's reviewDecision becomes APPROVED. Best-effort (the script
          # never fails the job) and idempotent.
          if [ "$REAL" = "true" ] && head -1 /tmp/qa-verdict.md | grep -q "VERDICT: APPROVE"; then
            python3 "$PIPELINE_DIR"/scripts/sync_review_state.py "$REPO" "$PR" || true
          fi

      # ── Head-bound review check (DRE-2291) ────────────────────────────────
      # GitHub attributes a workflow_dispatch run to the DEFAULT BRANCH, so
      # this job's own `call / review` check run lands on main's tip and
      # NOTHING lands on the pull request. The manual re-run is the
      # documented remedy and the one reconcile itself dispatches (DRE-2047,
      # DRE-2282) — it posts a fresh verdict comment while the PR head still
      # carries the dead check from the run the dispatch cancelled
      # (`concurrency: cancel-in-progress` in every stub). Verified on
      # agent-bureau PR #2007: three dispatched reviews wrote their check
      # onto commit 87eb0999 (main) while head 14934d98 stayed CANCELLED
      # under a genuine APPROVE.
      #
      # Publishing our own check run, explicitly bound to the sha Resolve PR
      # captured, makes the outcome land on the PR whatever fired the run —
      # and makes the self-inflicted cancellation harmless: the superseding
      # review overwrites the same record, and the check's summary names the
      # run and trigger that produced it, so it stays detectable too.
      #
      # The conclusion states the VERDICT, not the job's liveness:
      # `call / review` goes GREEN on REQUEST_CHANGES (it only means the job
      # finished), which is exactly the false green that got two
      # REQUEST_CHANGES PRs hand-merged (DRE-1825 → DRE-1895).
      #
      # NOT a merge credential: merge_gate.py's review condition stays the
      # qa-bot verdict COMMENT bound to the head (DRE-1990), and it excludes
      # review-origin checks by verified suite origin (DRE-1994). This check
      # can only ever hold a merge, never grant one.
      #
      # The SKIP path needs the same mint (DRE-2340). When the review is
      # skipped because the standing verdict still binds this head's
      # content, the skip is silent on the pull request by design — the
      # existing verdict must stay the latest comment — so the CHECK is the
      # only place the new head can show an honest review status. Without
      # it the head carries nothing and every consumer (gh pr checks, the
      # console, reconcile's crashed-review backstop, a human) reads
      # "unreviewed", which is exactly what it is not.
      #
      # NOT the pool slot, on purpose (DRE-4282, critic round 1). A check run
      # is a write nobody attributes, but it is not a write anybody may make:
      # publish_review_check.py UPDATES the head's existing review check in
      # place, and GitHub lets only the App that CREATED a check run update
      # it. Minted from whichever slot the selector picked, a re-review on a
      # different slot would fail at this last step, the head would keep its
      # stale check, and the crash-recovery loop would read a working
      # reviewer as broken. So this mint stays on the one App that has always
      # written the review check — the dispatch App — at the cost of one
      # look-up per review. The reads above ride the pool; this does not.
      - name: Mint dispatch-bot token (checks:write — qa-bot has checks:read)
        id: checks_app
        if: always() && !cancelled() && (steps.decide.outputs.review == 'true' || steps.decide.outputs.carried_sha != '')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      - name: Publish review check on the reviewed head
        if: always() && !cancelled() && steps.decide.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ steps.checks_app.outputs.token }}
          # Same expression the verdict step uses — one source for "did a
          # genuine review run", so the comment and the check can never
          # disagree about it.
          REAL: ${{ (steps.gate1.outputs.real == 'true' || steps.gate2.outputs.real == 'true') && 'true' || 'false' }}
          # DRE-2466: on the oversized path the head still gets a red check —
          # nothing was reviewed — but it must say the real reason. The
          # default no-review summary blames an infrastructure failure, and
          # here there wasn't one: the workflow read the size and declined.
          TOO_LARGE: ${{ steps.size.outputs.strategy == 'oversized' && steps.size.outputs.size_phrase || '' }}
        run: |
          python3 "$PIPELINE_DIR"/scripts/publish_review_check.py \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.pr.outputs.sha }}" \
            --verdict-file /tmp/qa-verdict.md \
            --real "$REAL" \
            --too-large "$TOO_LARGE" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event "${{ github.event_name }}"

      - name: Re-publish the review check for a carried verdict
        # Ordered AFTER the ordinary publish step on purpose: that one is
        # the head-bound record's primary writer (DRE-2291) and stays the
        # first `publish_review_check.py` step in this file.
        if: always() && !cancelled() && steps.decide.outputs.review != 'true' && steps.decide.outputs.carried_sha != ''
        env:
          GH_TOKEN: ${{ steps.checks_app.outputs.token }}
          CARRIED_SHA: ${{ steps.decide.outputs.carried_sha }}
        run: |
          # No review ran, so there is no /tmp/qa-verdict.md — the verdict
          # being carried is an APPROVE by construction (should_review_pr
          # carries nothing else), and the check states the conclusion of
          # THAT verdict, naming the commit it was earned on. `--real true`
          # is honest here: a genuine review DID run, on CARRIED_SHA, and
          # its verdict provably still describes this head's content.
          printf 'VERDICT: APPROVE\n' > /tmp/qa-carried-verdict.md
          python3 "$PIPELINE_DIR"/scripts/publish_review_check.py \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.decide.outputs.head_sha }}" \
            --verdict-file /tmp/qa-carried-verdict.md \
            --real true \
            --carried-from "$CARRIED_SHA" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event "${{ github.event_name }}"

      # Fail the job loudly AFTER the neutral comment is posted, so the
      # infra failure is visibly red and the medic picks it up. A genuine
      # review (real verdict) ends green regardless of APPROVE/REQUEST_CHANGES.
      - name: Fail if critic never really ran
        id: critic_fail
        # Only when we actually tried to review — a chrome-only PR (decide
        # said skip) never runs the gates, so it must NOT fail here.
        if: always() && !cancelled() && steps.decide.outputs.review == 'true' && steps.size.outputs.strategy != 'oversized' && steps.gate1.outputs.real != 'true' && steps.gate2.outputs.real != 'true'
        env:
          # DRE-2924: the annotation is the first line the medic and the
          # operator read, and it must not assert a crash over a run that
          # spent its turns. Same two gate outputs the comment is composed
          # from, so the red line and the comment can never disagree.
          A1_OUTCOME: ${{ steps.gate1.outputs.outcome }}
          A2_OUTCOME: ${{ steps.gate2.outputs.outcome }}
          # DRE-3304: and WHICH way each attempt came back empty. The gate
          # computed this and logged it two steps ago; without it here the
          # `else` below turned "the reviewer finished and wrote nothing"
          # into "crashed on both attempts" — over run 34170941436, whose
          # attempts ended subtype=success at 52 and 29 turns.
          A1_CAUSE: ${{ steps.gate1.outputs.cause }}
          A1_CAUSE_TEXT: ${{ steps.gate1.outputs.cause_text }}
          A2_CAUSE: ${{ steps.gate2.outputs.cause }}
          A2_CAUSE_TEXT: ${{ steps.gate2.outputs.cause_text }}
          # Named, because "both attempts" is only findable if the reader
          # knows which run held them, and a run log outlives nothing else.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Byte-identical to check_critic_result.UNKNOWN_CAUSE_TEXT, held
          # there by tests/test_critic_no_verdict_cause.py. An admission, not
          # a guess: the defect this step is fixing was a line that asserted
          # more than the run supported, and a different assertion is not the
          # remedy for that.
          UNKNOWN_CAUSE="the gate could not tell which way the verdict file was unusable, so this line will not guess — the job log is where the answer still is"

          # One attempt, described as what it actually did.
          attempt_line() {
            case "$2" in
              completed_no_verdict)
                if [ -n "${3:-}" ]; then WHY="$4"; else WHY="$UNKNOWN_CAUSE"; fi
                printf 'attempt %s finished cleanly and wrote no verdict (%s)' "$1" "$WHY" ;;
              turn_exhaustion)
                printf 'attempt %s ran out of turns' "$1" ;;
              crash)
                printf 'attempt %s crashed' "$1" ;;
              *)
                printf 'attempt %s left no execution record' "$1" ;;
            esac
          }

          if [ "${A1_OUTCOME:-}" = "turn_exhaustion" ] || [ "${A2_OUTCOME:-}" = "turn_exhaustion" ]; then
            echo "::error::QA critic ran out of turns before it produced a verdict — turn exhaustion, not a crash. The reviewer authenticated and did real work; no credential needs rotating. Split this pull request, or check that pr_size_strategy.py routed it to the multi-pass review."
          elif [ "${A1_OUTCOME:-}" = "completed_no_verdict" ] || [ "${A2_OUTCOME:-}" = "completed_no_verdict" ]; then
            # DRE-3304. The reviewer authenticated, reviewed, exited cleanly
            # and left nothing the gate could read. Ordered AFTER turn
            # exhaustion for DRE-2924's reason — exhaustion is the actionable
            # cause and its remedy is not this one's — and BEFORE the crash
            # wording, which may only describe an attempt that actually died.
            if [ "${A1_OUTCOME:-}" = "${A2_OUTCOME:-}" ] && [ "${A1_CAUSE:-}" = "${A2_CAUSE:-}" ]; then
              # Both the same, which is the case worth noticing: the retry
              # changed nothing. Say it once and say it landed twice, rather
              # than printing the same sentence twice and burying that.
              if [ -n "${A1_CAUSE:-}" ]; then WHY="$A1_CAUSE_TEXT"; else WHY="$UNKNOWN_CAUSE"; fi
              DESC="attempt 1 and attempt 2 both finished cleanly and wrote no verdict ($WHY)"
            else
              DESC="$(attempt_line 1 "${A1_OUTCOME:-}" "${A1_CAUSE:-}" "${A1_CAUSE_TEXT:-}")"
              DESC="$DESC; $(attempt_line 2 "${A2_OUTCOME:-}" "${A2_CAUSE:-}" "${A2_CAUSE_TEXT:-}")"
            fi
            # The no-credential claim is made about the attempts it is TRUE
            # of. When one attempt genuinely died and the other merely
            # finished empty, the reviewer did not "exit cleanly" and this
            # line does not say it did — asserting one attempt's story over
            # both is the fault being fixed here, pointed the other way.
            CLEAN=""
            if [ "${A1_OUTCOME:-}" = "completed_no_verdict" ] && [ "${A2_OUTCOME:-}" = "completed_no_verdict" ]; then
              CLEAN=" The reviewer authenticated, did real work and exited cleanly both times, so no credential needs rotating on the strength of this line."
            fi
            echo "::error::QA critic finished without writing a verdict.${CLEAN} ${DESC}. Run: ${RUN_URL:-unknown}. Posted neutral status; failing job for medic visibility."
          else
            echo "::error::QA critic crashed on both attempts — no real verdict. Posted neutral status; failing job for medic visibility."
          fi
          exit 1

      # Fail fast past the SECOND size threshold (DRE-2466). Ordered last for
      # the same reason as the step above: the comment and the head-bound
      # check are already posted, so the red is visible with its explanation
      # attached. No inference was spent getting here — the whole point is to
      # stop paying full price to fail (portico PR #297: four executions,
      # $12.40, no verdict, PR shipped unreviewed anyway).
      #
      # The message names the MEASURED size and asks for a split. It claims
      # nothing about credentials: the reason is known exactly, and borrowing
      # the crash wording is what sent people credential-hunting for a day
      # (DRE-2465).
      - name: Fail fast — pull request too large to review
        id: oversize_fail
        if: always() && !cancelled() && steps.decide.outputs.review == 'true' && steps.size.outputs.strategy == 'oversized'
        run: |
          echo "::error::QA critic declined this pull request: ${{ steps.size.outputs.files }} files / ${{ steps.size.outputs.lines }} changed lines is past the reviewable limit. No review was attempted. Split it into smaller pull requests and each part gets a full review."
          exit 1
