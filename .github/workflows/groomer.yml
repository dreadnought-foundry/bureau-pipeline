# The groomer (DRE-2683): sequence the whole Intake population into cycles and
# propose ONE batch — Portico first — for the CEO to approve. `propose` writes
# nothing but a comment; `drain` moves the approved batch to Planning and
# refuses without an approval naming that exact batch.
#
# WHEN IT RUNS — three decisions, in order. D5 (DRE-2683, approved 2026-08-23):
# on demand, until the groomer's judgement has been audited — a groomer running
# unattended over two hundred cards before anyone has checked its calls is the
# same mistake as trusting a critic's verdicts before comparing them to a
# held-back set. The amendment (DRE-3337, green-lit 2026-09-08): the drain may
# also be fired by the CEO's Approve on the console, as a `groom-drain`
# `repository_dispatch` that reaches `drain` and nothing else. The morning
# proposal (DRE-3586's signed answer, 2026-09-21, absorbed by DRE-4677): a
# `schedule` at 06:00 PT runs `propose` and only `propose`, behind a gate job
# that checks the PT clock and the standing card (DRE-4688); the drain still
# needs the CEO's Approve. So the calling stub carries three triggers — a
# `workflow_dispatch`, the `groom-drain` dispatch, and the gated schedule — and
# tests/test_groomer_wiring.py fails the build if that trigger set widens, if
# the scheduled job's `mode` is anything but the literal `propose`, or if
# `propose` becomes reachable from the approval dispatch.
#
# THREE JOBS (DRE-4972): `groom` computes the proposal and posts nothing,
# `verify` runs one read-only agent per Planning and spare card against that
# card's repo on its default branch, and `post` writes the verdicts onto the
# record and posts it — so the proposal reaches the card only after the matrix
# finishes. On a drain `verify` and `post` are skipped and `groom` runs the
# drain exactly as before.
#
# A FOURTH, BETWEEN THEM (DRE-5429): `lookup` runs the GitHub half of the
# card lookups once per owner in the roster, each leg on that owner's own App
# token, and the verify legs fold the documents into their targets. It is
# skipped on a drain with the other two.
#
# Reusable workflow: permissions live in the calling stub (contents: read).
name: Groomer (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkout (scripts). REQUIRED
          since DRE-2689: a caller must pass the same ref it pins in `uses:`,
          or it runs channel workflow YAML over another ref's scripts.
        type: string
        required: true
      mode:
        description: >-
          `propose` reads and writes nothing but a comment. `drain` moves the
          APPROVED batch onward, and refuses without an approval naming that
          batch. Default is the read-only one.
        type: string
        required: false
        default: propose
      lane:
        description: the lane to groom
        type: string
        required: false
        default: Intake
      capacity:
        description: how many cards one cycle is proposed at a time
        type: string
        required: false
        default: "20"
      batch_cycles:
        description: how many cycles the batch covers
        type: string
        required: false
        default: "1"
      priority:
        description: comma-separated repo slugs, highest first
        type: string
        required: false
        default: portico
      card:
        description: >-
          the card the proposal is posted to, and where its approval is read
          from. REQUIRED for `drain`.
        type: string
        required: false
        default: ""
      intake_hold:
        description: >-
          THE PEN'S SWITCH (DRE-3035), and since DRE-4141 the only reader
          of it. Set, `drain` refuses before any write and says so — `propose`
          is untouched, because a held pen still wants a batch prepared for
          the day it opens. The drain is the one thing this holds: the
          sweep's age-out is gone, and the sweep's Urgent fast path
          (DRE-4150) does not wait on the hold, by the CEO's signed answer.
        type: string
        required: false
        default: ""
      judgement:
        description: >-
          `on` runs the judged read (DRE-3150) — ONE model call over the whole
          census. Anything else passes `--no-judgement` and sequences by the
          rules alone, which is today's groomer byte-for-byte, so the two
          readings can be compared on one population.
        type: string
        required: false
        default: "on"
      dry_run:
        description: >-
          `true` demonstrates a proposal and writes NOTHING to the card
          (DRE-3712) — no `🧺 groom-proposal:`, no `🧠 model-attempt:` receipt.
          The whole page goes to the run log and the step summary instead. The
          2026-09-04 demonstration had no such switch, so it ran as an ordinary
          `--post` and sat in the CEO's Green Light for eight days. Anything
          but `true` is a real propose.
        type: string
        required: false
        default: ""
      lookup_budget:
        # The request budget each lookup leg may spend (DRE-5429), passed as
        # `--budget "$LOOKUP_BUDGET"` on EVERY run. The three readings are
        # DRE-5308's `groom_lookups.parse_budget`, not restated here: empty is
        # the ordinary morning, and `0` is how a proof produces a morning on
        # which every file-naming card's lookup failed without touching a
        # secret. Anything else is refused before any request, a red leg.
        description: >-
          empty = sized from the token's own bucket; 0 = spend nothing; a whole
          number = the cap on requests per owner
        type: string
        required: false
        default: ""
    secrets:
      LINEAR_API_KEY:
        required: true
      # The judged read's credential (DRE-3153). A reusable workflow sees ONLY
      # the secrets it declares — `secrets: inherit` on the calling stub passes
      # nothing a block like this does not name — so without these two lines
      # DRE-3150's one call is unreachable from the workflow that actually runs
      # the groomer. Both OPTIONAL: `CLAUDE_AUTH_MODE` decides which of the two
      # a repo sets, and requiring both would refuse every repo in the fleet.
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      # The context pack's merged-PR read (DRE-4964). Declared for the same
      # reason as the two above — undeclared, `secrets: inherit` hands the
      # mint below nothing. OPTIONAL: a repo without the App still grooms, and
      # its merged-PR section is named unread with the reason.
      BUREAU_APP_ID:
        required: false
      BUREAU_APP_PRIVATE_KEY:
        required: false

jobs:
  groom:
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    # READ OFF THE CALL'S OWN CEILING, not guessed (DRE-3153). DRE-3259 sizes
    # the judged read's wall clock from the census and names the widest one as
    # `groom_judgement.MAX_WALL_CLOCK_SECONDS` — `wall_clock_seconds(
    # OUTPUT_CEILING)`, 860 s at the constants it fences. 20 covers that plus
    # five minutes for the non-model work the step does (reading a 226-card
    # lane, the context pack, the proposal comment); the 15 it replaces does
    # not. `tests/test_groomer_wiring.py` asserts this number against that
    # constant rather than restating either, so a card that raises the ceiling
    # turns the build red instead of leaving the job killed mid-call.
    # 35 since DRE-3331: the ceiling doubled once the budget learned that the
    # model's thinking is billed against it — the widest call is now 1,660s.
    timeout-minutes: 35
    concurrency:
      group: groomer
      cancel-in-progress: false
    # The verify matrix's rows (DRE-4972): `[{"card": "DRE-N", "repository":
    # "<owner/repo>" | ""}, …]`, compacted onto one line. Empty on a drain.
    # `lookup_owners` (DRE-5429): the lookup job's matrix, every owner in the
    # roster as a JSON list.
    outputs:
      verify_matrix: ${{ steps.groom.outputs.verify_matrix }}
      lookup_owners: ${{ steps.owners.outputs.owners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      # THE LOOKUP LEGS' OWNERS (DRE-5429). The reader `fleet-wake.yml` builds
      # its matrix with, over the pipeline's own `config/repo-map.json`, so a
      # repo onboarded into the map is looked up with no second edit. Skipped
      # on `drain`, which runs no lookup.
      - name: Owners in the roster
        id: owners
        if: ${{ inputs.mode != 'drain' }}
        run: python3 .bureau-pipeline/scripts/release_train.py wake-owners

      # THE MERGED-PR READ'S TOKEN (DRE-4964). The Groom step had no
      # `GH_TOKEN`, so its `gh` read exited rc=4 on every run and the proposal
      # judged every card without knowing what had already shipped.
      # `github.token` is not the answer: it cannot see the fleet's private
      # repositories. The Bureau App's installation token can, for the owners
      # the App is installed on; `groom_context.read_merged_prs` asks the token
      # which those are and names every other owner unread.
      #
      # `continue-on-error`: a mint that fails renders an empty token, the read
      # names the section unread with the reason, and the proposal still
      # posts. Skipped on `drain`, which builds no context pack.
      - name: Mint the Bureau App token (merged-PR read)
        id: app
        if: ${{ inputs.mode != 'drain' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      - name: Groom
        # Identified for the death-cause receipt at the foot of this job
        # (DRE-4340): GitHub's own outcome for this step is what says whether
        # the judged read ran at all, because the read goes through
        # `planning_classify` and writes no execution record for a classifier
        # to load.
        id: groom
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # The judged read's credential (DRE-3153), gated on `CLAUDE_AUTH_MODE`
          # exactly the way plan.yml's classify step gates it — one reading of
          # which credential this run holds, and `planning_classify.api_key_mode`
          # picks the transport off the credential rather than off a mode name,
          # so a subscription token never reaches the raw Messages API
          # (DRE-3074). The wiring test reads plan.yml's expression instead of
          # restating it, so the two cannot drift apart.
          #
          # Wrapped in ONE extra guard: `drain` reads the approval and moves
          # cards, it never judges, so that branch is handed no model
          # credential at all.
          ANTHROPIC_API_KEY: ${{ inputs.mode != 'drain' && (vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '') || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.mode != 'drain' && (vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '') || '' }}
          # The merged-PR read's credential (DRE-4964) — the name is the
          # contract `groom_context.TOKEN_ENV` reads, and the per-card read too.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          LANE: ${{ inputs.lane }}
          CAPACITY: ${{ inputs.capacity }}
          BATCH_CYCLES: ${{ inputs.batch_cycles }}
          PRIORITY: ${{ inputs.priority }}
          CARD: ${{ inputs.card }}
          INTAKE_HOLD: ${{ inputs.intake_hold }}
          JUDGEMENT: ${{ inputs.judgement }}
        run: |
          set -euo pipefail
          # Every input through env, never interpolated into the shell line.
          SHAPING=(--lane "$LANE" --capacity "$CAPACITY"
                   --batch-cycles "$BATCH_CYCLES" --priority "$PRIORITY")
          if [ "$MODE" = "drain" ]; then
            if [ -z "$CARD" ]; then
              echo "drain needs the card the approval lives on" >&2
              exit 1
            fi
            # NO shaping flags (DRE-3338): the batch a drain moves is READ off
            # the approved proposal comment on the card, so there is nothing
            # for --capacity/--batch-cycles/--priority to shape. `--lane` is
            # only the fallback for a record whose own lane line is unreadable.
            python3 .bureau-pipeline/scripts/groomer.py drain \
              --card "$CARD" --lane "$LANE" | tee proposal.txt
          else
            # COMPUTE, NEVER POST (DRE-4972). `--card` reads the card's whole
            # thread — a held repo, an excluded card, an open decline — and
            # posts nothing: the `post` job posts the
            # record once the verify matrix has checked it (DRE-4971). The
            # dry-run switch (DRE-3712) moved there with the post.
            THREAD=()
            if [ -n "$CARD" ]; then THREAD=(--card "$CARD"); fi
            # Anything but `on` runs the rules alone — DRE-3150's own flag,
            # unchanged, so the switch and the CLI are one contract.
            JUDGE=()
            if [ "$JUDGEMENT" != "on" ]; then JUDGE=(--no-judgement); fi
            # `--keep-answer` (DRE-3331): the ranked read's raw answer, kept
            # for the artifact below. Model output over card text — an
            # artifact, never a comment. Absent when no call answered.
            python3 .bureau-pipeline/scripts/groomer.py propose \
              "${SHAPING[@]}" "${JUDGE[@]}" "${THREAD[@]}" \
              --keep-answer judgement-answer.txt \
              --out proposal.json | tee proposal.txt
            # The cards the verify matrix checks (DRE-4970): the Planning
            # list and the spares behind it, each card's text read HERE —
            # this job holds the Linear key and the verify job never does —
            # and sanitized before it is written. `matrix.json` marks a card
            # whose repo is not in config/repo-map.json with `repository: ""`.
            python3 .bureau-pipeline/scripts/groom_verify_agent.py targets \
              --proposal proposal.json --out verify-targets.json \
              --matrix-out matrix.json
            # One line, because a job output is one `key=value` line.
            echo "verify_matrix=$(python3 -c 'import json, sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' matrix.json)" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Groomer — $MODE"
            echo
            cat proposal.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the proposal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groom-proposal
          path: |
            proposal.json
            proposal.txt
            judgement-answer.txt
            verify-targets.json
          if-no-files-found: ignore
          retention-days: 30

      # THE RUN'S OWN DEATH-CAUSE RECEIPT (DRE-4340). 69 of the fleet's 1,310
      # failures over 22 days — $97 of model work — could not be attributed to
      # any cause, because the workflow they died in wrote nothing down. This
      # was one of them: the judged read is a model call, so this job can die
      # of a model cause, and until now nothing here said so.
      # `scripts/check_death_receipts.py` discovers every reusable workflow
      # that runs a model and fails the build when one writes no receipt.
      #
      # NO EXECUTION RECORD HERE, deliberately. The judged read goes through
      # `planning_classify`, not the vendor action, so there is no
      # `claude-execution-output.json` for the classifier to read — which is
      # precisely why `--step-outcome` is threaded: GitHub's own word on the
      # Groom step is what separates a model death from a death before the
      # model started (DRE-2931). The receipt records `unknown` WITH the
      # reason rather than guessing a cause off a record that does not exist.
      #
      # `always()` + `continue-on-error`: the receipt must be written for the
      # runs that died and must never change this job's own conclusion. Every
      # `${{ }}` is in env:, never in the script.
      - name: Keep the run's death-cause receipt
        id: death
        if: always()
        continue-on-error: true
        env:
          MODEL_STEP_OUTCOME: ${{ steps.groom.outcome }}
          JOB_STATUS: ${{ job.status }}
          CARD: ${{ inputs.card }}
          CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH_MODE }}
        run: |
          python3 .bureau-pipeline/scripts/death_receipt.py emit \
            --execution-file /home/runner/work/_temp/claude-execution-output.json \
            --out "${RUNNER_TEMP:-/tmp}/death-receipt.json" \
            --job-status "$JOB_STATUS" \
            --step-outcome "$MODEL_STEP_OUTCOME" \
            --card "$CARD" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the death-cause receipt
        if: always() && steps.death.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: death-receipt-${{ github.job }}-attempt${{ github.run_attempt }}
          path: ${{ steps.death.outputs.path }}
          if-no-files-found: warn
          retention-days: 90

  # THE LOOKUPS, ONE LEG PER OWNER (DRE-5429). The GitHub half of DRE-5308's
  # lookups reaches every repo in config/repo-map.json, and those repos sit
  # under three owners. An App installation token is scoped to ONE
  # installation, so the groom job's token — minted with no `owner:` — is
  # refused for every repo outside its own owner. Each leg here mints for its
  # own owner, the shape `fleet-wake.yml` uses for the same reason, runs
  # `groom_lookups.py owner` and uploads one document; the verify legs fold
  # them into the targets.
  #
  # WHAT THIS JOB HOLDS: a token that reads contents and pull requests on one
  # owner's installation, and nothing else — no Linear key, no model
  # credential. A leg whose mint failed still runs the script, which records
  # the owner unread with the reason (`no token for <owner>`).
  #
  # THE CLOCK, sized from the script's own: the leg stops asking at
  # `groom_lookups.MAX_SECONDS` (300 s), one call holds it past that by at most
  # `REQUEST_TIMEOUT` (20 s), and it then writes its document. Nine minutes
  # leave the mint, the download and the upload three minutes around that
  # 320 s, so the job's kill never arrives before the script's own stop.
  # tests/test_groomer_wiring.py asserts the number against both constants,
  # and asserts their sum fits the morning's headroom before 06:30 PT. A leg
  # the job does kill uploads nothing, and `fold` names that owner
  # `no lookup record for <owner>`; the run concludes `failure` and the medic
  # sees it, which is right for a leg that did not stop itself.
  lookup:
    needs: groom
    if: ${{ inputs.mode != 'drain' && needs.groom.outputs.verify_matrix != '' && needs.groom.outputs.verify_matrix != '[]' }}
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 9
    strategy:
      # One owner's missing installation never cancels the other owners'.
      fail-fast: false
      matrix:
        owner: ${{ fromJSON(needs.groom.outputs.lookup_owners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Download the proposal and its targets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: groom-proposal

      # Per owner, read-only, at the pin every mint in this file uses.
      # `continue-on-error`: a failed mint renders an empty token, and the
      # step below names the owner unread rather than the leg dying unsaid.
      - name: Mint a read-only token for this owner
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          permission-contents: read
          permission-pull-requests: read

      # No `if`: a leg with no token still writes its document. Every input
      # through env, never interpolated into the shell line, and `--budget`
      # on every run — empty is "no budget given" to `parse_budget`.
      - name: Look up this owner's repos
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ matrix.owner }}
          LOOKUP_BUDGET: ${{ inputs.lookup_budget }}
        run: |
          python3 .bureau-pipeline/scripts/groom_lookups.py owner \
            --owner "$OWNER" --targets verify-targets.json \
            --out "lookups-$OWNER.json" --budget "$LOOKUP_BUDGET"

      # `overwrite`: re-running one leg re-uploads its artifact, and `fold`
      # reads whatever is in the directory.
      - name: Keep this owner's lookups
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groom-lookups-${{ matrix.owner }}
          path: lookups-${{ matrix.owner }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # THE VERIFY MATRIX (DRE-4972, epic of DRE-4966..4971). One read-only agent
  # per card the proposal would put in front of the CEO — the Planning list and
  # the spares behind it — reading that card's repo on its default branch and
  # answering `still-needed`, `done`, `obsolete` or `unverified` with proof.
  # DRE-2382's answer was in code (its file still existed, and only a reader of
  # it could see the card no longer applied), and the groom job reads no code.
  #
  # WHAT THIS JOB HOLDS, deliberately: no Linear key anywhere (the card text
  # was read and sanitized by `targets` in the groom job), a GitHub App token
  # minted for ONE repository with `contents: read`, a checkout that keeps no
  # credential, and a model whose tool set is Read/Glob/Grep/Write. A model
  # over untrusted card text holds no token that can write code or Linear.
  #
  # `fail-fast: false`: one dead card never cancels its siblings, and every
  # leg writes its `verdict.json` on `always()` — a leg that dies is
  # `unverified`, never `still-needed`. The matrix ceiling is 256 legs; the
  # morning is at most capacity 20 plus 10 spares.
  #
  # A CARD WHOSE REPO IS NOT IN config/repo-map.json arrives with
  # `matrix.repository == ''`. On that leg the token, the checkout, the
  # install and the agent are skipped — no code is read and no model is called
  # — and `prepare` and `verdict` still run, so the leg uploads a verdict that
  # says `unverified` and names the slug. No verdict is ever formed from card
  # text alone.
  #
  # `always()` over `needs: [groom, lookup]` (DRE-5429): a lookup leg that
  # died never stops the matrix. Its owner has no document, `fold` names it
  # `no lookup record for <owner>`, and the cards it held are judged with that
  # said. Only a groom that did not succeed stops it.
  verify:
    needs: [groom, lookup]
    if: ${{ always() && inputs.mode != 'drain' && needs.groom.result == 'success' && needs.groom.outputs.verify_matrix != '' && needs.groom.outputs.verify_matrix != '[]' }}
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.groom.outputs.verify_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Download the proposal and its targets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: groom-proposal

      # NOT merged, the post job's verdict download copied: every leg's
      # artifact lands in its own subdirectory, so the dreadnought-foundry
      # document is at
      # `lookups/groom-lookups-dreadnought-foundry/lookups-dreadnought-foundry.json`
      # — never at `lookups/lookups-<owner>.json`. `fold` walks the directory
      # at every depth and reads each document's owner off its `owner` key.
      # `continue-on-error`: no artifact at all is every owner unread, not a
      # leg that never reaches its verdict.
      - name: Download every owner's lookups
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: groom-lookups-*
          path: lookups
          merge-multiple: false

      # Before `prepare`, so it fences the lookup evidence and `verdict` reads
      # the row's `lookups` field. `mkdir -p`: on a morning no leg uploaded,
      # the download above created nothing.
      - name: Fold the lookups into the targets
        run: |
          set -euo pipefail
          mkdir -p lookups
          python3 .bureau-pipeline/scripts/groom_lookups.py fold \
            --targets verify-targets.json --lookups-dir lookups \
            --out verify-targets.json

      # The agent's whole input, and the moment it started. No `if`: on an
      # unmapped repo `prepare` writes the one line that says the card is not
      # verifiable and starts the clock all the same, so the verdict below has
      # a leg to describe. It also splits `owner/repo` for the token's scope —
      # an expression has no split, and the matrix row is the contract.
      - name: Prepare the agent's input
        id: prepare
        env:
          CARD: ${{ matrix.card }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          python3 .bureau-pipeline/scripts/groom_verify_agent.py prepare \
            --targets verify-targets.json --card "$CARD" --out verify-input.md \
            --started-at-out started.txt
          if [ -n "$REPOSITORY" ]; then
            echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
            echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          fi

      # READ-ONLY, ONE REPOSITORY. The same pin reconcile.yml mints with, and
      # the App pair DRE-4964 declared optional above. The App must be
      # installed on the card's repo; a repo it cannot read fails here or at
      # the checkout, `continue-on-error` keeps the leg alive, and the agent
      # below does not run without the code — so the verdict is `unverified`,
      # never `still-needed`.
      - name: Mint a read-only token for the card's repo
        id: target_token
        if: ${{ matrix.repository != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: ${{ steps.prepare.outputs.owner }}
          repositories: ${{ steps.prepare.outputs.name }}
          permission-contents: read

      # The default branch — no `ref` — and no credential left on disk.
      - name: Check out the card's repo
        id: target
        if: ${{ matrix.repository != '' && steps.target_token.outcome == 'success' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          token: ${{ steps.target_token.outputs.token }}
          path: target
          persist-credentials: false

      - uses: ./.bureau-pipeline/.github/actions/install-claude-code
        id: install_claude
        if: ${{ matrix.repository != '' && steps.target.outcome == 'success' }}

      # Model selection for the verify agent, medic.yml's shape: the id and the
      # level it runs at come from config/models.yaml (agent `verifier`, the
      # ADVISORY ladder — a bounded read-only check, not build work), never a
      # pinned id and never the harness default (DRE-4836: an agent step that
      # passes no effort runs at Opus 5.5's own `medium`).
      - name: Select model
        id: model
        if: ${{ matrix.repository != '' && steps.target.outcome == 'success' && steps.install_claude.outcome == 'success' }}
        env:
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          WHY_FILE="$RUNNER_TEMP/model-why.txt"
          EFFORT_FILE="$RUNNER_TEMP/model-effort.txt"
          MODEL=$(python3 .bureau-pipeline/scripts/model_fallback.py select verifier \
            --explain-file "$WHY_FILE" --effort-file "$EFFORT_FILE")
          WHY=$(cat "$WHY_FILE")
          EFFORT=$(cat "$EFFORT_FILE" 2>/dev/null || true)
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "effort_arg=${EFFORT:+--effort $EFFORT}" >> "$GITHUB_OUTPUT"
          echo "selected model: $MODEL (agent: verifier, groom verify)"
          case "$WHY" in DEGRADED*) echo "::warning::$WHY" ;; esac

      # THE AGENT. Through the vendor action, never a raw Messages API call: a
      # subscription token answers 429 to every raw request (DRE-3074). The
      # two credential inputs are plan.yml's classify-step grammar, read by
      # tests/test_groomer_wiring.py rather than restated there.
      #
      # NO `LINEAR_API_KEY`, DELIBERATELY (DRE-2696 is the rule this omits).
      # The tool set is Read/Glob/Grep/Write — no Bash — so the agent could
      # not run linear_ops.py if it held the key, and it posts no heartbeat.
      # The waiver and its reason are pinned in tests/test_agent_linear_key.py.
      #
      # FIXED TEXT, AND NOTHING INTERPOLATED INTO IT. The card arrives inside
      # verify-input.md, fenced and sanitized by `targets`
      # (standards/untrusted-content.md).
      - name: Verify the card against main
        id: claude
        if: ${{ matrix.repository != '' && steps.target.outcome == 'success' && steps.install_claude.outcome == 'success' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          path_to_claude_code_executable: ${{ steps.install_claude.outputs.executable }}
          anthropic_api_key: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ github.token }}
          # model-trial.yml's agent step verbatim — a second, drifting list is
          # how DRE-2020/DRE-2053 happened — PLUS `agent-bureau-qa-bot`
          # (DRE-5123). A `schedule` run initiates as whoever last changed the
          # workflow on the default branch, and the qa-bot merges every PR
          # here, so all 29 legs of the first scheduled morning (run
          # 36426267250) aborted on the actor gate. Safe to admit: it is our
          # own merger, the input is our own board, and this step is
          # read-only (Read/Glob/Grep/Write, no token that can write).
          # Pinned in tests/test_scheduled_claude_allowed_bots.py.
          allowed_bots: agent-bureau-bot,agent-bureau-bot-2,agent-bureau-bot-3,agent-bureau-bot-4,agent-bureau-qa-bot,github-actions
          claude_args: |
            --max-turns 40
            --model ${{ steps.model.outputs.model }}
            ${{ steps.model.outputs.effort_arg }}
            --allowedTools "Read,Glob,Grep,Write"
          prompt: |
            Read the file verify-input.md at the workspace root and do what it
            says. The repository to check is checked out under target/.

            Write only the one answer file verify-input.md names. Change
            nothing under target/, run no commands, and do not commit, push or
            open a pull request.

      # ALWAYS, and it never trusts the step above: on an unmapped repo the
      # agent step reads `skipped` and `--targets` forces `unverified` naming
      # the slug; a failed or skipped agent is `unverified` with the reason.
      # Every expression is in env:, never in the script.
      - name: Write the verdict
        id: verdict
        if: always()
        env:
          CARD: ${{ matrix.card }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || '/home/runner/work/_temp/claude-execution-output.json' }}
        run: |
          python3 .bureau-pipeline/scripts/groom_verify_agent.py verdict \
            --card "$CARD" --targets verify-targets.json \
            --raw verify-verdict.json --execution-file "$EXECUTION_FILE" \
            --step-outcome "$OUTCOME" --started-at started.txt \
            --out verdict.json

      # `overwrite`: re-running one failed leg re-uploads its artifact.
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groom-verdict-${{ matrix.card }}
          path: verdict.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      # THE LEG'S OWN DEATH-CAUSE RECEIPT (DRE-4340) — this job runs a model,
      # so scripts/check_death_receipts.py requires it. Named per card so
      # thirty legs do not collide on one artifact name.
      - name: Keep the run's death-cause receipt
        id: death
        if: always()
        continue-on-error: true
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL_STEP_OUTCOME: ${{ steps.claude.outcome }}
          JOB_STATUS: ${{ job.status }}
          CARD: ${{ inputs.card }}
          CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH_MODE }}
        run: |
          EXEC_FILE="${CLAUDE_EXECUTION_FILE:-${RUNNER_TEMP:-/tmp}/claude-execution-output.json}"
          python3 .bureau-pipeline/scripts/death_receipt.py emit \
            --execution-file "$EXEC_FILE" \
            --out "${RUNNER_TEMP:-/tmp}/death-receipt.json" \
            --job-status "$JOB_STATUS" \
            --step-outcome "$MODEL_STEP_OUTCOME" \
            --card "$CARD" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the death-cause receipt
        if: always() && steps.death.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: death-receipt-verify-${{ matrix.card }}-attempt${{ github.run_attempt }}
          path: ${{ steps.death.outputs.path }}
          if-no-files-found: warn
          retention-days: 90

  # THE POST (DRE-4972). Nothing reaches the card until here, so a crash
  # before this job leaves no marker and the next run starts clean.
  #
  # `always()`: a failed or skipped verify never stops the proposal posting —
  # every leg wrote its verdict on `always()`, and a target with no verdict
  # artifact at all is marked `unverified` by `apply`. Only a groom that did
  # not succeed stops it, because then there is no record to post.
  post:
    needs: [groom, verify]
    if: ${{ always() && inputs.mode != 'drain' && needs.groom.result == 'success' }}
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    concurrency:
      group: groomer-post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Download the proposal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: groom-proposal

      # NOT merged: every leg's file is `verdict.json`, so merged into one
      # directory they would overwrite one another and `apply` would read one
      # card. Each artifact lands in `verdicts/<artifact>/`, and `apply` reads
      # every `verdict.json` under the directory. `continue-on-error`: no
      # verdict at all (the matrix was skipped, or every leg died before its
      # upload) is every target `unverified`, not a proposal left unposted.
      - name: Download every verdict
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: groom-verdict-*
          path: verdicts
          merge-multiple: false

      - name: Apply the verdicts
        run: |
          set -euo pipefail
          mkdir -p verdicts
          python3 .bureau-pipeline/scripts/groom_verify_agent.py apply \
            --proposal proposal.json --verdicts verdicts \
            --out proposal-verified.json

      # With a card, `post` posts the verified record at most once per id —
      # a re-run of the whole workflow recomputes, and `already_proposed`
      # keeps the second post silent. The dry-run switch (DRE-3712) reads the
      # thread and posts nothing. Without a card there is nowhere to post, and
      # the page is printed for the step summary.
      - name: Post the verified proposal
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CARD: ${{ inputs.card }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -n "$CARD" ]; then
            DRY=()
            if [ "$DRY_RUN" = "true" ]; then DRY=(--dry-run); fi
            python3 .bureau-pipeline/scripts/groomer.py post \
              --card "$CARD" --proposal proposal-verified.json "${DRY[@]}" \
              | tee proposal-verified.txt
          else
            python3 -c 'import json, sys; sys.path.insert(0, ".bureau-pipeline/scripts"); import groomer; print(groomer.render_proposal(json.load(open("proposal-verified.json"))))' \
              | tee proposal-verified.txt
          fi
          {
            echo "### Groomer — the verified proposal"
            echo
            cat proposal-verified.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # The receipt (DRE-3153): which model answered, and what the one call
      # cost. Same `🧠 model-attempt:` marker plan.yml posts for the planning
      # classifier, so the ladder's readers find it without learning a second
      # grammar — and composed by a Python reader over the proposal the step
      # above already wrote, never assembled in YAML (DRE-3083: a receipt built
      # in a shell string is a second answer to "which model answered" that
      # nothing tests).
      #
      # The reader decides whether there is anything to post: no comment under
      # `--no-judgement`, and none when no model was ever asked. It writes an
      # EMPTY file rather than failing, so this step never turns a missing
      # footnote into a red run over a proposal sitting on the card exactly as
      # intended (Q5: `proposal.json` is written before anything is posted).
      #
      # In the `post` job since DRE-4972, after the post, so the receipt still
      # lands after the proposal. It reads the verified record, which carries
      # the ranked read's block unchanged.
      #
      # A DRY RUN POSTS NOTHING AT ALL (DRE-3712), this footnote included. The
      # promise is "no marker", not "no proposal marker" — a receipt comment on
      # a card nobody proposed anything to is the same demonstration leaking
      # into the record.
      - name: Judgement receipt — the model that answered
        if: ${{ inputs.mode != 'drain' && inputs.card != '' && inputs.dry_run != 'true' }}
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CARD: ${{ inputs.card }}
        run: |
          set -euo pipefail
          python3 .bureau-pipeline/scripts/groomer_receipt.py \
            --proposal proposal-verified.json --out receipt.txt
          if [ -s receipt.txt ]; then
            python3 .bureau-pipeline/scripts/linear_ops.py comment \
              "$CARD" "$(cat receipt.txt)"
            {
              echo
              cat receipt.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi


      - name: Keep the verified proposal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: groom-proposal-verified
          path: |
            proposal-verified.json
            proposal-verified.txt
          if-no-files-found: ignore
          retention-days: 30
