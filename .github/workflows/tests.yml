# Tests for the central pipeline's own logic. Every product repo inherits
# this code on its next run — changes here must pass these before merging.
name: Pipeline Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: scripts unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The shared plumbing, dogfooded (DRE-2589). This job used to run THREE
      # pip installs — one from the pinned manifest and two of bare `pyyaml`
      # while requirements-dev.txt pins PyYAML — so two of the three took
      # whatever PyPI served that morning and a Dependabot bump of that pin
      # exercised nothing. One install, from the one manifest, cached and
      # skipped on a hit, and measurable because it is its own named step.
      # `./` on purpose: a PR's own run exercises the action from that PR.
      #
      # NAMED, because GitHub's jobs API reports a composite action as ONE
      # step under the caller's name (measured on run 32421767876). An
      # unnamed `uses:` would be reported as "Run ./.github/actions/
      # setup-python-cached", which ci_minutes_report.py cannot attribute.
      - name: Install test tooling (cached)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          requirements: |
            requirements-dev.txt
      # pytest, not stdlib unittest discover: half the suite is written
      # pytest-style (function tests), which unittest discover silently
      # collects as ZERO tests — they had never run in CI before this.
      - name: Unit tests
        env:
          LINEAR_API_KEY: test-key
          REPO: test/test
          GH_TOKEN: test
        run: python3 -m pytest tests -v
      - name: Workflow YAML parses
        run: python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('yaml ok')"
      # Release-channel integrity (DRE-2026): every internal checkout of
      # bureau-pipeline must thread the pipeline_ref input, or a stub pinned
      # to @vN silently runs scripts/briefs/standards from @main.
      - name: pipeline_ref threading check
        run: python3 scripts/check_pipeline_ref.py
      # One WIP cap (DRE-2529): every path that promotes cards must take the
      # caller's `max_wip`, never a literal. A hardcoded cap makes a repo's
      # deliberate override inert on that path — silently, and only inside
      # the WIP band the fast path exists for.
      - name: WIP cap single-source check
        run: python3 scripts/check_wip_cap.py
      # Red-main watcher coverage (DRE-2820): the repair rail watched ONE
      # workflow by name, the harness shipped as a second one, and a red main
      # was invisible for fourteen hours. The watched set is derived from the
      # workflow files here — adding a workflow with no watcher fails this
      # build rather than adding a silent failure surface.
      - name: Red-main watcher coverage check
        run: python3 scripts/check_workflow_watchers.py
      # Inline agent prompts (DRE-2727): `briefs/` and `standards/` are the
      # obvious surface for "what the agents are told" and they miss the
      # prompts written in prose inside these workflow files. medic.yml told
      # its agent to look for an existing failure card in three named lanes;
      # rename one and a repeatedly-failing workflow mints a fresh card on
      # every failure. Nothing else in the repo reaches that class.
      - name: Workflow prompts name only live lanes
        run: python3 scripts/check_workflow_prompts.py
      # The act registry, and the emission that makes it real (DRE-2825/2826).
      # The first binds the registry to the code — every declared act is
      # emitted, every emitted tag is declared. The second binds the code to
      # the registry: every `gh pr comment` / `gh issue comment` /
      # `_post_pr_note` / `linear_ops.cmd_comment` either composes its body
      # through pipeline_act.receipt() or is named in the `unconverted` block
      # with the reason — the last of those four being how a CARD comment is
      # posted, which is most of them. Without the
      # second, this stays true for exactly as long as nobody adds a recovery
      # in a hurry — and a receipt with no trailer looks like nothing happened,
      # which is the failure signature the whole wave is named after.
      - name: Act registry binds to the code that emits it
        run: python3 scripts/pipeline_act.py check
      - name: Every receipt composes through the one writer
        run: python3 scripts/check_act_receipts.py

  # TDD commit discipline (DRE-2022): this repo's PRs are hand-built, so the
  # rail's test-first order is enforced mechanically here — a commit touching
  # tests/ must precede the first commit changing non-test code (docs-only
  # and ops-only PRs exempt). Head-suite greenness is the `unit` job's job.
  tdd:
    name: TDD commit discipline
    # push runs (main) have no PR commit list to judge — PR events only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the check walks the PR's whole commit list
      - name: RED test precedes implementation
        env:
          # Through env, never interpolated into the shell line — a crafted
          # branch name must not become shell input.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The author decides the dependabot exemption (DRE-2049) —
          # GitHub-attested identity, never the spoofable branch name.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 scripts/check_tdd_commits.py "origin/$BASE_REF" "$HEAD_SHA"
