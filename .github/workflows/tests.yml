# Tests for the central pipeline's own logic. Every product repo inherits
# this code on its next run — changes here must pass these before merging.
name: Pipeline Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: scripts unit tests
    runs-on: ubuntu-latest
    # The one job here that runs the WHOLE suite, so the only one whose clock
    # tracks the suite's growth (DRE-3130). It sat at 5 until run 33987398284
    # reported `6277 passed, 1 skipped, 649 subtests passed in 299.47s` and was
    # cancelled four seconds later at 5m10s — a required check red on a suite
    # that had already proved itself. The cap was spent before that PR existed:
    # the fifteen main runs before it ranged 3m11s to 4m44s, i.e. 16 seconds of
    # headroom against 93 seconds of run-to-run spread. A budget narrower than
    # its own variance is a coin flip. 10 is ~2x the longest real run, matching
    # the other 10-minute jobs in this repo; `tests/test_unit_suite_time_budget.py`
    # holds it there and carries the measurements.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The shared plumbing, dogfooded (DRE-2589). This job used to run THREE
      # pip installs — one from the pinned manifest and two of bare `pyyaml`
      # while requirements-dev.txt pins PyYAML — so two of the three took
      # whatever PyPI served that morning and a Dependabot bump of that pin
      # exercised nothing. One install, from the one manifest, cached and
      # skipped on a hit, and measurable because it is its own named step.
      # `./` on purpose: a PR's own run exercises the action from that PR.
      #
      # NAMED, because GitHub's jobs API reports a composite action as ONE
      # step under the caller's name (measured on run 32421767876). An
      # unnamed `uses:` would be reported as "Run ./.github/actions/
      # setup-python-cached", which ci_minutes_report.py cannot attribute.
      - name: Install test tooling (cached)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          requirements: |
            requirements-dev.txt
      # pytest, not stdlib unittest discover: half the suite is written
      # pytest-style (function tests), which unittest discover silently
      # collects as ZERO tests — they had never run in CI before this.
      - name: Unit tests
        env:
          LINEAR_API_KEY: test-key
          REPO: test/test
          GH_TOKEN: test
        run: python3 -m pytest tests -v
      - name: Workflow YAML parses
        run: python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('yaml ok')"
      # Release-channel integrity (DRE-2026): every internal checkout of
      # bureau-pipeline must thread the pipeline_ref input, or a stub pinned
      # to @vN silently runs scripts/briefs/standards from @main.
      - name: pipeline_ref threading check
        run: python3 scripts/check_pipeline_ref.py
      # One WIP cap (DRE-2529): every path that promotes cards must take the
      # caller's `max_wip`, never a literal. A hardcoded cap makes a repo's
      # deliberate override inert on that path — silently, and only inside
      # the WIP band the fast path exists for.
      - name: WIP cap single-source check
        run: python3 scripts/check_wip_cap.py
      # reconcile.py call sites (DRE-3042): a workflow step that runs the
      # sweep is a call site, and the sweep takes its arguments from the
      # environment. linear-sync's conflict sweep never set REPO_SLUG —
      # absence there does not raise, it defaults, so the step dispatched a
      # workflow this repo cannot dispatch and died having dispatched nothing
      # while a conflicted PR (#244) sat unnoticed. A missing variable is a
      # missing argument, and it belongs in this build, not in a live sweep.
      - name: reconcile.py call sites pass their arguments
        run: python3 scripts/check_reconcile_env.py
      # Red-main watcher coverage (DRE-2820): the repair rail watched ONE
      # workflow by name, the harness shipped as a second one, and a red main
      # was invisible for fourteen hours. The watched set is derived from the
      # workflow files here — adding a workflow with no watcher fails this
      # build rather than adding a silent failure surface.
      - name: Red-main watcher coverage check
        run: python3 scripts/check_workflow_watchers.py
      # Inline agent prompts (DRE-2727): `briefs/` and `standards/` are the
      # obvious surface for "what the agents are told" and they miss the
      # prompts written in prose inside these workflow files. medic.yml told
      # its agent to look for an existing failure card in three named lanes;
      # rename one and a repeatedly-failing workflow mints a fresh card on
      # every failure. Nothing else in the repo reaches that class.
      - name: Workflow prompts name only live lanes
        run: python3 scripts/check_workflow_prompts.py
      # The act registry, and the emission that makes it real (DRE-2825/2826).
      # The first binds the registry to the code — every declared act is
      # emitted, every emitted tag is declared. The second binds the code to
      # the registry: every `gh pr comment` / `gh issue comment` /
      # `_post_pr_note` / `linear_ops.cmd_comment` either composes its body
      # through pipeline_act.receipt() or is named in the `unconverted` block
      # with the reason — the last of those four being how a CARD comment is
      # posted, which is most of them. Without the
      # second, this stays true for exactly as long as nobody adds a recovery
      # in a hurry — and a receipt with no trailer looks like nothing happened,
      # which is the failure signature the whole wave is named after.
      - name: Act registry binds to the code that emits it
        run: python3 scripts/pipeline_act.py check
      - name: Every receipt composes through the one writer
        run: python3 scripts/check_act_receipts.py

  # The act registry's CONSUMER (DRE-3091). Its own job, because it is the one
  # check here that leaves the repository: it reads the console's `ACTS` out of
  # agent-bureau and fails when this repo declares an act the console cannot
  # read. The console has always checked this, and only the console did — so it
  # fired in the wrong repo, after the fact, and held every open agent-bureau
  # PR hostage twice in twelve hours (DRE-3081 22:26 PT 2026-09-03, DRE-3090
  # 09:13 PT 2026-09-04) until someone filed a one-line console card.
  #
  # WHY IT IS NOT A STEP IN `unit`: `unit` runs with no secrets and must stay
  # that way, and this needs a token for another repository. Splitting it also
  # keeps the no-skip assertion honest — the guard SKIPS offline (loudly, with
  # the reason) so every other run of the suite stays green without a token,
  # and it is this job, and only this job, where a skip is red.
  acts-consumers:
    name: act registry consumers
    # Premortem Q1/Q2 (DRE-2047/2067): a dependabot-triggered pull_request runs
    # AS dependabot[bot] and gets GitHub's SEPARATE Dependabot secrets store —
    # for us EMPTY — so the mint below would yield nothing, the guard would
    # skip, and the no-skip assertion would turn every dependency bump red on
    # a question no bump can answer. The guard sits on the JOB so no step
    # executes and the run concludes `skipped`, which the merge gate's
    # GREEN_CONCLUSIONS admits (the harness.yml pattern).
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # WHICH RUNS ACTUALLY NEED THE CONSOLE (DRE-3091 review). This job has no
      # path filter — `on: pull_request` with no `paths:` — so without this step
      # every pull request in this repo, whatever it changed, would put another
      # repository's availability in front of its own merge: one transient mint
      # or API blip turns this job red, `merge_gate.py`'s GREEN_CONCLUSIONS
      # rejects a `failure`, and the gate waits on a question that PR never
      # asked. That is the pattern this card exists to END (DRE-3081, DRE-3090),
      # not to relocate from agent-bureau into here. So the CHANGED FILES
      # decide, exactly as `steps.actsreg` decides for the critic's receipt in
      # qa-review.yml, and the load-bearing steps below are gated on the answer.
      # A run that leaves the registry alone skips them and concludes success.
      #
      # FAIL CLOSED: if the file list cannot be read the answer is "yes". A gate
      # that fails open on an API blip is not a gate — it would let exactly the
      # PR this exists to stop through, silently and green.
      - name: Does this run change the act registry?
        id: actsreg
        env:
          GH_TOKEN: ${{ github.token }}
          # PR events compare the base against the head (a three-dot compare —
          # the merge base, so a stale base branch does not invent changes);
          # a push to main compares the range it just pushed.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
               --jq '.files[].filename' > /tmp/acts-changed.txt; then
            if grep -qxF 'config/pipeline-acts.json' /tmp/acts-changed.txt; then
              echo "touched=true" >> "$GITHUB_OUTPUT"
              echo "this run changes the act registry — the console's ACTS will be read"
            else
              echo "the act registry is unchanged — nothing to ask the console"
            fi
          else
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "could not read this run's changed files — asking the console anyway"
          fi
      - name: Install test tooling (cached)
        if: steps.actsreg.outputs.touched == 'true'
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          requirements: |
            requirements-dev.txt
      # Scoped to the console's repository and nothing else. NOT the job's own
      # GITHUB_TOKEN: that one is scoped to this repository, 404s on
      # agent-bureau, and would report "unread" for a reason nobody could act
      # on.
      #
      # `continue-on-error` for the same reason harness.yml:224 and this PR's
      # qa-review.yml mint carry it — agent-bureau is another installation, and
      # a mint that cannot happen must not be an opaque red action step. Here
      # the run still ends red, because on a registry change the console MUST be
      # readable; the difference is that the guard runs, skips, and `assert-ran`
      # below names the reason a person can act on.
      - name: Mint console token (reads agent-bureau's ACTS)
        id: console
        if: steps.actsreg.outputs.touched == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: dreadnought-foundry
          repositories: agent-bureau
      - name: Every declared act is known to the console
        if: steps.actsreg.outputs.touched == 'true'
        env:
          LINEAR_API_KEY: test-key
          REPO: test/test
          GH_TOKEN: test
          BUREAU_CONSOLE_TOKEN: ${{ steps.console.outputs.token }}
        run: |
          python3 -m pytest tests/test_pipeline_acts_consumers.py -v -rs \
            --junit-xml=/tmp/acts-consumers.xml
      # The other half of "skips loudly, never passes silently": in THIS job
      # the console must be readable, so a skipped or empty report is a build
      # that proved nothing and is failed here rather than reported green.
      # `always()` on purpose — a red suite must not hide a skip behind it —
      # but still only on a run that changed the registry, or a missing report
      # would fail every PR that correctly never wrote one.
      - name: The guard did not skip
        if: always() && steps.actsreg.outputs.touched == 'true'
        run: python3 scripts/check_act_consumers.py assert-ran /tmp/acts-consumers.xml

  # TDD commit discipline (DRE-2022): this repo's PRs are hand-built, so the
  # rail's test-first order is enforced mechanically here — a commit touching
  # tests/ must precede the first commit changing non-test code (docs-only
  # and ops-only PRs exempt). Head-suite greenness is the `unit` job's job.
  tdd:
    name: TDD commit discipline
    # push runs (main) have no PR commit list to judge — PR events only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the check walks the PR's whole commit list
      - name: RED test precedes implementation
        env:
          # Through env, never interpolated into the shell line — a crafted
          # branch name must not become shell input.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The author decides the dependabot exemption (DRE-2049) —
          # GitHub-attested identity, never the spoofable branch name.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 scripts/check_tdd_commits.py "origin/$BASE_REF" "$HEAD_SHA"
