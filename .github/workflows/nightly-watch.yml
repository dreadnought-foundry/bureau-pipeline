# The missing-nightly alarm (DRE-4805).
#
# PR CI now runs only the suites a change can reach, and a nightly `schedule:`
# run on `main` runs everything (standards/engineering.md, "CI: narrow per
# change, whole every night"). That makes the nightly the only thing that runs
# the suites a pull request skipped. If it silently stops running, those tests
# are never run again and nobody knows — which is the CEO's decision of
# 2026-09-24 in one line: "we have to have an alarm if the nightly one doesn't
# run so we know that we're not creating tech debt."
#
# A nightly that runs and goes RED already has a rail: Red-Main Repair keys on
# the head branch being the default branch, never on the event, so a scheduled
# run that fails is repaired like a push that fails. What nothing watches is
# the run that NEVER HAPPENS — a schedule GitHub disabled after 60 days of repo
# inactivity, a cron typo, a workflow that errors before any job starts, a run
# stuck in the queue. Nothing fails, because nothing ran.
#
# This file only gathers GitHub's records and acts on the verdict; the
# decision, the thresholds and where they came from live in
# scripts/nightly_watch.py, unit-tested in tests/test_nightly_watch.py. It
# raises its alarm as ONE console alert per condition per owner (DRE-7456),
# through scripts/pipeline_notice.py: `nightly_watch:<owner>:did_not_run` for a
# nightly that did not run and `nightly_watch:<owner>:cannot_read` for a repo
# it could not read, both at WARN, each resolved by the hour that finds its
# condition gone. When the console's door cannot take a raise, the client
# files the deduplicated Linear card this file filed before, exactly.
#
# WHO IS WATCHED: computed, never listed. Every workflow, in every repo in
# config/repo-map.json, whose file on the default branch triggers on BOTH
# `pull_request` and `schedule`. A repo that adds a nightly is watched from its
# first merge and one that removes it stops being watched, with no edit here —
# the `check_workflow_watchers.py` rule, because a list that is remembered is a
# list that drifts in the direction of watching less.
#
# WHAT IT DELIBERATELY CANNOT DO: change anything it watches. Read-only
# permissions on GitHub, no ref write, no dispatch, no `gh api` write, and a
# test that fails if one appears. The one thing it sends is its own alert, to
# the console's notice door, with the OIDC token `id-token: write` lets the
# watch job mint — a token that names this run and writes nothing on GitHub.
# An alarm that can touch what it watches is not an alarm.
#
# WHAT IF THE WATCHER ITSELF STOPS: "Nightly Watch" is in the medic's watch
# list (self-medic.yml), so a red run is diagnosed — and
# scripts/check_workflow_watchers.py fails the build if it ever leaves that
# list. A run that never fires at all is a gap, and it is written down here
# rather than papered over: nothing in this repo detects a scheduled workflow
# that stops for good.
#
# Vendor boundary (standards/vendor-boundaries.md):
#   Q1 actor — the schedule initiates as `github-actions`, the same actor the
#      Reconcile schedule already runs as; the medic admits it today.
#      Nothing is pushed or dispatched, so no downstream trigger depends on
#      the identity.
#   Q2 secrets — a schedule-triggered run in THIS repo reads the repo's normal
#      secrets store (never the separate Dependabot store), so LINEAR_API_KEY
#      (the fallback card's) and the App keys resolve, and the
#      BUREAU_READ_URL variable names the console's door. The CROSS-REPO reads cannot use
#      `github.token`, which is scoped to this repository and 404s on every
#      other one — that would report the whole fleet UNKNOWN. An App
#      installation token is scoped to ONE installation and this fleet spans
#      three owners, so the watch job is a matrix over the roster's owners with
#      a token minted per owner, exactly as the groomer's lookup legs read.
#   Q3 re-run — idempotent by construction: the alert's key is a constant per
#      condition per owner, so a re-run's raise is answered `repeat` and its
#      resolve `not-open`, and nothing is delivered twice. The fallback card's
#      lookup is by exact title, a constant per owner, so a re-run comments on
#      the open card instead of minting a second. A fallback card CANCELED
#      while the condition still holds and the door is down invites a fresh
#      one next hour — park it in Queued instead, the model-drift rule.
#   Q4 command limits — reading a workflow's TRIGGERS needs the file, which the
#      Actions API does not carry, so this reads each workflow's contents at
#      the default branch: roughly one read per workflow per repo per hour,
#      against an installation's 5,000/hour. A refusal is never substituted
#      for an answer. A GitHub server error (HTTP 5xx) is retried by the
#      watcher itself, at most gh_read_retry's three attempts with its
#      backoff between, and at most two retry waits in the whole run, so an
#      hour of GitHub being down cannot run this job out of time; past that a
#      5xx is unknown, and every other refusal is read once (DRE-7352). The
#      hourly request budget is shared by everything the fleet does on
#      the installation, so it can be spent by others (DRE-6461): a read
#      GitHub refuses for it is reported as not read this hour — never as
#      ran, never as a permission failure — and the watcher stops asking for
#      the rest of the run, so a throttle costs one read's backoff, not one
#      per file. A throttle alone alarms only on the daily re-confirm hour;
#      a missing nightly or any other unreadable subject alarms on any hour.
#   Q5 our crash — no receipts, no markers, nothing to unstick: a run that dies
#      anywhere repeats next hour, and its failure routes through the medic.
#      `fail-fast: false` so one owner's missing installation cannot stop the
#      other owners being read.
name: Nightly Watch

on:
  schedule:
    # Hourly at :23. Off the hour on purpose — GitHub delays scheduled jobs
    # hardest at :00 — and clear of the sweep's */15. The cadence is paired
    # with nightly_watch.INTERVAL_HOURS by a wiring test. Hourly, on a
    # schedule of its own: this must not depend on the repos it watches
    # running anything.
    - cron: "23 * * * *"
  workflow_dispatch:

# READ ONLY. The alarm must never be able to change what it is watching.
permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-watch
  cancel-in-progress: false

jobs:
  # The roster is `config/repo-map.json` — the same snapshot the relay routes
  # on and the groomer's lookup legs read. A repo onboarded into the map is
  # watched with no second edit, which is why the owner list is computed rather
  # than typed.
  owners:
    name: Read the roster
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      owners: ${{ steps.read.outputs.owners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Owners in the roster
        id: read
        run: python3 scripts/nightly_watch.py owners

  watch:
    name: Watch ${{ matrix.owner }}
    needs: owners
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    # Every permission the workflow grants, and `id-token: write`: the OIDC
    # token the console's notice door reads (DRE-7456). A job-level block
    # replaces the workflow's, so the two reads are restated.
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      # One owner's missing or under-permissioned installation must not stop
      # the other owners being read — and it does not go quiet either: those
      # repos are reported UNKNOWN, which alarms.
      fail-fast: false
      matrix:
        owner: ${{ fromJSON(needs.owners.outputs.owners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The decision parses workflow YAML, so it needs PyYAML — from the one
      # pinned manifest, through the fleet's shared plumbing, cached and
      # skipped on a hit. NAMED, or ci_minutes_report.py cannot attribute it.
      - name: Install test tooling (cached)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          requirements: |
            requirements-dev.txt

      # Per owner, because an App installation token is scoped to ONE
      # installation. `continue-on-error` so a missing installation produces an
      # empty token and a fleet of UNKNOWN readings — which alarm, and name the
      # reason — rather than an opaque red action step.
      - name: Mint bot token (this owner's installation)
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      # Through env, never interpolated into the shell line — the roster is
      # repo-controlled data today and the next writer of it may not be.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ matrix.owner }}
        run: |
          python3 scripts/nightly_watch.py watch \
            --owner "$OWNER" \
            --title-file "$RUNNER_TEMP/alarm-title.txt" \
            --body-file "$RUNNER_TEMP/alarm-body.md" \
            >> "$GITHUB_STEP_SUMMARY"

      # ONE console alert per condition per owner, and it keeps saying it
      # (DRE-7456). The key is a constant, so next hour's identical finding is
      # answered `repeat`: its text is refreshed in place and nothing is
      # delivered again. The daily re-confirm is a raise of the same key.
      #
      # The fallback is the card this step filed before — its title, lane
      # `Planning`, label `repo:<this repo>` — filed by the client when the
      # door cannot take the raise. Two cadences, and the difference is the
      # whole reason this runs hourly: the alert is RAISED on whichever hour
      # the alarm first fires, so a nightly that stopped is found within the
      # hour; a fallback card left open by a door outage is RE-CONFIRMED daily
      # (`nightly_watch.RECONFIRM_AFTER_HOURS`, on one morning hour,
      # `RECONFIRM_HOUR_UTC`), because twenty-four "still true" comments a day
      # on one standing card is the same noise as a card a day.
      - name: Raise the alarm on the console
        if: steps.decide.outputs.raise != ''
        env:
          BUREAU_READ_URL: ${{ vars.BUREAU_READ_URL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ matrix.owner }}
          RAISE: ${{ steps.decide.outputs.raise }}
          RECONFIRM: ${{ steps.decide.outputs.reconfirm }}
        run: |
          # The repo the fallback CARD is filed against — this one, which owns
          # the watcher; the repos the alarm is ABOUT are named in its body.
          # Derived, not hardcoded (DRE-2680): the card needs a repo:<slug>
          # label or the readiness gate cannot route it out of Planning.
          REPO_SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          TITLE="$(cat "$RUNNER_TEMP/alarm-title.txt")"
          case "$RAISE" in
            did_not_run) NOTICE="nightly_watch:$OWNER:did_not_run" ;;
            cannot_read) NOTICE="nightly_watch:$OWNER:cannot_read" ;;
            *) echo "::error::the decision named a notice this step does not know: $RAISE"
               exit 1 ;;
          esac
          if [ "$RECONFIRM" != "true" ]; then
            EXISTING="$(python3 scripts/linear_ops.py find-open "$TITLE" || true)"
            if [ -n "$EXISTING" ]; then
              echo "$EXISTING — the fallback card a door outage filed — is open" \
                   "and this is not the daily re-confirm tick, so nothing is said"
              exit 0
            fi
          fi
          {
            cat "$RUNNER_TEMP/alarm-body.md"
            echo ""
            echo "Watch run: $RUN_URL"
          } > "$RUNNER_TEMP/alarm-notice.md"
          python3 scripts/pipeline_notice.py raise --notice "$NOTICE" --severity WARN \
            --title "$TITLE" --body-file "$RUNNER_TEMP/alarm-notice.md" \
            --fallback-title "$TITLE" --fallback-lane Planning \
            --fallback-label "repo:$REPO_SLUG"

      # A condition this hour shows GONE is resolved: everything read and no
      # nightly missing clears `did_not_run`, nothing unreadable clears
      # `cannot_read` (nightly_watch.notice_actions). No all-clear copy — a
      # WARN never leaves the console — and a key that is not open answers
      # `not-open`. A resolve the door refuses is logged, never a card.
      - name: Resolve what has cleared
        if: steps.decide.outputs.resolve != ''
        env:
          BUREAU_READ_URL: ${{ vars.BUREAU_READ_URL }}
          OWNER: ${{ matrix.owner }}
          RESOLVE: ${{ steps.decide.outputs.resolve }}
        run: |
          for CLEARED in $RESOLVE; do
            case "$CLEARED" in
              did_not_run) python3 scripts/pipeline_notice.py resolve --notice "nightly_watch:$OWNER:did_not_run" ;;
              cannot_read) python3 scripts/pipeline_notice.py resolve --notice "nightly_watch:$OWNER:cannot_read" ;;
              *) echo "::error::the decision named a notice this step does not know: $CLEARED"
                 exit 1 ;;
            esac
          done
