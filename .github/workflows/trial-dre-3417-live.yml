# THROWAWAY — DRE-3417's live proof, on branch trial/DRE-3417-opus-5-5-live only.
# Never merged. Proves the PR #511 head (Claude Code 2.1.282 via the house
# installer, claude-code-action v1.0.234) runs claude-opus-5-5 on a real runner.
name: DRE-3417 live Opus 5.5 trial
on:
  push:
    branches: ["trial/DRE-3417-opus-5-5-live"]
permissions:
  contents: read
jobs:
  fleet-runner:
    # The house trial, on the fleet's own runners (vars.BUREAU_RUNS_ON).
    uses: ./.github/workflows/model-trial.yml
    with:
      model: claude-opus-5-5
      pipeline_ref: trial/DRE-3417-opus-5-5-live
    secrets: inherit

  github-ubuntu:
    # The upstream-1817 condition itself: a GitHub-hosted ubuntu-latest runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .bureau-pipeline
      - name: Install Claude Code (asserted)
        id: install_claude
        uses: ./.bureau-pipeline/.github/actions/install-claude-code
      - name: One Opus 5.5 call
        env:
          CLAUDE_BIN: ${{ steps.install_claude.outputs.proved-executable }}
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          set -uo pipefail
          "$CLAUDE_BIN" --version
          "$CLAUDE_BIN" -p "Reply with exactly the word: ready" --model claude-opus-5-5 --effort high \
            --max-turns 1 --output-format json > "$RUNNER_TEMP/out.json"; echo "exit=$?"
          python3 - "$RUNNER_TEMP/out.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          usage = d.get("modelUsage") or {}
          print("is_error:", d.get("is_error"), "| result:", str(d.get("result"))[:80])
          print("modelUsage models:", sorted(usage))
          ok = d.get("is_error") is False and any("opus-5-5" in m for m in usage)
          print("VERDICT:", "PASS" if ok else "FAIL")
          sys.exit(0 if ok else 1)
          PY
