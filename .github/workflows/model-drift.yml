# Model drift watch (DRE-2236) — the committed catalog snapshot, and nothing
# else. It decides nothing about a model (DRE-3899).
#
# We used to learn about model changes by eye: on 2026-07-28 the console showed
# "Opus 4.8" on every board card while the pipeline was already dispatching
# Opus 5, and the same rotation missed one agent's pin with CI green throughout.
# This job replaces the eyeball with a weekly read of the live model list.
#
# It does one thing: it refreshes models.json — DATA ONLY, the seam the console
# reads so agent-bureau needs no Anthropic credential and no second transport —
# and gets it onto `main` through one pull request (below).
#
# THE SNAPSHOT LIVES HERE; EVERY DECISION ABOUT A MODEL LIVES IN
# `model-adoption.yml`. This job used to file two sorts of Linear card — "the
# pinned ladder has something newer" (DRE-3880, Sonnet 4.6 -> Sonnet 5) and
# "the catalog offers a model we have never configured" (DRE-3881, five models
# older than what we run) — and both were the cards the CEO said should not
# exist once his rule of 2026-09-14 decides instead: a newer version of a
# family we run, at no higher declared price, is trialled and proposed as an
# ordinary pull request; an older one is ignored; a new family or a higher
# price is ONE question for him. `scripts/model_adoption.py` classifies,
# `config/model-prices.yaml` is the only source of price, and
# `model-adoption.yml` runs it daily against the live catalog.
#
# It does NOT change the ladder. The commit step below stages one path and then
# PROVES the staged set, so this workflow is structurally incapable of adopting
# anything — the one automated path to a ladder change is the adoption
# workflow's reviewed pull request, never a scheduled snapshot job.
#
# IT DOES NOT PUSH TO `main` (DRE-3879). The commit step used to end in
# `git push origin HEAD:main`, and branch protection refused it — `GH006:
# Protected branch update failed`, "Changes must be made through a pull
# request" — on every weekly run since at least 2026-08-10. The snapshot was
# refreshed correctly and then could not be saved. The CEO's signed answer
# (2026-09-14 08:14 PT) is the remedy and its limit together: open a pull
# request, change no branch protection. So the snapshot is committed to
# `bot/model-drift` — one fixed branch, one pull request, updated in place
# rather than reopened — and `main` keeps requiring a pull request and both
# required checks. The branch is on the merge gate's trusted list as a LITERAL
# name (never `bot/*`), so CI and the adversarial critic run on it exactly as
# on any other pull request and a red check or a REQUEST_CHANGES verdict
# blocks the merge.
#
# Vendor boundary (standards/vendor-boundaries.md):
#   Q1 actor — the schedule initiates as `github-actions`; the snapshot commit
#      is pushed, and its pull request opened, with the bureau App token, so
#      both (and the Pipeline Tests run the push triggers) are attributed to
#      agent-bureau-bot — an identity every gate here already admits, and one
#      distinct from the qa-bot App that merges, so author != merger holds.
#   Q2 secrets — a schedule-triggered run in this repo reads the repo's normal
#      secrets store (never the separate Dependabot store), so the Anthropic
#      credentials resolve. No Linear credential is read: the job files no card.
#   Q3 re-run — the snapshot write is idempotent (an unchanged catalog is a
#      byte-identical file, no commit and no pull request), and a changed one
#      force-pushes the same branch and finds its own open pull request, so a
#      re-run mints nothing new.
#   Q4 command limits — the push is to `bot/model-drift`, which no protection
#      rule covers, so the GH006 refusal cannot recur; the pull request is what
#      reaches `main`, through the gate. `gh pr list --state open` is
#      deliberately not `--state all` — a merged pull request is finished and
#      the next refresh needs a new one — and a listing GitHub will not answer
#      fails the run rather than opening a duplicate.
#   Q5 our crash — no receipts, no markers, nothing to unstick: a run that dies
#      anywhere simply repeats next week (or on workflow_dispatch).
name: Model drift

on:
  schedule:
    # Weekly, Monday 06:17 UTC. Off the hour on purpose — GitHub delays
    # scheduled jobs hardest at :00, and nothing here is time-critical.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drift:
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    concurrency:
      group: model-drift
      cancel-in-progress: false
    steps:
      # The App token, not github.token: a push made with GITHUB_TOKEN does not
      # trigger workflows, so the snapshot commit would land on main with the
      # test suite never running against it.
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ONE live API call per run. Both credential shapes are passed; the shared
      # auth seam (model_fallback.auth_headers) picks x-api-key or the OAuth
      # bearer. No credential, or any network/parse failure, degrades to an
      # empty catalog: the step warns, leaves the existing snapshot alone, and
      # the run stays green — a catalog outage is not an incident.
      - name: Refresh the catalog snapshot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/model_catalog.py snapshot models.json

      # DATA ONLY, and proven so: exactly one path is named here, and
      # `bot_branch_pr.py` stages it, reads the index back and refuses to
      # commit if anything else is staged. This is the structural guarantee
      # that a scheduled job can never move a model pin — shared with
      # split-ledger.yml since DRE-3879, so there is one tested copy of it.
      # The snapshot rides ONE pull request off `bot/model-drift`; an unchanged
      # catalog opens none and the run is green.
      - name: Publish the snapshot on bot/model-drift (one PR, never a push to main)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cat > "$RUNNER_TEMP/model-drift-pr-body.md" <<'BODY'
          The Anthropic catalog snapshot, refreshed by
          `.github/workflows/model-drift.yml` (DRE-2236).

          **Data only — the ladder is unchanged.** The run stages one path and
          refuses to commit anything else, so this job is structurally
          incapable of moving a model pin. Every decision about a model is
          made by `.github/workflows/model-adoption.yml` under the CEO's rule
          of 2026-09-14, never here.
          BODY
          python3 scripts/bot_branch_pr.py publish \
            --repo "$GITHUB_REPOSITORY" \
            --branch bot/model-drift \
            --base "${DEFAULT_BRANCH:-main}" \
            --path models.json \
            --title "chore(models): refresh the catalog snapshot" \
            --body-file "$RUNNER_TEMP/model-drift-pr-body.md"
