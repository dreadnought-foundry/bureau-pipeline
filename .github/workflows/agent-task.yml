# Executes a Linear card autonomously: triggered (via a thin stub in the
# product repo) by the bureau-linear-relay Lambda's repository_dispatch when
# a card with `**Repo:** <product>` enters Todo. The agent implements the
# card on a branch and opens a PR; CI and review gates are enforced by
# GitHub, not by the agent.
#
# Reusable workflow: concurrency + permissions live in the calling stub
# (which owns the trigger context). github.event / github.repository inside
# this file resolve to the CALLER's event and repo.
name: Agent Task (reusable)

on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the INTERNAL checkouts (scripts, briefs,
          standards). REQUIRED since DRE-2689: a caller must pass the same
          ref it pins in `uses:`, or it runs channel workflow YAML over
          another ref's scripts — pinned to everything that counts refs,
          and not actually pinned (DRE-2026).
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: true
      BUREAU_APP_ID:
        required: true
      BUREAU_APP_PRIVATE_KEY:
        required: true
      BUREAU_QA_APP_ID:
        required: false
      BUREAU_QA_APP_PRIVATE_KEY:
        required: false
      # Dispatch-pool workers (DRE-2013): agent-bureau-bot-2/3/4 — three
      # worker-identical Apps whose only job is spreading the worker-token
      # mint across independent 5,000 req/hr quota buckets (4-bucket pool
      # ≈ 20k/hr). ALL optional: a repo without them runs on the original
      # app exactly as before. To extend the pool, add a pair here, a probe
      # step, the selector env pair, and one clause per worker-mint input.
      BUREAU_APP_ID_2:
        required: false
      BUREAU_APP_PRIVATE_KEY_2:
        required: false
      BUREAU_APP_ID_3:
        required: false
      BUREAU_APP_PRIVATE_KEY_3:
        required: false
      BUREAU_APP_ID_4:
        required: false
      BUREAU_APP_PRIVATE_KEY_4:
        required: false

jobs:
  execute:
    runs-on: ${{ fromJSON(vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    # The total-runtime cap. 45 murdered legitimately long builds mid-work
    # (DRE-2074: DRE-2070's profiling runs were killed at the 45-minute mark
    # 4× while in_progress with fresh ⏳ receipts, and the Report step then
    # counted each kill as a dead run). When this timeout DOES fire, the
    # Report step defers (dead_run.py --cancelled) and the reconcile sweep
    # requeues off the run's real conclusion.
    timeout-minutes: 120
    env:
      # The secrets context is not readable in a step-level `if:`, so the
      # dispatch-pool probe mints check slot PRESENCE via these job-env
      # mirrors (app ids only — never keys). Empty ⇒ the probe is skipped
      # and the pool shrinks (DRE-2013 graceful degradation).
      BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
      BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
      BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
    steps:
      # Boot token: the ORIGINAL app (pool slot 1). Used for the checkouts
      # below (a handful of requests) and as slot 1's pool probe;
      # everything quota-heavy after pool selection uses the worker token.
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY }}

      # WHEN THE CLOCK STARTED (DRE-3043). GitHub kills an App installation
      # token at exactly 60 minutes, and the checkout below writes THIS token
      # into `http.https://github.com/.extraheader` — so this timestamp, not
      # the agent step's, is when every git credential on the runner begins
      # ageing. The pool probes, `setup.sh` and the card gate all sit between
      # here and the agent; a floor measured from the agent would warn late.
      - name: Record credential mint time
        id: minted
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      # Central pipeline scripts + briefs (public repo — no token needed).
      # Checked out AFTER the product repo so the product checkout's clean
      # step can't wipe it; excluded from the product repo's git view so an
      # agent `git add -A` can never commit it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline
      - name: Hide pipeline checkout from product git
        run: echo ".bureau-pipeline/" >> .git/info/exclude

      # ---- Dispatch-pool worker selection (DRE-2013) ----
      # Four worker-identical GitHub Apps (agent-bureau-bot + -2/-3/-4) give
      # four independent 5,000 req/hr REST quota buckets (~20k/hr; the
      # 2026-06-28 incident exhausted a single bucket twice). Mint a probe
      # token per CONFIGURED pool app — absent secrets skip the step and just
      # shrink the pool; continue-on-error so a broken pool app can never
      # fail a build — then let dispatch_pool.py probe each bucket with ONE
      # real, counted call and rank on the x-ratelimit-remaining header it
      # answers (DRE-4290: the meter the runner is charged against; healthy
      # buckets share the load by hash, a drained one is steered away from,
      # a refused one is out for the run, and a read failure falls back to
      # the hash). The selector only ever sees app ids + probe tokens, NEVER
      # private keys, and only outputs WHICH slot to use; the worker mint
      # below maps that slot to its secret pair explicitly (Actions can't
      # index secrets dynamically). Slot 1 is the original app and its probe
      # is the boot token — a repo without the new secrets degrades to a
      # single-app pool and behaves exactly as before.
      - name: Mint pool probe token (2)
        id: probe_2
        if: ${{ env.BUREAU_APP_ID_2 != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_2 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_2 }}
      - name: Mint pool probe token (3)
        id: probe_3
        if: ${{ env.BUREAU_APP_ID_3 != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_3 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_3 }}
      - name: Mint pool probe token (4)
        id: probe_4
        if: ${{ env.BUREAU_APP_ID_4 != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUREAU_APP_ID_4 }}
          private-key: ${{ secrets.BUREAU_APP_PRIVATE_KEY_4 }}

      - name: Select dispatch-pool app
        id: pool
        env:
          BUREAU_APP_ID: ${{ secrets.BUREAU_APP_ID }}
          BUREAU_POOL_TOKEN: ${{ steps.app.outputs.token }}
          BUREAU_APP_ID_2: ${{ secrets.BUREAU_APP_ID_2 }}
          BUREAU_POOL_TOKEN_2: ${{ steps.probe_2.outputs.token }}
          BUREAU_APP_ID_3: ${{ secrets.BUREAU_APP_ID_3 }}
          BUREAU_POOL_TOKEN_3: ${{ steps.probe_3.outputs.token }}
          BUREAU_APP_ID_4: ${{ secrets.BUREAU_APP_ID_4 }}
          BUREAU_POOL_TOKEN_4: ${{ steps.probe_4.outputs.token }}
          # Deterministic fallback key: the card id (run id when absent).
          BUREAU_POOL_KEY: ${{ github.event.client_payload.identifier || github.run_id }}
        run: |
          python3 .bureau-pipeline/scripts/dispatch_pool.py select >> "$GITHUB_OUTPUT"

      # Worker token: minted from the SELECTED pool app. Explicit per-N map
      # (Actions can't index secrets dynamically); each clause yields '' when
      # not selected — or when a selected slot's secrets are unexpectedly
      # empty — so the chain always falls through to the original app pair.
      - name: Mint worker token (selected pool app)
        id: worker
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_ID_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_ID_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_ID_4
             || secrets.BUREAU_APP_ID }}
          private-key: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_PRIVATE_KEY_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_PRIVATE_KEY_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_PRIVATE_KEY_4
             || secrets.BUREAU_APP_PRIVATE_KEY }}

      # Product-specific environment setup (submodules, toolchains, test DB).
      # Optional by design: a repo that needs nothing ships no setup.sh.
      - name: Product environment setup (optional)
        env:
          BOT_TOKEN: ${{ steps.worker.outputs.token }}
        run: |
          if [ -f .github/bureau/setup.sh ]; then
            bash .github/bureau/setup.sh
          else
            echo "no .github/bureau/setup.sh — skipping product setup"
          fi

      # Todo-entry card-validation gate (DRE-1405). The relay can't write to
      # Linear, so a malformed card (no resolvable repo, or no agent: role
      # label) would otherwise either silently vanish at the relay or dispatch
      # a broken build here. Validate the LIVE card and, if malformed AND still
      # in Todo/Triage, bounce it to Planning with a diagnostic comment — and
      # skip every downstream step. Runs BEFORE Card → In Progress so a bounced
      # card never flips In Progress first.
      - name: Card-validation gate
        id: gate
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          python3 .bureau-pipeline/scripts/validate_card.py gate \
            "${{ github.event.client_payload.identifier }}"

      # Duplicate-dispatch guard (DRE-2057). The relay sometimes fires TWO
      # agent-execute dispatches for one Todo transition (~60s apart; five
      # twin-PR incidents: #76 #83 #90 #97 #102/#103). The stub's per-card
      # concurrency group only SERIALIZES them (cancel-in-progress stays
      # false — DRE-2032), so the dup builds the card again LATER. Skip —
      # clean exit, 🤖 receipt on the card — when another run for this card
      # is still queued/in_progress (via the 🧠 heartbeat's run URL) or an
      # OPEN agent PR already exists; a re-dispatch after the PR closed or
      # merged still builds (the rebuild case). Fail-open: unreadable
      # answers proceed. EVERY step below honors the skip — the Report step
      # especially, or a skipped dup would read as a dead run and requeue.
      - name: Duplicate-dispatch guard
        id: dedupe
        if: steps.gate.outputs.bounced != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.worker.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 .bureau-pipeline/scripts/dedupe_dispatch.py gate \
            "${{ github.event.client_payload.identifier }}"

      # Model selection: the shared WORKHORSE ladder with runtime availability
      # detection (DRE-1490). Build roles are classified `workhorse` in
      # config/models.yaml (DRE-2317) and select() walks that ladder best→worst
      # — claude-opus-5, then claude-sonnet-5 — returning the first AVAILABLE
      # model. Availability is probed via a minimal /v1/messages call using the
      # CLAUDE token already in the env (no new secret): a 404 / not-found ⇒
      # skip; any other response, including 429, ⇒ choose it; an inconclusive
      # probe falls through to the next known-good model. The probe decides how
      # far DOWN the ladder to walk, never how far up: the STRONGEST model we
      # run — the judgement ladder's top (the planner, DRE-3015) — is
      # unreachable from this ladder at any availability. That is the
      # 2026-08-09 incident, pinned by tests/test_model_policy.py.
      #
      # The advisory ladder's top is a different question since 2026-09-16
      # (DRE-3880): `claude-sonnet-5` is BOTH the critic's model and this
      # ladder's backup rung, so build and review can coincide. The fence is
      # kept per pull request instead — a build that ran on it is reviewed on
      # something else (config/models.yaml `review_separation`), which the
      # critic's and verifier's own Select-model steps apply. Nothing about
      # this step changes: a build agent never reaches a judging kind's top.
      #
      # --explain-file records WHY anything above the chosen model was skipped.
      # The selection alone was never enough: a run that quietly dropped a rung
      # looked identical to one that got its first choice. The note rides the
      # heartbeat comment below, and a DEGRADED note also raises a ::warning::.
      #
      # THE TURN BUDGET IS CHOSEN HERE TOO (DRE-3097). `--max-turns 150` was a
      # literal below, with no per-card, per-size or per-repo knob — and the
      # park receipt's own second remedy ("or raises the turn budget") had no
      # handle. DRE-3088 died at that cap three times, $19.12/$19.12/$17.53,
      # every run reaching `⏳ 3/5 implementation green` and dying in the two
      # steps after it, the THIRD time after the card had already been split to
      # XS: the cost was the ~1,850-line file the agent had to keep re-reading,
      # not the size of the change. turn_budget.py reads a `turns:<n>` label
      # (from a closed, reviewed set), else the `size:` label, else 150 — in
      # THIS step, so a run cannot read the card one way for its model and
      # another for its budget. It never exits non-zero: an unreadable card
      # costs the raise, never the run.
      - name: Select model
        id: model
        if: steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          # The probe authenticates with the same CLAUDE token the agent uses.
          ANTHROPIC_API_KEY: ${{ vars.CLAUDE_AUTH_MODE != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.CLAUDE_AUTH_MODE == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # The budget is a property of the CARD, so this step reads Linear.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          ROLE="${{ steps.gate.outputs.role }}"; [ -n "$ROLE" ] || ROLE=engineer
          WHY_FILE="$RUNNER_TEMP/model-why.txt"
          MODEL=$(python3 .bureau-pipeline/scripts/model_fallback.py select "$ROLE" \
            --explain-file "$WHY_FILE")
          WHY=$(cat "$WHY_FILE")
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "selected model: $MODEL (role: $ROLE)"
          echo "$WHY" >> "$GITHUB_STEP_SUMMARY"
          # Never silent: a run that did NOT get the top of its ladder says so.
          case "$WHY" in DEGRADED*) echo "::warning::$WHY" ;; esac
          TURNS_FILE="$RUNNER_TEMP/turn-budget.txt"
          TURNS=$(python3 .bureau-pipeline/scripts/turn_budget.py select \
            "${{ github.event.client_payload.identifier }}" \
            --explain-file "$TURNS_FILE")
          TURNS_WHY=$(cat "$TURNS_FILE")
          echo "turns=$TURNS" >> "$GITHUB_OUTPUT"
          echo "turns_why=$TURNS_WHY" >> "$GITHUB_OUTPUT"
          echo "$TURNS_WHY"
          echo "$TURNS_WHY" >> "$GITHUB_STEP_SUMMARY"

      # Assemble the agent's context = the role's shared standards + role brief
      # (DRE-1646). The build agents run headless and cannot load Skills, so
      # standards/*.md is their only knowledge channel. assemble_context.py owns
      # the per-role standards mapping (single source of truth) and reads the
      # files from this checkout AT RUN TIME — so a `@main` edit to any standard
      # propagates to every product repo's agents on the next run with no
      # workflow change. The blob is written to a file the prompt points at.
      #
      # Then what PEOPLE said on the card (DRE-3785), appended: the CEO's
      # answer to an escalation, posted by the console on the fleet's key and
      # signed as him, labelled "the CEO, via the console" only when its
      # signature verifies — and nothing the pipeline wrote, whatever it says.
      # Before this the agent was handed no comment at all, so "answer, move
      # the card to Todo, and a fresh run reads your guidance" had nothing
      # behind it. The renderer always exits 0 (an unreadable thread renders
      # `SPOKEN STATUS: UNKNOWN`); the card and the key come through env, so
      # the line adds nothing to the compiled expression (DRE-3484).
      - name: Assemble agent context
        id: ctx
        if: steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          CARD: ${{ github.event.client_payload.identifier }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          ROLE="${{ steps.gate.outputs.role }}"; [ -n "$ROLE" ] || ROLE=engineer
          python3 .bureau-pipeline/scripts/assemble_context.py assemble "$ROLE" \
            > .bureau-pipeline/agent-context.md
          python3 .bureau-pipeline/scripts/spoken_thread.py people "$CARD" >> .bureau-pipeline/agent-context.md
          grep -E '^SPOKEN STATUS:' .bureau-pipeline/agent-context.md || echo "no SPOKEN STATUS: line in the assembled context"
          echo "assembled $(wc -l < .bureau-pipeline/agent-context.md) lines of context for role: $ROLE"

      # DRE-1996: make the DRE-1989 sentinel fence mechanical. Card title and
      # body are attacker-writable; a body containing its own "===== END
      # UNTRUSTED CARD TEXT =====" line visually escapes the fence (proven by
      # render on PR #59), and a multi-line title would inject prompt lines
      # above it. Hand both to the sanitizer via env (GitHub sets env
      # directly — no shell expansion) which defangs sentinel-lookalike lines
      # and collapses title newlines. The prompt below interpolates ONLY the
      # sanitized outputs; tests/test_untrusted_content_wiring.py pins this.
      - name: Sanitize untrusted card text
        id: card
        if: steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          RAW_TITLE: ${{ github.event.client_payload.title }}
          RAW_DESCRIPTION: ${{ github.event.client_payload.description }}
        run: |
          python3 .bureau-pipeline/scripts/sanitize_untrusted.py \
            line RAW_TITLE title \
            body RAW_DESCRIPTION description

      # DRE-2931: this is the step DRE-2911's attempts 2 and 3 died in — the
      # Linear key was at its 2,500/hour ceiling and every call answered HTTP
      # 400. Two things changed here. It carries an `id` so the Report step can
      # read GitHub's own outcome for it rather than infer one, and its output
      # is tee'd to PRE_AGENT_LOG so that step can tell a quota exhaustion (a
      # WAIT — DRE-2923) from a step that genuinely broke. Neither changes what
      # the step DOES: a failure here still fails the job, exactly as before.
      - name: Card → In Progress
        id: inprogress
        if: steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PRE_AGENT_LOG: ${{ runner.temp }}/preagent.log
        run: |
          set -o pipefail
          {
            python3 .bureau-pipeline/scripts/linear_ops.py state \
              "${{ github.event.client_payload.identifier }}" "In Progress"
            # Heartbeat: record which model this attempt uses so the board/console
            # can surface per-attempt model (DRE-1354 AC). The run URL maps the
            # card to THIS Actions run so the reconcile sweep can check the run
            # is actually still alive before declaring the card dead (DRE-2032 —
            # the sweep once requeued a live 45-minute build and the redispatch
            # cancelled it via the concurrency group, run 29125285930).
            ROLE="${{ steps.gate.outputs.role }}"; [ -n "$ROLE" ] || ROLE=engineer
            python3 .bureau-pipeline/scripts/linear_ops.py comment \
              "${{ github.event.client_payload.identifier }}" \
              "🧠 model-attempt: ${{ steps.model.outputs.model }} — $ROLE agent starting (turns=${{ steps.model.outputs.turns }}). ${{ steps.model.outputs.why }} ${{ steps.model.outputs.turns_why }} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } 2>&1 | tee "$PRE_AGENT_LOG"

      # A LOUD FLOOR, NOT A SILENT CEILING (DRE-3043). The re-mint below makes
      # an expired credential survivable; this makes it VISIBLE while the agent
      # can still act on it. At 50 minutes from the mint, with nothing of this
      # card's work on GitHub, the card gets one line — "credential expires in
      # 10 minutes — push what is green" — and briefs/engineer.md tells the
      # agent to push a WIP branch and carry on, so an expiry costs a rebase
      # rather than a rebuild. Backgrounded: it must never hold up the agent,
      # and credential_clock.py swallows every failure of its own for the same
      # reason (a heartbeat that blocks a build is worse than no heartbeat).
      - name: Credential floor (50-minute warning)
        id: clock
        if: steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CARD: ${{ github.event.client_payload.identifier }}
          MINTED_AT: ${{ steps.minted.outputs.at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          nohup python3 .bureau-pipeline/scripts/credential_clock.py watch \
            --card "$CARD" --minted-at "$MINTED_AT" --run-url "$RUN_URL" \
            > "$RUNNER_TEMP/credential-clock.log" 2>&1 &
          disown || true
          echo "credential floor armed: warns on the card at 50 minutes if nothing has been pushed"

      # Claude Code, installed ONCE and proved, before the model step below
      # (DRE-3414). DRE-3416: the vendor's own installer exited clean, left no
      # launcher, and every Claude-running job in the fleet died minutes later
      # on "native binary not found" — one turn, $0, which reads exactly like
      # a stale credential. The first operator to look was sent to the token,
      # which was the one thing that was not wrong.
      #
      # This step asserts `claude --version` answers, retries the install
      # once, and fails AS AN INSTALL FAILURE if it still does not; the model
      # step below then runs the binary this step proved, never a second copy
      # the vendor installed and nobody checked. It comes out of the pinned
      # pipeline checkout, the same way this file reaches the fleet's other
      # shared actions, so a caller's pipeline_ref picks the channel.
      - name: Install Claude Code (asserted)
        id: install_claude
        # Gated exactly like the model step below: a run that never reaches a
        # model must neither spend an install nor go red for one it did not
        # need.
        if: steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        uses: ./.bureau-pipeline/.github/actions/install-claude-code

      # ---- THE AGENT STEP, AND THE ONE REFUSAL IT IS RETRIED FOR (DRE-4108) ----
      # Two portico Agent Task runs died here on 2026-09-16, minutes apart,
      # inside the vendor action's allowed-bots setup:
      #
      #     GET /users/agent-bureau-bot-2%5Bbot%5D
      #     403 API rate limit exceeded for installation ID 123249480
      #
      # The model was never started. No turn, no spend — and the run exited 1
      # on the first refusal, so each one filed a pipeline-failure card for a
      # shared-quota hiccup that clears on its own. The CEO's signed rule on
      # DRE-4109 is the whole design in a line: a brief refusal from an
      # outside service is a retry, not a failure.
      #
      # The failing call is inside `anthropics/claude-code-action`, which the
      # fleet pins to a commit and does not patch, so the retry lives HERE.
      # Three attempts, each gated on `claude_rate_limit_retry.py decide`,
      # which fires ONLY on that signature: the step failed, the model never
      # started, and GitHub is refusing this installation right now. A run
      # that reached the model is never re-run — no build is duplicated and no
      # spend repeated — and neither is an auth failure, a turn cap, or a real
      # error.
      #
      # `continue-on-error` on all three, with the job's red light moved to
      # the terminal `agent_step_failed` gate at the bottom of this job. That
      # is what lets attempt 1 fail and attempt 2 succeed WITHOUT leaving a
      # failed run behind — and a failed run is exactly what summons the medic
      # to file a card (self-medic.yml watches `Agent Task` for
      # `conclusion == 'failure'`).
      #
      # NO YAML ANCHORS: GitHub Actions does not support them, so the two
      # retries below carry `with:` blocks that are deliberate duplicates of
      # attempt 1's and MUST be kept identical to it. Unlike qa-review.yml's
      # critic retry there is no intended difference at all — the thing being
      # retried never reached the model, so nothing about the run needs to
      # change, only the moment it happens.
      # tests/test_agent_task_rate_limit_retry.py fails the build if they drift.
      - name: Implement card
        id: claude
        if: steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
