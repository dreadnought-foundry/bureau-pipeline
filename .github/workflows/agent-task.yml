              "🧠 model-attempt: ${{ steps.model.outputs.model }} — $ROLE agent starting (turns=${{ steps.model.outputs.turns }}, $RESUME_CLAUSE). ${{ steps.model.outputs.why }} ${{ steps.model.outputs.turns_why }} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
