               "feat(${{ github.event.client_payload.identifier }}): <summary>",
               body must include the card URL. GH_TOKEN is already in your env.
            6. ESCALATE (only on genuine uncertainty — ambiguous intent, a
               risky/destructive change, or a business A-vs-B decision): do NOT
               guess and do NOT open a PR. Write a PLAIN-ENGLISH question (business
               terms, NO code/diffs/file paths) to /tmp/agent-escalation.txt — the
               workflow posts it to the card and parks the card in Green Light,
               the CEO's "needs you" queue. The CEO answers and moves the card
               back to Todo to proceed.
            7. If the card is instead IMPOSSIBLE as specified (cannot be built as
               written, no human decision would unblock it), open no PR and write
               your blocker reason to /tmp/agent-blocker.txt instead (this parks
               the card in Backlog).
            8. HAND BACK (the third exit): if this card was dispatched as one
               piece of work and is really an epic's worth — several
               independently shippable PRs, contracts between them — do NOT
               sprawl it into one unreviewable PR and do NOT silently build a
               fragment. Decide it by turn ${{ steps.model.outputs.decide_by }}, never later.
               Open no PR, and write a split proposal to /tmp/agent-handback.txt:
               for each piece, one line in plain English — a title, the files it
               edits, and the sibling it does not depend on. The workflow hands
               the card back to Planning with your proposal so the planner
               decomposes it instead of re-deriving it.
