               say so in the PR body rather than ignoring it.
            5. Push the branch and open a PR with `gh pr create` titled
               "feat(${{ github.event.client_payload.identifier }}): <summary>",
               body must include the card URL. GH_TOKEN is already in your env.
            6. ESCALATE (only on genuine uncertainty — ambiguous intent, a
               risky/destructive change, or a business A-vs-B decision): do NOT
               guess and do NOT open a PR. Write a PLAIN-ENGLISH question (business
               terms, NO code/diffs/file paths) to /tmp/agent-escalation.txt — the
               workflow posts it to the card and parks the card in Green Light,
               the CEO's "needs you" queue. The CEO answers and moves the card
               back to Todo to proceed.
            7. If the card is instead IMPOSSIBLE as specified (cannot be built as
               written, no human decision would unblock it), open no PR and write
               your blocker reason to /tmp/agent-blocker.txt instead (this parks
               the card in Backlog).
            8. HAND BACK (the third exit): if this card was dispatched as one
               piece of work and is really an epic's worth — several
               independently shippable PRs, contracts between them — do NOT
               sprawl it into one unreviewable PR and do NOT silently build a
               fragment. Open no PR, and write to /tmp/agent-handback.txt the
               pieces you found, one line each, in plain English. The workflow
               hands the card back to Planning with your list so the planner
               decomposes it instead of re-deriving it.
               Write at most ONE of escalation / blocker / hand-back.

      # ONE ANSWER FOR THE WHOLE AGENT STEP (DRE-4108). Everything downstream —
      # the result gate, the Linear report, the dead-run accounting — used to
      # read `steps.claude.*`. With retries that would judge the run by attempt
      # 1 and report a dead agent for a build attempt 2 finished. This step
      # resolves the LAST attempt that actually ran, and every consumer reads
      # it instead.
      - name: Resolve agent step result
        id: claude_result
        if: always() && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          ATTEMPT_1_OUTCOME: ${{ steps.claude.outcome }}
          ATTEMPT_1_FILE: ${{ steps.claude.outputs.execution_file }}
          ATTEMPT_2_OUTCOME: ${{ steps.claude_retry1.outcome }}
          ATTEMPT_2_FILE: ${{ steps.claude_retry1.outputs.execution_file }}
          ATTEMPT_3_OUTCOME: ${{ steps.claude_retry2.outcome }}
          ATTEMPT_3_FILE: ${{ steps.claude_retry2.outputs.execution_file }}
        run: |
          python3 .bureau-pipeline/scripts/claude_rate_limit_retry.py resolve \
            --attempt "${ATTEMPT_1_OUTCOME}=${ATTEMPT_1_FILE}" \
            --attempt "${ATTEMPT_2_OUTCOME}=${ATTEMPT_2_FILE}" \
            --attempt "${ATTEMPT_3_OUTCOME}=${ATTEMPT_3_FILE}" \
            --github-output "$GITHUB_OUTPUT"

      # THE RUN'S OWN USAGE READING (DRE-4338). Every Claude run emits a
      # `rate_limit_event` carrying the subscription windows it drew on, and
      # the vendor action writes it — with every other message of the run —
      # into the execution file the steps above already read, on a disk that
      # is destroyed with the runner. usage_reading.py keeps that ONE message
      # type (never the transcript: several repos are public) as a small JSON
      # document shaped as the Record's `body_raw`, and the step after it
      # uploads the file. No contract change, no secret, nothing to deploy.
      # The Record's ingestion, its source and event names and the account
      # attribution are the Record card's, and can BACKFILL from these.
      #
      # PUBLISHED ON PURPOSE: on a public repo this artifact is readable by
      # anyone for its 90 days. What it carries — window utilization, reset
      # times, status, overage flags, auth_mode — is the same class of fact
      # execution_result.py already prints to these public logs (total_cost_usd,
      # num_turns), names no account or credential, and is published
      # deliberately. The event's unknown fields are NOT: usage_reading.py's
      # `raw` block is an allowlist, so a field a future SDK adds is dropped
      # and only its name is reported.
      #
      # `always()` + `continue-on-error`: a reading not taken is a log line,
      # never a red build. Gated exactly like the result gate below, so a
      # bounced or duplicate card that never reached a model uploads nothing.
      # Every `${{ }}` is in env:, never in the script — the expression
      # ceiling (tests/test_workflow_expression_budget.py). The file is the
      # resolved LAST attempt's, the same one the gate reads — pinned by
      # tests/test_usage_reading.py's `WIRED`, because it is the one input
      # that decides which run the reading describes (DRE-4108).
      - name: Keep the run's Claude usage reading
        id: usage
        if: always() && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        continue-on-error: true
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_result.outputs.execution_file }}
          CARD: ${{ github.event.client_payload.identifier }}
          # Which credential the run billed — `subscription` or not. Not a
          # secret; the one fact that says whether this is a subscription
          # reading at all. The account itself stays unattributed.
          CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH_MODE }}
        run: |
          EXEC_FILE="${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          python3 .bureau-pipeline/scripts/usage_reading.py emit \
            --execution-file "$EXEC_FILE" \
            --out "${RUNNER_TEMP:-/tmp}/claude-usage-reading.json" \
            --card "$CARD" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # Named per attempt, or upload-artifact refuses a re-run's upload as a
      # duplicate name (plan.yml's Q4 note says the same of its own upload).
      # 90 days: the window the Record can backfill from.
      - name: Upload the usage reading
        if: always() && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true' && steps.usage.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-usage-reading-${{ github.job }}-attempt${{ github.run_attempt }}
          path: ${{ steps.usage.outputs.path }}
          if-no-files-found: warn
          retention-days: 90

      # THE RUN'S OWN DEATH-CAUSE RECEIPT (DRE-4340). On 2026-09-19 the fleet's
      # failures were counted for the first time — 1,310 of 62,451 runs over 22
      # days — and 69 of them, $97 of model work, could not be attributed to
      # any cause at all, because the workflow they died in wrote nothing down.
      # death_receipt.py reads the classifiers this pipeline already owns
      # (check_agent_result for the death class, death_cause for WHICH wall)
      # and writes one small JSON document; the step after it uploads the file.
      # `scripts/check_death_receipts.py` DISCOVERS every reusable workflow
      # that runs a model and fails the build when one of them does not call
      # it, so the next workflow added to the fleet cannot be added blind.
      #
      # `always()` + `continue-on-error`, and NO gate beyond that: the receipt
      # must be written for the runs that DIED, which is the whole point, and
      # it must never change this job's own conclusion in either direction. A
      # bounced or duplicate card simply records `none`, which is the honest
      # answer and the denominator the count needs.
      #
      # BOTH inputs are the RESOLVED attempt's, never attempt 1's (DRE-4108):
      # a consumer reading `steps.claude.*` judges the whole run by the first
      # try and would report a dead agent for a build the retry finished.
      # `claude_result` is the resolver every other consumer already reads, and
      # its `outcome` is what says whether the agent step ran at all — `skipped`
      # is a setup death (DRE-2931). Every `${{ }}` is in env:, never in the
      # script.
      - name: Keep the run's death-cause receipt
        id: death
        if: always()
        continue-on-error: true
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_result.outputs.execution_file }}
          MODEL_STEP_OUTCOME: ${{ steps.claude_result.outputs.outcome }}
          JOB_STATUS: ${{ job.status }}
          CARD: ${{ github.event.client_payload.identifier }}
          CLAUDE_AUTH_MODE: ${{ vars.CLAUDE_AUTH_MODE }}
        run: |
          EXEC_FILE="${CLAUDE_EXECUTION_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          python3 .bureau-pipeline/scripts/death_receipt.py emit \
            --execution-file "$EXEC_FILE" \
            --out "${RUNNER_TEMP:-/tmp}/death-receipt.json" \
            --job-status "$JOB_STATUS" \
            --step-outcome "$MODEL_STEP_OUTCOME" \
            --card "$CARD" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # Named per attempt, or upload-artifact refuses a re-run's upload as a
      # duplicate name. 90 days: the window the Record can backfill from.
      - name: Upload the death-cause receipt
        if: always() && steps.death.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: death-receipt-${{ github.job }}-attempt${{ github.run_attempt }}
          path: ${{ steps.death.outputs.path }}
          if-no-files-found: warn
          retention-days: 90

      # THE RUN'S WORKING LOG (DRE-4269, epic DRE-4267). The engineer's
      # transcript, scrubbed and put straight into our own store over OIDC —
      # never an Actions artifact and never echoed, because several of the
      # repos these runs happen in are public. The execution file is the
      # resolved attempt's, exactly as the receipt above reads it.
      #
      # `always()` + `continue-on-error`, and `upload_agent_log.py` exits 0 on
      # every path of its own: the runs worth keeping are the ones that died,
      # and keeping a log must never change this job's conclusion. Anything
      # that stops it — a refused scrub, no OIDC token (portico forbids
      # `id-token: write` by policy), no AWS CLI (the self-hosted minis may
      # not have one), a log over the single-part cap — is recorded as a GAP
      # on the run instead.
      #
      # The job's secrets arrive on STDIN, so the scrub can redact each one by
      # value; never as an argument, which would reach the process table. The
      # calling stub grants `id-token: write` (DRE-4348); this file declares no
      # `permissions:` block, because a called job asking for more than its
      # caller granted fails the whole run at startup. Every `${{ }}` is in
      # env:, never in the script.
      - name: Keep the run's working log
        if: always()
        continue-on-error: true
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_result.outputs.execution_file }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          EXEC_FILE="${CLAUDE_EXECUTION_FILE:-${RUNNER_TEMP:-/tmp}/claude-execution-output.json}"
          printf '%s' "$SECRETS_JSON" \
            | python3 .bureau-pipeline/scripts/upload_agent_log.py \
                --log-file "$EXEC_FILE" || true

      # ---- RE-MINT BEFORE THE PUSH (DRE-3043) ----
      # The token minted at the top of this job is dead by now if the run
      # passed an hour: GitHub gives an App installation token exactly 60
      # minutes, and every git credential on the runner is that token — the
      # `GH_TOKEN` the agent opens its PR with AND the extraheader
      # actions/checkout wrote for `git push`. On 2026-09-03 run 33822932627
      # finished DRE-3029 ten minutes after that deadline: 5,001 tests green,
      # not one byte of it pushed, ~$20 and 70 minutes rebuilt from scratch.
      #
      # Tokens are cheap and a stale one is a lost run, so mint a fresh one
      # from the SAME pool app the worker used (an explicit per-N map again —
      # Actions cannot index secrets dynamically) and hand it to the rescue
      # step below. continue-on-error + always(): a mint that fails must leave
      # the run exactly as it was, never fail a build that is otherwise fine.
      #
      # TWO of them (DRE-3098), and BOTH belong to the rescue. A `run:` step
      # cannot mint an App token — `create-github-app-token` is an action — so
      # the rescue's credentials are minted as its own steps, immediately
      # before it, and the retry gets a SECOND, independently minted token
      # rather than a second go with the one GitHub just refused. Minting both
      # up front costs two API calls on every run and buys a retry that does
      # not depend on anything the failure touched.
      - name: Mint fresh push token
        id: pushtoken
        if: always() && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_ID_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_ID_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_ID_4
             || secrets.BUREAU_APP_ID }}
          private-key: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_PRIVATE_KEY_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_PRIVATE_KEY_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_PRIVATE_KEY_4
             || secrets.BUREAU_APP_PRIVATE_KEY }}

      # The retry credential. Same App, separate mint: on 2026-09-04 run
      # 33896126776 the rescue pushed with the token the AGENT step held and
      # GitHub answered `The requested URL returned error: 400` — a rejected
      # credential twenty-six minutes into the run, nowhere near the hour.
      # A rescue that retries has to retry with something the failure cannot
      # have poisoned.
      - name: Mint rescue retry token
        id: pushtoken2
        if: always() && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_ID_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_ID_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_ID_4
             || secrets.BUREAU_APP_ID }}
          private-key: >-
            ${{ steps.pool.outputs.n == '2' && secrets.BUREAU_APP_PRIVATE_KEY_2
             || steps.pool.outputs.n == '3' && secrets.BUREAU_APP_PRIVATE_KEY_3
             || steps.pool.outputs.n == '4' && secrets.BUREAU_APP_PRIVATE_KEY_4
             || secrets.BUREAU_APP_PRIVATE_KEY }}

      # Deliver what the agent could not. push_rescue.py re-points GIT's
      # credential — not only `gh`'s — at the fresh token (unsetting the stale
      # extraheader first: http.extraheader is multi-valued and `git config`
      # REFUSES to overwrite a key holding more than one value, which is what
      # actions/checkout leaves behind on a repo with submodules), pushes the
      # card's branch if GitHub does not have it, and opens the PR if the card
      # has none. A STRICT no-op when the agent pushed its own work, and it
      # never fails the job: a red step here summons the medic to re-run a run
      # that already did the work. Its `local_work` output is what the Report
      # step reads to say `credential`, not `died`.
      #
      # BEFORE the two steps below on purpose: both resolve this card's branch
      # from `git branch -r`, and both must see the branch this step delivers.
      - name: Push rescue
        id: rescue
        if: always() && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          # Through the environment, never argv: an argv element is readable by
          # every process on the runner.
          #
          # BOTH credentials are the rescue's OWN mints, and there is no
          # fallback to `steps.worker.outputs.token` (DRE-3098). That fallback
          # is what run 33896126776 pushed with: the token the agent step held,
          # which the failure being rescued from may itself have invalidated —
          # GitHub answered 400 and three runs' partial work died on the
          # runner. The one push whose purpose is to run after something has
          # gone wrong cannot spend a credential the failure touched.
          PUSH_TOKEN: ${{ steps.pushtoken.outputs.token }}
          PUSH_TOKEN_RETRY: ${{ steps.pushtoken2.outputs.token }}
          # Labels, not secrets: what the failure line names, so the log says
          # WHICH credential GitHub refused instead of leaving a reader to
          # guess between three.
          PUSH_TOKEN_SOURCE: the rescue's own mint (Mint fresh push token)
          PUSH_TOKEN_RETRY_SOURCE: the rescue's own re-mint (Mint rescue retry token)
          CARD: ${{ github.event.client_payload.identifier }}
          CARD_URL: ${{ github.event.client_payload.url }}
          CARD_TITLE: ${{ steps.card.outputs.title }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # --patch: where the branch's commits go when BOTH credentials are
          # refused. The next step uploads it as `rescue-<card>.patch`, so the
          # work outlives the runner instead of being destroyed with it.
          python3 .bureau-pipeline/scripts/push_rescue.py rescue \
            --card "$CARD" --repo "$REPO" --base "$BASE" \
            --card-url "$CARD_URL" --card-title "$CARD_TITLE" \
            --patch "${RUNNER_TEMP:-/tmp}/rescue-$CARD.patch" \
            >> "$GITHUB_OUTPUT"

      # THE RUNNER IS NEVER THE LAST COPY (DRE-3098). `patch` is set only when
      # the rescue could not deliver the branch — every other run skips this
      # step with nothing to upload. A dead run's partial work is then on a
      # branch (the rescue pushed it) or in this artifact; it is never only on
      # a disk that is about to be destroyed.
      - name: Upload rescued work
        if: always() && steps.rescue.outputs.patch != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescue-${{ github.event.client_payload.identifier }}.patch
          path: ${{ steps.rescue.outputs.patch }}
          if-no-files-found: warn
          retention-days: 30

      # DRE-1346 Fix 1: the execution result can end {"subtype":"success",
      # "is_error":true} (usage-limit/API death mid-run) — previously the
      # job went green and the medic never fired. Fail loudly on a no-evidence
      # silent death; the report step below still runs (always()) and requeues.
      #
      # DRE-1354: an is_error death is NO LONGER a hard gate failure
      # (--ignore-is-error). The Report step handles it through the
      # model-fallback requeue — switch model + count toward the shared hold cap.
      # A hard fail here would trip the medic into re-running the job on the SAME
      # flaky model, bypassing the cap (the DRE-1300 18×-loop). The card is still
      # surfaced (model-error comment) and requeued; it just doesn't go red and
      # re-run blind.
      - name: Gate on agent result
        if: always() && steps.gate.outcome == 'success' && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.worker.outputs.token }}
          CARD: ${{ github.event.client_payload.identifier }}
          # DRE-2074: 'cancelled' = the agent was killed (job timeout /
          # external cancel) while still working — not a silent death; a red
          # gate here would summon the medic to re-run a healthy-but-slow card.
          CLAUDE_OUTCOME: ${{ steps.claude_result.outputs.outcome }}
        run: |
          BRANCH=$(git branch -r | grep -o "agent/${CARD}-[^ ]*" | head -1 | sed 's|origin/||' || true)
          # card_pr.py is the ONE PR-existence predicate (DRE-2316): --state
          # all (a PR that just MERGED is still a PR), \b-anchored to this
          # card (DRE-1343/2025). Exit 3 = the answer was UNREADABLE, which is
          # not "no PR" — feed the gate a non-empty marker so an API blip can
          # never be reported as a silent death (DRE-2034).
          PR_URL=""
          if PR_INFO=$(python3 .bureau-pipeline/scripts/card_pr.py find "$CARD" --branch "$BRANCH"); then
            PR_URL=$(printf '%s' "$PR_INFO" | cut -f2)
          else
            PR_URL="unreadable"
          fi
          EXEC_FILE="${{ steps.claude_result.outputs.execution_file }}"
          [ -n "$EXEC_FILE" ] || EXEC_FILE=/home/runner/work/_temp/claude-execution-output.json
          # --work-on-runner (DRE-3262): a rescue push GitHub refused leaves no
          # branch and no PR — that is what "refused" means — so without this
          # the DRE-3165 shape reads here as a silent death, fails the job, and
          # sends the medic to re-run a run that finished the card and whose
          # patch is already an artifact. The Report step answers it; this gate's
          # only job is not to call it a death.
          #
          # --handback-file (DRE-4376): the agent's THIRD deliberate exit —
          # it found an epic inside a one-off card and handed it back to
          # Planning, opening no PR. The Report step below already reads this
          # exact path, comments the pieces and moves the card; the gate never
          # knew the exit existed, so on 2026-09-19 (run 35466962427, DRE-4322)
          # a correct hand-back ended the run RED, woke the medic and put a
          # "pipeline failure" diagnosis in the CEO's queue for 20 hours. Same
          # path in both steps, pinned by tests/test_check_agent_result_handback.py.
          python3 .bureau-pipeline/scripts/check_agent_result.py \
            "$EXEC_FILE" "$BRANCH" "$PR_URL" /tmp/agent-blocker.txt \
            --escalation-file /tmp/agent-escalation.txt \
            --handback-file /tmp/agent-handback.txt --ignore-is-error \
            --claude-outcome "$CLAUDE_OUTCOME" \
            --work-on-runner "${{ steps.rescue.outputs.local_work }}"

      - name: Report result to Linear
        if: always() && steps.gate.outcome == 'success' && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.worker.outputs.token }}
          CARD: ${{ github.event.client_payload.identifier }}
          MODEL_USED: ${{ steps.model.outputs.model }}
          # DRE-2074: a cancelled agent step (job timeout / external cancel)
          # is a KILLED run, not a dead agent — the no-PR branch below must
          # defer instead of counting the shared dead-run cap.
          CLAUDE_OUTCOME: ${{ steps.claude_result.outputs.outcome }}
          # DRE-2931: GitHub's own outcome for every step that runs BEFORE the
          # agent, so a run that died in one of them can name which — derived
          # from the platform's record, never inferred from elapsed time or
          # from the absence of a PR (standards/console-honesty.md rule 1).
          DEDUPE_OUTCOME: ${{ steps.dedupe.outcome }}
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          CTX_OUTCOME: ${{ steps.ctx.outcome }}
          SANITIZE_OUTCOME: ${{ steps.card.outcome }}
          INPROGRESS_OUTCOME: ${{ steps.inprogress.outcome }}
          # What those steps printed, for the ONE question their outcome cannot
          # answer: was this Linear refusing a quota (a wait) or something that
          # actually broke?
          PRE_AGENT_LOG: ${{ runner.temp }}/preagent.log
          # DRE-3098: what GitHub refused the rescue push with, and where the
          # work went. "Work still on the runner" with no status sent three
          # runs' readers to the model and the card; the receipt names the
          # status and the artifact instead.
          RESCUE_PUSH_STATUS: ${{ steps.rescue.outputs.push_status }}
          RESCUE_PATCH: ${{ steps.rescue.outputs.patch }}
          RESCUE_ARTIFACT: rescue-${{ github.event.client_payload.identifier }}.patch
          # DRE-3262: whether the rescue's push actually landed, and GitHub's
          # own words when it did not. `local_work` alone cannot answer the
          # first — it is computed BEFORE the push and stays true on a rescue
          # that succeeded — and the second existed only in the run's log,
          # which is where the cause of the DRE-3165 400 still is.
          RESCUE_PUSHED: ${{ steps.rescue.outputs.pushed }}
          RESCUE_ERROR: ${{ steps.rescue.outputs.error }}
          # WHICH CREDENTIAL MAY DISPATCH (DRE-1254, DRE-3262). A
          # workflow_dispatch needs `actions: write`, and the App token above
          # carries no Actions permission at all — only the workflow's own
          # github.token can hold it, and only the calling stub can grant it.
          # Same variable, same mechanism as reconcile.yml's sweep. A stub that
          # has not been updated passes a token without the permission: the
          # dispatch 403s, the card still names the artifact, and the sweep
          # (whose stub does grant it) delivers on its next pass.
          GH_DISPATCH_TOKEN: ${{ github.token }}
          # NO ${{ }} BELOW THIS LINE, AND THAT IS THE POINT (DRE-3484). A `run:`
          # block containing an interpolation is compiled by GitHub into ONE
          # `format()` expression whose format string is the whole script, with
          # every literal brace doubled — and a single expression may not exceed
          # 21,000 characters. This script is ~23,000. On 2026-09-09 that made
          # the file unparseable and every agent-execute dispatch in the fleet
          # was refused at 06:15 PT with no job and no log, for 3h20m. The two
          # step outputs it used to read inline now arrive as env, the other
          # three were already default variables, and the script itself is
          # unchanged. With no interpolation the block is never compiled as an
          # expression, so its length stops mattering at any size — a property,
          # not a budget. `tests/test_workflow_expression_budget.py` holds the
          # line for the blocks that still do interpolate.
          # All five are declared HERE rather than read from the runner's own
          # GITHUB_* variables, even the three the runner always sets. The step
          # then states every value it needs in one place, and the scenario
          # harness — which renders `env:` and executes the script, and does not
          # simulate the runner's defaults — keeps testing the real thing. (The
          # GITHUB_ prefix is reserved and cannot be assigned here anyway.)
          BUREAU_SERVER_URL: ${{ github.server_url }}
          BUREAU_REPOSITORY: ${{ github.repository }}
          BUREAU_RUN_ID: ${{ github.run_id }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_result.outputs.execution_file }}
          RESCUE_LOCAL_WORK: ${{ steps.rescue.outputs.local_work }}
        run: |
          RUN_URL="$BUREAU_SERVER_URL/$BUREAU_REPOSITORY/actions/runs/$BUREAU_RUN_ID"
          # Resolve the card's branch FIRST: an empty --head filter makes
          # `gh pr list` return the repo's most recent open PR, which once
          # attributed another card's PR to a dead run and sent it to the review lane
          # with a false "PR opened" receipt (DRE-1343, 2026-06-12).
          BRANCH=$(git branch -r | grep -o "agent/${CARD}-[^ ]*" | head -1 | sed 's|origin/||' || true)
          # Then ask card_pr.py — the ONE PR-existence predicate the reconcile
          # sweep shares (DRE-2316). It queries --state all, so a PR that
          # MERGED seconds ago is visible; this step used to run a bare
          # `gh pr list --head` (default: OPEN only), which on 2026-08-08 read
          # DRE-2316's PR #137 — merged ten seconds earlier — as NO PR, posted
          # "agent died with no PR", and requeued shipped work onto a second
          # agent. It also confirms the head ref against this card, so the
          # DRE-1343 mis-attribution cannot return through the new seam.
          # Exit 3 means UNREADABLE (403 / rate limit / network) — NOT "no PR"
          # (DRE-2034); that branch defers instead of declaring a death.
          PR_STATE=""
          PR_URL=""
          if PR_INFO=$(python3 .bureau-pipeline/scripts/card_pr.py find "$CARD" --branch "$BRANCH"); then
            PR_STATE=$(printf '%s' "$PR_INFO" | cut -f1)
            PR_URL=$(printf '%s' "$PR_INFO" | cut -f2)
          else
            PR_STATE="UNREADABLE"
          fi

          # HOW did the run die? (DRE-1354, split by DRE-2312.) One shared
          # classifier answers it — `api_death`, `turn_exhaustion`, or `none`
          # — so this step and the gate can never tell different stories.
          #
          # This line used to be its own inline is_error test, reading the raw
          # result dict. That is why DRE-2695's turn-exhausted BUILD run was reported
          # as "agent died with API/model error (is_error) … dead run 1/3"
          # with a `model-error: claude-opus-5` marker after 36 minutes of real
          # work: the shared predicate was one import away and this path did
          # not call it. There is exactly one is_error test in the codebase now
          # (check_agent_result.classify_death) and every caller goes through
          # it.
          EXEC_FILE="$CLAUDE_EXECUTION_FILE"
          [ -n "$EXEC_FILE" ] || EXEC_FILE=/home/runner/work/_temp/claude-execution-output.json
          # --work-on-runner (DRE-3043): what the Push rescue step OBSERVED —
          # committed work for this card that GitHub does not have. It is the
          # difference between "the agent died with no PR" and "the run did the
          # work and its credential expired before it could deliver it", and it
          # is a fact from the disk, never a reading of the transcript.
          LOCAL_WORK="$RESCUE_LOCAL_WORK"
          DEATH_CLASS=$(python3 .bureau-pipeline/scripts/check_agent_result.py classify "$EXEC_FILE" \
            --work-on-runner "$LOCAL_WORK" || echo none)

          # DID IT DELIVER? (DRE-3262.) A second question about the same fact,
          # and the one the DRE-3165 run never asked: committed work on the
          # runner plus a push GitHub did not accept is a FAILED DELIVERY,
          # whatever the PR lookup answers. Both inputs are needed — a rescue
          # that pushed successfully still reports local_work=true — and the
          # answer comes from the shared predicate, never from a shell test of
          # its own. Fail-soft to `delivered`: an unreadable answer must leave
          # every other branch exactly as it was.
          FAILED_DELIVERY=$(python3 .bureau-pipeline/scripts/check_agent_result.py delivery \
            --work-on-runner "$LOCAL_WORK" --push-status "$RESCUE_PUSH_STATUS" \
            --pushed "$RESCUE_PUSHED" || echo delivered)
          RUN_ID="$BUREAU_RUN_ID"
          DELIVERY_REPO="$BUREAU_REPOSITORY"

          # DID THE AGENT START AT ALL? (DRE-2931.) Every class above presumes
          # a run: a run that failed BEFORE claude-code-action took no turn,
          # called no model and spent nothing, so it cannot have failed at this
          # card's work. Same discipline as the classifier — one shared
          # predicate, never a shell test of its own. Fail-open to "yes": if
          # the predicate itself cannot answer, count the death exactly as
          # today rather than quietly stop counting real ones.
          AGENT_STARTED=$(python3 .bureau-pipeline/scripts/check_agent_result.py started \
            "$EXEC_FILE" --claude-outcome "$CLAUDE_OUTCOME" --branch "$BRANCH" || echo yes)
          # WHICH step failed, from GitHub's own outcomes rather than a guess.
          FAILED_STEP=""
          for STEP_OUTCOME in "Duplicate-dispatch guard=$DEDUPE_OUTCOME" \
                              "Select model=$MODEL_OUTCOME" \
                              "Assemble agent context=$CTX_OUTCOME" \
                              "Sanitize untrusted card text=$SANITIZE_OUTCOME" \
                              "Card → In Progress=$INPROGRESS_OUTCOME"; do
            if [ "${STEP_OUTCOME##*=}" = "failure" ]; then
              FAILED_STEP="${STEP_OUTCOME%=*}"
              break
            fi
          done
          # And was that failure Linear refusing a quota? DRE-2923 owns that
          # fingerprint (host AND code on one line, so prose quoting a
          # RATELIMITED payload cannot classify) — read it, never re-derive it.
          RATE_FLAGS=""
          if python3 .bureau-pipeline/scripts/medic_classify.py \
               "Agent Task" "$PRE_AGENT_LOG" 2>/dev/null \
               | grep -qx "class=linear_ratelimited"; then
            RATE_FLAGS="--rate-limited"
          fi

          if [ "$PR_STATE" = "MERGED" ]; then
            # The work SHIPPED while this run was finishing (DRE-2316: PR #137
            # merged at 22:22:19, this step ran at 22:22:29). Report it and
            # change nothing: linear-sync's merge→Done owns the card's state,
            # and the reconcile sweep re-closes it if that ever failed. The one
            # thing this branch must never do is treat a merged PR as a death.
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" \
              "🤖 PR already merged: $PR_URL — this card's work shipped while the run was finishing; no requeue. Run: $RUN_URL"
          elif [ -n "$PR_URL" ] && [ "$PR_URL" != "null" ]; then
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" \
              "🤖 PR opened: $PR_URL — CI + critic review running. Run: $RUN_URL"
            python3 .bureau-pipeline/scripts/linear_ops.py advance "$CARD" "In Review" "In Progress,Todo"
          elif [ -f /tmp/agent-handback.txt ] && [ -s /tmp/agent-handback.txt ]; then
            # The hand-back rule (DRE-2727). The agent opened what the card
            # describes as one piece of work and found an epic's worth: several
            # independent PRs, several owners, contracts between them. The two
            # existing exits are both wrong for it — an escalation asks the CEO
            # a question nobody needs to answer ("should this be planned?" has
            # one answer), and a blocker parks it inert in Backlog where the
            # planner never sees it. So it goes back to Planning, which is the
            # lane that owes a decomposition, with the pieces the agent already
            # found written down so the planner does not re-derive them.
            #
            # Checked FIRST of the three stop-before-a-PR branches: it is the
            # most specific, and an agent that wrote a hand-back note has
            # already decided the card cannot ship as one PR.
            #
            # `advance`, not `state`: cmd_state's DRE-1885 building-card guard
            # re-routes an In Progress card aimed at a backlog-type state back
            # to Todo, which would re-dispatch straight into the same sprawl.
            # cmd_advance writes the target directly and still refuses to drag
            # a card that went Done in the meantime (DRE-2316).
            {
              echo "🤖 Handed back to Planning: this card was dispatched as one piece of work and is an epic's worth. The agent stopped rather than sprawl it into one unreviewable pull request."
              echo ""
              cat /tmp/agent-handback.txt
              echo ""
              echo "Run: $RUN_URL"
            } > /tmp/handback-comment.md
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" \
              "$(cat /tmp/handback-comment.md)"
            python3 .bureau-pipeline/scripts/linear_ops.py advance "$CARD" "Planning" "In Progress,Todo" || true
          elif [ -f /tmp/agent-escalation.txt ] && [ -s /tmp/agent-escalation.txt ]; then
            # Escalate-by-exception (DRE-1655/1706): the agent hit GENUINE
            # uncertainty — ambiguous intent it can't safely resolve, a
            # risky/destructive change, or a business A-vs-B decision the CEO
            # should own — so it stopped BEFORE opening a PR and wrote a
            # plain-English question. Post the question and park the card in
            # Green Light — the CEO's "needs you" queue (DRE-2776). An
            # escalated card is NOT broken: it is correct, and waiting on a
            # judgement only the CEO can make. The broken-card lane is for a
            # card that went wrong — unroutable, held, bounced by the readiness
            # guard — and it rotted the first time (17 machine-created cards,
            # none ever moved) precisely by mixing those two meanings.
            # The CEO answers in-thread and moves the card → Todo to proceed
            # (a fresh run reads the guidance) or → Backlog to drop it. Checked
            # BEFORE the blocker branch: an escalation is a human DECISION that
            # unblocks the build, distinct from an impossible-as-specified card.
            {
              echo "🙋 The agent paused for a decision before building — it judged this needs your call rather than a guess."
              echo ""
              cat /tmp/agent-escalation.txt
              echo ""
              echo "Answer here, then move this card to **Todo** to proceed (the agent picks up your guidance), or to **Backlog** to drop it. Run: $RUN_URL"
            } > /tmp/escalation-comment.md
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" \
              "$(cat /tmp/escalation-comment.md)"
            python3 .bureau-pipeline/scripts/linear_ops.py advance "$CARD" "Green Light" "In Progress,Todo" || \
              python3 .bureau-pipeline/scripts/linear_ops.py state "$CARD" "Green Light" || true
          elif [ -f /tmp/agent-blocker.txt ]; then
            # Backlog, NEVER Todo: the relay dispatches a fresh agent on every
            # Todo transition, and a blocker is deterministic — the next agent
            # reads the same card and blocks on the same wall, forever. (Origin:
            # DRE-1286 redispatched 6s after its blocker note, 2026-06-12.)
            # Backlog is inert until a human (or a description fix + the
            # dependency gate) releases it.
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" \
              "🛑 Agent blocked: $(cat /tmp/agent-blocker.txt) — parked in Backlog until the blocker is resolved (a Todo return here would redispatch agents into the same wall). Run: $RUN_URL"
            # --park: a blocker is a DELIBERATE Backlog hold (Todo would
            # redispatch into the same wall — DRE-1286). Without it the
            # DRE-1885 building-card guard would re-route this In Progress →
            # Backlog move to Todo and reintroduce that loop.
            python3 .bureau-pipeline/scripts/linear_ops.py state "$CARD" "Backlog" --park || true
          elif [ "$FAILED_DELIVERY" = "failed" ] && [ -n "$RESCUE_PATCH" ] && [ -f "$RESCUE_PATCH" ]; then
            # THE RUN STILL DELIVERS (DRE-3262). The work is committed on a disk
            # that is about to be destroyed, GitHub refused the push on both of
            # the rescue's own fresh mints, and the patch is already uploaded as
            # a run artifact. Two things have to happen here, in this step,
            # because this is the last step that will ever run for this card:
            #
            #   1. SAY IT ON THE CARD, naming the artifact and this run. On
            #      2026-09-06 the card instead read "the push-rescue step
            #      delivers the branch and opens the PR" followed by "could not
            #      read this card's PR state … NOT being recorded as a dead
            #      agent", and a 93-minute green build sat in
            #      `rescue-DRE-3165.patch` until a person went looking at 11:05
            #      PT. A rescued patch only a human knows about is the DRE-3043
            #      loss with an extra step.
            #   2. HAND THE DELIVERY TO A JOB THAT CAN DO IT — a
            #      `deliver-rescue` workflow_dispatch carrying the run id, which
            #      downloads the artifact with its OWN freshly minted token,
            #      applies it on a fresh branch and opens the pull request. The
            #      comment goes out whether or not the dispatch is accepted (a
            #      repo with no such stub answers 404), so the artifact fact is
            #      on the card either way and the reconcile sweep can re-check
            #      off it.
            #
            # DELIBERATELY ABOVE THE UNREADABLE BRANCH. Both branches can be
            # true at once — it was the same expired token that refused the push
            # and 401'd the PR read — and this one is built on a fact from the
            # runner's disk while that one is built on a question GitHub
            # declined to answer. The card is NOT requeued to Todo here: a
            # requeue rebuilds from nothing the work the artifact is holding
            # (~90 minutes and the run's cost again), and if the delivery does
            # not land, the sweep's re-check spends the dead-run budget instead.
            #
            # AND ONLY WHEN THE PATCH REALLY EXISTS. `write_patch` can fail —
            # a root commit with no merge base, a full disk — and when it does,
            # push_rescue says plainly that "this run's disk is the only copy of
            # the work". There is nothing to deliver then and nothing to name on
            # the card, so this branch stands aside and DRE-3043's remedy takes
            # the card: the credential-expiry receipt and the requeue below,
            # which is the only remedy left when the work is genuinely gone.
            python3 .bureau-pipeline/scripts/deliver_rescue.py handoff \
              --card "$CARD" --repo "$DELIVERY_REPO" --run-id "$RUN_ID" \
              --artifact "$RESCUE_ARTIFACT" --status "$RESCUE_PUSH_STATUS" \
              --stderr "$RESCUE_ERROR" || true
          elif [ "$PR_STATE" = "UNREADABLE" ] && [ "$FAILED_DELIVERY" != "failed" ]; then
            # …UNLESS THE RUN PLAINLY FAILED TO DELIVER (DRE-3262). Reached only
            # when there is no artifact to hand a delivery job — the branch
            # above took the deliverable case — and then this run's work is
            # genuinely gone, so a rebuild is the remedy and the death branch
            # below owns it. It was the SAME expired token that refused the push
            # and 401'd this lookup, so letting the failed lookup answer is
            # letting the cause of the problem certify that there isn't one.
            #
            # GitHub would not tell us whether a PR exists (403, rate limit,
            # network). "Could not tell" is NOT "no PR" — parsing a failed read
            # as emptiness is what yanked healthy cards around on 2026-06-28
            # (DRE-2034). Post the receipt, move nothing, count nothing: the
            # reconcile sweep re-asks off the run's real conclusion, with the
            # existing cap. Deliberately below the blocker/escalation branches
            # — an honest note the agent wrote is better evidence than a failed
            # lookup.
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" \
              "⚠️ Could not read this card's PR state from GitHub (API error), so this run is NOT being recorded as a dead agent — the reconcile sweep will re-check. Run: $RUN_URL"
          else
            # No PR and no blocker. Three death classes share ONE hold cap
            # (turn exhaustion has its OWN — see the DRE-2312 note below),
            # counted by the 'dead-run-requeue' tag (DRE-1403): silent (here),
            # hung (reconcile sweep), and — new in DRE-1354 — is_error (an
            # API/model death mid-run). dead_run.decide() unifies requeue-vs-hold
            # and, for an is_error death, records a 'model-error:' marker so the
            # requeue's next attempt selects the NEXT model down the ladder
            # instead of re-dying on the same one. is_error deaths now COUNT
            # toward the cap (previously they failed the job and the medic re-ran
            # on the same model, bypassing it — DRE-1300 looped 18×).
            #
            # A CANCELLED agent step is NOT a death (DRE-2074): the job timeout
            # (or an external cancel) killed a still-working agent — the old
            # code counted each kill as a silent death and parked DRE-2070
            # after 4 of them. decide --cancelled answers "defer": post the
            # receipt, move nothing, count nothing; the reconcile sweep
            # requeues off the run's real conclusion (DRE-2032), with the
            # existing cap.
            #
            # --since "dead-run-budget-reset": the cap is a BUDGET, and a human
            # can refill it. Nothing used to reset the count — and the hold
            # comment itself carries the 'dead-run-requeue' tag — so a card an
            # operator released (label cleared, Backlog → Todo) walked back in
            # with its whole exhausted history and re-held on its very first
            # subsequent death. `linear_ops.py unpark <CARD>` posts the reset
            # marker; only deaths AFTER it count here.
            #
            # TURN EXHAUSTION IS ITS OWN BUDGET (DRE-2312): the agent ran out
            # of steps, which is a failed attempt, not a death of the service
            # and not a fault of the model. It reads and spends the
            # 'turn-exhaustion-requeue' count instead — one retry, then a hold
            # that says the card needs splitting — and passes NO --error-model,
            # so no 'model-error:' marker is written and the DRE-1354 fallback
            # cannot switch models on a budget ceiling.
            # WHICH cap a hold came from, carried to the park receipt below.
            # `decide` reaches "hold" from two independent budgets and the park
            # step is uniform for either, so the branch that picked the budget
            # is the only place that still knows which one it was.
            PARK_TAG_FLAGS=""
            if [ "$AGENT_STARTED" = "no" ]; then
              # A PLATFORM FAULT, not a strike (DRE-2931). The run died before
              # the agent: no turn, no model, nothing spent. Checked FIRST of
              # the classes because none of them can be true of a run that
              # never started — DRE-2911 was told it had died of an API/model
              # error, twice, for 20-second runs that cost $0, and the third
              # one parked it as "a human must split/fix the card".
              #
              # No count is read at all: the cap is the CARD's budget and this
              # is not the card's fault, so the answer cannot change the
              # decision — and under the exhausted quota that caused this, the
              # count-comments call would fail too.
              PRIOR=0
              ERR_FLAGS="--pre-agent $RATE_FLAGS"
            elif [ "$DEATH_CLASS" = "turn_exhaustion" ]; then
              PRIOR=$(python3 .bureau-pipeline/scripts/linear_ops.py count-comments \
                "$CARD" "turn-exhaustion-requeue" --since "dead-run-budget-reset" || echo 0)
              # BUDGET OR SIZE? (DRE-3097.) The hold has two causes and used to
              # name one. The card's own thread answers it — the `⏳ n/5` phase
              # receipts of each run, grouped by the `🧠 model-attempt`
              # heartbeat that starts one — so the receipt tells a human to
              # raise `turns:` when every run reached implementation green and
              # died after it, instead of telling them to split a card that
              # splitting has already failed to fix (DRE-3088's third death was
              # on the XS version). Fail-soft at every step: an unreadable
              # thread writes an empty array and dead_run.py falls back to the
              # split text it has always sent.
              COMMENTS_FILE="${RUNNER_TEMP:-/tmp}/card-comments.json"
              python3 .bureau-pipeline/scripts/linear_ops.py dump-comments "$CARD" \
                > "$COMMENTS_FILE" || echo '[]' > "$COMMENTS_FILE" || true
              ERR_FLAGS="--turn-exhaustion --execution-file $EXEC_FILE --comments-file $COMMENTS_FILE"
              PARK_TAG_FLAGS="--turn-exhaustion"
            elif [ "$DEATH_CLASS" = "credential_expiry" ]; then
              # DRE-3043. The re-mint above did not save this one — so say what
              # actually happened. The run finished the card and GitHub refused
              # the push; calling that "the agent died" sends whoever reads the
              # card to the model, the service and the card itself, none of
              # which is at fault. It spends the SHARED dead-run budget (the
              # rebuild is real) and passes NO --error-model, so no
              # `model-error:` marker arms the DRE-1354 fallback against a
              # model that never failed.
              PRIOR=$(python3 .bureau-pipeline/scripts/linear_ops.py count-comments \
                "$CARD" "dead-run-requeue" --since "dead-run-budget-reset" || echo 0)
              ERR_FLAGS="--credential-expiry"
              # DRE-3098: name what GitHub actually said, and where the work
              # is. The status is admitted only if it IS a status — ERR_FLAGS
              # is deliberately word-split, so nothing but three digits may
              # reach it.
              case "$RESCUE_PUSH_STATUS" in
                ''|*[!0-9]*) ;;
                *) ERR_FLAGS="$ERR_FLAGS --push-status $RESCUE_PUSH_STATUS" ;;
              esac
              # Same discipline for the artifact name: it carries the card
              # identifier, which arrives from the relay's payload.
              if [ -n "$RESCUE_PATCH" ] && [ -f "$RESCUE_PATCH" ]; then
                case "$RESCUE_ARTIFACT" in
                  *[!A-Za-z0-9._-]*) ;;
                  *) ERR_FLAGS="$ERR_FLAGS --artifact $RESCUE_ARTIFACT" ;;
                esac
              fi
            else
              PRIOR=$(python3 .bureau-pipeline/scripts/linear_ops.py count-comments \
                "$CARD" "dead-run-requeue" --since "dead-run-budget-reset" || echo 0)
              ERR_FLAGS=""
              if [ "$DEATH_CLASS" = "api_death" ]; then
                ERR_FLAGS="--is-error --error-model $MODEL_USED"
              fi
            fi
            if [ "$CLAUDE_OUTCOME" = "cancelled" ]; then
              ERR_FLAGS="$ERR_FLAGS --cancelled"
            fi
            # shellcheck disable=SC2086  # ERR_FLAGS is deliberately word-split
            DECISION=$(python3 .bureau-pipeline/scripts/dead_run.py decide \
              "${PRIOR:-0}" $ERR_FLAGS --failed-step "$FAILED_STEP" --run-url "$RUN_URL")
            ACTION=$(printf '%s\n' "$DECISION" | head -1)
            BODY=$(printf '%s\n' "$DECISION" | tail -n +3)
            if [ "$ACTION" = "hold" ] && ! python3 .bureau-pipeline/scripts/dead_run.py park "$CARD"; then ACTION="hold-unlanded"; fi
            if [ "$ACTION" = "hold-unlanded" ]; then BODY=$(python3 .bureau-pipeline/scripts/dead_run.py park-unlanded --run-url "$RUN_URL" "$PARK_TAG_FLAGS"); fi
            python3 .bureau-pipeline/scripts/linear_ops.py comment "$CARD" "$BODY"
            # THE PARK IS ATOMIC OR IT IS NOTHING (DRE-2931). This used to be
            # two independent `|| true` writes — add the label, then move the
            # card — and DRE-2911's park landed the first and lost the second:
            # the card sat In Progress for seven and a half hours while its own
            # comment said it was in Backlog, and nothing retried it, because
            # the label is what tells every sweep a held card is already
            # handled. `dead_run.py park` retries each write and takes its OWN
            # label back off if the state never lands, so neither survives
            # alone; when it writes neither it exits nonzero and the receipt
            # above says so instead of claiming a hold that never happened.
            # The sweep re-attempts on its next pass.
            #
            # $PARK_TAG_FLAGS is why that receipt knows WHICH budget it is
            # spending. `decide` reaches "hold" from two independent caps and
            # the unlanded receipt REPLACES the body it wrote, so a tag
            # hardcoded in park-unlanded would lose the turn strike a turn-cap
            # hold actually spent and bill the dead-run budget for a death
            # that never happened — the same accounting corruption the atomic
            # park removes, one corner over. It is empty on every path but the
            # turn-exhaustion one, and quoted, so the call is always exactly
            # one extra argument the CLI ignores when there is nothing to say.
            if [ "$ACTION" = "hold-unlanded" ]; then
              echo "::error title=Park did not land::$CARD reached a hold cap but Linear refused the writes — the card is NOT parked and carries no label. The reconcile sweep re-attempts it."
            elif [ "$ACTION" = "requeue" ]; then
              python3 .bureau-pipeline/scripts/linear_ops.py state "$CARD" "Todo" || true
            elif [ "$ACTION" = "infra" ]; then
              # The fault is against the RUN, not the card, so it is reported
              # where run faults belong — on the run — and the card is left
              # exactly where it was for the reconcile sweep to pick up.
              echo "::warning title=Infrastructure fault before the agent started::${FAILED_STEP:-a step before the agent} failed; no agent ran and no model was called, so this is NOT charged to $CARD."
            fi
            # ACTION=defer (cancelled run): receipt only — the card stays
            # In Progress and reconcile owns the requeue after the run
            # actually concludes.
          fi

      # THE JOB'S RED LIGHT (DRE-4108). It used to be the agent step itself:
      # the step failed, the job failed, and every `always()` step below still
      # ran. With three attempts that no longer works — attempt 1 failing must
      # not end the run when attempt 2 is going to finish it — so the attempts
      # are `continue-on-error` and the decision moves here, to the LAST step
      # in the job, reading the resolved outcome.
      #
      # Everything above it is unchanged in order and in behaviour: the push
      # rescue, the result gate and the Linear report all still run, and still
      # run before anything goes red. What a dead run reports is exactly what
      # it reported before.
      #
      # Only `failure` fails. `cancelled` is the 120-minute cap killing a
      # healthy long build (DRE-2074) and `skipped` is an agent step that never
      # ran — neither is an agent failure, and turning either into one would
      # summon the medic to re-run work that was never wrong.
      - name: Fail if the agent step failed
        id: agent_step_failed
        if: always() && steps.gate.outputs.bounced != 'true' && steps.dedupe.outputs.skip != 'true' && steps.claude_result.outputs.outcome == 'failure'
        env:
          AGENT_OUTCOME: ${{ steps.claude_result.outputs.outcome }}
          AGENT_ATTEMPTS: ${{ steps.claude_result.outputs.attempts }}
          RETRY_1_REASON: ${{ steps.retry1.outputs.reason }}
          RETRY_2_REASON: ${{ steps.retry2.outputs.reason }}
        run: |
          if [ "$AGENT_OUTCOME" != "failure" ]; then
            echo "agent step outcome: ${AGENT_OUTCOME:-unset} — nothing to fail on"
            exit 0
          fi
          echo "::error::The agent step failed on all ${AGENT_ATTEMPTS:-1} attempt(s)." \
               "Retry decisions: ${RETRY_1_REASON:-none} / ${RETRY_2_REASON:-none}." \
               "A GitHub rate-limit refusal that arrives before the model is" \
               "retried (DRE-4108); anything else, and anything that reached" \
               "the model, is not. This run is red and the medic files a card."
          exit 1
