# Self-host trigger stub (DRE-1929, adr-bureau-pipeline-self-host) — this repo
# consumes its OWN reusable workflows exactly like a product repo. The stub
# owns the trigger, concurrency, and permissions; everything else is central.
#
# @main on purpose: bureau-pipeline IS the canary channel. The fleet consumes
# human-promoted tags (@v1), so an agent merge to main here changes nothing
# live — it only stages the next release. The fully qualified form (never a
# local ./ ref) pins the logic to the already-merged version, not the PR's.
name: Agent Task

on:
  repository_dispatch:
    types: [agent-execute]

concurrency:
  group: agent-${{ github.event.client_payload.identifier }}
  cancel-in-progress: false

# `actions: write` (DRE-3262) is what lets a run whose rescue push was refused
# dispatch the `deliver-rescue` follow-up that turns its patch artifact into a
# pull request. The App token carries no Actions permission at all (DRE-1254:
# "HTTP 403: Resource not accessible by integration"), so the dispatch rides
# the workflow's own GITHUB_TOKEN and only the stub can grant it — the same
# reason self-merge-gate.yml and the agent-fix stub carry it. A stub without it
# degrades rather than breaks: the dispatch 403s, the card still names the
# artifact and the run, and the reconcile sweep delivers on its next pass.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  call:
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/agent-task.yml@main
    with:
      pipeline_ref: main
    secrets: inherit
