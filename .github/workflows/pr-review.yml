# Self-critic stub — run the adversarial QA critic on bureau-pipeline's OWN PRs.
#
# Every product repo runs the critic via a thin stub like this; until now the
# pipeline repo itself was the one exception — its workflows are all reusable
# (workflow_call) and never fire on its own PRs, so control-plane changes (the
# merge gate, the agents' prompts) shipped with NO adversarial review. This
# stub closes that: same reusable qa-review, same verdict contract, on every
# PR here. Since DRE-1929 (accepted adr-bureau-pipeline-self-host) the full
# stub set exists — self-merge-gate.yml DOES auto-merge on an authenticated
# APPROVE: main is the staging channel (the fleet consumes human-promoted
# tags), so the permanent human gate is release PROMOTION, not per-PR merges.
# This file stays the ONE qa-review stub; don't add a second caller.
#
# SECURITY — the `uses:` ref is the FULLY QUALIFIED @main form on purpose.
# A local `./.github/workflows/qa-review.yml` reference would resolve from the
# PR's merge ref, letting a PR that edits qa-review.yml choose the logic that
# reviews itself. @main pins the critic to the already-merged version.
name: QA Review

on:
  pull_request:
    # `ready_for_review` (DRE-5801): the critic skips a draft, so marking it
    # ready is the event that starts its review. A product-repo stub needs the
    # same type: one that does not list it reviews a PR marked ready only on
    # its next push, because no sweep dispatches a review that never ran.
    # `edited` (DRE-6192): a person's fix to the description of a pull
    # request the critic sent back re-reviews it with no push. The reusable
    # decides which edits review — only a person's body edit while the
    # critic's REQUEST_CHANGES stands on the unchanged head — so every other
    # edit is a skip. A product-repo stub opts in with the same type and the
    # same concurrency group below.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true

# An `edited` run gets a group of its OWN (DRE-6192). A run joins its group
# when it is created, before any `if:` or step runs, so an edit sharing the
# push group would cancel a review in progress and then decide to skip — the
# review lost, with nothing to re-ask for it. The pipeline edits bodies near
# reviews (on agent-bureau #3323 the bot edited the body 9 seconds before the
# review run was created). The same hole would survive inside one edited
# group, so an edit that can review — a body change by a sender typed and not
# a Bot, the script's own admission rule — takes `-edited`, and every other
# edit, which always skips, takes `-edited-other`. A skip then cancels only a
# skip, and a person's newer body edit replaces the review of the older one.
concurrency:
  group: qa-review-${{ github.event.pull_request.number || inputs.pr_number }}${{ github.event.action == 'edited' && (github.event.changes.body && github.event.sender.type && github.event.sender.type != 'Bot' && '-edited' || '-edited-other') || '' }}
  cancel-in-progress: true

permissions:
  # DRE-4269: the agent's scrubbed log uploads on a short-lived AWS login,
  # and a reusable workflow can hold no more permission than the stub that
  # calls it — so the grant has to live here.
  id-token: write
  contents: read
  pull-requests: write
  # DRE-1927: the repair-PR review context fetches the ORIGINAL failing
  # run's logs with github.token (the qa-bot App deliberately lacks
  # actions:read). Read-only; absent it, the stage degrades to the
  # maximum-suspicion fallback rather than blocking review.
  actions: read

jobs:
  call:
    # DEPENDABOT (DRE-2047): a pull_request run triggered by dependabot[bot]
    # receives GitHub's separate Dependabot secrets store (empty for us) plus
    # a read-only token — `secrets: inherit` passes nothing and the reusable
    # dies at required-secret validation with ZERO steps (PRs #93–#96, run
    # 29168433294). Skip that doomed run here, at the only point early
    # enough; the reconcile sweep dispatches the REAL review for dependabot
    # PRs via workflow_dispatch below (full secrets, reviewing the PR ref —
    # never pull_request_target against untrusted code).
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/qa-review.yml@main
    with:
      pipeline_ref: main
    secrets: inherit
