# Shadow Replay (DRE-7197) — a batch of side-by-side replays, and how often
# each replay agreed with the verdict recorded at the time.
#
# The critic (DRE-7193, qa-review.yml) and the verifier (DRE-7194, verify.yml)
# each replay ONE past pull request in shadow mode: at the head its recorded
# verdict was bound to, on the model the caller names, writing the verdict to
# the `shadow-verdict-<role>-<pr>` artifact and posting nothing. This runs a
# batch of them and compares. The noise-floor reading is taken with it, and
# the model-switch epics (DRE-7185, DRE-7187, DRE-7188, DRE-7189) read their
# bars with it afterwards.
#
#   pick     scripts/shadow_replay.py pick — by default the newest `count`
#            critic reviews recorded on `recorded_model` (read off the
#            critic's copies on this repo's Linear cards), or the pull
#            requests `prs` lists. Fewer than `count` fails the run, naming
#            how many were found. Each critic record names `rules_ref`, the
#            newest bureau-pipeline `main` commit at or before its recorded
#            verdict (DRE-7280), so the critic replays by the rules of that
#            day; one it cannot read is replayed by today's rules, and named.
#            `unknown_builder` picks the reviews run while the build's model
#            could not be read, the acted-on rejections first (DRE-7304);
#            `from_run` replays exactly the acted-on records of an earlier
#            run's pick, the Opus control.
#   replay   a matrix over the pick, four at a time so a batch does not drain
#            the subscription in one burst. `uses:` cannot be an expression,
#            so the replay is two jobs, one per reusable, and `reviewer`
#            decides which one runs.
#   compare  always: the artifacts against the pick, the report as the
#            `shadow-replay-report` artifact, and the `shadow-replay:` lines.
#
# It posts nothing anywhere: everything it produces is an artifact and lines
# in its own log. NOT watched by the medic or red-main repair
# (scripts/check_workflow_watchers.py NOT_WATCHED): a red replay is read by
# the operator from its report, and an automatic retry would spend another
# batch of reviewer runs.
#
# Dispatched here, or called by a product repo's stub (DRE-7306) — the only
# way to replay the verifier, which bureau-pipeline has no stub for. Either
# way `pick` and `compare` run shadow_replay.py and the Python setup out of a
# bureau-pipeline checkout at `pipeline_ref` in `.bureau-pipeline`, the way
# verify.yml runs its scripts, never out of the caller's tree; a dispatch
# here has no `pipeline_ref` and checks out `main`. `$GITHUB_REPOSITORY` is
# the caller in a called workflow, so `pick` reads the caller's pull
# requests, its cards under `repo:<slug>`, and `from_run`'s earlier pick. A
# stub's own concurrency group must not be `shadow-replay-<run id>`: a caller
# and the workflow it calls sharing one group deadlock.
#
# Vendor boundary (standards/vendor-boundaries.md):
#   Q1 actor — a person dispatches this, or a product repo's stub that calls
#      it, so the run initiates as that person; nothing here reads the actor,
#      and the nested reusables' bot gates are not involved. The reusables
#      run in shadow mode, which reviews unconditionally (DRE-7193) and mints
#      the critic's token read-only.
#   Q2 secrets — a dispatched run reads its repo's full secrets store (the
#      caller's, when a stub calls this), and `secrets: inherit` hands the
#      reusables the same keys a live review holds. `pick` uses
#      LINEAR_API_KEY to read comments and this run's own token to read
#      commits and pull requests, bureau-pipeline `main`'s commit list
#      included — and, since DRE-7304, the verifier stub's runs and job logs
#      and an earlier run's `shadow-replay-pick` artifact, on the
#      `actions: read` grant below.
#   Q3 re-run — re-running failed jobs replays only the failed pull requests
#      and compares again, and a re-dispatch re-runs the whole batch. Nothing
#      is posted, so there is no receipt either could trip over.
#   Q4 limits — a matrix holds at most 256 jobs and a job output 1 MB; a
#      batch of `count` records (150 at most so far) is far inside both.
#      Called, the nesting is stub → this → qa-review.yml/verify.yml, three
#      levels, inside GitHub's limit.
#   Q5 our crash — a replay that dies leaves no artifact, and compare counts
#      it as a `no verdict` mismatch, named apart from a disagreement. A pick
#      that fails starts no replay at all.
name: Shadow Replay

on:
  workflow_dispatch:
    inputs:
      reviewer:
        description: Which reviewer to replay — critic (qa-review.yml) or verifier (verify.yml).
        type: choice
        options: [critic, verifier]
        default: critic
      model:
        description: The model id the replays run on.
        type: string
        required: true
      recorded_model:
        description: >-
          Pick the critic reviews recorded on this model (the `🧠 model:` line
          on the card's copy). Not needed when `prs` is given.
        type: string
        default: ''
      count:
        description: How many reviews to pick. Fewer eligible fails the run.
        type: string
        default: '20'
      prs:
        description: >-
          Comma-separated pull request numbers that replace the pick. Each is
          replayed at its newest real verdict's head, or at its final head
          with `recorded` none when it has no verdict.
        type: string
        default: ''
      unknown_builder:
        description: >-
          Pick the reviews run while the build's model could not be read
          (DRE-7304) — the critic's off the card copies, the verifier's off
          the runs of `verify_workflow`. An empty `recorded_model` then means
          claude-opus-5-5.
        type: boolean
        default: false
      verify_workflow:
        description: >-
          The verifier stub's workflow file whose runs the verifier's
          `unknown_builder` pick reads.
        type: string
        default: ''
      from_run:
        description: >-
          A Shadow Replay run id: replay exactly the acted-on records of its
          pick (the Opus control), at the same heads and under the same rules.
        type: string
        default: ''
  # The dispatch inputs, name for name, plus `pipeline_ref`
  # (tests/test_shadow_replay_callable.py holds the two sets together).
  workflow_call:
    inputs:
      pipeline_ref:
        description: >-
          bureau-pipeline ref for the `.bureau-pipeline` checkout and the two
          nested reviewers. REQUIRED (DRE-2689): pass the ref the stub pins
          in `uses:`.
        type: string
        required: true
      reviewer:
        description: Which reviewer to replay — critic (qa-review.yml) or verifier (verify.yml).
        type: string
        default: critic
      model:
        description: The model id the replays run on.
        type: string
        required: true
      recorded_model:
        description: >-
          Pick the critic reviews recorded on this model. Not needed when
          `prs` is given.
        type: string
        default: ''
      count:
        description: How many reviews to pick. Fewer eligible fails the run.
        type: string
        default: '20'
      prs:
        description: Comma-separated pull request numbers that replace the pick.
        type: string
        default: ''
      unknown_builder:
        description: Pick the reviews run while the build's model could not be read (DRE-7304).
        type: boolean
        default: false
      verify_workflow:
        description: >-
          The verifier stub's workflow file whose runs the verifier's
          `unknown_builder` pick reads.
        type: string
        default: ''
      from_run:
        description: >-
          A Shadow Replay run id in the calling repository: replay exactly
          the acted-on records of its pick (the Opus control).
        type: string
        default: ''

# Its own group, never a pull request's: a replay can never cancel, or be
# cancelled by, a live review.
concurrency:
  group: shadow-replay-${{ github.run_id }}
  cancel-in-progress: false

# Exactly these four. A reusable can hold no more than its caller grants and
# a grant left out is `none`, so each is here for the reusables:
#   id-token        the agent's scrubbed log upload (DRE-4269)
#   contents        every checkout — without it each replay fails at its first
#   pull-requests   Resolve PR's read of the pull request record and compare
#   actions         the run-log reads
permissions:
  id-token: write
  contents: read
  pull-requests: read
  actions: read

jobs:
  pick:
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # The pipeline, never the caller's tree (DRE-7306): `pick` reads the
      # caller only through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Install the pipeline's Python tooling (cached)
        uses: ./.bureau-pipeline/.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          requirements: |
            .bureau-pipeline/requirements-dev.txt

      # The Opus control (DRE-7304): the earlier run's own records file, so
      # the control replays the very (pull request, sha) records it did. The
      # run is the calling repository's: a product repo's control replays
      # that repo's own earlier pick (DRE-7306).
      - name: Download the earlier run's pick
        if: inputs.from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          gh run download "$FROM_RUN" --repo "$GITHUB_REPOSITORY" -n shadow-replay-pick \
            -D "$RUNNER_TEMP/from-pick"

      - name: Pick the reviews to replay
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          REVIEWER: ${{ inputs.reviewer }}
          RECORDED_MODEL: ${{ inputs.recorded_model }}
          COUNT: ${{ inputs.count }}
          PRS: ${{ inputs.prs }}
          UNKNOWN_BUILDER: ${{ inputs.unknown_builder }}
          VERIFY_WORKFLOW: ${{ inputs.verify_workflow }}
          FROM_RUN: ${{ inputs.from_run }}
        # The caller's cards carry `repo:<slug>`, the slug derived the way
        # red-main-repair.yml derives it.
        run: |
          FLAGS=()
          if [ "$UNKNOWN_BUILDER" = "true" ]; then FLAGS+=(--unknown-builder); fi
          if [ -n "$FROM_RUN" ]; then
            FLAGS+=(--from-pick "$RUNNER_TEMP/from-pick/shadow-replay-pick.json" --acted-on-only)
          fi
          REPO_SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          python3 .bureau-pipeline/scripts/shadow_replay.py pick \
            --reviewer "$REVIEWER" --recorded-model "$RECORDED_MODEL" \
            --count "$COUNT" --prs "$PRS" --repo "$GITHUB_REPOSITORY" \
            --repo-label "repo:$REPO_SLUG" \
            --out "$RUNNER_TEMP/shadow-replay-pick/shadow-replay-pick.json" \
            --github-output "$GITHUB_OUTPUT" \
            --verify-workflow "$VERIFY_WORKFLOW" "${FLAGS[@]}"

      # The full records, with each recorded verdict's first line, for the
      # compare job's report; the matrix carries only {pr, sha, recorded,
      # rules_ref}.
      - name: Upload the pick
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadow-replay-pick
          path: ${{ runner.temp }}/shadow-replay-pick
          if-no-files-found: error
          retention-days: 90

  replay-critic:
    name: replay critic PR ${{ matrix.replay.pr }}
    needs: pick
    if: inputs.reviewer == 'critic'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        replay: ${{ fromJSON(needs.pick.outputs.matrix) }}
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/qa-review.yml@main
    # The harness is the caller's `pipeline_ref` (`main` on a dispatch here);
    # the rules it judges by are the ones in force when the recorded verdict
    # was written (DRE-7280). An empty `rules_ref` replays by today's rules,
    # and the report counts it.
    with:
      pipeline_ref: ${{ inputs.pipeline_ref || 'main' }}
      model: ${{ inputs.model }}
      shadow: true
      replay_pr: ${{ format('{0}', matrix.replay.pr) }}
      replay_sha: ${{ matrix.replay.sha }}
      rules_ref: ${{ matrix.replay.rules_ref }}
    secrets: inherit

  replay-verifier:
    name: replay verifier PR ${{ matrix.replay.pr }}
    needs: pick
    if: inputs.reviewer == 'verifier'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        replay: ${{ fromJSON(needs.pick.outputs.matrix) }}
    uses: dreadnought-foundry/bureau-pipeline/.github/workflows/verify.yml@main
    with:
      pipeline_ref: ${{ inputs.pipeline_ref || 'main' }}
      model: ${{ inputs.model }}
      shadow: true
      replay_pr: ${{ format('{0}', matrix.replay.pr) }}
      replay_sha: ${{ matrix.replay.sha }}
    secrets: inherit

  compare:
    needs: [pick, replay-critic, replay-verifier]
    if: always()
    runs-on: ${{ fromJSON(vars.BUREAU_SHORT_RUNS_ON || vars.BUREAU_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dreadnought-foundry/bureau-pipeline
          ref: ${{ inputs.pipeline_ref || 'main' }}
          path: .bureau-pipeline

      - name: Install the pipeline's Python tooling (cached)
        uses: ./.bureau-pipeline/.github/actions/setup-python-cached
        with:
          python-version: "3.12"
          requirements: |
            .bureau-pipeline/requirements-dev.txt

      - name: Download the pick
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shadow-replay-pick
          path: ${{ runner.temp }}/shadow-replay-pick

      # A replay that died wrote no artifact, and a batch where every replay
      # died matches none: compare reads that as `no verdict` for each pull
      # request, so an empty download is a finding in the report rather
      # than a red step with no report.
      - name: Download the shadow verdicts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shadow-verdict-${{ inputs.reviewer }}-*
          path: ${{ runner.temp }}/shadow-verdicts

      # The tagged lines go to a file here and are printed once, by the last
      # step, so the log carries exactly one summary line.
      - name: Compare the replays with the recorded verdicts
        env:
          REVIEWER: ${{ inputs.reviewer }}
          MODEL: ${{ inputs.model }}
          RECORDED_MODEL: ${{ inputs.recorded_model }}
        run: |
          STATUS=0
          python3 .bureau-pipeline/scripts/shadow_replay.py compare \
            --reviewer "$REVIEWER" --model "$MODEL" --recorded-model "$RECORDED_MODEL" \
            --pick "$RUNNER_TEMP/shadow-replay-pick/shadow-replay-pick.json" \
            --artifacts "$RUNNER_TEMP/shadow-verdicts" \
            --out-dir "$RUNNER_TEMP/shadow-replay-report" \
            > "$RUNNER_TEMP/shadow-replay.log" || STATUS=$?
          grep -v '^shadow-replay:' "$RUNNER_TEMP/shadow-replay.log" || true
          exit "$STATUS"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadow-replay-report
          path: |
            ${{ runner.temp }}/shadow-replay-report/shadow-replay-report.md
            ${{ runner.temp }}/shadow-replay-report/shadow-replay-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Print the shadow-replay lines
        run: grep '^shadow-replay:' "$RUNNER_TEMP/shadow-replay.log"
